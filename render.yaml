services:
  - type: web
    name: ihui-web
    env: node
    plan: free
    # rootDir 上提到仓库根(省略即根):buildCommand 的 pnpm install --frozen-lockfile
    # 与 pnpm --filter @ihui/web... 都是 workspace 级命令,必须在含 pnpm-lock.yaml +
    # pnpm-workspace.yaml 的根执行;apps/web 下这两份清单都不存在,rootDir 落在这里必失败。
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @ihui/web... build
    startCommand: pnpm --filter @ihui/web start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_APP_NAME
        value: IHUI AI
      - key: NEXT_TELEMETRY_DISABLED
        value: '1'
      - key: JWT_SECRET
        sync: false
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false
    # web 服务上 /api/health 无上游:rewrites 默认指 127.0.0.1:8802,Render 上不存在本地
    # API,该路径必然失败。改指静态导出首页(/),它是 web 自己能稳定 200 应答的路径。
    healthCheckPath: /

  - type: web
    name: ihui-api
    env: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @ihui/api... build
    startCommand: node apps/api/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '8802'
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CREDENTIALS_ENCRYPTION_KEY
        generateValue: true
      - key: AI_SERVICE_URL
        value: https://ihui-ai-service.onrender.com
      - key: CORS_ORIGIN
        sync: false
    healthCheckPath: /api/health

  - type: web
    name: ihui-ai-service
    env: python
    plan: free
    rootDir: apps/ai-service
    buildCommand: pip install --no-cache-dir .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: API_SERVICE_URL
        value: https://ihui-api.onrender.com
      - key: AI_CALLBACK_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false
    healthCheckPath: /health

databases:
  - name: ihui-postgres
    plan: free
    databaseName: ihui
  - name: ihui-redis
    # 缺 type 会被 Render blueprint 按 databases 段默认语义当作 PostgreSQL 创建,
    # 应用的 REDIS_URL 于是指向一个 PG 实例 —— 显式钉成 redis。
    type: redis
    plan: free
# ⁠​‌​​‌​​‌‍‍​‌​​‌​​​‍‍​‌​‌​‌​‌‍‍​‌​​‌​​‌‍‍​​‌​‌‌​‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌​​‌‌‌‌​‌​‍‍‌‌​‌‌​​​‌​​​‌‌‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌‌​‌​​‌‌‌​‍‍‌‌​​‌‌​​​‌​​‌​‌‍‍‌​‌‌‌​‌‌‌​‌‌‌​‌‍‍‌​‌‌​‌‌‌‍‍​‌​​‌‌​​‍‍​‌​​​​‌‌‍‍‌​‌‌​‌‌‌‍‍​‌‌​​​​‌‍‍​‌‌​‌​​‌‍‍​‌‌‌‌​‌​‍‍​‌‌​‌​​​‍‍​‌‌‌​​‌‌‍‍​​‌​‌‌‌​‍‍​‌‌‌​‌​​‍‍​‌‌​‌‌‌‌‍‍​‌‌‌​​​​‍‍‌​‌‌​‌‌‌‍‍​‌​‌​​​​‍‍​‌​‌​​‌​‍‍​‌​​‌‌‌‌‍‍​‌​‌​‌‌​‍‍​‌​​​‌​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​‌‌‍‍​‌​​​‌​‌‍‍​​‌​‌‌​‌‍‍​​‌‌​​‌​‍‍​​‌‌​​​​‍‍​​‌‌​​‌​‍‍​​‌‌​‌‌​⁠
