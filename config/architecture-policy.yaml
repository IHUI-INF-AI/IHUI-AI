#   packages/ui-react → design-tokens 10   packages/ui-native → design-tokens 11 / types 1
#   packages/{types,design-tokens,auth,database,i18n,context-compaction,browser-platform,eslint-config} → 无出边
#   apps/{desktop,mobile-cap,ai-service} → 无 TS 跨模块边(ai-service 是 Python 端,本表不判)
#   repo-tooling(scripts/)→ app 12 / ui-react 8 / design-tokens 5 / api-client 2 / types 1 / shared 1
# ⇒ 这张图的现实形态是 DAG:包永不 import 端,端永不互相 import。
#   layers 就是把这个既成事实写成可问责的声明 —— 不是发明新约束。
#
# ---------------------------------------------------------------------------
# 改这张表的规矩
# 1. 新增 apps/* 或 packages/* 目录必须同步登记模块,否则该目录的源文件无主,
#    只会在报告里以"未登记模块 N 个 / 无主源文件 N 个"的形式报数(不判红,
#    理由:逼多个会话在同一份共享配置上对撞,代价高于收益 —— §12d 同型)。
# 2. managed: false → true 前,必须先跑 `node scripts/check-architecture-policy.mjs --managed-trial <id>`
#    看该模块在判红口径下到底有几条,收口完再翻。
#    **2026-09-24 全模块试跑取证**(把 24 个模块全部按 managed:true 判一次):
#      判红共 3 条,全部是"表还没覆盖到的现实边",没有一个模块的既有代码违反声明:
#        - packages/i18n/tests/waiting-keys-in-end-packages.test.ts:19  D1+D2
#          测试按相对路径 ../../shared/src/chat/waiting-pool 穿透进 composite 层实现。
#          ❌ 当时写的收口动作"改走 @ihui/shared/chat 公开入口"**做不到,已推翻**(2026-09-25 取证):
#            analyze() 里 D2 判据是 `target.rank > mod.rank`,**只比 rank 数值**,与走不走公开入口、
#            requires 是否声明全无关;而 packages/i18n=platform(rank 20)、packages/shared=composite
#            (rank 30),30>20 ⇒ 换路径照样判红。补 requires 只消 D1 不消 D2;把 i18n 挪到 composite
#            或把 shared 挪到 platform 属"挪层消红",本节上方已禁止。
#          ✅ 唯一合规出路 = 把该测试放到**不反向**的那一层:`packages/shared/tests/chat/`
#            (同包 ⇒ 无跨模块边;它读各端 JSON 词包用的是 readFileSync,不构成 import 边,门不判),
#            改法是 2 处:L27 的 import 改 `../src/chat/waiting-pool`、L29 的 REPO_ROOT 由 '../../..'
#            改 '../../../..'。已实测收集面覆盖该目录(packages/shared/vitest.config.ts 只加 exclude、
#            未设 include ⇒ 默认收 tests/**),且全仓**无**按旧路径锚它的代码级引用(grep scripts/ .github/)。
#          另注:全仓 repo-tooling→apps/* 的真 import 边实测**只有 1 处**(下述 export-openapi-stub-key),
#          同目录 `deploy/tests/prod-bundle-diagnose.test.mjs:227` 已有"读文本不 import"的现成正例可抄。
#        - scripts/tests/export-openapi-stub-key.test.mjs:22  D1
#          仓库脚本按相对路径读 apps/api/scripts/export-openapi.ts。
#          **不得**为了消红把 apps/api 写进 repo-tooling.requires —— 试过,T1 当场判红
#          "端应用声明 exported:false,这条依赖声明本身就是违规"。正确出路是把那个导出
#          脚本挪进 packages/(可依赖面),或让脚本走 CLI 而不是 import 源文件。
#      ⇒ "翻 managed:true"不是未知工作量:22 个模块今天就能翻,2 个模块各差一处整改。
# 3. 本表只支持受限 YAML 子集(缩进 2 空格、值不加行内 # 注释、标量可加单/双引号)。
#    解析器认不出的行会**显式报错并 exit 2(无法判定)**,不会静默跳行 ——
#    静默跳过的后果是"扫到 0 条却报绿"(既有门反复踩过的同一类)。
# ============================================================================

version: 1
policy_id: 'architecture-policy'
# 本表口径:内容一律判 revision 的 blob(默认 HEAD;--staged 判索引),不判滞后的工作树
content_face: 'head-blob'

constraints:
  # C1 全仓即时判红:单文件行上限(实测依据见文件头)
  max_file_lines: 6000
  # C2 managed-only:契约文件行上限
  max_contract_file_lines: 2000
  # C3 managed-only:模块主入口对外公开出口数上限
  max_public_exports: 300
  # D4 managed-only:禁循环依赖(全仓图由本表 requires 声明,已由 T1 保证无环;
  # 这里判的是**现实 import 边**是否成环 —— 表说无环而现实成环,即表与现实脱节)
  forbid_cycles: true
  # D3 managed-only:禁穿透公开入口的深导入
  forbid_deep_imports: true
  # 契约文件面(命中任一 pattern 即算契约文件;glob 只支持 ** 与 * 两种通配)
  contract_file_patterns:
    - 'packages/types/src/**'
    - 'packages/database/src/schema/**'
    - 'packages/api-client/src/endpoints/**'
    - 'packages/sdk/src/**'
    - '**/*.schema.ts'
    - '**/*.types.ts'
  # 扫描面排除:工具装配文件与夹具树,不算模块运行时代码
  scan_excludes:
    - '**/node_modules/**'
    - '**/dist/**'
    - '**/.next/**'
    - '**/.expo/**'
    - '**/build/**'
    - '**/coverage/**'
    - 'benchmarks/**'
    - '**/*.config.js'
    - '**/*.config.cjs'
    - '**/*.config.mjs'
    - '**/*.config.ts'
    - '**/*.d.ts'
    - '**/*.gen.ts'
    - '**/*.generated.ts'
  # 深导入判据的测试面豁免:D3 不咬测试/夹具/mock 文件(按路径 import 实现细节去 mock
  # 是合法形态,HEAD 实测这类共 16 处,全部落在 tests/ 与 __mocks__/ 下)。
  # D1/C2/C3 不受此豁免影响,照旧判。
  # ⚠️ 这 16 处里最多的一枚是 apps/mobile-rn/tests/__mocks__/ihui-rn-app.ts(12 处按路径
  # 取共享屏实现做 RN mock)。它**不需要**另登记 exceptions —— 上面的测试面豁免已经覆盖它,
  # 再登记一条就成了"永远不会命中的例外"(本门的 unusedExceptions 判据会当场点名清单腐烂,
  # 建表时真被它抓到过一次)。这里只留一句提醒:若哪天改成从 @ihui/rn-app 主入口取符号,
  # 就该把这条测试面豁免收窄,而不是留着继续免检。
  deep_import_test_exempts:
    - '**/tests/**'
    - '**/test/**'
    - '**/__tests__/**'
    - '**/__mocks__/**'
    - '**/*.test.ts'
    - '**/*.test.tsx'
    - '**/*.spec.ts'
    - '**/e2e/**'

# 层序:rank 小的可被 rank 大的依赖,反向即违规(数值化是为避免"字典序当层级"的歧义)
layers:
  - id: 'contract'
    rank: 10
    note: '零依赖的公共语言:类型、设计令牌、lint 规则本体'
  - id: 'platform'
    rank: 20
    note: '面向单一能力的适配层:HTTP 客户端、DB、鉴权、i18n、SDK、压缩'
  - id: 'composite'
    rank: 30
    note: '组合层:跨端共享 hooks/utils/store 与组件库'
  - id: 'product'
    rank: 40
    note: '八个产品端,只向下依赖,端与端之间不得互相依赖'
  - id: 'tooling'
    rank: 90
    note: '仓库级工程脚本/部署/监控,位于最外侧(不得被端内反向依赖)'

# ---------------------------------------------------------------------------
# 模块清单
# exported: false ⇒ 该模块不得被任何其他模块 import(端应用、仓库工具)
# managed: 见文件头「渐进收口」—— 存量一律 false,只报数不判红
# ---------------------------------------------------------------------------
