# 既有 100+ 道守门是**从违规模式反推**(发现一类事故 → 写一条判据);
# 本表是**从声明反查**:先声明"模块是谁、能依赖谁、对外露什么",
# 再由 scripts/check-architecture-policy.mjs 拿仓库现实去对账。
# 两者并存,本表不替代任何一道既有门。
