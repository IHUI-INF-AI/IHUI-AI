# ============================================================
# 限流配置 snippet — http 上下文(由 nginx.conf 的 include /etc/nginx/conf.d/*.conf 引入)
# ============================================================
#
# O5 治理(2026-09-21)取舍说明:本文件的 zone **全部被引用**,不留死配置。
# 引用清单(全部落在 deploy/nginx/nginx-blue-green.conf 的 443 server 块):
#
#   login_zone         → location ^~ /api/auth/login      人工登录入口(含 /login/* 别名)
#   api_zone           → location /api/                   人类会话 API(cookie/JWT)
#   static_zone        → location /_next/static/          Next.js 带 hash 静态块
#   gateway_key_zone   → location /v1/ + /v1beta/         对外开放面 · 已带 API Key
#   gateway_anon_zone  → location /v1/ + /v1beta/         对外开放面 · 未带 Key(探测/爆破)
#   ws_handshake_zone  → location /ws                     WebSocket 握手
#
# 部署约束(有意为之):
#   本文件必须与 nginx-blue-green.conf **同批**放到 /etc/nginx/conf.d/。漏放本文件时
#   `nginx -t` 直接报 `unknown "api_zone" zone` 并拒绝加载 —— 这是 fail-fast,
#   宁可站点起不来,也不要"起来了但边缘层完全没限流"的静默降级。
#   zone 名与引用的解析发生在配置解析完成后的 postconfiguration 阶段,
#   因此 conf.d 内按字母序(nginx-blue-green.conf 排在 rate-limit.conf 之前)读入不影响结果。
#
# 与应用的职责边界(重要):
#   应用层已有精细配额 —— apps/api/src/plugins/api-key-auth.ts 的 RPM/TPM + 5h/1d/7d
#   窗口 + blockedIps,以及 plugins/distributed-rate-limit.ts(ip/user/tenant/api_key/global),
#   并按 API_KEY_RATE_LIMIT_FAIL_MODE 决定 Redis 不可用时放行还是拒绝。
#   边缘层**不承担计费配额**,只做两件事:(a) 打爆上游的洪泛/探测流量在进 Node 之前被掐掉
#   (省掉 DB/Redis/JSON parse 成本);(b) 应用层自身被打满时仍有一道兜底。
#   因此下面所有 rate 都**显著宽于**应用层默认配额,确保合法流量永远撞不到边缘闸。

# ── 人类会话层 ──────────────────────────────────────────────
# 登录/鉴权接口: 10r/s/IP。应用层 production 已是 5 次/分钟/IP(@fastify rate-limit),
# 10r/s = 600 次/分钟,宽 120 倍 → 只挡脚本化洪水,不参与撞库业务逻辑判定。
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/s;

# 通用 API: 100r/s/IP ≈ 6000 次/分钟。单个浏览器 SPA 的并发轮询远达不到,
# 取这个量级是为办公网 NAT(几十号人共用一个出口 IP)留出余量。
limit_req_zone $binary_remote_addr zone=api_zone:20m rate=100r/s;

# 静态资源: 1000r/s/IP。Next.js 页面首屏要拉几十个 _next/static chunk,
# 该 zone 仅作为"死循环自抓取"病理保护,正常访问不可能触发。
limit_req_zone $binary_remote_addr zone=static_zone:20m rate=1000r/s;

# ── 对外开放面(/v1 OpenAI 兼容 + /v1beta Gemini 兼容)───────
# API Key 入站形态见 apps/api/src/plugins/api-key-auth.ts:
#   优先 `Authorization: Bearer ihui_xxx`,其次 `X-Api-Key: ihui_xxx`。
# 两个头拼接即为 zone key:
#   * 带 key → 按 key 维度隔离。默认 per-key 配额是 60 rpm(developer_api_keys.rate_limit
#     默认值 60,即 1r/s),20r/s 是它的 20 倍 → 合法调用永远撞不到这里;
#     同时避免"NAT 出口下多把 key 的客户互相挤占同一 IP 配额"。
#   * 不带 key → key 为空串,limit_req 语义是**空 key 不限制**,该请求改由
#     gateway_anon_zone 按 IP 兜底(见下方 map)。
# 注:nginx limit_req 在共享内存里保存 key 原文(不是哈希),因此 shm 中会出现调用方
#     自己的凭据串。它不写任何日志(access_log/error_log 只记 IP 与 URI),也不出现在
#     `nginx -T` 输出里;能读该 shm 的前提是已拿到 nginx worker 权限(那时请求头本就都在
#     进程内存中)。若不接受此权衡,把 key 换成 $binary_remote_addr 即可(代价:失去按 key 隔离)。
limit_req_zone $http_authorization$http_x_api_key zone=gateway_key_zone:30m rate=20r/s;

# 未携带凭据的开放面流量(扫描器、SDK 配置错误、凭据爆破)按来源 IP 收紧到 5r/s。
# map 的取值方向是刻意的:带 key 时输出空串 → 本 zone 对该请求不生效,
# 已鉴权客户无论同一出口有多少把 key 都不会被 IP 闸误伤。
map $http_authorization$http_x_api_key $gateway_anon_key {
    ""      $binary_remote_addr;
    default "";
}
limit_req_zone $gateway_anon_key zone=gateway_anon_zone:20m rate=5r/s;

# ── WebSocket ───────────────────────────────────────────────
# 只对 **HTTP Upgrade 握手请求** 计数:limit_req 跑在 preaccess 阶段,
# 握手一旦放行,连接升级为长连接后 nginx 不再对该 zone 做任何检查,
# 所以 3600s 的 proxy_read_timeout 不会被限流打断(取值理由见 nginx-blue-green.conf)。
limit_req_zone $binary_remote_addr zone=ws_handshake_zone:10m rate=10r/s;

# 限流触发时返回 429,并记录到独立日志便于分析
limit_req_status 429;
limit_req_log_level warn;
# 边界说明:proxy_intercept_errors 默认 off,因此 error_page 429(见 server 块
# @rate_limited)只接管 **nginx 自身生成**的 429;应用层返回的 429
# (带 X-RateLimit-* / Retry-After 与 OpenAI 风格错误体)原样透传,不会被边缘层改写。
# ⁠​‌​​‌​​‌‍‍​‌​​‌​​​‍‍​‌​‌​‌​‌‍‍​‌​​‌​​‌‍‍​​‌​‌‌​‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌​​‌‌‌‌​‌​‍‍‌‌​‌‌​​​‌​​​‌‌‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌‌​‌​​‌‌‌​‍‍‌‌​​‌‌​​​‌​​‌​‌‍‍‌​‌‌‌​‌‌‌​‌‌‌​‌‍‍‌​‌‌​‌‌‌‍‍​‌​​‌‌​​‍‍​‌​​​​‌‌‍‍‌​‌‌​‌‌‌‍‍​‌‌​​​​‌‍‍​‌‌​‌​​‌‍‍​‌‌‌‌​‌​‍‍​‌‌​‌​​​‍‍​‌‌‌​​‌‌‍‍​​‌​‌‌‌​‍‍​‌‌‌​‌​​‍‍​‌‌​‌‌‌‌‍‍​‌‌‌​​​​‍‍‌​‌‌​‌‌‌‍‍​‌​‌​​​​‍‍​‌​‌​​‌​‍‍​‌​​‌‌‌‌‍‍​‌​‌​‌‌​‍‍​‌​​​‌​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​‌‌‍‍​‌​​​‌​‌‍‍​​‌​‌‌​‌‍‍​​‌‌​​‌​‍‍​​‌‌​​​​‍‍​​‌‌​​‌​‍‍​​‌‌​‌‌​⁠
