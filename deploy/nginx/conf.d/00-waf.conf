# ============================================================
# 可选边缘 WAF 片段(http 上下文) — 2026-10-29 加固补充
# ============================================================
#
# 设计原则:**宁漏勿误伤**。只拦明确恶意的模式,绝不拦任何合法业务流量。
# 本文件**默认不生效**:它只定义 map 变量,必须在 server 块内引用 $waf_block 才会拦。
#
# 启用方式(在 deploy/nginx/nginx-blue-green.conf 的 443 server 块顶部加一行,
# 或 docker/nginx.web.conf 的 server 块内):
#     # 可选 WAF(见 conf.d/00-waf.conf)
#     if ($waf_block) { return 444; }
#
# 444 = nginx 无响应断开(不返回任何 body,对扫描器最省资源)。
# 注意:`if` 仅用于 server 块顶部的简单 return,不在 location 内做复杂逻辑(避开 "if is evil")。

# 1) 路径遍历:任何合法 API/静态请求都不含裸 `../` 或 `..\` 序列
map $request_uri $waf_path_traversal {
    default       0;
    "~*\.\./"     1;
    "~*\\.\\.\\"   1;
}

# 2) 已知扫描器 / 恶意 UA。空 UA 与常见合法 UA(浏览器、curl 调试、SDK)均不拦,
#    只拦明确恶意的自动化工具特征(大小写不敏感)。
map $http_user_agent $waf_bad_bot {
    default                                                                 0;
    "~*(?i:sqlmap|nmap|masscan|nikto|dirb|gobuster|wpscan|acunetix|nessus|burpsuite|hydra|wfuzz|zgrab|zgrab2|semrushbot|ahrefsbot|mj12bot|dotbot)"  1;
}

# 3) 合并判据:任一命中即为 1(值是 "0/1" 拼接,含 "1" 即拦截)
map $waf_path_traversal$waf_bad_bot $waf_block {
    default  0;
    "~1"     1;
}
# ⁠​‌​​‌​​‌‍‍​‌​​‌​​​‍‍​‌​‌​‌​‌‍‍​‌​​‌​​‌‍‍​​‌​‌‌​‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌​​‌‌‌‌​‌​‍‍‌‌​‌‌​​​‌​​​‌‌‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌‌​‌​​‌‌‌​‍‍‌‌​​‌‌​​​‌​​‌​‌‍‍‌​‌‌‌​‌‌‌​‌‌‌​‌‍‍‌​‌‌​‌‌‌‍‍​‌​​‌‌​​‍‍​‌​​​​‌‌‍‍‌​‌‌​‌‌‌‍‍​‌‌​​​​‌‍‍​‌‌​‌​​‌‍‍​‌‌‌‌​‌​‍‍​‌‌​‌​​​‍‍​‌‌‌​​‌‌‍‍​​‌​‌‌‌​‍‍​‌‌‌​‌​​‍‍​‌‌​‌‌‌‌‍‍​‌‌‌​​​​‍‍‌​‌‌​‌‌‌‍‍​‌​‌​​​​‍‍​‌​‌​​‌​‍‍​‌​​‌‌‌‌‍‍​‌​‌​‌‌​‍‍​‌​​​‌​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​‌‌‍‍​‌​​​‌​‌‍‍​​‌​‌‌​‌‍‍​​‌‌​​‌​‍‍​​‌‌​​​​‍‍​​‌‌​​‌​‍‍​​‌‌​‌‌​⁠
