# ============================================================
# ai-service 对外能力面 —— 默认档入口(http 级,与主站 443 完全隔离)
# ============================================================
#
# 2026-09-28 立(机主拍板:按能力目录逐项放开)。与
# `public-ai-service.locations.fragment`(白名单 location 本体)配套,一份真相两个壳。
#
# ── 为什么是"独立 server 块 + 独立端口",而不是直接往主站 443 里加 location ──
#   ① 本票的文件清单里**没有** deploy/nginx/nginx-blue-green.conf(它是别的会话在写的
#      主站配置),所以"改主站"这条路的正确交付形态是:把可复用的白名单片段单独成文
#      (.fragment),由主站持有人按片段头注②那一行 include 接线 —— 判据、清单、回退都已就位。
#   ② 复用同一张 aizhs.top 证书 ⇒ **零 DNS / 零签发**动作;8443 未放行时本块整体不可达。
#   ③ 主站面(443)在本票里**逐字未改** ⇒ "未列入白名单的一切保持零公网暴露"这一条
#      不是靠"我记得没加"成立,而是靠"那个文件没有我的改动"成立。
#
# ── 默认档 = 零暴露(两条独立成立的闸门)────────────────────────────────
#   a) 8443 未在防火墙/安全组放行 ⇒ 外部根本连不上(部署机现问:`netstat -ano | findstr :8443`
#      与云侧安全组;本机关是**开发机**,8801/8802/8810 全无监听,所以这句在本机无法取证);
#   b) 即便端口开了,本 server 块的 `location / { return 404; }` 是**默认拒绝**,
#      只有 .fragment 里显式写了 `location =` 的路径会被代理。
#   回退一行(收回全部对外面,不需要动任何别处):
#     mv /etc/nginx/conf.d/public-ai-service.locations.fragment /etc/nginx/conf.d/public-ai-service.locations.fragment.off && nginx -t && nginx -s reload
#   (挪走片段后本文件里的 `include` 取不到文件 ⇒ nginx **启动即失败**,这是 fail-fast:
#    宁可站点起不来,也不要"壳还在、白名单没了"却静默放行 —— 与 conf.d/rate-limit.conf
#    对"漏放限流文件即 unknown zone 拒绝加载"是同一条设计。)
#
# ── 部署机待取证清单(本机关是**开发机**:无 IHUI* 服务、8801/8802/8810 零监听 ⇒ 以下每一条
#    在本机都跑不出结论,不得读成"已验证")──────────────────────────────────────
#  [ ] 1 `netstat -ano | findstr LISTENING | findstr ":8803"` ⇒ 该端口确是 apps/ai-service
#          (FastAPI)在听。仓内两处口径互斥:docs/port-management.md 记 8803=AI Service,
#          而 deploy/nginx/nginx-blue-green.conf 头部注释记 8803=Green web(其 upstream 实际
#          用 8841-8844)。上游指错不会报错,只会 502,必须现问。
#  [ ] 2 端口可达路径:本壳听 8443。裸机/蓝绿形态要先在防火墙与安全组放行 8443;
#          若 aizhs.top 的公网入口是 Cloudflare Tunnel(实测 deploy/prod-bundle/cloudflared/
#          config.yml 只把 hostname aizhs.top → localhost:8801),则**还必须**给隧道加一条
#          指向本机 8443 的 ingress(或改用主站 443 + 片段 include 那条路,见片段头注②),
#          否则本壳开了也对外不可达 —— "配置就位"不等于"能力上线",这条别混着报。
#  [ ] 3 `nginx -t` 必须同批放这三个文件:public-ai-service.conf、
#          public-ai-service.locations.fragment、conf.d/rate-limit.conf(缺片段 ⇒ include
#          取不到文件 ⇒ 启动即失败,这是有意的 fail-fast)。
#  [ ] 4 证书路径:本壳复用 /etc/nginx/ssl/aizhs.top.crt(.key)。若主站由 certbot 管的是
#          别的 Fullchain 路径,以主站现值为准,不要照抄本文件。
#  [ ] 5 上线后逐条实测(每条都要留 RC):
#          匿名 `curl -i -X POST https://<host>:8443/api/mcp`     ⇒ 期望 401(不是 404、不是 200)
#          带用户 JWT 同请求                                        ⇒ 期望进入 JSON-RPC 分发(200/400 业务码)
#          携带 `X-IHUI-Principal: 伪造值`                          ⇒ 期望与匿名同形(头被剥),不得 200
#          `curl -i https://<host>:8443/api/agents/sessions`        ⇒ 期望 404(白名单外一律不存在)
#          连打 >10r/s 的同一 IP                                    ⇒ 期望 429 + Retry-After: 1 + X-RateLimit-Layer: edge
#          `curl -i https://<host>/api/mcp`(443 主站)              ⇒ 期望与改动前逐字相同(本票未碰主站面)
#  [ ] 6 收回:执行上面那行 mv 之后,再跑一次 [5] 的匿名请求 ⇒ 期望变成连接层失败/404,
#          并 `node scripts/check-public-exposure-list.mjs --worktree` 报"开放集为空 = 全部只内网"。
#
# ── 与两份 nginx 配置的同步约束(AGENTS §5 明文)──────────────────────────────

# 边缘限流有**两份**配置:本文件(蓝绿/裸机部署)与 deploy/docker/nginx.web.conf
# (单机/SaaS)。两边必须同批改,差异**只有**下面三处,其余(开放集、429 形态、剥头)逐字同形:
#   1. zone 名与 map 结果变量名在 docker 侧一律加 `docker_` 前缀 —— 两份配置可能落进
#      **同一个 http 上下文**,重名 zone 会让 nginx 直接 `duplicate zone` 启动失败,
#      重名 map 结果变量同理(`"x" is already used`)。该规则由 o5 测试判据 ⑨/⑫ 与
#      守门之外的手动档 scripts/check-public-exposure-list.mjs 共同核。
#   2. 上游地址:本文件用 `127.0.0.1:8803`(宿主机进程,端口取自 docs/port-management.md);
#      docker 侧用容器名 `ai-service:8803`(docker-compose.yml:224 起的 `ai-service` 服务)。
#      ⚠️ 8803 这个数在本仓有**两处口径冲突**的登记:deploy/nginx/nginx-blue-green.conf
#      头部注释把 8803 记成 "Green: web=8803"(而蓝绿实际 upstream 用的是 8841-8844)。
#      本机是开发机、零监听 ⇒ 无法现问。部署机放行前**必须**实测该端口真是 FastAPI
#      (已列入交付报告的待取证清单),不得照本文件写死的数字上线。
#   3. `limit_req_status 429` 与 `error_page 429`:本文件写在 **server 级**(rate-limit.conf
#      已在 http 级设过一次,同 level 重复设没有意义且容易被读成"两处真相");docker 侧那份
#      本来就是 server 级。**行为一致**:超限一律 429 + `Retry-After: 1` +
#      `X-RateLimit-Layer: edge`,且因 `proxy_intercept_errors` 保持默认 off,
#      应用层自己返回的 429/401 原样透传,不被边缘改写。

# ── 限流档:为什么宽于 gateway_*_zone ─────────────────────────────────────
# MCP 客户端的一个特点:一次 `tools/call` 之前要 initialize / tools/list / ping 数请求,
# 长会话还会走 SSE 续推;所以边缘档按"会话建立 + 稳态调用"两段给,而不是按单请求给。
# 主站 /v1 开放面的按-key 档是 20r/s、按-IP 档 5r/s —— 这里刻意**不做按-key 维度**:
# ai-service 明确拒绝机器 key(app/services/capability_gate.py 里 ihui_ / X-Api-Key
# 一律 401),能到这里的凭据只有用户 JWT,而按 Authorization 头做 zone key 等于把
# ~1KB 的 JWT 原文长期存进共享内存(rate-limit.conf 那段权衡在 60 字节的 API Key 上
# 可接受,在 JWT 上不划算),且同一用户多设备/多 token 会互相看不出关联。
# 因此两个维度都按 **来源 IP**:
#   aisvc_open_zone  10r/s/IP ≈ 600 次/分钟 —— 合法 MCP 会话远达不到(它的稳态是秒级
#                    一次 tools/call),取这个量级同样为办公网 NAT 留余量;
#   aisvc_anon_zone   2r/s/IP —— 只统计**不带 Authorization** 的请求(即注定 401 的那批:
#                    扫描器、SDK 漏配凭据、token 爆破)。map 的取值方向与 gateway_anon_key
#                    同款:带凭据时输出空串 ⇒ 本 zone 对该请求不生效,已鉴权客户不被 IP 闸误伤。
limit_req_zone $binary_remote_addr zone=aisvc_open_zone:10m rate=10r/s;

map $http_authorization $aisvc_anon_key {
    ""      $binary_remote_addr;
    default "";
}
limit_req_zone $aisvc_anon_key zone=aisvc_anon_zone:10m rate=2r/s;

# 上游:ai-service(FastAPI)。端口口径冲突与本票未能本机取证,详见文件头第 2 条差异说明。
upstream ihui_ai_service_public {
    server 127.0.0.1:8803 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

server {
    listen 8443 ssl http2;
    server_name aizhs.top www.aizhs.top;

    # 证书与主站同一张(单域证书已覆盖这两个名字,见 nginx-blue-green.conf)。
    ssl_certificate     /etc/nginx/ssl/aizhs.top.crt;
    ssl_certificate_key /etc/nginx/ssl/aizhs.top.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:AiSvcPublicSSL:10m;
    ssl_session_timeout 10m;

    # 对外能力面是**接口**,不承载页面 ⇒ 安全头按接口面收紧,不复制主站那套 CSP。
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # 本面没有同源页面可放,任何 frame/跨源读取都不是设计内的用法。
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    client_max_body_size 8m;

    # 超限应答与主站 @rate_limited 同形态(Retry-After=1 + X-RateLimit-Layer: edge)。
    # 名字带 aisvc_ 前缀:named location 的作用域是本 server,与主站的 @rate_limited
    # 同名既不报错也互不可达,但"两套壳一个名字"会让日志与排障串台,故显式区分。
    limit_req_status 429;
    limit_req_log_level warn;
    error_page 429 = @aisvc_rate_limited;
    location @aisvc_rate_limited {
        add_header Retry-After "1" always;
        add_header X-RateLimit-Layer "edge" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        default_type application/json;
        return 429 '{"error":{"message":"Too many requests (edge rate limit). Retry after 1s.","type":"rate_limit_error","code":429,"layer":"edge"},"code":429,"message":"请求过于频繁,请稍后重试","data":{"layer":"edge","retryAfter":1}}';
    }

    # 未申报的形态一律 404(不是 403:403 会告诉探测者"这条路存在,只是被挡",
    # 而本面的设计意图是"除了白名单,其他**不存在**")。
    location / {
        return 404 '{"error":{"message":"Not found","type":"invalid_request_error","code":404},"code":404,"message":"资源不存在"}';
        default_type application/json;
    }

    include /etc/nginx/conf.d/public-ai-service.locations.fragment;
}
