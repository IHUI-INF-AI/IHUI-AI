# ============================================================
# IHUI-AI Blue-Green Deployment Nginx Configuration
# ============================================================
#
# Port Mapping:
#   Blue:  web=8801, api=8802
#   Green: web=8803, api=8804
#
# Default active environment: BLUE
#
# Switch to Green:
#   sed -i 's/blue_web/green_web/g; s/blue_api/green_api/g' nginx-blue-green.conf
#   nginx -t && nginx -s reload
#
# Switch back to Blue:
#   sed -i 's/green_web/blue_web/g; s/green_api/blue_api/g' nginx-blue-green.conf
#   nginx -t && nginx -s reload
#
# For GitHub Actions workflow integration, see README.md
#
# ── 边缘限流依赖(2026-09-21 O5)──
# 本文件的 limit_req 引用了 conf.d/rate-limit.conf 里定义的 6 条 zone
# (login_zone / api_zone / static_zone / gateway_key_zone / gateway_anon_zone / ws_handshake_zone)。
# 两个文件必须**同批**部署到 /etc/nginx/conf.d/;只放本文件时 `nginx -t` 会以
# `unknown "api_zone" zone` 直接失败(fail-fast,避免静默无限流上线)。
# 超限统一由 server 块的 `error_page 429 = @rate_limited` 应答(带 Retry-After: 1
# 与 X-RateLimit-Layer: edge);应用层自己返回的 429 因 proxy_intercept_errors 默认 off 而原样透传。
#
# 微信支付回调(2026-07-18 证书激活):
#   - 商户号: 1714645682(吉林省爱智汇人工智能科技有限公司)
#   - 回调端点(必须公网可达,配置 SSL 后用 https://aizhs.top/...):
#       /api/payments/wechat/notify         — JSAPI/NATIVE 支付回调
#       /api/payments/wechat/notify/refund  — 退款回调
#       /api/payments/recurring/wechat-notify — 周期扣款签约/扣款回调
#       /api/payments/withdrawal/notify     — 提现回调
#   - WeChat Pay 回调使用 application/json 格式,Body 通常 5-15 KB,
#     SSL 必须有效(否则 WeChat 验签失败)
#   - 不要在 /api/payments/*/notify 上加 client certificate / IP 白名单 /
#     限流(WeChat 服务器 IP 段经常变动)
# ============================================================

# ── Blue upstream (passive health check via max_fails/fail_timeout) ──
upstream blue_web {
    server 127.0.0.1:8841 max_fails=3 fail_timeout=30s;
    keepalive 32;
}
upstream blue_api {
    server 127.0.0.1:8842 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ── Green upstream ──
upstream green_web {
    server 127.0.0.1:8843 max_fails=3 fail_timeout=30s;
    keepalive 32;
}
upstream green_api {
    server 127.0.0.1:8844 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ── HTTP → HTTPS redirect ──
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ── Main server (HTTPS) ──
server {
    listen 443 ssl http2;
    server_name aizhs.top www.aizhs.top;

    # SSL — Let's Encrypt 推荐 certbot --nginx -d aizhs.top -d www.aizhs.top
    # 自签名证书路径(部署时替换):
    ssl_certificate     /etc/nginx/ssl/aizhs.top.crt;
    ssl_certificate_key /etc/nginx/ssl/aizhs.top.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── 安全响应头 (OWASP Top 10 防护) ──
    # HSTS: 强制 HTTPS 2 年(含子域名),防止降级攻击
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    # X-Frame-Options: 禁止被任意站点 iframe 嵌入,防点击劫持
    add_header X-Frame-Options "SAMEORIGIN" always;
    # X-Content-Type-Options: 禁止 MIME 嗅探,防 XSSI
    add_header X-Content-Type-Options "nosniff" always;
    # Referrer-Policy: 仅同源时发送完整 referrer,防泄露 token
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP: 限制资源加载源,防 XSS/数据外泄
    # - default-src 'self': 默认只允许同源
    # - script-src 'self' 'unsafe-inline' 'unsafe-eval': 允许内联脚本(Next.js 必需)
    # - style-src 'self' 'unsafe-inline': 允许内联样式(Tailwind/CSS-in-JS 必需)
    # - img-src 'self' data: blob: https: : 允许图片(data/blob/任意 https)
    # - font-src 'self' data:: 允许字体
    # - connect-src 'self' https: ws: wss:: 允许 API/WebSocket(任意 https + ws)
    # - media-src 'self' https: blob:: 允许音视频
    # - frame-ancestors 'self': 等同 X-Frame-Options SAMEORIGIN
    # - form-action 'self': 表单只能提交到同源
    # - base-uri 'self': <base> 标签只能同源
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: ws: wss:; media-src 'self' https: blob:; frame-ancestors 'self'; form-action 'self'; base-uri 'self'" always;
    # X-XSS-Protection: 旧版 IE/Edge 反射型 XSS 过滤(现代浏览器已由 CSP 接管,保留兼容)
    add_header X-XSS-Protection "1; mode=block" always;

    # ── gzip 压缩(减少传输体积 ~70%) ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml
               application/rss+xml application/atom+xml application/manifest+json
               image/svg+xml font/woff font/woff2
               application/vnd.api+json;

    # ── 边缘限流的超限响应(由 conf.d/rate-limit.conf 的 zone 触发)──
    # 为什么需要显式 error_page:RFC 9110 要求 429 带 Retry-After,裸 429 会让
    # OpenAI/Gemini SDK 的自动重试退避策略拿不到提示,直接以更短间隔猛撞。
    # ⚠️ 该接管只作用于 nginx 自身产生的 429:proxy_intercept_errors 保持默认 off,
    #    所以应用层(api-key-auth / distributed-rate-limit)返回的 429
    #    连同其 X-RateLimit-* / Retry-After / OpenAI 风格错误体一并原样透传。
    # Retry-After 固定取 1 秒:limit_req 是漏桶,超限后最迟 1 个 rate 周期即有额度;
    # 报更大会把"轻微突发"也拖成 1 秒以上的排队,报 0 则等于鼓励立即重试。
    error_page 429 = @rate_limited;
    location @rate_limited {
        add_header Retry-After "1" always;
        # layer=edge 便于客户端与运维区分"被 nginx 挡了"还是"被应用配额挡了"
        add_header X-RateLimit-Layer "edge" always;
        # 注意:location 内的 add_header 会覆盖 server 级安全头,故显式补回 429 响应
        # 仍需要的两项(JSON 错误体只需 nosniff 防 MIME 嗅探 + HSTS 防降级)
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        default_type application/json;
        # 同时给 OpenAI 兼容错误体与项目统一信封,两类客户端都能解析
        return 429 '{"error":{"message":"Too many requests (edge rate limit). Retry after 1s.","type":"rate_limit_error","code":429,"layer":"edge"},"code":429,"message":"请求过于频繁,请稍后重试","data":{"layer":"edge","retryAfter":1}}';
    }

    # ── 静态资源缓存(Next.js /_next/static/ 永久缓存) ──
    # Next.js 静态资源带 hash,可永久缓存
    location /_next/static/ {
        # static_zone 1000r/s/IP:纯病理保护(死循环自抓取),真实首屏不可能触发。
        # 超限同样落到 @rate_limited,与其它 location 保持一致的 429 + Retry-After 形态。
        limit_req zone=static_zone burst=2000 nodelay;
        proxy_pass http://blue_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 1 年 immutable 缓存
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # 注意: add_header 在 location 块会覆盖 server 块的安全头,需重新声明
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # Nginx self health check (used by load balancer / monitoring)
    location /nginx-health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # 人工登录入口(含 /api/auth/login/sms|email|username|phone-code|carrier 等别名)。
    # 必须是独立 location 才能引用 login_zone —— limit_req 不会跨 location 继承,
    # 在 /api/ 上统一用 10r/s 会把全站 SPA 轮询一起掐掉。
    # ^~ 前缀匹配:命中即停止正则搜索,优先级高于下面 /api/ 的 api_zone。
    # 应用层另有 @fastify rate-limit 5 次/分钟/IP + 账号锁定(5 次锁定),边缘这道
    # 只挡洪水,不替代业务判定,所以 burst 给到 20(≈2 秒突发)也远宽于应用层。
    location ^~ /api/auth/login {
        limit_req zone=login_zone burst=20 nodelay;
        proxy_pass http://blue_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # API proxy — default: BLUE
    # To switch: change blue_api → green_api
    location /api/ {
        # api_zone 100r/s/IP:显著宽于应用层任何 per-user/per-tenant 配额,只做洪泛闸。
        # burst=200 覆盖 SPA 首屏并发(一次进页可打出上百个 /api 请求)且不排队(nodelay)。
        # 微信支付回调不受影响:下方 `location ~ ^/api/payments/.../notify`(正则)一旦命中,
        # 该 location 未声明 limit_req,而 limit_req 不跨 location 继承
        # (WeChat 出口 IP 段常变,不能限流)。
        limit_req zone=api_zone burst=200 nodelay;
        proxy_pass http://blue_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        # P0 流式修复：禁用响应缓冲，确保 SSE 逐 chunk 转发到前端
        proxy_buffering off;
        proxy_cache off;
    }

    # 中转站公开网关(2026-09-13 立):/v1 OpenAI 兼容 + /v1beta Gemini 兼容
    # - SSE 流式(chat/completions stream=1 / streamGenerateContent):proxy_buffering off 必需
    # - 长生成宽容:读/写超时 300s(默认 60s 会掐断长输出流)
    # - 切换蓝绿:与 /api/ 一致,blue_api → green_api
    #
    # ── O5 边缘限流(2026-09-21 补,此前 /v1 全文无任何 limit_req)──
    # 两条 zone 同时生效(nginx 允许一个 location 多条 limit_req,逐条判定,任一条超限即拒):
    #   1) gateway_key_zone  20r/s + burst 60,key = Authorization/X-Api-Key
    #      → 带 key 的请求按 key 隔离;20r/s = 默认 per-key 配额(60rpm)的 20 倍,
    #        合法流量撞不到,只掐"单把 key 打爆上游"的异常脚本。
    #   2) gateway_anon_zone 5r/s + burst 20,key = 无凭据时的 $binary_remote_addr
    #      → 无 key 请求本就会被应用层 401,这里省掉它们的 DB/Redis/parse 成本。
    # **为什么不会打断流式长连接**:limit_req 只在请求进入 preaccess 阶段时计数一次,
    # 判定通过后 SSE 响应体持续 300s 推流期间 nginx 不再复查该 zone;
    # 一个 HTTP 请求 = 一次计数,与它持续多久无关。故此处无需为流式放宽 timeout 之外的任何参数。
    location /v1/ {
        limit_req zone=gateway_key_zone burst=60 nodelay;
        limit_req zone=gateway_anon_zone burst=20 nodelay;
        proxy_pass http://blue_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_buffering off;
        proxy_cache off;
    }

    location /v1beta/ {
        # 与 /v1/ 复用同两条 zone(**有意共享**:同一把 key 跨 /v1 与 /v1beta 的总请求数
        # 合并计数,防止"两个协议入口各拿一份配额"变相翻倍);参数取值理由见 /v1/ 上方注释。
        limit_req zone=gateway_key_zone burst=60 nodelay;
        limit_req zone=gateway_anon_zone burst=20 nodelay;
        proxy_pass http://blue_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_buffering off;
        proxy_cache off;
    }

    # WebSocket(/ws → 8802,web 实时通道;2026-09-13 补齐)
    # - 必须 proxy_http_version 1.1 + Upgrade/Connection 头,否则握手 400
    # - 长连接:读超时 3600s(心跳保活,默认 60s 会反复断连)
    location /ws {
        # 只限 **握手请求**:limit_req 在 preaccess 阶段对 HTTP Upgrade 这一次请求计数,
        # 握手通过并升级为长连接后 nginx 不再复查 —— 3600s 的读超时与已建立连接的存活
        # 完全不受影响。故 10r/s/IP 只可能挡住"重连风暴/握手洪水",不会掐断在线会话。
        # burst=30 nodelay 的取值理由:一台机器/一个 NAT 出口会并发多个标签页 × 多条通道
        # (chat / tasks / notifications / payment 各自一条 WS),首屏并发握手可达十余次;
        # 断网恢复时浏览器还会各自立即重连。30 的余量足以覆盖这两类正常突发。
        limit_req zone=ws_handshake_zone burst=30 nodelay;
        proxy_pass http://blue_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_buffering off;
    }

    # 微信支付回调专用 location(在 /api/ 之前匹配)
    # - 关闭请求体缓冲(回调体需要立即转发到 API 验签)
    # - 60s 读超时(WeChat 期望 API 在 5s 内响应 200/204,长读超时只是容错)
    # - 显式允许 application/json Content-Type
    # 路径匹配:/api/payments/wechat/notify、/api/payments/wechat/notify/refund、
    #          /api/payments/recurring/wechat-notify、/api/payments/withdrawal/notify
    location ~ ^/api/payments/(wechat|recurring|withdrawal)/.+/b(通知|webhook|notify).*$ {
        proxy_pass http://blue_api;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # ── 前端鉴权拦截(2026-08-30 安全加固) ──
    # 与 apps/web/proxy.ts dev 模式 middleware 对等:next.config.ts 用 output:'export'
    # 静态导出,Next middleware 生产环境不生效,由 nginx 边缘层补齐未登录拦截。
    # 规则:cookie auth_token 为空 → 307 到 /sso/login?redirect=<原始路径>(307 保留 method,
    # 与 dev middleware 一致;nginx 1.11.8+ 支持 return 307)。
    # 只判 cookie 存在性(性能敏感,不做后端验签;token 验签由后端 /api/auth/verify 负责)。
    # 不影响 /api/、/_next/static/ 等其他 location。
    # 蓝绿切换:proxy_pass 中的 blue_web 会被文件头部的 sed 切换脚本一并替换为 green_web。
    # Admin 前端拦截 — default: BLUE
    location /admin/ {
        if ($cookie_auth_token = "") {
            return 307 /sso/login?redirect=$request_uri;
        }
        proxy_pass http://blue_web;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # 教务管理路由拦截(matcher 与 proxy.ts 一致: /edu/edu-management/:path*),规则同 /admin/ — default: BLUE
    location /edu/edu-management/ {
        if ($cookie_auth_token = "") {
            return 307 /sso/login?redirect=$request_uri;
        }
        proxy_pass http://blue_web;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # 无权限提示页不拦截(与 proxy.ts UNAUTHORIZED_PATH 一致,让用户看到无权限页) — default: BLUE
    location = /admin/unauthorized {
        proxy_pass http://blue_web;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # Web proxy — default: BLUE
    # To switch: change blue_web → green_web
    location / {
        proxy_pass http://blue_web;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
