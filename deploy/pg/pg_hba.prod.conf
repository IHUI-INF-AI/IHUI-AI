# =============================================================================
# IHUI-AI 生产 PostgreSQL 客户端认证配置 —— pg_hba.conf 的「目标态」
# =============================================================================
# 本文件是"应当长成什么样"的唯一入库真相源,**不是**现网正在跑的那一份。
# 现网文件在各机数据目录下(取法:从数据库服务命令行里 `runservice -D` 之后那一段读,
# 不得照抄任何文档里的路径 —— 本仓已多次因把另一台机的盘符当本机事实而误诊)。
# 两者之间的差异由 deploy/pg/apply-pg-hba.ps1 **人工**比对与落地;本文件的规则由
# apps/api/tests/o20c-pg-hba-policy.test.ts 每次跑测试时代为看守(静态判据,不连库)。
#
# 为什么现在要有这份文件(O20c,2026-09-26 立):
#   ① 收紧这件事在 2026-09-24 04:47 已被人在现网手工做过一次(local/host 由 trust
#      改成 scram-sha-256),但它**不来自本仓任何一次提交** ⇒ 既没有可复现的目标态,
#      也没有一道门看守它是否还成立。重装、换机、误覆盖,或有人为了"临时先连上"把某
#      一行改回免密,都不会有任何声响 —— 这是本仓最常见的一类失效:判据不在真跑它的那
#      一刻成立,就等于没有。
#   ② trust 的实际敞口:本机任意进程免密即可以 superuser 连上端口。O13 的"非超级用户
#      角色 + 应用闸"挡住的是**经应用连上来的路径**,挡不住**本机进程直连端口**这一条,
#      所以只要本地链路是免密,角色隔离就是纸面的。
#   ③ 本票只产出"可交给运维执行的东西 + 机器判据":不改现网、不重启服务、不连库。
#
# -----------------------------------------------------------------------------
# 阅读本文件前必须知道的三条 PostgreSQL 语义(写错方向就是一道敞口)
# -----------------------------------------------------------------------------
# · **首条匹配即裁决**:规则从上往下找,第一条匹配的连接就定终身,后面的行不再看。
#   所以"窄的允许行"必须在"宽的拒绝行"之前;而末尾的兜底放行行必须真的在**最后** ——
#   把兜底行挪到文件顶部,会得到一份"看上去全是 scram、其实上面所有窄规则一条都没生效"
#   的配置,现象是"连得上、权限却和预期对不上",从日志里反推不出来。
# · **没有匹配行 = 拒绝**(fail-closed)。所以本档刻意不写任何非回环地址的条目:
#   外部地址结构上进不来。这一条不要因为"运维要从办公网连一下"而被放宽 —— 那属于
#   另开一票并显式改动判据白名单,而不是在这里加一行。
# · Windows 上 `local` 记录匹配的是**共享内存**连接(psql/pg_dump 不带 `-h` 时走它),
#   不是 Unix socket;`peer`/`ident` 在 Windows 上根本不支持,而安装器默认模板里的
#   `sspi`(Windows 域认证)是**免口令**的 —— 本档一律不出现这三类方法,详见 F 段之后。
#
# -----------------------------------------------------------------------------
# 认证方法的选择:为什么是 scram-sha-256 而不是 md5
# -----------------------------------------------------------------------------
# · `md5` 已被官方标记为过渡档:它把口令先哈希一次再进挑战,服务端存的那串摘要**本身就
#   等价于口令**(pass-the-hash:拿到 md5 摘要即可登录,不需要还原明文);且对超长口令
#   按 MD5 密码族的 16 字节截断,长口令的强度并不会随长度增长。
# · `scram-sha-256` 是 RFC 5802 的 Salted Challenge Response:口令本身从不离开客户端、
#   服务端摘要也不能直接当凭据重放,并有 salt 与迭代 ⇒ 库文件泄露时的离线成本高一档。
#   本仓服务端与客户端均为 PostgreSQL 18.x(libpq ≥ 10 即支持 SCRAM),不存在"旧客户端
#   只会 md5"的现实约束。
# · 判据仍把 `md5` 留在**可接受集合**里,但要求带行内理由标记(见测试 A1b):真实约束
#   若出现(某个只支持 md5 的老驱动),处置应是换驱动,而不是把整档退回免密。留这个出口
#   的理由正是本票的起因 —— **没有出口的人会把 trust 加回来**,那比 md5 坏一个数量级。
# · `password`(明文口令过线)与 `trust`/`cert`/`peer`/`ident`/`sspi`/`gss` 一律不出现在
#   本文件:前者把口令摊在链路上,后者不验口令。
#
# -----------------------------------------------------------------------------
# 本档涉及的三个角色(边界各不相同,不要合并成 `all`)
# -----------------------------------------------------------------------------
# · `postgres`  —— 超级用户,只做管理与救火:建库、改权限、读 pg_* 目录。给到 `all`
#   数据库是必要的(它必须能连 `postgres`/`template1` 做维护),但**只给回环**且必须口令。
# · `ihui`      —— 应用角色(O13 的产物):只连业务库,不带 superuser。
# · `beifen`    —— 备份专用只读角色(O20c 这条链的正例):NOSUPERUSER + pg_read_all_data
#   + BYPASSRLS,只允许连目标业务库。BYPASSRLS 不是特权膨胀而是**正确性要求**:库里有
#   带 FORCE ROW LEVEL SECURITY 的表,缺它这些表会被策略过滤成空而 pg_dump 完全不报错。
#   它的口令落在仓库外的凭据权威目录(见 deploy/win/ihui-pg-backup.ps1 的取用逻辑),
#   **本文件里不出现任何口令**:pg_hba 本来也不存口令,写进来只会是多一份无人管的副本。
# =============================================================================

# =============================================================================
# A 段 · 管理角色 postgres:仅本机回环 / 共享内存,必须口令
# =============================================================================
# 为什么这一段的前置不是文件内容而是"确认 postgres 已设有 scram 口令":
# 2026-09-25 那次事故的成因就是"改完 scram 才发现这台机从没人给 postgres 设过口令"
# (此前整台机靠免密连库)⇒ 收紧之后管理员对谁都不通,包括改配置的人。所以
# apply-pg-hba.ps1 把"管理员口令可用"做成一条必须显式确认的开关,不靠人记得。
local      all          postgres       scram-sha-256
host       all          postgres       127.0.0.1/32   scram-sha-256
host       all          postgres       ::1/128        scram-sha-256

# =============================================================================
# B 段 · 备份专用只读角色 beifen:只目标业务库,其余库显式拒绝
# =============================================================================
# 顺序解释(这一处最容易写反):先给"允许的窄行",再给"拒绝的宽行"。
# 反过来写会让第一条 reject 先匹配到业务库,表现是"备份账号突然连不上库",
# 而配置看上去没错 —— 因为两行长得很像,只有首条匹配语义解释了它。
#
# 为什么要有 reject 行,而不是"不写就完了":F 段有一条 `host all all ... scram-sha-256`
# 兜底口令行,没有这两行时 beifen 仍能连任意库。角色本身确实只读,所以不会丢数据,
# 但"能连"与"能读什么"是两回事:它能枚举库名、探测其它库的对象清单,而备份根本不需要。
# 显式 reject 还把这条边界写成了文档,而不是依赖"权限恰好够小"。
#
# 为什么 `local` 给 beifen 直接 reject 而没有允许行:备份链一律带 `-h localhost`
# (实测见 deploy/win/ihui-pg-backup.ps1 里 pg_dump/psql 的调用形态),走的是 TCP。
# 留一条没被任何调用方测过的通路,等于留一条"哪天它开始用共享内存连、行为没人验过"的
# 暗道;要放开就先改调用方,再改这里。
host       ihui_dev     beifen         127.0.0.1/32   scram-sha-256
host       ihui_dev     beifen         ::1/128        scram-sha-256
local      all          beifen                       reject
host       all          beifen         127.0.0.1/32   reject
host       all          beifen         ::1/128        reject

# =============================================================================
# C 段 · 应用角色 ihui:只业务库,仅本机
# =============================================================================
# 应用连不上时最容易有人顺手把这一行改成 trust 来"排除认证问题"。所以这里把
# 判据写死:业务库之外不新增应用可见范围;要临时排查请用人家的管理账号,不要改这行。
local      ihui_dev     ihui           scram-sha-256
host       ihui_dev     ihui           127.0.0.1/32   scram-sha-256
host       ihui_dev     ihui           ::1/128        scram-sha-256

# =============================================================================
# F 段 · 兜底:其余任何"角色 × 库"组合,只允许本机 + 口令,绝不放宽成免密
# =============================================================================
# 为什么必须有兜底行(而不是靠"没写就等于拒绝"):
#   收紧配置最常见的失败不是配错,而是**太严以致有人整个退回免密**。监控 exporter、
#   迁移期临时账号、集成测试用的另一个库,都会在缺兜底时表现为"改一下 pg_hba 才能干活"。
#   兜底给这些未知消费方一个"必须口令、但只在本机"的档,于是收紧是可长期维持的。
#   它与 A/C 段的差别是范围(all × all),不是强度 —— 强度上三档同为口令。
# 必须位于文件末尾(见开头"首条匹配即裁决"),判据 A5 就是钉这一条的。
# IPv4 与 IPv6 两行都要:本机 `localhost` 可能先解析到 ::1,只写 /32 时部分驱动
# (连接池/JDBC 一类)不会重试下一个地址,现象是"psql 能连、应用连不上",
# 极容易被误读成应用侧缺陷。
local      all          all                          scram-sha-256
host       all          all            127.0.0.1/32   scram-sha-256
host       all          all            ::1/128        scram-sha-256

# =============================================================================
# 本档刻意**不写**的东西(每一条都是决定,不要"顺手补上")
# =============================================================================
# · 不写 0.0.0.0/0、网段、主机名条目:外部地址无匹配行 = 拒绝。需要跨机访问请另开一票,
#   同时更新 apps/api/tests/o20c-pg-hba-policy.test.ts 的白名单与理由,而不是在这里加行。
# · 不写 replication 条目:本仓未启用流复制;需要时单独评审(复制口子一旦开,等于给
#   对端整库读的权限,和备份只读角色的边界完全不是一回事)。
# · 不写 trust / password / md5 / cert / peer / ident / sspi / gss:理由见文件开头
#   「认证方法的选择」。真要出现 md5 的历史客户端,必须在同一行写
#   `md5-legacy-reason: <一句话>` 并同步登记到期处置,否则判据 A1b 直接红。
# · 不写任何口令、连接串、环境变量名取值:pg_hba 不承载口令,写了只会多一份无人轮换的
#   副本;判据 A4 用一条反向正则专门拦这一型。
# =============================================================================
# ⁠​‌​​‌​​‌‍‍​‌​​‌​​​‍‍​‌​‌​‌​‌‍‍​‌​​‌​​‌‍‍​​‌​‌‌​‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌​​‌‌‌‌​‌​‍‍‌‌​‌‌​​​‌​​​‌‌‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌‌​‌​​‌‌‌​‍‍‌‌​​‌‌​​​‌​​‌​‌‍‍‌​‌‌‌​‌‌‌​‌‌‌​‌‍‍‌​‌‌​‌‌‌‍‍​‌​​‌‌​​‍‍​‌​​​​‌‌‍‍‌​‌‌​‌‌‌‍‍​‌‌​​​​‌‍‍​‌‌​‌​​‌‍‍​‌‌‌‌​‌​‍‍​‌‌​‌​​​‍‍​‌‌‌​​‌‌‍‍​​‌​‌‌‌​‍‍​‌‌‌​‌​​‍‍​‌‌​‌‌‌‌‍‍​‌‌‌​​​​‍‍‌​‌‌​‌‌‌‍‍​‌​‌​​​​‍‍​‌​‌​​‌​‍‍​‌​​‌‌‌‌‍‍​‌​‌​‌‌​‍‍​‌​​​‌​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​‌‌‍‍​‌​​​‌​‌‍‍​​‌​‌‌​‌‍‍​​‌‌​​‌​‍‍​​‌‌​​​​‍‍​​‌‌​​‌​‍‍​​‌‌​‌‌​⁠
