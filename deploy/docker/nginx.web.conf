# A 套壳架构 nginx 配置(2026-07-24)
# output:'export' 静态文件服务 + API/AI-service 反向代理
# 替代 Next.js standalone server.js + rewrites(output:export 不支持 rewrites)

# O5 边缘限流(2026-09-23 补):本文件此前一条 limit_req 都没有 ⇒ 单机/SaaS(docker-compose)
# 部署完全没有边缘限速,只有蓝绿那套 deploy/nginx/nginx-blue-green.conf 有。
# zone 名一律加 docker_ 前缀:本文件与 deploy/nginx/conf.d/*.conf 可能落进同一个 http 上下文,
# 重名会让 nginx 启动即失败(duplicate zone)。
limit_req_zone $binary_remote_addr zone=docker_api_zone:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=docker_ai_service_zone:10m rate=20r/s;
# ── ai-service 对外能力面(2026-09-28 立,机主拍板"按能力目录逐项放开")──────
# 与站点侧 deploy/nginx/conf.d/public-ai-service.conf 的**同批**改动,三处刻意差异:
#   1) zone 名与 map 结果变量名一律 `docker_` 前缀(本文件与 conf.d/*.conf 可能落进
#      同一个 http 上下文 ⇒ 重名 zone 是 `duplicate zone`、重名 map 结果是 `"x" is
#      already used`,两者都是 nginx **启动失败**,不是一个警告);
#   2) 上游是容器名 `ai-service:8803`(docker-compose.yml 的 ai-service 服务),站点侧是
#      宿主机 `127.0.0.1:8803`;
#   3) 本壳上第三方入口挂在 `/ai-service/api/mcp` 而**不是** `/api/mcp`:
#      `location = /api/mcp` 在本壳上会与 apps/api 的 MCP **项目** CRUD 撞路径 ——
#      packages/api-client/src/endpoints/misc.ts:130/141 就用 `GET/POST /api/mcp` 读写
#      `McpProject`(那是 api 的资源,不是 ai-service 的 JSON-RPC 入口),抢过来等于把
#      站内"我的 MCP 项目"整块打坏。命名空间分离与 apps/web/src/config/ai-service-edge.ts
#      那句"为什么另起 /ai-service/* 而不复用 /api/*"是同一条理由。
# 档位取值理由(与站点侧逐字同口径,不另立一套):MCP 一次会话在稳态前会先 initialize /
# tools/list,10r/s/IP ≈ 600 次/分钟远宽于合法用法,只为掐洪泛;未带凭据的那批
# (注定被应用层 401)另按 2r/s/IP 收紧,map 的取值方向与站点侧 $aisvc_anon_key 同款。
limit_req_zone $binary_remote_addr zone=docker_aisvc_open_zone:10m rate=10r/s;

map $http_authorization $docker_aisvc_anon_key {
    ""      $binary_remote_addr;
    default "";
}
limit_req_zone $docker_aisvc_anon_key zone=docker_aisvc_anon_zone:10m rate=2r/s;
# 超限统一回 429(nginx 默认 503 会让客户端误判为服务不可用,且不会触发 SDK 退避)
limit_req_status 429;

server {
   listen 8801;
   server_name _;
   root /usr/share/nginx/html;
   index index.html;

   # 超限应答:带 Retry-After 供前端/SDK 退避(与 nginx-blue-green.conf 同口径)
   error_page 429 = @rate_limited;
   location @rate_limited {
       default_type application/json;
       add_header Retry-After "1" always;
       return 429 '{"code":429,"message":"请求过于频繁,请稍后重试"}';
   }

   # gzip 压缩
   gzip on;
   gzip_vary on;
   gzip_min_length 1024;
   gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml image/svg+xml;

   # 静态资源缓存(Next.js _next/static/ 带内容哈希,可永久缓存)
   location /_next/static/ {
       expires 1y;
       add_header Cache-Control "public, immutable";
   }

   # API 反向代理 → apps/api (Fastify :8802 → Docker 内网 api:8802)
   location /api/ {
       limit_req zone=docker_api_zone burst=200 nodelay;
       proxy_pass http://api:8802;
       proxy_http_version 1.1;
       proxy_set_header Upgrade $http_upgrade;
       proxy_set_header Connection "upgrade";
       proxy_set_header Host $host;
       proxy_set_header X-Real-IP $remote_addr;
       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
       proxy_set_header X-Forwarded-Proto $scheme;
       proxy_read_timeout 300s;
       proxy_send_timeout 300s;
       # P0 流式修复：禁用响应缓冲，确保 SSE 逐 chunk 转发到前端
       proxy_buffering off;
       proxy_cache off;
   }

   # ── ai-service 对外能力:① 类唯一放开项 mcp:connect(与站点侧片段同批)────
   # 精确匹配 `location =` 优先于下方 `location /ai-service/` 前缀,所以它拿到的是
   # **独立的两段闸**(会话档 + 未带凭据档),不与站内自己的 ai-service 流量共用额度。
   # 为什么只放这一条:能力目录里 host:'ai-service' 的条目现读 6 项,只有 mcp:connect
   # 同时满足"thirdPartyEligible=true + dataClass 非 platform + 端点自带凭据闸"三条
   # (逐条分类与理由见 deploy/nginx/conf.d/public-ai-service.locations.fragment 头注,
   #  那一份是清单的正文,这里刻意不重述以免两处文字漂移)。
   # 鉴权来源(ai-service 侧唯一出口 app/services/capability_gate.py::resolve_principal_from_headers):
   #   只认 HS256 用户 JWT 或 HMAC 签名的内网头;**机器 key(ihui_/X-Api-Key)一律 401**。
   #   下面两行 `proxy_set_header … "";` 把"公网不该存在"的身份通道剥掉:
   #     · X-IHUI-Principal 是 apps/api 在内网签发的冒名风险面,外部携带即等于冒充他人主体;
   #     · X-Api-Key 本就会被应用层拒,剥掉只为让"为什么被拒"只有一种答案。
   # ⚠️ 本壳上仍有一处**早于本票**的更宽面:`location /ai-service/`(2026-07-24 A 套壳)
   #   把 ai-service 整棵子树按前缀代理出去(尾斜杠 ⇒ /ai-service/X 转成上游 /X),
   #   即"逐项放开"之外的既有暴露面。本票刻意**不收窄**它:仓内 5 端源码对 `/ai-service/`
   #   零 HTTP 调用方不等于全网无调用方(§7 删除安全:先证功能承接,再谈移除),
   #   收窄属该 location 持有人的决策。审计脚本把它作为"超出白名单的既有宽面"点名报数。
   location = /ai-service/api/mcp {
       # @public-exposure: open capability=mcp:connect method=POST path=/ai-service/api/mcp upstream=/api/mcp
       limit_req zone=docker_aisvc_open_zone burst=30 nodelay;
       limit_req zone=docker_aisvc_anon_zone burst=5 nodelay;
       proxy_set_header X-IHUI-Principal "";
       proxy_set_header X-Api-Key "";
       proxy_pass http://ai-service:8803/api/mcp;
       proxy_http_version 1.1;
       proxy_set_header Host              $host;
       proxy_set_header X-Real-IP         $remote_addr;
       proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
       proxy_set_header X-Forwarded-Proto $scheme;
       # MCP 的 tools/call 带 _meta.progressToken 时走 SSE 长响应 ⇒ 关缓冲 + 长读超时
       # (与下方 /ai-service/ 与站点侧片段同口径)。
       proxy_buffering off;
       proxy_request_buffering off;
       proxy_read_timeout 3600s;
       proxy_send_timeout 3600s;
   }

   # AI Service 反向代理 → apps/ai-service (FastAPI :8803 → Docker 内网 ai-service:8803)
   location /ai-service/ {
       limit_req zone=docker_ai_service_zone burst=60 nodelay;
       # 2026-09-28 随"逐项放开"票同批的**零路由影响加固**(只剥头,不改 proxy_pass):
       # 本 location 按前缀把公网流量整片转给 ai-service,而 nginx 默认原样转发客户端请求头
       # ⇒ 内网身份通道 X-IHUI-Principal 会跟着进来。ai-service 那一侧把它当"apps/api 在内网
       # 签发的可信主体"(app/services/capability_gate.py:261 verify_principal_header,HMAC+exp),
       # 公网能携带它 = 一旦签名密钥外泄即整片冒名。现读全仓:该头的**生产者为零**
       # (`git grep X-IHUI-Principal -- apps/api/src packages` 0 命中;api 走 AI_SERVICE_URL
       #  容器网直连,不经本 location),消费者只有 ai-service 的校验函数 ⇒ 剥掉不会改任何一条
       # 现有链路。与上方精确 location 同一条纪律:身份只许来自凭据本身。
       # ⚠️ 本 location 仍是"整棵子树"形态,超出本票白名单;收窄它属该 location 持有人的决策
       #    (本仓 §7:先证功能承接再谈移除),现由 scripts/check-public-exposure-list.mjs
       #    以 X5 逐条点名报数(只报数不判红,免得变成替别人背债的恒红门)。
       proxy_set_header X-IHUI-Principal "";
       proxy_pass http://ai-service:8803/;
       proxy_http_version 1.1;
       proxy_set_header Upgrade $http_upgrade;
       proxy_set_header Connection "upgrade";
       proxy_set_header Host $host;
       proxy_set_header X-Real-IP $remote_addr;
       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
       proxy_set_header X-Forwarded-Proto $scheme;
       proxy_read_timeout 600s;
       proxy_send_timeout 600s;
       # P0 流式修复：禁用响应缓冲，确保 SSE 逐 chunk 转发到前端
       proxy_buffering off;
       proxy_cache off;
       proxy_request_buffering off;
   }

   # WebSocket 代理(/socket.io/)
   location /socket.io/ {
       proxy_pass http://ai-service:8803;
       proxy_http_version 1.1;
       proxy_set_header Upgrade $http_upgrade;
       proxy_set_header Connection "upgrade";
       proxy_set_header Host $host;
       proxy_set_header X-Real-IP $remote_addr;
       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
       proxy_set_header X-Forwarded-Proto $scheme;
   }

   # APK 自托管分发(2026-08-17):同源直链下载,强制 attachment 下载 + 防缓存
   location /apk/ {
       add_header Content-Disposition 'attachment; filename="ihui-ai-latest.apk"';
       add_header Cache-Control "no-cache";
       try_files $uri =404;
   }

   # ── 前端鉴权拦截(2026-08-30 安全加固) ──
   # 与 apps/web/proxy.ts dev 模式 middleware 对等:next.config.ts 用 output:'export'
   # 静态导出,Next middleware 生产环境不生效,由 nginx 层补齐未登录拦截。
   # 规则:cookie auth_token 为空 → 307 到 /sso/login?redirect=<原始路径>(307 保留 method,
   # 与 dev middleware 一致;nginx 1.11.8+ 支持 return 307,本镜像为 nginx:1.27-alpine)。
   # 只判 cookie 存在性(性能敏感,不做后端验签;token 验签由后端 /api/auth/verify 负责)。
   # 不影响 /api/、/ai-service/、/_next/static/ 等其他 location。
   location /admin/ {
       if ($cookie_auth_token = "") {
           return 307 /sso/login?redirect=$request_uri;
       }
       # 已登录:走 SPA 回退,与 location / 行为一致
       try_files $uri $uri.html $uri/index.html /index.html;
   }

   # 教务管理路由(matcher 与 proxy.ts 一致: /edu/edu-management/:path*),拦截规则同 /admin/
   location /edu/edu-management/ {
       if ($cookie_auth_token = "") {
           return 307 /sso/login?redirect=$request_uri;
       }
       try_files $uri $uri.html $uri/index.html /index.html;
   }

   # 无权限提示页不拦截(与 proxy.ts UNAUTHORIZED_PATH 一致,让用户看到无权限页)
   location = /admin/unauthorized {
       try_files $uri /index.html;
   }

   # SPA 回退:客户端路由全部回退到 index.html(Next.js output:export 需要)
   location / {
       try_files $uri $uri.html $uri/index.html /index.html;
   }

   # 健康检查端点
   location /health {
       access_log off;
       return 200 "ok";
       add_header Content-Type text/plain;
   }
}
