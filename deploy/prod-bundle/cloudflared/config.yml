# =============================================================================
# Cloudflare Tunnel 配置文件(备选,token 模式不需要此文件)
# =============================================================================
# 用途:当不想用 token 模式时,可以用 config.yml + credentials.json 模式
# 适用场景:
#   1. token 已 rotate,新 token 需要重新部署
#   2. 想完全本地管理 ingress 规则(不依赖 Cloudflare 后台)
#   3. 调试 tunnel 连接
#
# 用法:
#   1. 把 cloudflared 容器或本机 cloudflared 切换到 config 模式:
#      cloudflared tunnel --config deploy/prod-bundle/cloudflared/config.yml run
#   2. credentials.json 在 ~/.cloudflared/<TUNNEL_ID>.json
#      (从 token 模式自动生成,或从 Cloudflare 后台下载)
#
# 当前部署默认用 token 模式,本文件仅作备选/参考
# =============================================================================

tunnel: e675929a-f6f0-4893-927e-4c823f9724e0
credentials-file: /root/.cloudflared/e675929a-f6f0-4893-927e-4c823f9724e0.json

# ============================================================================
# Ingress 规则(本文件是 token 模式之外的备选,真相同步自 Cloudflare 控制台)
# ============================================================================
# 2026-10-19 现读控制台 ihui-local 共 **8 条**路由,本文件此前只记了 2 条 ——
# 谁按本文件切到 config 模式跑,就会把另外 6 个域名一起打成 404。
# 服务地址一律写 127.0.0.1 而**不是** localhost:cloudflared 把 localhost 解析成
# ::1 优先去连,而各服务只听 IPv4 回环 ⇒ 该请求直接 530(实测 764 条这类拒连)。
# Cookie 写在 .aizhs.top 域,主子域共享登录态。

ingress:
  # 主站(web,8801)
  - hostname: aizhs.top
    service: http://127.0.0.1:8801
  # 登录/扫码/第三方 OAuth 回调专用子域(同一台 web)
  - hostname: bsm.aizhs.top
    service: http://127.0.0.1:8801
  # API(Fastify,8802)
  - hostname: api.aizhs.top
    service: http://127.0.0.1:8802
  # AI 服务(FastAPI,8803)
  - hostname: ai.aizhs.top
    service: http://127.0.0.1:8803
  # 文件/上传出口(同 API)
  - hostname: file.aizhs.top
    service: http://127.0.0.1:8802
  # 远程桌面隧道
  - hostname: rdp.aizhs.top
    service: tcp://127.0.0.1:3389
  # SSH 隧道
  - hostname: ssh.aizhs.top
    service: ssh://127.0.0.1:22
  # 单点登录(Keycloak,8543)
  - hostname: sso.aizhs.top
    service: http://127.0.0.1:8543
  # 兜底(404)
  - service: http_status:404

# ============================================================================
# 日志级别
# ============================================================================
# debug / info / warn / error / fatal
loglevel: info

# ============================================================================
# Transport 协议优化
# ============================================================================
# quic(默认)/ http2
# 本网络实测:cloudflared 预检 `UDP Connectivity region2.v2.argotunnel.com = QUIC connection failed`,
# 而现役 Windows 服务 ImagePath 带的就是 `--protocol http2`。本文件与实跑对齐,
# 免得谁切到 config 模式反而用上一条在这台网结构性缺一腿的协议。
protocol: http2

# ============================================================================
# 重试策略
# ============================================================================
retries: 5
grace-period: 30s

# ============================================================================
# 健康检查端点(localhost:$(PORT))
# ============================================================================
# cloudflared 启动后在本地开一个 HTTP 端口用于健康检查
metrics: 127.0.0.1:36500
