# promtool 单元测试 —— Redis 持久化三条规则的正反用例(2026-10-02 立)。
# 目的不是"多覆盖",是让"这三条规则真会响"变成可机器证明的东西:
# 每条规则各有一对正例(必 firing)与反例(必不 firing),含空转(changes=0)不报警这一格。
# 时间语义:promtool unit test 的时钟自 epoch(1970-01-01T00:00Z)起算,
#   所以 `time() - redis_rdb_last_save_timestamp_seconds > 7200` 这一条要用
#   "很旧的 last_save(=1) + 足够晚的 eval_time(140m)"来构造,而不是拿真实时钟。
# 运行:promtool test rules monitoring/prometheus/tests/redis-persistence.test.yml
rule_files:
  - ../alerts.yml

evaluation_interval: 1m

tests:
  # ── 正例一:RDB bgsave 失败持续 >5m ⇒ RedisPersistenceFailing firing ──
  - interval: 1m
    input_series:
      - series: 'redis_rdb_last_bgsave_status{instance="localhost:9121"}'
        values: '0x141'
      - series: 'redis_aof_last_bgrewrite_status{instance="localhost:9121"}'
        values: '1x141'
      - series: 'redis_aof_last_write_status{instance="localhost:9121"}'
        values: '1x141'
      - series: 'redis_rdb_changes_since_last_save{instance="localhost:9121"}'
        values: '0x141'
      - series: 'redis_rdb_last_save_timestamp_seconds{instance="localhost:9121"}'
        values: '0x141'
    alert_rule_test:
      - eval_time: 10m
        alertname: RedisPersistenceFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: localhost:9121
            exp_annotations:
              summary: 'Redis 持久化失败(RDB bgsave / AOF rewrite 报错)'
              description: 'RDB bgsave 或 AOF rewrite 最后一次状态为失败(instance localhost:9121),重启/崩溃随时可能丢数据'

  # ── 正例二:AOF 写盘失败 ⇒ RedisAofWriteFailing firing ──
  - interval: 1m
    input_series:
      - series: 'redis_rdb_last_bgsave_status{instance="localhost:9121"}'
        values: '1x141'
      - series: 'redis_aof_last_bgrewrite_status{instance="localhost:9121"}'
        values: '1x141'
      - series: 'redis_aof_last_write_status{instance="localhost:9121"}'
        values: '0x141'
      - series: 'redis_rdb_changes_since_last_save{instance="localhost:9121"}'
        values: '0x141'
      - series: 'redis_rdb_last_save_timestamp_seconds{instance="localhost:9121"}'
        values: '0x141'
    alert_rule_test:
      - eval_time: 10m
        alertname: RedisAofWriteFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: localhost:9121
            exp_annotations:
              summary: 'Redis AOF 写盘失败'
              description: 'AOF(everysec)落盘连续报错(instance localhost:9121):写命令已无法持久化,常见于磁盘满/权限变化'

  # ── 正例三:有未落盘变更且 RDB 超 2h 未保存 ⇒ RedisRdbStale firing(for:15m) ──
  # last_save=1(1970+s)且 eval 在 140m:time()-1=8399 > 7200 已在 t>7201s 成立,
  # +15m for 之后必经 firing;rdb/bgsave 状态保持 1 确保不误触另外两条。
  - interval: 1m
    input_series:
      - series: 'redis_rdb_last_bgsave_status{instance="localhost:9121"}'
        values: '1x141'
      - series: 'redis_aof_last_bgrewrite_status{instance="localhost:9121"}'
        values: '1x141'
      - series: 'redis_aof_last_write_status{instance="localhost:9121"}'
        values: '1x141'
      - series: 'redis_rdb_changes_since_last_save{instance="localhost:9121"}'
        values: '10x141'
      - series: 'redis_rdb_last_save_timestamp_seconds{instance="localhost:9121"}'
        values: '1x141'
    alert_rule_test:
      - eval_time: 140m
        alertname: RedisRdbStale
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: localhost:9121
            exp_annotations:
              summary: 'Redis RDB 超过 2 小时未成功保存(且有未落盘变更)'
              description: '存在未落盘变更且最后成功保存距今超过 2 小时(instance localhost:9121),检查磁盘与日志'

  # ── 反例一:一切正常(含空转:changes=0 且 last_save 很旧)⇒ 三条规则均不得 firing ──
  # 这一格防的正是最常见假红形态:无写入时 last_save 天然陈旧,不得据此报警。
  - interval: 1m
    input_series:
      - series: 'redis_rdb_last_bgsave_status{instance="localhost:9121"}'
        values: '1x141'
      - series: 'redis_aof_last_bgrewrite_status{instance="localhost:9121"}'
        values: '1x141'
      - series: 'redis_aof_last_write_status{instance="localhost:9121"}'
        values: '1x141'
      - series: 'redis_rdb_changes_since_last_save{instance="localhost:9121"}'
        values: '0x141'
      - series: 'redis_rdb_last_save_timestamp_seconds{instance="localhost:9121"}'
        values: '1x141'
    alert_rule_test:
      - eval_time: 140m
        alertname: RedisPersistenceFailing
        exp_alerts: []
      - eval_time: 140m
        alertname: RedisAofWriteFailing
        exp_alerts: []
      - eval_time: 140m
        alertname: RedisRdbStale
        exp_alerts: []
# ⁠​‌​​‌​​‌‍‍​‌​​‌​​​‍‍​‌​‌​‌​‌‍‍​‌​​‌​​‌‍‍​​‌​‌‌​‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌​​‌‌‌‌​‌​‍‍‌‌​‌‌​​​‌​​​‌‌‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌‌​‌​​‌‌‌​‍‍‌‌​​‌‌​​​‌​​‌​‌‍‍‌​‌‌‌​‌‌‌​‌‌‌​‌‍‍‌​‌‌​‌‌‌‍‍​‌​​‌‌​​‍‍​‌​​​​‌‌‍‍‌​‌‌​‌‌‌‍‍​‌‌​​​​‌‍‍​‌‌​‌​​‌‍‍​‌‌‌‌​‌​‍‍​‌‌​‌​​​‍‍​‌‌‌​​‌‌‍‍​​‌​‌‌‌​‍‍​‌‌‌​‌​​‍‍​‌‌​‌‌‌‌‍‍​‌‌‌​​​​‍‍‌​‌‌​‌‌‌‍‍​‌​‌​​​​‍‍​‌​‌​​‌​‍‍​‌​​‌‌‌‌‍‍​‌​‌​‌‌​‍‍​‌​​​‌​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​‌‌‍‍​‌​​​‌​‌‍‍​​‌​‌‌​‌‍‍​​‌‌​​‌​‍‍​​‌‌​​​​‍‍​​‌‌​​‌​‍‍​​‌‌​‌‌​⁠
