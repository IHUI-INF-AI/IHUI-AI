# 告警规则 — IHUI-AI 监控告警
#
# ── 日志来源锚点(告警侧,G-472 的第二半;采集侧的流分区见 promtail 配置)──────────────
# LOG_SOURCE_ANCHOR: page={job=~"api|ai-service|applogs"} report-only={job="monitorlogs"}
#   这一行**不是散文**:monitoring/alertbridge/log-source-anchor.js 用同一个解析函数把它与
#   monitoring/promtail/promtail-config.yml 里的同名标记对账,标签名与分区取值一律现读采集侧
#   产出(不得在本文件另起第二个标签名 —— 两处算同一件事必漂移)。对账判不出 ⇒ 桥侧一律
#   fail-open(全部照旧到人,绝不静默压掉任何一条),并由下面的 LogSourceSplitBlind 响。
#   为什么要分流:Loki 会把收到的查询语句原样打进自己的 querier INFO 行,postgres_exporter 的
#   采集器失败每 15 秒刷一条 `source=collector.go msg="collector failed"` —— 两者过去都混在
#   `job=applogs` 里,于是"按关键字计数"的日志型判据数到的是监控自己引用自己与采集器噪声,
#   而不是业务错误(症状:告警永远压不掉、看起来像真故障)。
#   规矩(台账 G-472 的判据写法,照抄别重新发明):日志型判据必须同时带 ①来源分区 ②级别词
#   ③出处词 三样;只带关键字的先修再用。**出口不变**:到人仍只有 Alertmanager → bridge → 品牌
#   邮件这一条通道,本分流只决定"炸不炸到人",不新增任何发信方式。
groups:
  - name: api-alerts
    rules:
      # API 宕机(1 分钟内无指标)
      - alert: ApiDown
        expr: up{job="api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'API 服务宕机'
          description: 'API 服务 {{ $labels.instance }} 已宕机超过 1 分钟'

      # API 高错误率(5xx 占比 > 5%)
      - alert: ApiHighErrorRate
        expr: |
          sum(rate(http_requests_by_status{job="api",status=~"5.."}[5m]))
          /
          sum(rate(http_requests_by_status{job="api"}[5m]))
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'API 错误率过高'
          description: 'API 5xx 错误率 {{ $value | humanizePercentage }} 超过 5% 持续 5 分钟'

      # API 响应时间过长(P95 > 1s)
      - alert: ApiSlowResponse
        expr: |
          histogram_quantile(0.95,
            rate(http_response_time_bucket{job="api"}[5m])
          ) > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'API 响应时间过长'
          description: 'API P95 响应时间 {{ $value }}ms 超过 1s 持续 5 分钟'

  - name: ai-service-alerts
    rules:
      # AI 服务宕机
      - alert: AiServiceDown
        expr: up{job="ai-service"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'AI 服务宕机'
          description: 'AI 服务已宕机超过 1 分钟'

  - name: llm-alerts
    rules:
      # LLM provider 健康/配额降级(重): model_sync 把 provider 标记为不健康(常见于 402/配额超限被禁用)。
      # 指标 `model_sync_provider_health`(gauge, 1=健康/0=降级)已确认持续采样(含 provider_code=stepfun)。
      - alert: LlmProviderUnhealthy
        expr: model_sync_provider_health{job="ai-service"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'LLM provider 不健康(疑似 402/配额超限)'
          description: 'provider_code={{ $labels.provider_code }} 被标记为不健康已达 5 分钟。检查配额/费用(stepfun/step-3.7-flash 曾 402 quota_exceeded 拖垮线上)。'

      # LLM provider 错误突增(402/5xx 等): 15 分钟窗口内出现 provider 错误。
      # `ihui_llm_provider_errors_total` 为按需采样计数(无事件时不出现), 用 `or on() vector(0)` 兜底为 0,
      # 指标一出现即生效。
      # ⚠ 本文件曾在这条与下面 LlmTokenCostSurge 上写 `disabled: true` —— **Prometheus 3.x 没有这个字段**,
      #   带上它 promtool 直接拒绝整份规则文件(`field disabled not found in type rulefmt.Rule`),
      #   后果不是"这一条不响"而是**整份 12 条一起不加载**。线上之所以还响着,是因为部署机读的是
      #   D:\DevEnv\monitor\prometheus\ 下一份去掉了这两条的副本 —— 即"仓库这份从没真跑过"。
      #   现按作者原意改回可加载形态:两条都带 `or on() vector(0)` 兜底,指标缺席时算式恒为 0 > 0 /
      #   0 > 100000 = 假,所以"接入打点前不会误报"这一目的由表达式自己保证,不需要关文件的开关。
      - alert: LlmProviderErrorBurst
        expr: (sum(rate(ihui_llm_provider_errors_total{job="ai-service"}[15m])) or on() vector(0)) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'LLM provider 错误突增'
          description: '15 分钟窗口内出现 LLM provider 错误(含 402 配额/超限/5xx)。请核查 LLM 网关日志与配额。'

      # LLM token/费用突增: 15 分钟 token 量超阈值(费用代理指标)。
      # `ihui_llm_tokens_total` 同为按需采样计数; 阈值 100k 需按真实基线校准(当前尚无采样, 规则已就位待指标出现即生效)。
      # ⚠ 当前 ai-service 尚未打点该指标(absent);与上面同一条机制 —— `or on() vector(0)` 已保证缺席时恒不成立,
      #   故不再写 Prometheus 3.x 不认的 `disabled:` 字段(写了会让整份文件加载失败)。阈值 100k 待真实基线校准。
      - alert: LlmTokenCostSurge
        expr: (sum(rate(ihui_llm_tokens_total{job="ai-service"}[15m])) or on() vector(0)) > 100000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'LLM token/费用突增'
          description: '15 分钟 LLM token 用量 {{ $value }} 超过阈值 100000,费用可能异常上涨。阈值需按基线人工校准。'

  - name: infrastructure-alerts
    rules:
      # Windows 宿主机磁盘空间不足(< 15%,windows_exporter 逻辑盘指标)
      - alert: WindowsDiskSpaceLow
        expr: |
          (windows_logical_disk_free_bytes / windows_logical_disk_size_bytes) < 0.15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '磁盘空间不足'
          description: 'Windows 卷 {{ $labels.volume }} 剩余空间不足 15%(当前 {{ $value | humanizePercentage }})'

      # PostgreSQL 实例 down
      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'PostgreSQL 实例不可用'
          description: 'Postgres exporter {{ $labels.instance }} 无指标,PostgreSQL 疑似宕机'

      # Redis 实例 down
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Redis 实例不可用'
          description: 'Redis exporter {{ $labels.instance }} 无指标,Redis 疑似宕机'

      # ⚠ 原 DiskSpaceLow / MemoryLow 两条已判"结构上永不响",2026-09-27 实测后收口 ——
      #   它们取的是 node_exporter 的 `node_filesystem_*` / `node_memory_*`,而本机 prometheus.yml
      #   第 189 行的 `node` job 是**注释掉的**(这台机跑 windows_exporter,没有 node_exporter):
      #   `/api/v1/series?match[]=node_filesystem_avail_bytes` 与 `node_memory_*` 均返回 `data:[]`,
      #   即表达式恒不匹配。一条永不匹配的告警规则与没有规则等价,却会在台账上读成
      #   "磁盘/内存已有人看守" —— 那比空缺更贵,所以不留"先挂着以后用"的余地。
      #   · 磁盘维:已由同组上方的 WindowsDiskSpaceLow(windows_logical_disk_*,实测在采)覆盖,
      #     故本条**删除**而不是改写 —— 两个维度各留一把尺子,免得同一件事两处基线互相顶掉。
      #   · 内存维:下面改写为 windows_exporter 的等价表达式(此前无任何活的内存告警)。
      #   真接了 Linux node_exporter 那天,把 node_* 两形**按当次实测的指标名**再加回来,
      #   不要照抄本注释里的名字 —— 名字漂了又是一条恒不响的规则。
      # 主机内存不足(可用/物理 < 10%,windows_exporter)
      - alert: MemoryLow
        expr: |
          (windows_memory_available_bytes
          /
          windows_cs_physical_memory_bytes)
          < 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '内存不足'
          description: 'Windows 可用内存占物理内存不足 10%(当前 {{ $value | humanizePercentage }})'

      # RSSHub(IHUI-RSSHUB 服务)宕机 —— "一个服务没了却没有任何到人出口"那一格的尺子(2026-09-27 立)。
      # 立因实测:该服务自 09-11 后再无一次成功启动(nssm Application 指向的
      #   `C:\Users\Administrator\.workbuddy\binaries\node\versions\22.22.2-2\node.exe` 已被 workbuddy
      #   自升级顶掉,目录现仅剩 22.22.2-3 / current;09-24 04:39 与 09-26 07:58 两条系统事件日志原话
      #   「IHUI-RSSHUB … 服务意外终止 … 系统找不到指定的路径」),而全链对它零覆盖:
      #   不是抓取目标、alerts.yml 无它的规则、ai-world-sync 的源失败只写 aiWorldSyncLog 表。
      # 后果实测(2026-09-27):apps/api/.env 未设 RSSHUB_URL ⇒ `rsshub()` 回落 https://rsshub.app,
      #   现量 curl(直连=000 / 走 SYNC_PROXY_URL=7897 亦 403,公共实例自述"仅测试用途"),
      #   五个国内源(qbitai/36kr-ai/leiphone-ai/thepaper-ai/huxiu)每 12 小时静默失败一次;
      #   且 thepaper 路由的上游 bug 只在本地这份 RSSHub 修过(见 ai-world-sync.ts:200)——
      #   本地实例是该能力唯一可用抓取器,09-05~09-10 其访问日志里这五条路由全部 200 可查。
      # 抓取契约取证(不是猜的):dist/index.mjs 主 hono 应用注册了 `I.get('/metrics', …)` 路由,
      #   仅当配置 DEBUG_INFO=false 才摘除,而本安装的服务 env 块没有该项 ⇒ up 能真实代言存活。
      #   ⚠ 若日后有人给该服务设 DEBUG_INFO=false,本式会在服务正常时假 DOWN —— 届时的正确替换形态是
      #   `windows_service_state{name="IHUI-RSSHUB", state="running"} == 0`
      #   (该形态与 up 形态于 2026-09-27 都做过成对自证:该服务现值 0/命中,其余 10 个在跑 IHUI-* 服务全 1/不命中)。
      #   两形态的兜底边界如实登记:windows_exporter 死了则 service_state 序列消失、式子不评估(数据缺失≠0,
      #   不假响也不响),那一维由 monitoring-self-alerts 组的 WindowsExporterDown 兜,两道互补不互替。
      - alert: RsshubServiceDown
        expr: up{job="rsshub"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'RSSHub 服务未运行(AI World 国内媒体 RSS 的唯一可用抓取源)'
          description: 'RSSHub(127.0.0.1:12000)抓取失败持续 2 分钟以上。影响:ai-world-sync 五个国内资讯源经 rsshub.app 回落持续 403,静默失败两周+(结果只写库不喊人)。修复动作属机主裁决:① 把 nssm 的 Application 指回在位的 node.exe(`…\.workbuddy\binaries\node\versions\22.22.2-3\node.exe`)并启动服务;② 定夺 apps/api/.env 是否设 RSSHUB_URL=http://127.0.0.1:12000 —— 当前未设,服务起了也没有流量(该端点仅监听 127.0.0.1,LISTEN_INADDR_ANY=false)。核验:`sc query IHUI-RSSHUB`、`curl 127.0.0.1:12000/metrics` 出 Prometheus 文本、本告警转 resolved。'

  - name: monitoring-self-alerts
    # 监控链自保:确保"监控自身死亡"能被发现,而不是静默断链。
    # 说明:这些规则依赖 prometheus.yml 中对应的自监控 scrape job
    #   (alertmanager/alertbridge 两个 target 已在本仓 prometheus.yml 新增;
    #    部署副本 D:\DevEnv\monitor\prometheus\prometheus.yml 需同步),
    #   部署前先校验 alertmanager --version / promtool check rules。
    rules:
      # Prometheus 自身无指标(自监控 up==0 或进程死)→ 告警源头失效
      - alert: PrometheusDown
        expr: up{job="prometheus"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Prometheus 自身宕机'
          description: 'Prometheus self-scrape 无指标,监控数据失效,整条告警链源头断裂'
      # Alertmanager(原生 127.0.0.1:9093)掉线 → 通知链路(含运维邮件)失效
      - alert: AlertmanagerDown
        expr: up{job="alertmanager"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Alertmanager 不可用'
          description: 'Alertmanager 无指标,通知路由(经 bridge → 运维邮件)可能失效'
      # 告警中转 bridge(127.0.0.1:9096)掉线 → 运维邮件收不到
      - alert: AlertBridgeDown
        expr: up{job="alertbridge"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: '告警中转 bridge 不可用'
          description: 'alert-webhook-bridge 无指标,运维邮件告警链路断裂;检查 NSSM 服务状态'
      # windows_exporter(127.0.0.1:9182)掉线 → 磁盘/内存等主机告警全部消失
      - alert: WindowsExporterDown
        expr: up{job="windows"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 'Windows 主机指标采集器不可用'
          description: 'windows_exporter 无指标,WindowsDiskSpaceLow 等主机告警会静默失效;检查 windows_exporter 服务'
      # ── 日志/可视化栈自身(2026-09-27 缺口审计补,job 见 prometheus.yml 同名三条) ──
      # 告警链的"静默失效"反证:`AlertBridgeDown` 只答"桥进程活着",答不了"桥有没有把信寄出去"。
      # 实测过这一型:09-27 邮件键被整块清空后,deploy-loop 每轮打"两条通道均未送达",
      # 而那是**人翻日志**发现的 —— 桥在跑、up==1、没有任何规则会响。
      #
      # ⚠ 本条最初(同日 11:4x)写成 uptime>10 天 ∧ mail_last_success==0 ∧ webhooks_received>0,
      #   2026-09-27 下午实测**两条都永远不可能成立**,已整条换掉,留此记录免得有人把它改回去:
      #   ① 桥的重启把全部计数器/时间戳清回 0(状态文件里只有 `dedup` 一个键,余皆进程内存),
      #      而实测 21 天内**最长一次连续存活仅 8.63 天**(09-15→09-23)⇒ `uptime > 864000` 在这台机上从未成立;
      #   ② 与门要求 `mail_last_success == 0`,可只要历史上成功寄过一次它就非零且不会再归零(除非重启,
      #      而重启又撞上①)⇒ "曾经寄通过、现在坏了"这一最该喊的形态恰好被自己的条件排除;
      #   ③ 附带一处语义漏洞:`send_resolved: true` 且桥的 handleAlert 不按 status 过滤,
      #      所以 `webhooks_received > 0` 连"确实有过 firing 告警"都不能证明。
      #   ⇒ 一条要同时满足两个不可达条件的规则不是"保守",是"没有规则",却会在台账上读成"这一维已覆盖"。
      #
      # 现判据换成**落盘态**与 **AM 自己的计数器**,两者都对重启免疫:
      - alert: AlertBridgeMailUndelivered
        # 这条取的是桥写在磁盘上的 UNDELIVERED 标记(现读 0 = 无标记 = 健康)。
        # 它是"寄给人这件事最终失败"的**持久**留痕:进程重启不擦,下一次成功投递才清除 ——
        # 正是 §5e "失败必须响"要求的那个"响"。
        expr: ihui_alertbridge_mail_undelivered == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: '有告警一次都没寄到人(桥侧 UNDELIVERED 标记在盘上)'
          description: 'bridge 的邮件批次两腿都失败并已落 UNDELIVERED 标记 ⇒ 这段时间该到人的告警没到人。检查 apps/api/.env 的 ALERT_EMAIL_TO 与 SMTP/Resend 通道;标记被下一次成功投递自动清除'
      - alert: AlertmanagerDeliveryFailed
        # 这一条补的是上面那条**结构上碰不到**的那一维:"AM 有话要说,但桥根本没收到" ——
        # 那种情形桥不会写 UNDELIVERED(它压根没被叫醒),只有 AM 自己知道自己送失败了几次。
        # 用 increase() 而非绝对值:计数器归零是重启,而 increase 对归零免疫(本仓已多次踩过"拿绝对值判"的坑)。
        # 只取 integration="webhook":AM 侧还挂着 discord/email 等**没在用**的 receiver 标签,
        # 不加这个限定就会把"某个从未配置过的通道的零值序列"读成结论。
        expr: increase(alertmanager_notifications_failed_total{integration="webhook"}[30m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Alertmanager 到告警中转桥的投递在失败'
          description: '过去 30 分钟 AM 向 webhook receiver 投递失败 {{ $value | humanize }} 次 ⇒ 告警停在 AM 里没进桥。检查 bridge(127.0.0.1:9096)与 alertmanager.yml 的 receiver URL;这条与 AlertBridgeMailUndelivered 互补,后者只答"进了桥却没寄出去"'
      # 仍未闭环的一格(如实登记,不得读成"整条链已被看住"):**prometheus 自身死亡**时上面所有规则
      #   都没有评估者(PrometheusDown 由将死的进程评估,结构上自相矛盾)。这一维由**不依赖 prometheus
      #   的独立探活**兜:deploy/win/ihui-monitor.ps1 的端口清单(2026-09-27 起含 8815/9093/9096)。
      # 定级 warning 而非 critical:它们一挂,受影响的是"出事时翻不翻得到日志",不是线上功能。
      # 刻意不写"loki 停止收流"这类规则:接入前没取证过对应指标名,表达式恒不匹配的规则
      # 与没有规则等价,却会在台账上读成"这一维已覆盖"。要加先拿真实指标名再来一票。
      - alert: LokiDown
        expr: up{job="loki"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '日志存储 loki 不可用'
          description: 'loki(127.0.0.1:3100)无指标超过 5 分钟,历史日志查不到;检查 ihui-loki 服务'
      - alert: PromtailDown
        expr: up{job="promtail"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '日志采集器 promtail 不可用'
          description: 'promtail(127.0.0.1:9080)无指标超过 5 分钟 ⇒ 从这一刻起的新日志不再入库,而线上表现一切正常'
      - alert: GrafanaDown
        expr: up{job="grafana"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: '看板 grafana 不可用'
          description: 'grafana(127.0.0.1:8816)无指标超过 10 分钟;只影响人工查看,告警链不经它,故窗口放宽'
      # ── 分流机制自身的活性(G-472 告警侧的"判据失效必须响")─────────────────────────
      # 上面那行 LOG_SOURCE_ANCHOR 与 promtail 侧的同名标记一旦对不上(任一侧改名/摘线),
      # 桥就退回"全部照旧到人"—— 那是安全方向,但**分流失明本身必须被看见**,否则这条纪律
      # 会在某次改名后静默失效(本仓最高频的失效型是"判据瞎了而账面全绿")。
      # 表达式取的是桥真暴露的那个 gauge(见 monitoring/alertbridge/log-source-anchor.js 的
      # 消费点 alert-webhook-bridge.cjs),不是猜的指标名 —— 恒不匹配的表达式与没有规则等价,
      # 却会在台账上读成"这一维已覆盖"。
      - alert: LogSourceSplitBlind
        expr: ihui_alertbridge_log_anchor_ok == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: '日志来源分流失明(采集侧与规则侧的锚点对不上)'
          description: '桥读不到/对不上 LOG_SOURCE_ANCHOR ⇒ 采集器与监控自身造成的日志正在与真实业务错误同炸。桥已 fail-open(一条都没压),但必须把两侧的名字改回同值:见 alerts.yml 头部与 promtail 配置各自那一行'
