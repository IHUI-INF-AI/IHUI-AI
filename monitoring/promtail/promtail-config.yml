# Promtail 配置 — IHUI-AI 日志采集
# 采集方式:本机应用日志文件(static_configs 抓取 *.log) + 可选 Nginx 日志
# 线上生产为 Windows 原生部署(二进制在 D:\DevEnv\monitor),不采集 docker 容器日志、
# 不依赖 docker.sock、也没有 systemd journal。docker_sd_configs / journal job
# 仅作容器化/Linux 备选保留,原生部署下不生效。
# pipeline_stages 解析 JSON 日志,提取 level/timestamp/requestId 标签
# 注意:clients.url 必须指向 127.0.0.1:3100(原生部署),绝不能用 docker 服务名 loki,
# 否则 Loki 会一直空(详见 monitoring/README-logging.md "常见部署差异陷阱")。

server:
  http_listen_address: 127.0.0.1 # 收敛到本机,避免无鉴权暴露
  http_listen_port: 9080 # Promtail 自身 HTTP 端口(指标 + 健康检查)
  grpc_listen_port: 0 # 禁用 gRPC 监听(单机模式不需要)
  log_level: info

positions:
  filename: D:/DevEnv/monitor/promtail/positions.yaml # 记录每个日志文件已读取位置,重启后继续

clients:
  - url: http://localhost:3100/loki/api/v1/push
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10

scrape_configs:
  # === Windows 应用日志采集(NSSM 托管的 svc-<service>-nssm*.log) ===
  # 使用确定性 job 标签(job="api"/job="ai-service"),LogQL 直接按 job 过滤。
  - job_name: api
    static_configs:
      - targets: [localhost]
        labels:
          job: api
          __path__: 'D:/DevEnv/logs/svc-api-nssm*.log'
    pipeline_stages:
      # 解析 pino 应用日志,提取关键字段
      - json:
          expressions:
            level: level
            msg: msg
            requestId: requestId
            time: time
      - labels:
          level:
          requestId:
      - timestamp:
          source: time
          format: RFC3339Nano
          on_missing: skip

  - job_name: ai-service
    static_configs:
      - targets: [localhost]
        labels:
          job: ai-service
          __path__: 'D:/DevEnv/logs/svc-ai-nssm*.log'
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
            requestId: requestId
            time: time
      - labels:
          level:
          requestId:
      - timestamp:
          source: time
          format: RFC3339Nano
          on_missing: skip

  # === 其它 NSSM 服务日志(兜底采集,统一归入 job="applogs") ===
  # ⚠️ 两条兜底 glob 与上面的专用 job 同源同族(svc-api-*/svc-ai-* 同时命中两处),
  #    promtail 对"被多个 job 命中的文件"会**各收一遍**(2026-09-28 实测:svc-api-nssm.log
  #    同时以 job=api 与 job=applogs 两个流入库,同一天同一签名 156/164 条双份存储)。
  #    所以这里用 __path_exclude__ 把专用 job 与监控组件的面排除掉 —— 排除面必须与
  #    下面 monitorlogs 组的包含面同形,否则那批文件会整份从 Loki 里消失(比双份更糟)。
  - job_name: windows-app-stdout
    static_configs:
      - targets: [localhost]
        labels:
          job: applogs
          stream: stdout
          __path__: 'D:/DevEnv/logs/svc-*-nssm.log'
          __path_exclude__: 'D:/DevEnv/logs/svc-{api,ai,loki,promtail,prometheus,alertmanager,alert-bridge,pg-exporter,redis-exporter,windows-exporter}-nssm*.log'
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
            requestId: requestId
            time: time
      - labels:
          level:
          requestId:
      - timestamp:
          source: time
          format: RFC3339Nano
          on_missing: skip

  - job_name: windows-app-stderr
    static_configs:
      - targets: [localhost]
        labels:
          job: applogs
          stream: stderr
          __path__: 'D:/DevEnv/logs/svc-*-nssm-err.log'
          __path_exclude__: 'D:/DevEnv/logs/svc-{api,ai,loki,promtail,prometheus,alertmanager,alert-bridge,pg-exporter,redis-exporter,windows-exporter}-nssm*.log'

  # === 监控组件自身日志(单独立流,G-472 的根治半) ===
  # 为什么必须拆:Loki 会把收到的查询语句原样打进自己的 querier INFO 行,而这份 stderr
  # 过去经上面的兜底 glob 进了 job=applogs —— 任何"按关键字计数"的判据都会数到
  # "谁查过这个关键字"而不是"谁在报这个错"(同一条查询连发两次,计数就变大)。
  # 拆出 job=monitorlogs 后,应用侧判据恒 {job=~"api|ai-service|applogs"},
  # 监控自检判据走 {job="monitorlogs"};**不要**用"关掉 Loki 查询日志"来消噪(拿可审计性换账面)。
  #
  # LOG_SOURCE_ANCHOR: page={job=~"api|ai-service|applogs"} report-only={job="monitorlogs"}
  #   ↑ 这一行是**机器读的那一份**(告警侧 monitoring/alertbridge/log-source-anchor.js 与
  #   monitoring/prometheus/alerts.yml 各带一行同名标记,由同一个解析函数对账):
  #   page= 是"照旧炸到人"的分区,report-only= 是"只报不炸"的分区。改这里的名/值,规则侧
  #   不同值 ⇒ 桥 fail-open(一条都不压)并让 LogSourceSplitBlind 响,而不是静默分错。
  #   取值必须真是下面某个 static_configs.labels.job(判据会核),排除面同形性也一起核。
  - job_name: windows-monitor-logs
    static_configs:
      - targets: [localhost]
        labels:
          job: monitorlogs
          __path__: 'D:/DevEnv/logs/svc-{loki,promtail,prometheus,alertmanager,alert-bridge,pg-exporter,redis-exporter,windows-exporter}-nssm*.log'
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
            requestId: requestId
            time: time
      - labels:
          level:
          requestId:
      - timestamp:
          source: time
          format: RFC3339Nano
          on_missing: skip
# ⁠​‌​​‌​​‌‍‍​‌​​‌​​​‍‍​‌​‌​‌​‌‍‍​‌​​‌​​‌‍‍​​‌​‌‌​‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌​​‌‌‌‌​‌​‍‍‌‌​‌‌​​​‌​​​‌‌‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌‌​‌​​‌‌‌​‍‍‌‌​​‌‌​​​‌​​‌​‌‍‍‌​‌‌‌​‌‌‌​‌‌‌​‌‍‍‌​‌‌​‌‌‌‍‍​‌​​‌‌​​‍‍​‌​​​​‌‌‍‍‌​‌‌​‌‌‌‍‍​‌‌​​​​‌‍‍​‌‌​‌​​‌‍‍​‌‌‌‌​‌​‍‍​‌‌​‌​​​‍‍​‌‌‌​​‌‌‍‍​​‌​‌‌‌​‍‍​‌‌‌​‌​​‍‍​‌‌​‌‌‌‌‍‍​‌‌‌​​​​‍‍‌​‌‌​‌‌‌‍‍​‌​‌​​​​‍‍​‌​‌​​‌​‍‍​‌​​‌‌‌‌‍‍​‌​‌​‌‌​‍‍​‌​​​‌​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​‌‌‍‍​‌​​​‌​‌‍‍​​‌​‌‌​‌‍‍​​‌‌​​‌​‍‍​​‌‌​​​​‍‍​​‌‌​​‌​‍‍​​‌‌​‌‌​⁠
