# ⚠ 本文件已废弃 —— 它只是"渲染前的旧落点",不再被任何运行实例加载。
#
# 单一真相源: monitoring/alertmanager/alertmanager.yml.tmpl(带 ${VAR} 占位符的模板)
# 渲染命令:   node scripts/render-alertmanager-config.mjs
# 渲染产物:   monitoring/alertmanager/alertmanager.rendered.yml(含真实凭据,被 git 忽略)
#
# 为什么废弃:本文件过去把 smtp_smarthost / smtp_auth_password 写成
#   smtp.example.com:465 与 '<your-smtp-password>' 这类占位符,注释说"需通过环境变量注入",
#   但 Alertmanager 根本不展开 ${VAR}(本机 0.34.0 实测,取证见 .tmpl 头部),仓库里也
#   从来没有过任何注入机制 ⇒ 占位符永远原样发给中继,基础设施告警的邮件通道从未送达过。
#   留着这份"看着像配置"的文件,就是留着同一个坑让人再踩一次。
#
# 故意不写成一份可用配置:若有人误把本文件挂给 Alertmanager,它会因为下面没有 route/receivers
# 而**立刻报错退出**,而不是悄悄加载一份发不出信的假配置 —— 宁可响,不要静默。
#
# 收尾动作(与新增 .tmpl 同一次提交):git rm monitoring/alertmanager/alertmanager.yml
#   注意:只在工作区 rm 会被 scripts/heal-worktree-tracked.mjs(§5b 工作区存续自愈)按
#   "索引==HEAD"的判据自动找回;必须 git rm 让索引与 HEAD 不一致,删除才生效。
