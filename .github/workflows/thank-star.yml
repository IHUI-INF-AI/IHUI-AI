name: Thank New Stargazers

on:
  watch:
    types: [started]
  # 2026-09-28 新增:定时清理过期感谢帖(每 6 小时;判据见 auto-close-stale)。
  # 立因:开放 issue 中感谢帖+机器人帖占比 72%,真实反馈被列表淹没。
  # 感谢保留(互动不砍),但 48 小时无人回复自动关闭,有人回复则长期保留。
  schedule:
    - cron: '17 */6 * * *'

jobs:
  thank:
    if: github.event_name == 'watch'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create thank you issue
        uses: actions/github-script@v7
        with:
          script: |
            const stargazer = context.actor;
            const repo = context.repo.repo;
            const owner = context.repo.owner;

            // 检查是否已经感谢过这个用户
            const issues = await github.rest.issues.listForRepo({
              owner,
              repo,
              labels: ['thank-you', `star-${stargazer}`],
              state: 'all'
            });

            if (issues.data.length > 0) {
              console.log(`Already thanked ${stargazer}, skipping.`);
              return;
            }

            // 创建感谢 Issue
            await github.rest.issues.create({
              owner,
              repo,
              title: `⭐ 感谢 @${stargazer} 的 Star!`,
              body: `## 谢谢你的 Star ⭐
              
              @${stargazer},感谢你 Star 了 IHUI-AI!
              
              你的支持是我们持续迭代的动力。
              
              ### 接下来你可以
              
              - 📖 阅读 [README](https://github.com/${owner}/${repo}#readme) 了解项目全貌
              - 🚀 按 [快速开始](https://github.com/${owner}/${repo}#快速开始) 本地启动
              - 💬 在 [Discussions](https://github.com/${owner}/${repo}/discussions) 参与讨论
              - 🐛 在 [Issues](https://github.com/${owner}/${repo}/issues) 反馈建议
              - 🌐 访问 [官网](https://aizhs.top) 体验在线版
              - 💰 查看 [定价方案](https://aizhs.top/pricing) 升级 Pro
              
              ### 社区
              
              - 邮箱:[REDACTED-EMAIL]
              - 微信:ok502319984
              
              ---
              
              *这是自动生成的感谢消息。如果你不想收到这类通知,可以 unsubscribe 这个 Issue。*
              `,
              labels: ['thank-you', `star-${stargazer}`]
            });

            console.log(`Created thank you issue for ${stargazer}`);
      - name: Create label if not exists
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'thank-you'
              });
            } catch (e) {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'thank-you',
                color: 'ffeb3b',
                description: '自动感谢 Star 用户'
              });
            }

  auto-close-stale:
    # 感谢帖自动归档:创建满 48 小时且无真人回复 ⇒ 留言后关闭;有真人回复 ⇒ 保留(真实互动)。
    # 判据只认非 Bot 评论(github-actions 自己的关闭留言 type==='Bot',不会阻止后续轮次)。
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close stale thank-you issues
        uses: actions/github-script@v7
        env:
          STALE_HOURS: '48'
        with:
          script: |
            const staleMs = Number(process.env.STALE_HOURS || '48') * 3600 * 1000;
            const { owner, repo } = context.repo;
            const now = Date.now();
            let closed = 0;
            let kept = 0;
            for (let page = 1; page <= 10; page++) {
              const { data: issues } = await github.rest.issues.listForRepo({
                owner,
                repo,
                labels: ['thank-you'],
                state: 'open',
                per_page: 100,
                page,
              });
              if (issues.length === 0) break;
              for (const issue of issues) {
                if (issue.pull_request) continue;
                if (now - new Date(issue.created_at).getTime() < staleMs) {
                  kept++;
                  continue;
                }
                const { data: comments } = await github.rest.issues.listComments({
                  owner,
                  repo,
                  issue_number: issue.number,
                  per_page: 100,
                });
                const human = comments.filter((c) => c.user && c.user.type !== 'Bot');
                if (human.length > 0) {
                  kept++;
                  console.log(`#${issue.number} 有真人回复,保留不关`);
                  continue;
                }
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body:
                    '本感谢帖已按自动归档策略关闭(创建满 48 小时且无人回复)。\n\n' +
                    '感谢你的 Star ⭐ 有任何问题或建议,欢迎随时开新 issue,或到 [Discussions](https://github.com/' +
                    owner +
                    '/' +
                    repo +
                    '/discussions) 交流。',
                });
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'completed',
                });
                closed++;
              }
            }
            console.log(`auto-close-stale: closed=${closed} kept=${kept}`);

# ⁠​‌​​‌​​‌‍‍​‌​​‌​​​‍‍​‌​‌​‌​‌‍‍​‌​​‌​​‌‍‍​​‌​‌‌​‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌​​‌‌‌‌​‌​‍‍‌‌​‌‌​​​‌​​​‌‌‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌‌​‌​​‌‌‌​‍‍‌‌​​‌‌​​​‌​​‌​‌‍‍‌​‌‌‌​‌‌‌​‌‌‌​‌‍‍‌​‌‌​‌‌‌‍‍​‌​​‌‌​​‍‍​‌​​​​‌‌‍‍‌​‌‌​‌‌‌‍‍​‌‌​​​​‌‍‍​‌‌​‌​​‌‍‍​‌‌‌‌​‌​‍‍​‌‌​‌​​​‍‍​‌‌‌​​‌‌‍‍​​‌​‌‌‌​‍‍​‌‌‌​‌​​‍‍​‌‌​‌‌‌‌‍‍​‌‌‌​​​​‍‍‌​‌‌​‌‌‌‍‍​‌​‌​​​​‍‍​‌​‌​​‌​‍‍​‌​​‌‌‌‌‍‍​‌​‌​‌‌​‍‍​‌​​​‌​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​‌‌‍‍​‌​​​‌​‌‍‍​​‌​‌‌​‌‍‍​​‌‌​​‌​‍‍​​‌‌​​​​‍‍​​‌‌​​‌​‍‍​​‌‌​‌‌​⁠
