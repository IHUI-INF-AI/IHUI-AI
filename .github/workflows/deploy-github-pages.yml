name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/i18n/**'
      - 'packages/ui/**'
      - 'packages/ui-react/**'
      - 'packages/types/**'
      - 'packages/config/**'
      - 'packages/eslint-config/**'
      - 'packages/tsconfig/**'
      - 'public/**'
      - '.github/workflows/deploy-github-pages.yml'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'turbo.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build workspace deps (topological closure)
        # @ihui/api-client 的 exports 全部映射到 ./dist/*，而 dist/ 不入库(.gitignore:67)。
        # pnpm --filter @ihui/web 不做 workspace 依赖的拓扑构建 ⇒ 缺本步则 webpack 打包期
        # 直接 Module not found: '@ihui/api-client'(2026-09-24 Pages 连红三次的根因;
        # 尾缀 `...` 连同上游依赖拓扑构建，与 ci.yml:70/94/222 既有正解同口径)。
        # 2026-09-26 起改用拓扑选择器 `^...`(= 该包的**全部 workspace 依赖**,不含本包):
        # 本仓已有 7 个包 exports 指 dist(cli/i18n/design-tokens/types/dom-actions/api-client/
        # context-compaction),**手工点名"要先建哪几个包"必然落后于新增** —— 落后一次的形态是
        # "CI 恒红而本地全绿"(守门 72/78 同族)。选择器由 pnpm 从包图算,加包不再需要改本文件。
        run: pnpm --filter "@ihui/web^..." run build

      - name: Build web
        # 2026-08-28:改走 build-static(与 Tauri 同一静态导出入口)。
        # 该入口会临时移出 app/cdn|uploads 等 force-dynamic 运行时路由
        # (output:'export' 与之不兼容,且静态站点无 Node 磁盘运行时),
        # 直接 next build + GITHUB_PAGES=true 会在 Collecting page data 崩溃。
        run: pnpm --filter @ihui/web build:static
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_APP_NAME: IHUI AI
          NEXT_PUBLIC_API_URL: https://ihui-api.railway.app
          NEXT_TELEMETRY_DISABLED: 1

      - name: Add .nojekyll
        run: touch apps/web/out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
# ⁠​‌​​‌​​‌‍‍​‌​​‌​​​‍‍​‌​‌​‌​‌‍‍​‌​​‌​​‌‍‍​​‌​‌‌​‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌​​‌‌‌‌​‌​‍‍‌‌​‌‌​​​‌​​​‌‌‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌‌​‌​​‌‌‌​‍‍‌‌​​‌‌​​​‌​​‌​‌‍‍‌​‌‌‌​‌‌‌​‌‌‌​‌‍‍‌​‌‌​‌‌‌‍‍​‌​​‌‌​​‍‍​‌​​​​‌‌‍‍‌​‌‌​‌‌‌‍‍​‌‌​​​​‌‍‍​‌‌​‌​​‌‍‍​‌‌‌‌​‌​‍‍​‌‌​‌​​​‍‍​‌‌‌​​‌‌‍‍​​‌​‌‌‌​‍‍​‌‌‌​‌​​‍‍​‌‌​‌‌‌‌‍‍​‌‌‌​​​​‍‍‌​‌‌​‌‌‌‍‍​‌​‌​​​​‍‍​‌​‌​​‌​‍‍​‌​​‌‌‌‌‍‍​‌​‌​‌‌​‍‍​‌​​​‌​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​‌‌‍‍​‌​​​‌​‌‍‍​​‌​‌‌​‌‍‍​​‌‌​​‌​‍‍​​‌‌​​​​‍‍​​‌‌​​‌​‍‍​​‌‌​‌‌​⁠
