name: Snapshot source to Gitee (国内只读快照)

# 用途(方案 c,2026-11-04 立):
#   Gitee 仓只保留「当前 origin/main 的一棵树 + 一个无父提交」的只读源码快照。
#   · 按周刷新(本 workflow 的 schedule)+ 每次 desktop-v* 发版后在 release-desktop.yml
#     末端 `snapshot-gitee` job 再刷新一次 ⇒ 落后窗口 ≤ 7 天;
#   · 不镜像历史/父提交/LFS(2026-10-23 历史镜像因 Gitee 1024MB 配额已整体下线,
#     守卫 scripts/check-mirror-purge-intact.mjs 禁止恢复旧 mirror-to-cn.yml);
#   · force 推送只作用于 Gitee 的 refs/heads/main,不碰 GitHub、不碰任何 tag;
#   · 最新代码仍以 GitHub main 为准,Gitee 仅供国内可访问 + 发布包下载。
# 实现:.github/scripts/gitee-snapshot.py(生成无父提交 → force push → ls-remote 复核)。

on:
  schedule:
    # 每周一 03:17 UTC(11:17 +08);错开整点避免与 release 链撞车
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshot-to-cn
  # 快照是幂等的「收敛到当前 main」;不允许后一次运行取消前一次,避免半推送状态
  cancel-in-progress: false

jobs:
  snapshot:
    name: Snapshot origin/main to Gitee main
    # 默认开启;显式关闭:仓库 Settings → Variables → GITEE_SYNC_ENABLED=false
    if: ${{ vars.GITEE_SYNC_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Snapshot + verify
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO: IHUI-AI
        run: python3 .github/scripts/gitee-snapshot.py
# ⁠​‌​​‌​​‌‍‍​‌​​‌​​​‍‍​‌​‌​‌​‌‍‍​‌​​‌​​‌‍‍​​‌​‌‌​‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌​​‌‌‌‌​‌​‍‍‌‌​‌‌​​​‌​​​‌‌‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌‌​‌​​‌‌‌​‍‍‌‌​​‌‌​​​‌​​‌​‌‍‍‌​‌‌‌​‌‌‌​‌‌‌​‌‍‍‌​‌‌​‌‌‌‍‍​‌​​‌‌​​‍‍​‌​​​​‌‌‍‍‌​‌‌​‌‌‌‍‍​‌‌​​​​‌‍‍​‌‌​‌​​‌‍‍​‌‌‌‌​‌​‍‍​‌‌​‌​​​‍‍​‌‌‌​​‌‌‍‍​​‌​‌‌‌​‍‍​‌‌‌​‌​​‍‍​‌‌​‌‌‌‌‍‍​‌‌‌​​​​‍‍‌​‌‌​‌‌‌‍‍​‌​‌​​​​‍‍​‌​‌​​‌​‍‍​‌​​‌‌‌‌‍‍​‌​‌​‌‌​‍‍​‌​​​‌​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​‌‌‍‍​‌​​​‌​‌‍‍​​‌​‌‌​‌‍‍​​‌‌​​‌​‍‍​​‌‌​​​​‍‍​​‌‌​​‌​‍‍​​‌‌​‌‌​⁠
