name: Smoke New Modules

# 新模块冒烟测试工作流 — 新增模块快速验证
# 当 apps/api/src/routes/ 或 apps/web/src/ 下出现新文件时触发，对核心端点做冒烟检查
on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/api/src/routes/**'
      - 'apps/web/src/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/api/src/routes/**'
      - 'apps/web/src/**'

# Security: least-privilege GITHUB_TOKEN (CWE-250). Third-party actions use @v tags — pin to commit SHA for stricter supply-chain security.
permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect new modules
        id: detect
        run: |
          # 比对当前与上游分支差异，识别新增路由/前端模块文件
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          git diff --name-status --diff-filter=A "$BASE" HEAD -- \
            'apps/api/src/routes/*.ts' 'apps/web/src/**' > /tmp/added.txt || true
          COUNT=$(wc -l < /tmp/added.txt)
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          if [ "$COUNT" -gt 0 ]; then
            echo "::notice::检测到 $COUNT 个新增模块文件"
            cat /tmp/added.txt
          fi

      - name: Typecheck
        if: steps.detect.outputs.count != '0'
        run: pnpm turbo run typecheck

      - name: Lint new modules
        if: steps.detect.outputs.count != '0'
        run: pnpm turbo run lint

      - name: Smoke test
        if: steps.detect.outputs.count != '0'
        # 不要在此追加 `-- --passWithNoTests`:turbo 会把尾参数原样拼到每个包的
        # `test` 脚本后面,而需要「空测试集也放行」的包(web/extension/miniapp-taro/
        # mobile-rn/ui-react/context-compaction)已在各自 package.json 的 test 脚本里
        # 声明过该 flag ⇒ vitest 收到两个同名选项,直接
        # `Expected a single value for option "--passWithNoTests", received [true, true]`
        # 并 rc=1(smoke job 恒红)。按「一处声明」原则,tolerance 归包脚本,CI 只跑 turbo。
        run: pnpm turbo run test
# ⁠​‌​​‌​​‌‍‍​‌​​‌​​​‍‍​‌​‌​‌​‌‍‍​‌​​‌​​‌‍‍​​‌​‌‌​‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌​​‌‌‌‌​‌​‍‍‌‌​‌‌​​​‌​​​‌‌‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌‌​‌​​‌‌‌​‍‍‌‌​​‌‌​​​‌​​‌​‌‍‍‌​‌‌‌​‌‌‌​‌‌‌​‌‍‍‌​‌‌​‌‌‌‍‍​‌​​‌‌​​‍‍​‌​​​​‌‌‍‍‌​‌‌​‌‌‌‍‍​‌‌​​​​‌‍‍​‌‌​‌​​‌‍‍​‌‌‌‌​‌​‍‍​‌‌​‌​​​‍‍​‌‌‌​​‌‌‍‍​​‌​‌‌‌​‍‍​‌‌‌​‌​​‍‍​‌‌​‌‌‌‌‍‍​‌‌‌​​​​‍‍‌​‌‌​‌‌‌‍‍​‌​‌​​​​‍‍​‌​‌​​‌​‍‍​‌​​‌‌‌‌‍‍​‌​‌​‌‌​‍‍​‌​​​‌​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​‌‌‍‍​‌​​​‌​‌‍‍​​‌​‌‌​‌‍‍​​‌‌​​‌​‍‍​​‌‌​​​​‍‍​​‌‌​​‌​‍‍​​‌‌​‌‌​⁠
