name: DB Owner RLS (O13)

# O13 补齐⑤(2026-09-21):迁移 20260921160000_scoped_app_role_owner_rls.sql 的角色权限
# 此前只有"读 SQL 文本"的断言(packages/database/tests/app-role-privileges.test.ts),
# 没有任何自动化证明"迁移真跑一遍后角色权限如预期"。本 job 在 GitHub 托管 runner 上
# 起一个**一次性** Postgres service container(与 test-real-db.yml 同款镜像与口径,
# 绝不连任何长期库),跑真实迁移后用 pg_roles / 真实负向查询做机械断言:
#   1) ihui_app rolsuper=false 且 rolbypassrls=false
#   2) 对未授权业务表(public.users,不在迁移 4 表白名单里)SELECT 必须 permission denied
#   3) 反向 sanity:白名单表(webhook_subscriptions)必须可 SELECT(GRANT 真实生效)
# 另跑 `owner-rls.mjs status`(全程只读)确认策略/GRANT 与清单零漂移。

on:
  push:
    branches: [main]
    paths:
      - 'packages/database/drizzle/**'
      - 'packages/database/scripts/owner-rls.mjs'
      - '.github/workflows/db-owner-rls.yml'
  pull_request:
    paths:
      - 'packages/database/drizzle/**'
      - 'packages/database/scripts/owner-rls.mjs'
      - '.github/workflows/db-owner-rls.yml'
  workflow_dispatch:

# Security: least-privilege GITHUB_TOKEN (CWE-250).
permissions:
  contents: read

jobs:
  owner-rls-verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        # 与 test-real-db.yml 同款:pgvector 镜像(drizzle-kit migrate 全量迁移含 vector 列)
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ihui_rls_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ihui_rls_test
      # 密码仅存在于本 job 的一次性容器里(CI ephemeral,与 postgres/postgres 同级),绝不复用生产口令
      DATABASE_APP_URL: postgresql://ihui_app:ci-only-ephemeral-pw@localhost:5432/ihui_rls_test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build database package
        run: pnpm --filter @ihui/database build

      # 同 test-real-db.yml:pgvector 镜像每个 database 仍需显式 CREATE EXTENSION
      - name: Enable pgvector extension
        working-directory: packages/database
        run: |
          node --input-type=module -e "
            import postgres from 'postgres';
            const sql = postgres(process.env.DATABASE_URL);
            await sql.unsafe('CREATE EXTENSION IF NOT EXISTS vector');
            await sql.end();
            console.log('pgvector extension enabled');
          "

      - name: Apply migrations to ephemeral DB (creates ihui_app + GRANT + policies)
        working-directory: packages/database
        run: npx drizzle-kit migrate

      # 迁移刻意不写密码(密码不落仓,见 docs/developer/data-classes.md §3.1 上线顺序 ②);
      # CI 用一次性容器密码补上,等价于运维在库上执行的 ALTER ROLE ihui_app PASSWORD ...
      - name: Set ephemeral password for ihui_app (CI stand-in for ops step)
        run: psql "$DATABASE_URL" -c "ALTER ROLE ihui_app PASSWORD 'ci-only-ephemeral-pw'"

      - name: 'owner-rls status (read-only drift check)'
        run: node packages/database/scripts/owner-rls.mjs status

      - name: 'Assert ihui_app is NOSUPERUSER + NOBYPASSRLS'
        run: |
          row=$(psql "$DATABASE_URL" -Atc "SELECT rolsuper, rolbypassrls FROM pg_roles WHERE rolname='ihui_app'")
          echo "pg_roles rolsuper|rolbypassrls = [$row]"
          if [ "$row" != "f|f" ]; then
            echo "::error::ihui_app 必须是 NOSUPERUSER NOBYPASSRLS,实际 [$row]"
            exit 1
          fi

      - name: 'Assert unauthorized table denied / whitelisted table granted for ihui_app'
        run: |
          # 负向:public.users 不在迁移 4 表白名单,表级 ACL 必须直接 permission denied
          out=$(psql "$DATABASE_APP_URL" -c "SELECT 1 FROM users LIMIT 1" 2>&1 || true)
          echo "$out"
          if ! echo "$out" | grep -q 'permission denied'; then
            echo "::error::预期 ihui_app 查询 public.users 被 permission denied,实际却放行 —— GRANT 面漂移"
            exit 1
          fi
          # 反向 sanity:白名单表必须读得动(否则上面的 denied 只是整体配置错的假阳性)
          psql "$DATABASE_APP_URL" -Atc "SELECT count(*) FROM webhook_subscriptions" > /dev/null
          echo 'whitelisted table webhook_subscriptions readable by ihui_app'

# ⁠​‌​​‌​​‌‍‍​‌​​‌​​​‍‍​‌​‌​‌​‌‍‍​‌​​‌​​‌‍‍​​‌​‌‌​‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌​​‌‌‌‌​‌​‍‍‌‌​‌‌​​​‌​​​‌‌‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌‌​‌​​‌‌‌​‍‍‌‌​​‌‌​​​‌​​‌​‌‍‍‌​‌‌‌​‌‌‌​‌‌‌​‌‍‍‌​‌‌​‌‌‌‍‍​‌​​‌‌​​‍‍​‌​​​​‌‌‍‍‌​‌‌​‌‌‌‍‍​‌‌​​​​‌‍‍​‌‌​‌​​‌‍‍​‌‌‌‌​‌​‍‍​‌‌​‌​​​‍‍​‌‌‌​​‌‌‍‍​​‌​‌‌‌​‍‍​‌‌‌​‌​​‍‍​‌‌​‌‌‌‌‍‍​‌‌‌​​​​‍‍‌​‌‌​‌‌‌‍‍​‌​‌​​​​‍‍​‌​‌​​‌​‍‍​‌​​‌‌‌‌‍‍​‌​‌​‌‌​‍‍​‌​​​‌​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​‌‌‍‍​‌​​​‌​‌‍‍​​‌​‌‌​‌‍‍​​‌‌​​‌​‍‍​​‌‌​​​​‍‍​​‌‌​​‌​‍‍​​‌‌​‌‌​⁠
