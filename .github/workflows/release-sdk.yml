name: Release SDK

# 4 语言 SDK 统一发布 CI(参考 release-cli.yml 模式)
# 触发:push tag sdk-v* 或 workflow_dispatch 手动触发(含 dry-run 选项)
#   标签前缀与 cli-v* / desktop-v* 对齐;裸 v* 会与仓库其他发版标签互相误触发,故不用。
# 发布:npm(@ihui/sdk)+ PyPI(ihui-ai)+ Maven Central(com.ihui:ihui-ai-java)+ Go module(github.com/.../sdk/go)
# 鉴权:优先 OIDC trusted publishing(npm/PyPI/Maven),无 OIDC 时回退 NPM_TOKEN/PYPI_TOKEN/MAVEN_TOKEN

on:
  push:
    tags:
      - 'sdk-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0);留空则使用当前 HEAD 的最近 v* tag'
        required: false
        default: ''
      dry_run:
        description: 'Dry-run(只构建不发布,验证配置正确)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      language:
        description: '选择要发布的语言(all = 全部)'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'npm'
          - 'pypi'
          - 'maven'
          - 'go'

permissions:
  contents: write
  packages: write
  id-token: write # OIDC trusted publishing 必需

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9'
  PYTHON_VERSION: '3.11'
  JAVA_VERSION: '17'
  GO_VERSION: '1.21'

# 防止重复发布:同一 tag 已有 release 制品则跳过
concurrency:
  group: release-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------- Job 0: 解析 tag + 版本号 + dry-run 标志 ----------
  extract:
    name: Extract version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      dry_run: ${{ steps.parse.outputs.dry_run }}
      is_tag: ${{ steps.parse.outputs.is_tag }}
    steps:
      - name: Parse tag and version
        id: parse
        shell: bash
        run: |
          # 优先使用 workflow_dispatch 输入的 tag,否则使用 GITHUB_REF
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          if [ -z "$TAG" ] || [ "$TAG" = "$GITHUB_REF" ]; then
            echo "❌ No tag detected (ref=$GITHUB_REF, input=${{ github.event.inputs.tag }})"
            exit 1
          fi

          # 去前缀 sdk-v / v → 版本号(tag 触发与 dispatch 触发都兼容)
          VERSION="$(printf '%s' "$TAG" | sed -E 's/^sdk-v//; s/^v//')"
          # 版本号必须是 semver,否则后续 npm/pypi/maven 会拿到垃圾版本污染注册表
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$'; then
            echo "❌ tag $TAG 解析出的版本号 '$VERSION' 不是合法 semver(期望 sdk-v1.2.3)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_tag=true" >> "$GITHUB_OUTPUT"
          echo "✅ Detected tag: $TAG → version: $VERSION"

      - name: Resolve dry-run mode
        id: dry
        shell: bash
        run: |
          DRY="${{ github.event.inputs.dry_run || 'true' }}"
          # tag 触发默认非 dry-run(真实发布),workflow_dispatch 默认 dry-run(防误发布)
          if [ "${{ github.event_name }}" = "push" ]; then
            DRY="false"
          fi
          echo "dry_run=$DRY" >> "$GITHUB_OUTPUT"
          echo "✅ Dry-run mode: $DRY (event: ${{ github.event_name }})"

  # ---------- Job 1: npm @ihui/sdk 发布 ----------
  npm-publish:
    name: Publish to npm
    needs: extract
    # 门控:tag 触发(push sdk-v*)必跑;workflow_dispatch 按 language 选择。
    # 旧写法 `dry_run == 'true' || language == 'all' || ...` 在 push 事件下三个条件
    # 全为 false(language 是 dispatch 专属入参)→ 真发布永远被跳过,只 green 不发布。
    if: >-
      (startsWith(github.ref, 'refs/tags/sdk-v') || github.event_name == 'workflow_dispatch') &&
      (github.event_name == 'push' || github.event.inputs.language == 'all' || github.event.inputs.language == 'npm')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @ihui/sdk typecheck

      - name: Build SDK (tsc → dist/)
        run: pnpm --filter @ihui/sdk build

      - name: Set publish version
        working-directory: packages/sdk
        shell: bash
        run: |
          VERSION="${{ needs.extract.outputs.version }}"
          # package.json 本身已是"可发布形态"(入口指 dist / files 白名单 / 无 workspace 依赖 /
          # publishConfig.registry 锁定 npmjs.org),CI 只需对齐 tag 里的版本号。
          # 过去在这里顺手重写 main/types/exports 并剥 @ihui/* 依赖,是因为仓库里那份不可安装;
          # 现在把修复前移到仓库,本地 `npm pack` 与 CI 产物就完全一致了。
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          node -e "
            const p = require('./package.json');
            const errs = [];
            if (p.private) errs.push('private=true 会直接拒绝发布');
            if (!p.license) errs.push('缺少 license(Apache-2.0 发行必须声明)');
            if (!p.publishConfig?.registry?.includes('registry.npmjs.org'))
              errs.push('publishConfig.registry 未锁定 npmjs.org —— 仓库根 .npmrc 指向 npmmirror,项目级配置优先级更高,漏了这一条会把包推给第三方镜像');
            for (const [f, v] of Object.entries({ main: p.main, types: p.types }))
              if (String(v).includes('/src/')) errs.push(\`\${f}=\${v} 指向 src,外部装了用不了\`);
            for (const [d, s] of Object.entries(p.dependencies || {}))
              if (d.startsWith('@ihui/') || String(s).startsWith('workspace:'))
                errs.push(\`dependencies 含未发布内部包 \${d}@\${s},消费者 npm i 必 404\`);
            if (!Array.isArray(p.files) || !p.files.includes('dist'))
              errs.push('files 白名单缺失/不含 dist,会打进 src/其他语言 SDK/.turbo 日志等噪音');
            if (errs.length) { console.error('❌ 发布前置校验失败:\n  - ' + errs.join('\n  - ')); process.exit(1); }
            console.log(\`✅ \${p.name}@\${p.version} 发布前置校验通过\`);
          "

      - name: Inspect tarball (fail on junk / missing license)
        working-directory: packages/sdk
        shell: bash
        run: |
          # 真发布前把 tarball 清单摊开:杜绝源码 / 其他语言 SDK / 构建产物噪音与任何密钥外流
          npm pack --dry-run --json > /tmp/sdk-pack.json 2>/tmp/sdk-pack.err || { cat /tmp/sdk-pack.err; exit 1; }
          node -e "
            const e = JSON.parse(require('fs').readFileSync('/tmp/sdk-pack.json','utf8'))[0];
            const paths = e.files.map((f) => f.path);
            const junk = paths.filter((p) => /^(src|java|go|dotnet|python|tests|\.turbo)\//.test(p) || /tsbuildinfo|(^|\/)\.env|node_modules/.test(p));
            console.log(\`  files=\${paths.length} tarball=\${(e.size/1024).toFixed(1)}KB unpacked=\${(e.unpackedSize/1024/1024).toFixed(2)}MB\`);
            if (junk.length) { console.error('❌ tarball 混入不该有的条目:', junk.slice(0, 10)); process.exit(1); }
            for (const need of ['LICENSE', 'NOTICE', 'dist/index.js', 'dist/index.d.ts'])
              if (!paths.includes(need)) { console.error('❌ tarball 缺少', need); process.exit(1); }
            console.log('✅ tarball 干净且自包含(dist + LICENSE + NOTICE)');
          "

      - name: Publish to npm (OIDC trusted publishing)
        if: needs.extract.outputs.dry_run == 'false'
        working-directory: packages/sdk
        run: |
          VERSION="${{ needs.extract.outputs.version }}"
          echo "📦 Publishing @ihui/sdk@$VERSION to npm (OIDC)..."
          npm publish --access public --provenance
          # 回读验证:registry 拿不到就等于没发布,绝不用"命令没报错"当结论
          sleep 5
          PUBLISHED="$(npm view @ihui/sdk version --registry=https://registry.npmjs.org/ 2>/dev/null || echo '')"
          echo "registry 回读 version=$PUBLISHED (期望 $VERSION)"
          [ "$PUBLISHED" = "$VERSION" ] || { echo "❌ 发布后回读失败"; exit 1; }
          echo "✅ @ihui/sdk@$VERSION 已在 npm registry 可见"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # OIDC 失败时回退

      - name: Dry-run verification
        if: needs.extract.outputs.dry_run == 'true'
        working-directory: packages/sdk
        run: |
          VERSION="${{ needs.extract.outputs.version }}"
          echo "🔍 Dry-run: validate @ihui/sdk@$VERSION publish config..."
          npm publish --dry-run --access public
          echo "✅ Dry-run passed — package would publish to npm registry"

      - name: Summary
        run: |
          VERSION="${{ needs.extract.outputs.version }}"
          echo "### npm SDK 发布" >> $GITHUB_STEP_SUMMARY
          echo "- 包名: \`@ihui/sdk@$VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "- 安装: \`npm install @ihui/sdk\`" >> $GITHUB_STEP_SUMMARY

  # ---------- Job 2: PyPI ihui-ai 发布 ----------
  pypi-publish:
    name: Publish to PyPI
    needs: extract
    if: >-
      (startsWith(github.ref, 'refs/tags/sdk-v') || github.event_name == 'workflow_dispatch') &&
      (github.event_name == 'push' || github.event.inputs.language == 'all' || github.event.inputs.language == 'pypi')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set version in pyproject.toml
        working-directory: packages/sdk/python
        shell: bash
        run: |
          VERSION="${{ needs.extract.outputs.version }}"
          # 用 sed 替换 version 行
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          echo "✅ Set version to $VERSION"
          grep '^version' pyproject.toml

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build wheel + sdist
        working-directory: packages/sdk/python
        run: |
          # Apache-2.0 第 4 条要求分发副本附带许可证与 NOTICE 全文;
          # pyproject 的 license-files = ["LICENSE","NOTICE"] 按 glob 取包内文件,
          # 故构建前从仓库根复制(不提交副本,避免法律文本漂移)。缺文件只 warn 不 fail,
          # 真发布必须带,所以这里显式校验存在性。
          cp ../../LICENSE ../../NOTICE .
          test -s LICENSE && test -s NOTICE || { echo "❌ 未取到 LICENSE / NOTICE"; exit 1; }
          python -m build
          echo "📦 Build artifacts:"
          ls -lh dist/
          python - <<'PY'
          import glob, zipfile, sys
          whl = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(whl).namelist()
          have = [n for n in names if 'licenses/' in n]
          print('  packaged license files:', have)
          if not any('LICENSE' in n.upper() for n in have) or not any('NOTICE' in n.upper() for n in have):
              sys.exit('❌ wheel 未附带 LICENSE / NOTICE')
          PY

      - name: Publish to PyPI (OIDC trusted publishing)
        if: needs.extract.outputs.dry_run == 'false'
        working-directory: packages/sdk/python
        run: |
          VERSION="${{ needs.extract.outputs.version }}"
          # 上传前先 twine check:元数据/长描述不合法就不该去打 PyPI 的不可撤销动作
          python -m twine check dist/*
          echo "📦 Publishing ihui-ai to PyPI (OIDC)..."
          python -m twine upload --non-interactive dist/*
          # 回读验证:PyPI JSON API 为准(与"命令没报错"无关)
          sleep 10
          curl -fsS "https://pypi.org/pypi/ihui-ai/$VERSION/json" -o /tmp/ihui-pypi.json \
            && node -e "
                 const j=require('/tmp/ihui-pypi.json');
                 console.log('✅ PyPI 回读成功:', j.info.name, j.info.version, '| license:', j.info.license_expression || j.info.license);
               " \
            || { echo "❌ PyPI 回读失败:ihui-ai@$VERSION 查不到"; exit 1; }
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }} # OIDC 失败时回退

      - name: Dry-run verification
        if: needs.extract.outputs.dry_run == 'true'
        working-directory: packages/sdk/python
        run: |
          echo "🔍 Dry-run: validate PyPI publish config..."
          python -m twine check dist/*
          echo "✅ Dry-run passed — wheel/sdist would publish to PyPI"

      - name: Summary
        run: |
          VERSION="${{ needs.extract.outputs.version }}"
          echo "### PyPI SDK 发布" >> $GITHUB_STEP_SUMMARY
          echo "- 包名: \`ihui-ai==$VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "- 安装: \`pip install ihui-ai\`" >> $GITHUB_STEP_SUMMARY

  # ---------- Job 3: Maven Central com.ihui:ihui-ai-java 发布 ----------
  maven-publish:
    name: Publish to Maven Central
    needs: extract
    if: >-
      (startsWith(github.ref, 'refs/tags/sdk-v') || github.event_name == 'workflow_dispatch') &&
      (github.event_name == 'push' || github.event.inputs.language == 'all' || github.event.inputs.language == 'maven')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Set version in pom.xml
        working-directory: packages/sdk/java
        shell: bash
        run: |
          VERSION="${{ needs.extract.outputs.version }}"
          # 用 sed 替换 version 行
          sed -i "0,/<version>.*<\/version>/s//<version>$VERSION<\/version>/" pom.xml
          echo "✅ Set version to $VERSION"
          grep -E '<version>' pom.xml | head -1

      - name: Configure Maven settings.xml (OIDC)
        if: needs.extract.outputs.dry_run == 'false'
        shell: bash
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${env.MAVEN_USERNAME}</username>
                <password>${env.MAVEN_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
          echo "✅ Maven settings.xml configured"

      - name: Compile + verify (dry-run uses verify, not deploy)
        if: needs.extract.outputs.dry_run == 'true'
        working-directory: packages/sdk/java
        run: |
          echo "🔍 Dry-run: validate Maven build config..."
          mvn -B clean verify -DskipTests=true
          echo "✅ Dry-run passed — artifact would deploy to Maven Central"

      - name: Deploy to Maven Central
        if: needs.extract.outputs.dry_run == 'false'
        working-directory: packages/sdk/java
        run: |
          VERSION="${{ needs.extract.outputs.version }}"
          echo "📦 Deploying com.ihui:ihui-ai-java:$VERSION to Maven Central..."
          mvn -B clean deploy -DskipTests=true
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_TOKEN: ${{ secrets.MAVEN_TOKEN }}

      - name: Summary
        run: |
          VERSION="${{ needs.extract.outputs.version }}"
          echo "### Maven Central SDK 发布" >> $GITHUB_STEP_SUMMARY
          echo "- 坐标: \`com.ihui:ihui-ai-java:$VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "- Maven 引入:" >> $GITHUB_STEP_SUMMARY
          echo '```xml' >> $GITHUB_STEP_SUMMARY
          echo '<dependency>' >> $GITHUB_STEP_SUMMARY
          echo '  <groupId>com.ihui</groupId>' >> $GITHUB_STEP_SUMMARY
          echo '  <artifactId>ihui-ai-java</artifactId>' >> $GITHUB_STEP_SUMMARY
          echo "  <version>$VERSION</version>" >> $GITHUB_STEP_SUMMARY
          echo '</dependency>' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ---------- Job 4: Go module github.com/IHUI-INF-AI/IHUI-AI/packages/sdk/go 发布 ----------
  go-publish:
    name: Publish Go module
    needs: extract
    if: >-
      (startsWith(github.ref, 'refs/tags/sdk-v') || github.event_name == 'workflow_dispatch') &&
      (github.event_name == 'push' || github.event.inputs.language == 'all' || github.event.inputs.language == 'go')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set version via git tag (Go convention)
        shell: bash
        run: |
          VERSION="${{ needs.extract.outputs.version }}"
          # Go 模块使用 git tag 作为版本号,创建 sdk/v$VERSION tag
          # 已有 v* tag(主仓库),再打一个 sdk/v$VERSION 子 tag
          git tag -d "sdk/v$VERSION" 2>/dev/null || true
          git tag "sdk/v$VERSION" HEAD
          echo "✅ Created tag sdk/v$VERSION pointing to HEAD"

      - name: Verify Go build
        working-directory: packages/sdk/go
        run: |
          echo "🔍 Verifying Go SDK builds..."
          go build ./...
          go vet ./...
          echo "✅ Go SDK builds successfully"

      - name: Push Go module tag (real release)
        if: needs.extract.outputs.dry_run == 'false'
        shell: bash
        run: |
          VERSION="${{ needs.extract.outputs.version }}"
          echo "📦 Pushing sdk/v$VERSION tag to origin..."
          git push origin "sdk/v$VERSION"
          echo "✅ Go proxy (proxy.golang.org) will pick up sdk/v$VERSION within minutes"

      - name: Dry-run verification
        if: needs.extract.outputs.dry_run == 'true'
        shell: bash
        run: |
          echo "🔍 Dry-run: validate Go module config..."
          echo "Module path: github.com/IHUI-INF-AI/IHUI-AI/packages/sdk/go"
          echo "Version: sdk/v${{ needs.extract.outputs.version }}"
          echo "✅ Dry-run passed — module would be published to Go proxy"

      - name: Summary
        run: |
          VERSION="${{ needs.extract.outputs.version }}"
          echo "### Go module SDK 发布" >> $GITHUB_STEP_SUMMARY
          echo "- 模块: \`github.com/IHUI-INF-AI/IHUI-AI/packages/sdk/go\`" >> $GITHUB_STEP_SUMMARY
          echo "- 版本: \`sdk/v$VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "- 安装: \`go get github.com/IHUI-INF-AI/IHUI-AI/packages/sdk/go/sdk@v$VERSION\`" >> $GITHUB_STEP_SUMMARY

  # ---------- Job 5: 发布总结 ----------
  release-summary:
    name: Release Summary
    needs: [extract, npm-publish, pypi-publish, maven-publish, go-publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate summary
        run: |
          VERSION="${{ needs.extract.outputs.version }}"
          DRY="${{ needs.extract.outputs.dry_run }}"
          echo "## 🎉 SDK Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag**: \`v$VERSION\`  " >> $GITHUB_STEP_SUMMARY
          echo "**Mode**: $([ "$DRY" = "true" ] && echo "🔍 Dry-run (no publish)" || echo "📦 Real release")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status | 包名 / 坐标 |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| npm \`@ihui/sdk\` | ${{ needs.npm-publish.result }} | @ihui/sdk@$VERSION |" >> $GITHUB_STEP_SUMMARY
          echo "| PyPI \`ihui-ai\` | ${{ needs.pypi-publish.result }} | ihui-ai==$VERSION |" >> $GITHUB_STEP_SUMMARY
          echo "| Maven Central | ${{ needs.maven-publish.result }} | com.ihui:ihui-ai-java:$VERSION |" >> $GITHUB_STEP_SUMMARY
          echo "| Go module | ${{ needs.go-publish.result }} | github.com/IHUI-INF-AI/IHUI-AI/packages/sdk/go sdk/v$VERSION |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
