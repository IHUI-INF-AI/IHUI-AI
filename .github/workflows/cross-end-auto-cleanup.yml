name: cross-end-auto-cleanup

# 作用:清理 cross-end-sync 旧实现留下的自动快照(分支 cross-end-auto-<run_id> + 对应 PR)。
# 背景:旧实现「直推 main 失败 ⇒ 每次 run 新建分支 + 新 PR」,46.8h 内长出 58 支快照 / 58 个 PR,
#       而派生件一条都没进 main。2026-11-08 已把生成侧改成「固定分支 cross-end-auto + 复用同一 PR」
#       (见 cross-end-sync.yml),本工作流只负责清理历史快照与后续可能出现的孤儿分支。
#
# 安全口径:
#   · 默认 dry-run:定时档只有在仓库变量 CROSS_END_CLEANUP_ENABLED=true 时才真删;
#     手动 workflow_dispatch 也必须显式传 mode=delete。
#   · 删前先把清单(分支 / sha / 最后提交时间 / open PR)写成 manifest.json + manifest.tsv 并作为 artifact 留档。
#   · 只处理 cross-end-auto* 前缀;有 open PR 但作者不是 github-actions[bot] 或带 keep 标签的,整支跳过。
#   · 固定落地分支 cross-end-auto 默认不动(需 include_fixed=true 且无 open PR 才清)。
#   · 单轮最多删 100 条,超过直接中止,避免一次误删过猛。

on:
  schedule:
    # 每天 03:17 UTC = 11:17 北京时间
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run 只报告;delete 真关 PR + 删分支'
        type: choice
        options: [dry-run, delete]
        default: dry-run
      older_than_days:
        description: '快照最小存活天数(默认 3)'
        default: '3'
      include_fixed:
        description: '是否连固定落地分支 cross-end-auto 一起清(仅无 open PR 时)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cross-end-auto-cleanup
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}
  MAX_DELETE: '100'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 决定 mode(定时档默认 dry-run)
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          MODE="dry-run"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${{ inputs.mode }}"
          elif [[ "${{ vars.CROSS_END_CLEANUP_ENABLED }}" == "true" ]]; then
            MODE="delete"
          fi
          AGE="${{ inputs.older_than_days }}"
          AGE="${AGE:-3}"
          INCLUDE_FIXED="${{ inputs.include_fixed }}"
          INCLUDE_FIXED="${INCLUDE_FIXED:-false}"
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "age=${AGE}" >> "$GITHUB_OUTPUT"
          echo "include_fixed=${INCLUDE_FIXED}" >> "$GITHUB_OUTPUT"
          echo "本轮 mode=${MODE},阈值=${AGE} 天,include_fixed=${INCLUDE_FIXED}"

      - name: 导出快照清单(删前备份)
        id: manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          AGE="${{ steps.mode.outputs.age }}"
          CUTOFF=$(( $(date -u +%s) - AGE * 86400 ))
          : > manifest.tsv
          gh api --paginate "repos/${REPO}/git/matching-refs/heads/cross-end-auto" --jq '.[].ref' \
            | sed 's#refs/heads/##' | sort -u > branches.txt
          echo "匹配到 $(wc -l < branches.txt) 个 cross-end-auto* 分支"
          while IFS= read -r BR; do
            [[ -z "${BR}" ]] && continue
            if [[ "${BR}" == "cross-end-auto" && "${{ steps.mode.outputs.include_fixed }}" != "true" ]]; then
              echo "skip ${BR}(固定落地分支,include_fixed=false)"
              continue
            fi
            SHA="$(gh api "repos/${REPO}/git/ref/heads/${BR}" --jq '.object.sha')"
            DATE="$(gh api "repos/${REPO}/commits/${BR}" --jq '.commit.committer.date')"
            TS="$(date -u -d "${DATE}" +%s)"
            PR_JSON="$(gh pr list --head "${BR}" --state open --json number,author,labels)"
            PR_NUM="$(echo "${PR_JSON}" | jq -r '.[0].number // empty')"
            if [[ -n "${PR_NUM}" ]]; then
              PR_AUTHOR="$(echo "${PR_JSON}" | jq -r '.[0].author.login')"
              PR_KEEP="$(echo "${PR_JSON}" | jq -r '[.[0].labels[].name] | index("keep") // empty')"
              if [[ "${PR_AUTHOR}" != "github-actions[bot]" || -n "${PR_KEEP}" ]]; then
                echo "skip ${BR}(open PR #${PR_NUM} author=${PR_AUTHOR} keep=${PR_KEEP:-no})"
                continue
              fi
            fi
            if (( TS < CUTOFF )); then
              printf '%s\t%s\t%s\t%s\n' "${BR}" "${SHA}" "${DATE}" "${PR_NUM}" >> manifest.tsv
            fi
          done < branches.txt
          COUNT="$(wc -l < manifest.tsv)"
          echo "超过 ${AGE} 天的候选 ${COUNT} 条"
          {
            echo "### cross-end-auto 清理清单(mode=${{ steps.mode.outputs.mode }})"
            echo ""
            echo "| 分支 | sha | 最后提交 | open PR |"
            echo "| --- | --- | --- | --- |"
            while IFS=$'\t' read -r BR SHA DATE PR_NUM; do
              echo "| ${BR} | ${SHA:0:12} | ${DATE} | ${PR_NUM:-—} |"
            done < manifest.tsv
          } >> "$GITHUB_STEP_SUMMARY"
          jq -R -s 'split("\n") | map(select(length > 0) | split("\t") | {branch: .[0], sha: .[1], last_commit: .[2], open_pr: (if .[3] == "" then null else (.[3] | tonumber) end)})' manifest.tsv > manifest.json
          if [[ "${{ steps.mode.outputs.mode }}" == "delete" && "${COUNT}" -gt "${MAX_DELETE}" ]]; then
            echo "::error::候选 ${COUNT} 条 > 单轮上限 ${MAX_DELETE},中止(防止一次误删过猛)"
            exit 1
          fi

      - name: 上传 sha 清单备份
        uses: actions/upload-artifact@v4
        with:
          name: cross-end-auto-cleanup-manifest-${{ github.run_id }}
          path: |
            manifest.tsv
            manifest.json
          if-no-files-found: error

      - name: 关闭 PR + 删除分支(dry-run 只打印)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MODE="${{ steps.mode.outputs.mode }}"
          while IFS=$'\t' read -r BR SHA DATE PR_NUM; do
            [[ -z "${BR}" ]] && continue
            if [[ -n "${PR_NUM}" ]]; then
              if [[ "${MODE}" == "delete" ]]; then
                gh pr comment "${PR_NUM}" --body "该分支是 cross-end-sync 的自动快照(最后提交 ${DATE}),超过 ${{ steps.mode.outputs.age }} 天且未合并;清理工作流关闭并删除。sha=${SHA}" || true
                gh pr close "${PR_NUM}" || true
                echo "closed PR #${PR_NUM} (${BR})"
              else
                echo "[dry-run] would close PR #${PR_NUM} (${BR})"
              fi
            fi
            if [[ "${MODE}" == "delete" ]]; then
              gh api -X DELETE "repos/${REPO}/git/refs/heads/${BR}" >/dev/null && echo "deleted branch ${BR} (sha=${SHA})"
            else
              echo "[dry-run] would delete branch ${BR} (sha=${SHA})"
            fi
          done < manifest.tsv
# ⁠​‌​​‌​​‌‍‍​‌​​‌​​​‍‍​‌​‌​‌​‌‍‍​‌​​‌​​‌‍‍​​‌​‌‌​‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌​​‌‌‌‌​‌​‍‍‌‌​‌‌​​​‌​​​‌‌‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌‌​‌​​‌‌‌​‍‍‌‌​​‌‌​​​‌​​‌​‌‍‍‌​‌‌‌​‌‌‌​‌‌‌​‌‍‍‌​‌‌​‌‌‌‍‍​‌​​‌‌​​‍‍​‌​​​​‌‌‍‍‌​‌‌​‌‌‌‍‍​‌‌​​​​‌‍‍​‌‌​‌​​‌‍‍​‌‌‌‌​‌​‍‍​‌‌​‌​​​‍‍​‌‌‌​​‌‌‍‍​​‌​‌‌‌​‍‍​‌‌‌​‌​​‍‍​‌‌​‌‌‌‌‍‍​‌‌‌​​​​‍‍‌​‌‌​‌‌‌‍‍​‌​‌​​​​‍‍​‌​‌​​‌​‍‍​‌​​‌‌‌‌‍‍​‌​‌​‌‌​‍‍​‌​​​‌​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​‌‌‍‍​‌​​​‌​‌‍‍​​‌​‌‌​‌‍‍​​‌‌​​‌​‍‍​​‌‌​​​​‍‍​​‌‌​​‌​‍‍​​‌‌​‌‌​⁠
