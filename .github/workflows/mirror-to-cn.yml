# 国内镜像自动同步：把 main 镜像到 Gitee + GitCode
# 仅用 git 官方 CLI，不依赖第三方 action，透明可控。
# 所需 Secrets：GITEE_TOKEN / GITEE_OWNER / GITCODE_TOKEN / GITCODE_OWNER
# 详见 .github/SECRETS.md「国内镜像同步」一节。
#
# ⚠️ 触发方式已改（2026-09-23 实测取证，勿改回 push 触发）：
#   原 `on: push: branches:[main]` 在**多会话高频提交**下会把镜像任务**永久饿死** ——
#   本仓库自 09-21 起每 2-3 分钟一次 push，而镜像要推数千 commit + 数千 tag 到国内，单轮几十分钟；
#   `concurrency.cancel-in-progress: false` 下 GitHub 仍会**取消排队中的旧 run**（只保留最新一个），
#   于是实测最近 30 次运行 = **27 cancelled / 1 failure / 0 success**，
#   地面真相是 Gitee 侧 main 的最后提交停在 **2026-09-20 23:16**（落后 3 天，且无人报警，
#   因为状态一直是"在跑"而不是"失败"）。
#   现改为**定时 20 分钟 + 手动**：并发面从"每 push 一次"降到"最多一个排队"，
#   在跑的 run 不会被挤掉 ⇒ 能真正跑完。镜像延迟由 0 变为 ≤20 分钟，这是有意的取舍。
name: Mirror to CN

on:
  workflow_dispatch:
  schedule:
    # 每 20 分钟一次；单轮未完成时下一个只排队一个，不挤掉在跑的
    - cron: '*/20 * * * *'

permissions:
  contents: read

concurrency:
  group: mirror-to-cn
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    # 2026-09-05 根治:超时 20min→60min + LFS 扫描限定 main
    # 2026-09-11 泄密整改:全历史重写后 force push 需全量重传 ~582MB 对象,
    # 两次实测 60min 均被强杀(cancelled)——再提到 240min,保证全量镜像可完成
    timeout-minutes: 240
    steps:
      - name: Checkout（全历史 + LFS）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: 配置 git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # 2026-09-17 根治:actions/checkout 只创建触发分支的本地 ref(fetch-depth 只影响该分支历史),
      # 若不补齐,下方 "refs/heads/*" 实际只含 main → --prune 会把镜像侧的真源分支(如
      # desktop-feed 更新器 feed)全部删除(今日三次实证)。此处拉取 GitHub 全部分支到本地 refs。
      # 2026-09-19 根治:--update-head-ok 必带——actions/checkout 把 main checkout 在工作区,
      # 裸 fetch '+refs/heads/*:refs/heads/*' 会报 "refusing to fetch into branch checked out"
      # (exit 128,连续 3 次 run 实证);镜像 CI 只消费 refs 不消费工作区,允许覆盖 checked-out ref 安全。
      - name: 拉取全部分支（保证镜像 refspec 完整）
        run: |
          git fetch origin '+refs/heads/*:refs/heads/*' --prune --update-head-ok
          echo "本地分支列表:"; git branch --list | head -20

      - name: 镜像到 Gitee
        id: gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
        run: |
          if [ -z "$GITEE_TOKEN" ] || [ -z "$GITEE_OWNER" ]; then
            echo "⚠️ GITEE_TOKEN / GITEE_OWNER 未配置，跳过 Gitee 镜像"
            echo "GITEE_OWNER 长度: ${#GITEE_OWNER}（应为 16: JLSLSSZWHYXGS_0）"
            exit 0
          fi
          echo "GITEE_OWNER 长度: ${#GITEE_OWNER}（应非 0）"
          set -o pipefail
          REMOTE="https://${GITEE_OWNER}:${GITEE_TOKEN}@gitee.com/${GITEE_OWNER}/IHUI-AI.git"
          # ── 推送前先释放配额:删掉远端上的**内部备份标签** ─────────────────────────
          # 2026-09-23 实测:Gitee 服务端硬配额 `Repo size 1156MB > 1024MB` 会以 pre-receive
          # 拒绝**整个 push(含 main)**,当天一轮镜像跑 69 分钟后失败就在这一步。
          # 体积主源是 `refs/tags/*` 全量推送带上去的 `lost-commit/*` / `nightly-*` / `backup/*`
          # —— 本地 4227 个标签里这类占 4206 个(仅剩 21 个真对外标签)。它们的存在意义是
          # **防本地/origin 的 git gc 回收悬空 commit**(AGENTS.md §22/§29),国内镜像不需要,
          # 且 GitHub 侧一份未删(权威源)。
          # 零损失前置:先把"远端当前真实存在的这批 ref + sha"落盘成清单,可按 sha 精确复原。
          # 注意:删除后 Gitee 需服务端 GC 才真正降体积(其无公开 GC API,由平台定期回收);
          # 故本轮仍可能失败 —— 那时**结论文本必须是"等 GC"而不是"再调触发器"**。
          # 内部备份标签的**唯一定义** —— 删除清单与推送排除必须同一个 RE,否则删掉又被推回去。
          # 实测教训(2026-09-23 两处独立自伤):
          #   ① 原排除式写 `(lost-commit|nightly|backup)/` 要求 nightly 后带斜杠,而真实标签名是
          #      `nightly-<数字>`(本地 140 个)⇒ 排除式漏掉整族,删完再推回原地。
          #   ② 原删除式用 `grep -E '\t'` 匹配制表符 —— GNU grep 的 ERE **不把 `\t` 当 tab**(它匹配
          #      字面 `t`),对 `sha<TAB>refs/tags/...` 恒 0 命中,于是"零损失删除"整步静默跳过。
          #      现改为先 `cut -f2` 取列再匹配,判据不依赖不可见的转义语义。
          INTERNAL_TAG_RE='^refs/tags/(lost-commit|nightly|backup)'
          git ls-remote "$REMOTE" 'refs/tags/*' > /tmp/gitee-tags.tsv 2>/dev/null || true
          cut -f2 /tmp/gitee-tags.tsv | grep -E "$INTERNAL_TAG_RE" > gitee-internal-tags-before-prune.txt || true
          DEL_N=$(wc -l < gitee-internal-tags-before-prune.txt | tr -d ' ')
          REMOTE_TAG_N=$(cut -f2 /tmp/gitee-tags.tsv | wc -l | tr -d ' ')
          echo "远端标签总数=${REMOTE_TAG_N} / 其中内部备份标签=${DEL_N} 个(清单已存 gitee-internal-tags-before-prune.txt)"
          # 反假绿:本地内部标签实测 4206 个。若该 RE 在本地只匹配到 <1000,说明**表达式本身失效**
          # (上面 ①② 两类静默 no-op 都是这个形状:步骤"成功"、什么都没做、镜像照旧恒红)。
          # 与其让它带着坏判据去跑 69 分钟,不如 3 秒内失败并点名。
          LOCAL_INTERNAL_N=$(git for-each-ref --format='%(refname)' refs/tags | grep -Ec "$INTERNAL_TAG_RE" || true)
          echo "本地内部备份标签(按同一 RE 计)= ${LOCAL_INTERNAL_N}"
          if [ "${LOCAL_INTERNAL_N}" -lt 1000 ]; then
            echo "::error::INTERNAL_TAG_RE 在本仓库只匹配到 ${LOCAL_INTERNAL_N} 个标签,远低于实测 4206 —— 判据失效,拒绝以「无需删除/已排除」的假绿继续"
            exit 1
          fi
          if [ "${DEL_N}" -gt 0 ]; then
            echo "首批 5 个待删:$(head -5 gitee-internal-tags-before-prune.txt | tr '\n' ' ')"
            mapfile -t DEL < gitee-internal-tags-before-prune.txt
            i=0
            FAILB=0
            while [ "$i" -lt "${#DEL[@]}" ]; do
              CHUNK=("${DEL[@]:$i:300}")
              if ! git push --delete "$REMOTE" "${CHUNK[@]}" 2>&1 | sed "s|${GITEE_TOKEN}|***|g"; then
                FAILB=$((FAILB + 1))
              fi
              i=$((i + 300))
            done
            echo "✅ 内部备份标签删除完成:共 ${#DEL[@]} 个 / 失败批次 ${FAILB}"
          else
            echo "远端已无内部备份标签(此前已清理),跳过删除"
          fi
          # ─────────────────────────────────────────────────────────────────────────
          # 不用 --mirror:推 refs/remotes/origin/* 会被 Gitee 拒绝(deny hidden ref)
          # 改用 refspec:推 branches + tags,删除远端多余,不推 remote-tracking
          #
          # 2026-09-23 实测必改:全量 `refs/tags/*` 会把**内部备份标签**一起推给国内镜像。
          # 本地 4222 个标签里 `lost-commit/*` + `nightly-*` + `backup/*` 占 4172 个,正是它们
          # 把 Gitee 仓库体积推到 1156MB、撞上 1024MB **硬配额** ⇒ 服务端 pre-receive 连 `main`
          # 一起拒(`Push rejected for repository [size exceeds limit]`,gitee.com/help/articles/4232),
          # 结果是"每 20 分钟跑一次、连续一天一条都没落地"。
          # 这些标签的用途是防本地/origin 的 git gc 回收悬空 commit(AGENTS.md §22/§29),
          # **GitHub 侧一份不少**;国内镜像不需要它们。删镜像上的既有副本属破坏性动作,
          # 需人工确认后才做(见 PROJECT_PLAN 的"残余")。
          # 排除式直接复用上方同一个 $INTERNAL_TAG_RE(单一真相源,不再各写一份 → 这正是
          # 上面 ① 那类"删了又推回去"漂移的根治点)。
          SPEC=()
          while IFS= read -r r; do
            case "$r" in
              '') ;;
              *) SPEC+=("$r:$r") ;;
            esac
          done < <(git for-each-ref --format='%(refname)' refs/tags | grep -Ev "$INTERNAL_TAG_RE")
          echo "推送分支 + ${#SPEC[@]} 个标签(同一 RE 已排除内部备份标签 ${LOCAL_INTERNAL_N} 个)"
          GIT_LFS_SKIP_PUSH=1 git push --force --prune "$REMOTE" "refs/heads/*:refs/heads/*" "${SPEC[@]}" 2>&1 | sed "s|${GITEE_TOKEN}|***|g"
          echo "✅ Gitee 镜像推送完成"

      - name: 镜像到 GitCode
        id: gitcode
        if: always()
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITCODE_OWNER: ${{ secrets.GITCODE_OWNER }}
        run: |
          if [ -z "$GITCODE_TOKEN" ] || [ -z "$GITCODE_OWNER" ]; then
            echo "⚠️ GITCODE_TOKEN / GITCODE_OWNER 未配置，跳过 GitCode 镜像"
            echo "GITCODE_OWNER 长度: ${#GITCODE_OWNER}（应为 7: IHUI-AI）"
            exit 0
          fi
          echo "GITCODE_OWNER 长度: ${#GITCODE_OWNER}（应非 0）"
          set -o pipefail
          REMOTE="https://${GITCODE_OWNER}:${GITCODE_TOKEN}@gitcode.com/${GITCODE_OWNER}/IHUI-AI.git"
          # GitCode 服务端 pre-receive hook 要求 LFS 对象必须存在，先推 LFS 对象
          # 限定 main:--all 不带 ref 会扫描全部分支+tag 历史的 LFS 对象,是超时根因
          git lfs push --all "$REMOTE" main 2>&1 | sed "s|${GITCODE_TOKEN}|***|g" || true
          # 2026-09-05 根治(三层):
          # ① GitCode 网关对大包 push 返回 HTTP 504 断连——main 先单推(增量小)
          # ② tags 有 5000+ 个,全量 refspec 一次推必 504——分批(每批 200 个)推送,失败重试(增量递减)
          # ③ 管道后退出码曾是 sed 的,失败被吞成 success——pipefail + 显式判定
          GITCODE_FAILED=0
          if ! OUT=$(GIT_LFS_SKIP_PUSH=1 git push --force "$REMOTE" main 2>&1); then
            echo "❌ GitCode main 单推失败:"; echo "$OUT" | sed "s|${GITCODE_TOKEN}|***|g"
            GITCODE_FAILED=1
          else
            echo "$OUT" | sed "s|${GITCODE_TOKEN}|***|g"
          fi
          TAGS_FAILED=0
          for ATTEMPT in 1 2; do
            if git for-each-ref --format='%(refname)' refs/tags | xargs -n 200 git push --force "$REMOTE" 2>&1 | sed "s|${GITCODE_TOKEN}|***|g"; then
              echo "✅ GitCode tags 分批推送完成(第 $ATTEMPT 轮)"
              TAGS_FAILED=0
              break
            fi
            TAGS_FAILED=1
            echo "⚠️ tags 第 $ATTEMPT 轮有批次失败,30s 后重试(增量传输)"
            sleep 30
          done
          if [ "$GITCODE_FAILED" != "0" ] || [ "$TAGS_FAILED" != "0" ]; then
            echo "❌ GitCode 推送未完全成功(main 失败=$GITCODE_FAILED, tags 失败=$TAGS_FAILED);main/分支已推部分由下轮 run 增量补齐"
            exit 1
          fi
          echo "✅ GitCode 镜像推送完成"

      - name: 同步结果汇总
        if: always()
        run: |
          echo "## 国内镜像同步结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          GITEE_RESULT="${{ (steps.gitee.outcome == 'success' || steps.gitee.outcome == 'skipped') && '✅ 成功' || '❌ 失败（见上一步日志）' }}"
          GITCODE_RESULT="${{ (steps.gitcode.outcome == 'success' || steps.gitcode.outcome == 'skipped') && '✅ 成功' || '❌ 失败（见上一步日志）' }}"
          echo "- Gitee: $GITEE_RESULT" >> $GITHUB_STEP_SUMMARY
          echo "- GitCode: $GITCODE_RESULT" >> $GITHUB_STEP_SUMMARY
          # 如果两个都失败，让 job failed（让失败可见，避免静默失败）
          if [ "${{ steps.gitee.outcome }}" != "success" ] && [ "${{ steps.gitee.outcome }}" != "skipped" ] && [ "${{ steps.gitcode.outcome }}" != "success" ] && [ "${{ steps.gitcode.outcome }}" != "skipped" ]; then
            echo "❌ Gitee 和 GitCode 都失败，job 标记为 failed" >&2
            exit 1
          fi

# ⁠​‌​​‌​​‌‍‍​‌​​‌​​​‍‍​‌​‌​‌​‌‍‍​‌​​‌​​‌‍‍​​‌​‌‌​‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌​​‌‌‌‌​‌​‍‍‌‌​‌‌​​​‌​​​‌‌‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌‌​‌​​‌‌‌​‍‍‌‌​​‌‌​​​‌​​‌​‌‍‍‌​‌‌‌​‌‌‌​‌‌‌​‌‍‍‌​‌‌​‌‌‌‍‍​‌​​‌‌​​‍‍​‌​​​​‌‌‍‍‌​‌‌​‌‌‌‍‍​‌‌​​​​‌‍‍​‌‌​‌​​‌‍‍​‌‌‌‌​‌​‍‍​‌‌​‌​​​‍‍​‌‌‌​​‌‌‍‍​​‌​‌‌‌​‍‍​‌‌‌​‌​​‍‍​‌‌​‌‌‌‌‍‍​‌‌‌​​​​‍‍‌​‌‌​‌‌‌‍‍​‌​‌​​​​‍‍​‌​‌​​‌​‍‍​‌​​‌‌‌‌‍‍​‌​‌​‌‌​‍‍​‌​​​‌​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​‌‌‍‍​‌​​​‌​‌‍‍​​‌​‌‌​‌‍‍​​‌‌​​‌​‍‍​​‌‌​​​​‍‍​​‌‌​​‌​‍‍​​‌‌​‌‌​⁠
