name: Real DB Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Security: least-privilege GITHUB_TOKEN (CWE-250). Third-party actions use @v tags — pin to commit SHA for stricter supply-chain security.
permissions:
  contents: read

jobs:
  real-db-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        # 2026-08-30 修复:postgres:17 镜像不带 pgvector 扩展,drizzle-kit push 到 vector 列会失败;
        # 换 pgvector/pgvector:pg17(官方 pgvector 镜像,内置扩展,兼容 postgres 17)
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ihui_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ihui_test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build database package
        run: pnpm --filter @ihui/database build

      # 2026-09-10 根因修复:pgvector 镜像只是把扩展文件放进镜像,每个 database 仍需
      # 显式 CREATE EXTENSION;缺这步 → drizzle 到 vector(1536) 列时抛
      # `type "vector" does not exist` 并回滚整个 DDL 事务 → 全库无表 →
      # 109/110 个真实 DB 测试级联失败(balances undefined / 500 vs 200 等)。
      - name: Enable pgvector extension
        working-directory: packages/database
        run: |
          node --input-type=module -e "
            import postgres from 'postgres';
            const sql = postgres(process.env.DATABASE_URL);
            await sql.unsafe('CREATE EXTENSION IF NOT EXISTS vector');
            await sql.end();
            console.log('pgvector extension enabled');
          "

      # 2026-09-10 根因修复:原 `drizzle-kit push --force` 只按 schema 现状建表,不执行
      # drizzle/*.sql 迁移 —— 0010_fulltext_search_indexes.sql 的 search_vector 列 +
      # GIN 触发器永远不生效,全文检索相关测试必挂。改用与 e2e.yml 一致的权威迁移路径。
      - name: Apply migrations to test DB
        working-directory: packages/database
        run: npx drizzle-kit migrate

      - name: Seed baseline data
        working-directory: packages/database
        # 真实 DB 集成测试断言依赖引用/基线数据(ai_world 8 分类、gamification levels、
        # 证书模板、news/point 渠道配置等),空库下这些测试必挂(2026-09-10)
        env:
          JWT_SECRET: test-jwt-secret-for-real-db-0123456789abcdef
          CREDENTIALS_ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
        # ①先用 api 侧脚本建默认用户(argon2 在 api 依赖里);②再跑全量基线 seed。
        # users.ts 检测到 argon2 不可用且库中已有用户时会自动跳过,不再 critical 失败
        run: |
          pnpm --filter @ihui/api run seed:test-users
          pnpm run seed

      - name: Run real DB integration tests
        working-directory: apps/api
        run: pnpm test:real
# ⁠​‌​​‌​​‌‍‍​‌​​‌​​​‍‍​‌​‌​‌​‌‍‍​‌​​‌​​‌‍‍​​‌​‌‌​‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌​​‌‌‌‌​‌​‍‍‌‌​‌‌​​​‌​​​‌‌‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌‌​‌​​‌‌‌​‍‍‌‌​​‌‌​​​‌​​‌​‌‍‍‌​‌‌‌​‌‌‌​‌‌‌​‌‍‍‌​‌‌​‌‌‌‍‍​‌​​‌‌​​‍‍​‌​​​​‌‌‍‍‌​‌‌​‌‌‌‍‍​‌‌​​​​‌‍‍​‌‌​‌​​‌‍‍​‌‌‌‌​‌​‍‍​‌‌​‌​​​‍‍​‌‌‌​​‌‌‍‍​​‌​‌‌‌​‍‍​‌‌‌​‌​​‍‍​‌‌​‌‌‌‌‍‍​‌‌‌​​​​‍‍‌​‌‌​‌‌‌‍‍​‌​‌​​​​‍‍​‌​‌​​‌​‍‍​‌​​‌‌‌‌‍‍​‌​‌​‌‌​‍‍​‌​​​‌​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​‌‌‍‍​‌​​​‌​‌‍‍​​‌​‌‌​‌‍‍​​‌‌​​‌​‍‍​​‌‌​​​​‍‍​​‌‌​​‌​‍‍​​‌‌​‌‌​⁠
