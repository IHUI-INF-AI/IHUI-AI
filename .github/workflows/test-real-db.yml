name: Real DB Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Security: least-privilege GITHUB_TOKEN (CWE-250). Third-party actions use @v tags — pin to commit SHA for stricter supply-chain security.
permissions:
  contents: read

jobs:
  real-db-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        # 2026-08-30 修复:postgres:17 镜像不带 pgvector 扩展,drizzle-kit push 到 vector 列会失败;
        # 换 pgvector/pgvector:pg17(官方 pgvector 镜像,内置扩展,兼容 postgres 17)
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ihui_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ihui_test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build database package
        run: pnpm --filter @ihui/database build

      - name: Push schema to test DB
        working-directory: packages/database
        run: npx drizzle-kit push

      - name: Run real DB integration tests
        working-directory: apps/api
        run: pnpm test:real
