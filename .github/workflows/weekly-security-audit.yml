name: weekly-security-audit

# 每周一 02:00 北京时间 (UTC 18:00 周日) 执行
# TS Monorepo (Fastify + Next.js + FastAPI) 安全审计：
# - pnpm audit 依赖漏洞扫描
# - tsc 类型检查（编译期错误即安全隐患）
# - eslint 静态分析
# - 依赖漏洞深度扫描（生产依赖）
# - 许可证合规检查
# - 密钥泄露扫描（复用 scripts/check-api-key-leak.mjs + gitleaks）
# - 汇总报告上传 artifact，发现高危问题自动创建 Issue

on:
  schedule:
    - cron: '0 18 * * 0' # UTC 周日 18:00 = 北京周一 02:00
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  NODE_VERSION: '22'
  # 与根 package.json packageManager 对齐,避免 pnpm 版本漂移
  PNPM_VERSION: '11.18.0'

jobs:
  security-audit:
    name: 安全审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 1. 依赖漏洞扫描（全量 + 生产依赖）
      # known workaround: npmmirror registry 无 audit 端点,显式切到官方 registry(npmjs)
      #   使 pnpm audit 可命中安全端点;仅作用于本步骤 env,不影响其他安装/本地配置。
      - name: 依赖漏洞扫描 (pnpm audit)
        env:
          npm_config_registry: https://registry.npmjs.org
        run: |
          mkdir -p reports
          # 全量审计（含 dev 依赖），输出 JSON 报告
          pnpm audit --json > reports/pnpm-audit-full.json || true
          echo "=== 全量依赖审计摘要(仅告警) ==="
          pnpm audit || true
          # 仅生产依赖审计（更高危）：先尽力写 JSON 报告(供 artifact/Issue 用,不阻塞),
          # 再以 --audit-level=high 作为阻塞门槛(存在 high/critical 时 pnpm 非 0 退出,|| exit 1 使任务失败)。
          echo "=== 生产依赖审计摘要(阻塞门槛) ==="
          pnpm audit --prod --json > reports/pnpm-audit-prod.json || true
          pnpm audit --prod --audit-level=high > reports/pnpm-audit-prod.txt || exit 1

      # 2. TypeScript 类型检查（turbo 并行）
      - name: TypeScript 类型检查 (tsc --noEmit)
        run: pnpm run typecheck || echo "::warning::存在类型错误，详见日志"

      # 3. ESLint 静态分析
      - name: ESLint 静态分析
        run: |
          pnpm run lint 2>&1 | tee reports/eslint-report.txt || true

      # 4. 许可证合规检查
      - name: 许可证检查
        run: |
          npx license-checker --production --json > reports/licenses.json 2>/dev/null || true
          # 检查是否存在不合规许可证（GPL/AGPL/LGPL 在商业项目通常受限）
          npx license-checker --production --summary | tee reports/licenses-summary.txt || true
          if grep -iE 'GPL|AGPL|LGPL|Unlicensed' reports/licenses-summary.txt; then
            echo "::warning::发现受限许可证，详见 reports/licenses.json"
          fi

      # 5. 密钥泄露扫描（复用项目脚本 + gitleaks 双保险）
      - name: 密钥泄露扫描 (项目脚本)
        run: |
          node scripts/check-api-key-leak.mjs 2>&1 | tee reports/api-key-leak.txt || true

      - name: 密钥泄露扫描 (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan-mode: repo
        continue-on-error: true

      # 6. 汇总安全报告
      - name: 生成安全审计汇总报告
        run: |
          {
            echo "# 每周安全审计报告"
            echo ""
            echo "- 执行时间: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "- 触发: ${{ github.event_name }}"
            echo ""
            echo "## 依赖漏洞"
            echo "见 reports/pnpm-audit-full.json（全量）/ reports/pnpm-audit-prod.json（生产）"
            echo ""
            echo "## 许可证"
            cat reports/licenses-summary.txt 2>/dev/null || echo "（无）"
            echo ""
            echo "## 密钥泄露"
            cat reports/api-key-leak.txt 2>/dev/null || echo "（无）"
          } > reports/security-audit-summary.md

      - name: 上传安全审计 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-security-audit-${{ github.run_id }}
          path: reports/
          retention-days: 30

      # 7. 发现高危漏洞时维护**唯一跟踪帖**（生产依赖存在 high/critical）
      # 2026-09-28 社区卫生:原写法 `--title "... - ${DATE}"` 每周开一帖(与 [nightly] 同型)。
      # 现口径同 button-wrap-nightly:命中即更新同一条(标题逐字相等匹配,不许 startsWith),
      # 0 命中即自动关闭 —— 0 命中还留着 open 的"高危漏洞"帖就是腐烂台账。
      # 注:原 `--label "security,backend"` 两枚标签本仓**从未存在**,gh 直接非 0 退出,
      # 又被 `|| true` 吞掉 ⇒ 这条自动化历史上**一帖未产**(search "安全审计" = 0)。故此处不带标签。
      - name: 高危漏洞跟踪帖（命中即更新 / 0 命中即关闭）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          TITLE='[安全审计] 生产依赖高危漏洞 · 自动跟踪'
          HIGH=$(jq '[.vulnerabilities[]? | select(.severity | ascii_downcase | IN("high","critical"))] | length' reports/pnpm-audit-prod.json 2>/dev/null || echo -1)
          echo "高危漏洞数: ${HIGH}(-1 = 报告取不到,判不出 ⇒ 不开也不关)"
          case "$HIGH" in ''|*[!0-9-]*) HIGH=-1;; esac
          # 报告本身缺失(前序步骤在写 JSON 之前就崩了)同样算"未判定",不得静默当 0
          [ -s reports/pnpm-audit-prod.json ] || HIGH=-1
          if [ "$HIGH" -lt 0 ]; then
            echo "::notice::本轮拿不到可靠的漏洞计数(报告缺失或解析失败),跟踪帖不改动"
            exit 0
          fi
          T="$TITLE" TRACKER=$(gh issue list --state open --limit 200 --json number,title \
            --jq '.[] | select(.title == $env.T) | .number' | head -n1)
          echo "TRACKER=${TRACKER:-（无）}"
          if [ "$HIGH" -gt 0 ]; then
            {
              echo "生产依赖(pnpm audit --prod)当前存在 **${HIGH}** 个 high/critical 漏洞。"
              echo ""
              echo "- 最近一次扫描: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              echo "- 详细报告: artifact \`weekly-security-audit-${RUN_ID}\` 中的 reports/pnpm-audit-prod.json"
              echo "- 复跑: \`pnpm audit --prod --audit-level=high\`"
              echo ""
              echo "---"
              echo ""
              echo "由 \`.github/workflows/weekly-security-audit.yml\` 自动维护(命中即更新本帖,0 命中即关闭)。"
            } > tracker-body.md
            if [ -n "$TRACKER" ]; then
              gh issue edit "$TRACKER" --body-file tracker-body.md && echo "已更新唯一跟踪帖 #$TRACKER"
            else
              gh issue create --title "$TITLE" --body-file tracker-body.md || echo "::warning::跟踪帖创建失败"
            fi
          else
            if [ -n "$TRACKER" ]; then
              gh issue comment "$TRACKER" --body "本轮扫描($(date -u '+%Y-%m-%d'))高危 0 处 ⇒ 自动关闭本跟踪帖。"
              gh issue close "$TRACKER" --reason completed
            else
              echo "高危 0 处且无在位跟踪帖,不做任何事"
            fi
          fi

# ⁠​‌​​‌​​‌‍‍​‌​​‌​​​‍‍​‌​‌​‌​‌‍‍​‌​​‌​​‌‍‍​​‌​‌‌​‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌​​‌‌‌‌​‌​‍‍‌‌​‌‌​​​‌​​​‌‌‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌‌​‌​​‌‌‌​‍‍‌‌​​‌‌​​​‌​​‌​‌‍‍‌​‌‌‌​‌‌‌​‌‌‌​‌‍‍‌​‌‌​‌‌‌‍‍​‌​​‌‌​​‍‍​‌​​​​‌‌‍‍‌​‌‌​‌‌‌‍‍​‌‌​​​​‌‍‍​‌‌​‌​​‌‍‍​‌‌‌‌​‌​‍‍​‌‌​‌​​​‍‍​‌‌‌​​‌‌‍‍​​‌​‌‌‌​‍‍​‌‌‌​‌​​‍‍​‌‌​‌‌‌‌‍‍​‌‌‌​​​​‍‍‌​‌‌​‌‌‌‍‍​‌​‌​​​​‍‍​‌​‌​​‌​‍‍​‌​​‌‌‌‌‍‍​‌​‌​‌‌​‍‍​‌​​​‌​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​‌‌‍‍​‌​​​‌​‌‍‍​​‌​‌‌​‌‍‍​​‌‌​​‌​‍‍​​‌‌​​​​‍‍​​‌‌​​‌​‍‍​​‌‌​‌‌​⁠
