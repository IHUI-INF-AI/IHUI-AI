# Assistant Release 资产上传(blob-SHA 直取 → runner 组装 → sha256 强校验 → gh release upload)
# 背景: 本机→uploads.github.com 的大文件 PUT 被网络层反复掐断(3 次实测中途死亡),
# 分块已随历史提交进入远端对象库(虽不被任何 ref 引用, 但 git blob API 可按 SHA 直取).
# 终产物以 SHA256 强校验, 确保组装结果与本地构建逐字节一致.
name: assistant-release-upload

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: "GitHub Release ID"
        required: true
        type: string

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch chunks by blob SHA and reassemble
        run: |
          set -euo pipefail
          mkdir -p out .chunks
          REPO="${{ github.repository }}"
          fetch() {
            curl -sf -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/git/blobs/$1" \
              | python3 -c "import sys,json,base64; sys.stdout.buffer.write(base64.b64decode(json.load(sys.stdin)['content']))" \
              > "$2"
            echo "fetched $2 ($(stat -c%s "$2") bytes)"
          }
          fetch c571c9b635f5cc64cf80d7cb384d2e7d50854946 .chunks/msi-01
          fetch 59d224957c990aa6008cfd6c5c23cbbcb231c106 .chunks/msi-02
          fetch b653a442787e72c2d991c238a89c23c253f70146 .chunks/msi-03
          fetch 9653324ba78385d92dc52d3a66839d3682cc7455 .chunks/msi-04
          fetch ee6414ae5fb01eb6f2b2f806e49a4be7fd522721 .chunks/msi-05
          fetch 5bf9a41a0ef5e4e9793bc213fa3471a7ceffc6df .chunks/nsis-01
          fetch 70c699bd101dc09b5475d5f2f61f6820157e3a35 .chunks/nsis-02
          fetch f285fd156f6f1c6d189498310df22cc3cb0abb15 .chunks/nsis-03
          fetch 3cabde07186e4720ae6840bfed386fa47d66d035 .chunks/nsis-04
          fetch 557a49a69dea656ba11a604bdf85ca25ae69dc92 .chunks/nsis-05
          cat .chunks/msi-01 .chunks/msi-02 .chunks/msi-03 .chunks/msi-04 .chunks/msi-05 \
            > out/ihui-assistant_0.1.0_x64_zh-CN.msi
          cat .chunks/nsis-01 .chunks/nsis-02 .chunks/nsis-03 .chunks/nsis-04 .chunks/nsis-05 \
            > out/ihui-assistant_0.1.0_x64-setup.exe
          ls -la out/
          # 终产物 SHA256 强校验(与本地构建逐字节一致)
          echo "b36db00feb41c6e47731cfd321f989715ee2425dee3f642be8ec8d119ac1e9df  out/ihui-assistant_0.1.0_x64_zh-CN.msi" | sha256sum -c -
          echo "3ffe488de7e34bd7a618e0f622a18d82eb3cc48036ef3412bd203612b5fde59f  out/ihui-assistant_0.1.0_x64-setup.exe" | sha256sum -c -

      - name: Upload to release
        run: |
          set -euo pipefail
          gh release upload "${{ github.event.inputs.release_id }}" \
            out/ihui-assistant_0.1.0_x64_zh-CN.msi \
            out/ihui-assistant_0.1.0_x64-setup.exe \
            --repo "${{ github.repository }}" --clobber
          gh release view "${{ github.event.inputs.release_id }}" --repo "${{ github.repository }}" \
            --json assets --jq '.assets[] | [.name, .size, .state] | @tsv'
# ⁠​‌​​‌​​‌‍‍​‌​​‌​​​‍‍​‌​‌​‌​‌‍‍​‌​​‌​​‌‍‍​​‌​‌‌​‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌​​‌‌‌‌​‌​‍‍‌‌​‌‌​​​‌​​​‌‌‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌‌​‌​​‌‌‌​‍‍‌‌​​‌‌​​​‌​​‌​‌‍‍‌​‌‌‌​‌‌‌​‌‌‌​‌‍‍‌​‌‌​‌‌‌‍‍​‌​​‌‌​​‍‍​‌​​​​‌‌‍‍‌​‌‌​‌‌‌‍‍​‌‌​​​​‌‍‍​‌‌​‌​​‌‍‍​‌‌‌‌​‌​‍‍​‌‌​‌​​​‍‍​‌‌‌​​‌‌‍‍​​‌​‌‌‌​‍‍​‌‌‌​‌​​‍‍​‌‌​‌‌‌‌‍‍​‌‌‌​​​​‍‍‌​‌‌​‌‌‌‍‍​‌​‌​​​​‍‍​‌​‌​​‌​‍‍​‌​​‌‌‌‌‍‍​‌​‌​‌‌​‍‍​‌​​​‌​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​‌‌‍‍​‌​​​‌​‌‍‍​​‌​‌‌​‌‍‍​​‌‌​​‌​‍‍​​‌‌​​​​‍‍​​‌‌​​‌​‍‍​​‌‌​‌‌​⁠
