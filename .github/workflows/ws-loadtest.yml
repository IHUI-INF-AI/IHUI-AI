name: WebSocket Load Test

# WebSocket 负载测试工作流 — 关联 M-24/M-25
# 对 WebSocket 端点进行连接压力测试，验证 WS 连接承载能力
on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'WebSocket 目标地址（如 ws://localhost:8801/ws）'
        required: false
        default: 'ws://localhost:8801/ws'
      users:
        description: '并发连接数'
        required: false
        default: '100'
      duration:
        description: '压测时长（秒）'
        required: false
        default: '60'
  schedule:
    - cron: '0 4 * * 1' # 每周一 04:00 UTC 回归压测

# Security: least-privilege GITHUB_TOKEN (CWE-250).
permissions:
  contents: read

jobs:
  loadtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install autocannon
        # 逐字钉版(现读 npm view autocannon = 8.0.0):`npm install -g autocannon` 每次拉最新,
        # 同一枚提交的压测结果能在两个时间点之间不可比 —— 而这条作业产出的数字正是要拿来判
        # "吞吐有没有退"的。版本来源不写死,升级必须由人在 diff 里发起。
        run: npm install -g autocannon@8.0.0

      - name: Run WebSocket load test
        run: |
          autocannon --connections ${{ inputs.users || 100 }} \
            --duration ${{ inputs.duration || 60 }} \
            --render-status-code \
            --ws \
            --ws-config '{"url":"${{ inputs.target_url || 'ws://localhost:8801/ws' }}"}' \
            | tee ws-loadtest-report.txt

      - name: Upload load test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ws-loadtest-report
          path: ws-loadtest-report.txt
          retention-days: 14
# ⁠​‌​​‌​​‌‍‍​‌​​‌​​​‍‍​‌​‌​‌​‌‍‍​‌​​‌​​‌‍‍​​‌​‌‌​‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌​​‌‌‌‌​‌​‍‍‌‌​‌‌​​​‌​​​‌‌‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌‌​‌​​‌‌‌​‍‍‌‌​​‌‌​​​‌​​‌​‌‍‍‌​‌‌‌​‌‌‌​‌‌‌​‌‍‍‌​‌‌​‌‌‌‍‍​‌​​‌‌​​‍‍​‌​​​​‌‌‍‍‌​‌‌​‌‌‌‍‍​‌‌​​​​‌‍‍​‌‌​‌​​‌‍‍​‌‌‌‌​‌​‍‍​‌‌​‌​​​‍‍​‌‌‌​​‌‌‍‍​​‌​‌‌‌​‍‍​‌‌‌​‌​​‍‍​‌‌​‌‌‌‌‍‍​‌‌‌​​​​‍‍‌​‌‌​‌‌‌‍‍​‌​‌​​​​‍‍​‌​‌​​‌​‍‍​‌​​‌‌‌‌‍‍​‌​‌​‌‌​‍‍​‌​​​‌​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​‌‌‍‍​‌​​​‌​‌‍‍​​‌​‌‌​‌‍‍​​‌‌​​‌​‍‍​​‌‌​​​​‍‍​​‌‌​​‌​‍‍​​‌‌​‌‌​⁠
