name: i18n Dead Key Audit

# =============================================================================
# i18n 死 key 审计 workflow(2026-07-26 立)
#
# 扫描 packages/i18n/messages/web/zh-CN.json 中已声明但代码中无任何
# t() / useTranslations() 引用的"死 key",防止 PR 引入新的死 key 增量。
# 脚本: scripts/scan-dead-i18n-keys.mjs
# 退出码:发现死 key → exit 1(blocking);无死 key → exit 0
# 报告:.ihui-agent/tmp/i18n-dead-keys-YYYY-MM-DD.md(无论成败均上传 artifact)
#
# 2026-07-26 增强:新增 unit-tests job 挂载 i18n 扫描器单测 + 4 端集成测试,
#   覆盖 _i18n-scan-helpers.mjs 的 STATIC_T_RE / USE_T_RE / DYNAMIC_T_RE 等正则
#   + main() 端到端入口,防止正则重构引入回归(如 commit 5ebb17915 漏识别 getTranslations)。
# =============================================================================

# 2026-11-03(排队治理):最近 12 次运行 = 8 failure + 3 cancelled、0 success;单次执行
#   556s(2 个 job),而 push 触发面覆盖 apps/web/src/**、apps/mobile-rn/** 等几乎每次
#   main 提交都会改到的目录 —— 即"每次都跑、大多数都红、无人看"的长杆。按本轮口径从
#   push / pull_request 触发面撤下,改为**每日一次定时 + 手动触发**;job、判据、报告产物
#   一行未删。
# 恢复方式:把下面 `on:` 整块换回原触发面 —— push 与 pull_request 两侧相同:
#   branches: [main, develop]
#   paths: 'packages/i18n/messages/**', 'apps/web/src/**', 'apps/miniapp-taro/src/**',
#          'apps/cli/src/**', 'apps/extension/**', 'apps/mobile-rn/**',
#          'packages/shared/src/chat/**', 'scripts/scan-dead-i18n-keys.mjs',
#          'scripts/_i18n-scan-helpers.mjs', 'scripts/i18n-contract-keys.json',
#          'scripts/tests/**', '.github/workflows/i18n-dead-key-audit.yml'
# 它不承载 required check(分支保护现读只有 `CI / lint-typecheck-test (push)`)。
on:
  schedule:
    # 每天 17:30 UTC = 北京时间次日 01:30(与 scripts-mirror 的 18:20 UTC 错开)
    - cron: '30 17 * * *'
  workflow_dispatch:

concurrency:
  group: i18n-dead-key-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  unit-tests:
    name: i18n 扫描器单测 + 集成测试
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # 2026-10-31:本 job 原为"零第三方依赖"直跑 node --test。但扫描器现经
      # scripts/lib/i18n-scan-targets.mjs → rn-carried-keys.mjs 静态 import `typescript`
      # (承载闭包单一真相源,与门 251 / 词包生成器同源)⇒ 不装依赖时 node --test 在加载期
      # 报 ERR_MODULE_NOT_FOUND 整份文件失败(run 41150575691)。装依赖是"多要一次",不是放宽判据。
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Setup Node
        id: setup-node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: 运行 i18n 扫描器单测 + 4 端集成测试
        id: run-tests
        # 6 个测试文件:
        #   - i18n-scan-helpers.test.mjs:正则单元测试(STATIC_T_RE / USE_T_RE / DYNAMIC_T_RE)
        #   - scan-web-dead-i18n-keys.test.mjs 等 4 份:各端 main() 端到端集成测试
        #   - scan-dead-i18n-keys.test.mjs:公共入口 main() 的**契约键声明**判据(依据按 HEAD 逐条
        #     核验、形状不合法/依据漂移/未知 target 一律 exit 1)—— 2026-09-24 补进清单:该文件
        #     此前只在本地跑,CI 不执行 ⇒ 免除口腐烂(依据漂移后仍判绿)无人知道,正是本仓
        #     "造好没装车"那一型;下面那行注释的计数也因此是假的,一并改成实测值。
        # 用 Node.js 内置 test runner,无第三方依赖
        run: |
          node --test \
            scripts/tests/i18n-scan-helpers.test.mjs \
            scripts/tests/scan-dead-i18n-keys.test.mjs \
            scripts/tests/scan-web-dead-i18n-keys.test.mjs \
            scripts/tests/scan-miniapp-taro-dead-i18n-keys.test.mjs \
            scripts/tests/scan-mobile-rn-dead-i18n-keys.test.mjs \
            scripts/tests/scan-extension-dead-i18n-keys.test.mjs

      # 失败分诊(公开 annotations):唯一实现 = scripts/ci-failure-triage.sh,本步骤只注入参数。
      # 立因与行为契约见该脚本头注;边界:只在 failure() 分支跑,不碰上面任何步骤的判据
      # 严格程度(无 continue-on-error、不删步骤、不扩 permissions、不新增 secret)。
      - name: Failure triage (public annotations)
        id: failure-triage
        if: failure()
        env:
          TRIAGE_WORKFLOW_FILE: .github/workflows/i18n-dead-key-audit.yml
          TRIAGE_IDS: checkout setup-node install run-tests
          O_CHECKOUT: ${{ steps.checkout.outcome }}
          O_SETUP_NODE: ${{ steps.setup-node.outcome }}
          O_INSTALL: ${{ steps.install.outcome }}
          O_RUN_TESTS: ${{ steps.run-tests.outcome }}
        run: bash scripts/ci-failure-triage.sh

  dead-key-audit:
    name: i18n 死 key 审计
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: unit-tests

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # 同 unit-tests job:扫描器静态依赖 typescript,不装依赖会 ERR_MODULE_NOT_FOUND。
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Setup Node
        id: setup-node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: 扫描死 key(失败即阻塞 PR;五端全扫,不再只跑 web)
        id: scan
        # 2026-10-31:改存量棘轮档(AGENTS §12e)。五端存量死键是历史债,绝对零容忍 = 恒红门;
        # 基线只拦新增,存量数字与出处见 scripts/data/i18n-dead-key-baseline.json。
        # 提交链(--staged)不传基线,仍是零容忍。
        run: node scripts/scan-dead-i18n-keys.mjs --target all --exit 1 --baseline scripts/data/i18n-dead-key-baseline.json

      - name: 上传死 key 审计报告
        id: upload-report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: i18n-dead-key-report
          path: .ihui-agent/tmp/i18n-dead-keys-*.md
          if-no-files-found: ignore

      # 失败分诊(公开 annotations):唯一实现 = scripts/ci-failure-triage.sh,本步骤只注入参数。
      # 立因:本 job 是唯一真判红的那一格,而分诊此前只挂在 unit-tests 上 ⇒ 它红了 runner 只留
      # 一行 "Process completed with exit code 1",失败命令原文进不了 annotations,只能靠人拿
      # check-runs API 考古(2026-10-17 实测走的就是这条弯路)。契约与边界同 ci.yml:只在
      # failure() 分支跑,不碰上面任何步骤的判据严格程度(无 continue-on-error、不删步骤、
      # 不扩 permissions、不新增 secret)。
      - name: Failure triage (public annotations)
        id: failure-triage
        if: failure()
        env:
          TRIAGE_WORKFLOW_FILE: .github/workflows/i18n-dead-key-audit.yml
          TRIAGE_IDS: checkout setup-node install scan upload-report
          O_CHECKOUT: ${{ steps.checkout.outcome }}
          O_SETUP_NODE: ${{ steps.setup-node.outcome }}
          O_INSTALL: ${{ steps.install.outcome }}
          O_SCAN: ${{ steps.scan.outcome }}
          O_UPLOAD_REPORT: ${{ steps.upload-report.outcome }}
        run: bash scripts/ci-failure-triage.sh
# ⁠​‌​​‌​​‌‍‍​‌​​‌​​​‍‍​‌​‌​‌​‌‍‍​‌​​‌​​‌‍‍​​‌​‌‌​‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌​​‌‌‌‌​‌​‍‍‌‌​‌‌​​​‌​​​‌‌‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌‌​‌​​‌‌‌​‍‍‌‌​​‌‌​​​‌​​‌​‌‍‍‌​‌‌‌​‌‌‌​‌‌‌​‌‍‍‌​‌‌​‌‌‌‍‍​‌​​‌‌​​‍‍​‌​​​​‌‌‍‍‌​‌‌​‌‌‌‍‍​‌‌​​​​‌‍‍​‌‌​‌​​‌‍‍​‌‌‌‌​‌​‍‍​‌‌​‌​​​‍‍​‌‌‌​​‌‌‍‍​​‌​‌‌‌​‍‍​‌‌‌​‌​​‍‍​‌‌​‌‌‌‌‍‍​‌‌‌​​​​‍‍‌​‌‌​‌‌‌‍‍​‌​‌​​​​‍‍​‌​‌​​‌​‍‍​‌​​‌‌‌‌‍‍​‌​‌​‌‌​‍‍​‌​​​‌​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​‌‌‍‍​‌​​​‌​‌‍‍​​‌​‌‌​‌‍‍​​‌‌​​‌​‍‍​​‌‌​​​​‍‍​​‌‌​​‌​‍‍​​‌‌​‌‌​⁠
