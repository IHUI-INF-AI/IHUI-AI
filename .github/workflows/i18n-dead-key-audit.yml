name: i18n Dead Key Audit

# =============================================================================
# i18n 死 key 审计 workflow(2026-07-26 立)
#
# 扫描 packages/i18n/messages/web/zh-CN.json 中已声明但代码中无任何
# t() / useTranslations() 引用的"死 key",防止 PR 引入新的死 key 增量。
# 脚本: scripts/scan-dead-i18n-keys.mjs
# 退出码:发现死 key → exit 1(blocking);无死 key → exit 0
# 报告:.ihui-agent/tmp/i18n-dead-keys-YYYY-MM-DD.md(无论成败均上传 artifact)
#
# 2026-07-26 增强:新增 unit-tests job 挂载 i18n 扫描器单测 + 4 端集成测试,
#   覆盖 _i18n-scan-helpers.mjs 的 STATIC_T_RE / USE_T_RE / DYNAMIC_T_RE 等正则
#   + main() 端到端入口,防止正则重构引入回归(如 commit 5ebb17915 漏识别 getTranslations)。
# =============================================================================

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/i18n/messages/**'
      - 'apps/web/src/**'
      - 'apps/miniapp-taro/src/**'
      - 'apps/cli/src/**'
      # 2026-09-24:本 job 改跑 --target all(五端全覆盖),触发路径必须覆盖被扫的目录,
      # 否则改了 extension/mobile-rn/shared 消费方时这道门根本不跑。
      - 'apps/extension/**'
      - 'apps/mobile-rn/**'
      - 'packages/shared/src/chat/**'
      - 'scripts/scan-dead-i18n-keys.mjs'
      - 'scripts/_i18n-scan-helpers.mjs'
      - 'scripts/tests/**'
      - '.github/workflows/i18n-dead-key-audit.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/i18n/messages/**'
      - 'apps/web/src/**'
      - 'apps/miniapp-taro/src/**'
      - 'apps/cli/src/**'
      # 2026-09-24:本 job 改跑 --target all(五端全覆盖),触发路径必须覆盖被扫的目录,
      # 否则改了 extension/mobile-rn/shared 消费方时这道门根本不跑。
      - 'apps/extension/**'
      - 'apps/mobile-rn/**'
      - 'packages/shared/src/chat/**'
      - 'scripts/scan-dead-i18n-keys.mjs'
      - 'scripts/_i18n-scan-helpers.mjs'
      - 'scripts/tests/**'
      - '.github/workflows/i18n-dead-key-audit.yml'

concurrency:
  group: i18n-dead-key-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  unit-tests:
    name: i18n 扫描器单测 + 集成测试
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 运行 i18n 扫描器单测 + 4 端集成测试
        # 6 个测试文件:
        #   - i18n-scan-helpers.test.mjs:正则单元测试(STATIC_T_RE / USE_T_RE / DYNAMIC_T_RE)
        #   - scan-web-dead-i18n-keys.test.mjs 等 4 份:各端 main() 端到端集成测试
        #   - scan-dead-i18n-keys.test.mjs:公共入口 main() 的**契约键声明**判据(依据按 HEAD 逐条
        #     核验、形状不合法/依据漂移/未知 target 一律 exit 1)—— 2026-09-24 补进清单:该文件
        #     此前只在本地跑,CI 不执行 ⇒ 免除口腐烂(依据漂移后仍判绿)无人知道,正是本仓
        #     "造好没装车"那一型;下面那行注释的计数也因此是假的,一并改成实测值。
        # 用 Node.js 内置 test runner,无第三方依赖
        run: |
          node --test \
            scripts/tests/i18n-scan-helpers.test.mjs \
            scripts/tests/scan-dead-i18n-keys.test.mjs \
            scripts/tests/scan-web-dead-i18n-keys.test.mjs \
            scripts/tests/scan-miniapp-taro-dead-i18n-keys.test.mjs \
            scripts/tests/scan-mobile-rn-dead-i18n-keys.test.mjs \
            scripts/tests/scan-extension-dead-i18n-keys.test.mjs

  dead-key-audit:
    name: i18n 死 key 审计
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: unit-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 扫描死 key(失败即阻塞 PR;五端全扫,不再只跑 web)
        run: node scripts/scan-dead-i18n-keys.mjs --target all --exit 1

      - name: 上传死 key 审计报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-dead-key-report
          path: .ihui-agent/tmp/i18n-dead-keys-*.md
          if-no-files-found: ignore
# ⁠​‌​​‌​​‌‍‍​‌​​‌​​​‍‍​‌​‌​‌​‌‍‍​‌​​‌​​‌‍‍​​‌​‌‌​‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌​​‌‌‌‌​‌​‍‍‌‌​‌‌​​​‌​​​‌‌‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌‌​‌​​‌‌‌​‍‍‌‌​​‌‌​​​‌​​‌​‌‍‍‌​‌‌‌​‌‌‌​‌‌‌​‌‍‍‌​‌‌​‌‌‌‍‍​‌​​‌‌​​‍‍​‌​​​​‌‌‍‍‌​‌‌​‌‌‌‍‍​‌‌​​​​‌‍‍​‌‌​‌​​‌‍‍​‌‌‌‌​‌​‍‍​‌‌​‌​​​‍‍​‌‌‌​​‌‌‍‍​​‌​‌‌‌​‍‍​‌‌‌​‌​​‍‍​‌‌​‌‌‌‌‍‍​‌‌‌​​​​‍‍‌​‌‌​‌‌‌‍‍​‌​‌​​​​‍‍​‌​‌​​‌​‍‍​‌​​‌‌‌‌‍‍​‌​‌​‌‌​‍‍​‌​​​‌​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​‌‌‍‍​‌​​​‌​‌‍‍​​‌​‌‌​‌‍‍​​‌‌​​‌​‍‍​​‌‌​​​​‍‍​​‌‌​​‌​‍‍​​‌‌​‌‌​⁠
