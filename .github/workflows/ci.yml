name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Security: least-privilege GITHUB_TOKEN (CWE-250). Third-party actions use @v tags — pin to commit SHA for stricter supply-chain security.
permissions:
  contents: read

jobs:
  # ============================================================================
  # 桌面端安装器回归守门(独立 job,2026-09-18 立;同日二次加固:从 lint-typecheck-test
  # **搬出来独立成 job**)。
  #
  # ## 为什么必须独立成一个 job
  # GitHub 的 job 内一旦某步失败,**后续步骤全部 skipped**。原先这两步排在
  # `lint-typecheck-test` 的第 15~17 位(在 pnpm install / 3 个包构建 / typecheck /
  # schema drift / migration bookkeeping / api routes / port registry **之后**),
  # 任何一处无关失败都会让安装器守门**根本不执行、连结论都没有**。
  # 2026-09-18 实证:`Lint` 步骤就是这样被前面的红挡了整整 6 个 run(skipped),直到
  # 守门修好才第一次真正跑起来 —— 而历史事故 0.1.35 正是"错误被 CI 静默吞掉,
  # 直到用户装上才发现(记为无任何 Windows 资产)"。
  # 所以「向导语言 + 默认安装目录」的守门必须**永不被其他步骤掩蔽**,独立 job 才有独立结论。
  #
  # ## 为什么可以不装依赖
  # 下面两步只用仓库里的文件(JSON + NSIS 文本 + node:test),不需要 node_modules,
  # 秒级完成。上游模板漂移比对需要 @tauri-apps/cli,故**不在此处**,见下方
  # `lint-typecheck-test` 里 install 之后的 drift 步骤;其真正的强制点是
  # release-desktop.yml / desktop-build.yml 的 **Windows leg** + 本机 pre-commit(id 51)。
  # ============================================================================
  desktop-installer-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ① 静态不变量:tauri.conf.json 配置(A2~A6)+ installer.nsi 定制块(B1~B7)
      #    + hooks.nsi 职责边界(C1)。纯文件内容判定,任意平台都必须通过。
      - name: Desktop installer guard — invariants (config + template block + hooks)
        run: node scripts/check-desktop-install-dir.mjs

      # ② 守门的守门:对抗性自测 —— 逐条注入真实回退场景,断言守门**确实拦得住**
      #    且命中预期断言 id;另含平台门 4 例。守门被改弱 = 防线归零,所以它也要被钉住。
      - name: Desktop installer guard — adversarial self test
        run: node --test scripts/tests/check-desktop-install-dir.test.mjs

  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版权溯源水印守护: 任何删除水印的 PR 将导致 CI 失败
      - name: Provenance watermark check
        run: node scripts/watermark.mjs verify

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 桌面端安装器守门 · 上游漂移组(与 Tauri CLI 内置模板逐字节比对)。
      # 紧跟 install:本步需要能定位 @tauri-apps/cli,前置步骤越少越不容易被无关失败挡掉。
      # ⚠️ NSIS 模板只内嵌在 **Windows** 版 Tauri CLI 二进制里,本 job 是 ubuntu-latest,
      #    故该子项由脚本**显式打印跳过原因**后放行(非静默跳过,已由平台门测试钉住);
      #    真正强制漂移校验的是 release-desktop.yml / desktop-build.yml 的 Windows leg。
      - name: Desktop installer guard — upstream template drift vs Tauri CLI
        run: node scripts/check-desktop-install-dir.mjs --template --require-cli

      - name: Build database package
        run: pnpm --filter @ihui/database build

      - name: Build auth package
        run: pnpm --filter @ihui/auth build

      - name: Build api-client package
        run: pnpm --filter @ihui/api-client build

      # WXT 生成 apps/extension/.wxt/tsconfig.json(extension 的 tsconfig 继承它)。
      # 缺此步 -> TS5083 读不到文件, 连带 200+ 个路径解析/自动导入错误(2026-09-10 实测)。
      # 本地由 apps/extension 的 postinstall 兜底, CI 显式前置保证确定性。
      - name: Prepare WXT types (extension)
        run: pnpm --filter @ihui/extension exec wxt prepare

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Schema drift check
        run: node scripts/check-db-schema-drift.mjs

      # 迁移记账守门(2026-09-13 立):journal ↔ .sql 一一对应、when 严格单调唯一。
      # 背景: journal 的 when 曾是合成时间戳 < 库内真实 created_at → drizzle-kit migrate
      # 恒空转,静默数周无守门。CI 只跑离线维度(无 DB);库内双射用 pnpm migration:check:db。
      - name: Migration bookkeeping check
        run: node scripts/check-migration-bookkeeping.mjs

      - name: API route consistency check
        run: node scripts/check-api-routes.mjs

      - name: Port registry check
        run: node scripts/check-port-registry.mjs

      # 桌面端安装器守门不在此处:源码不变量 + 对抗自测已独立成 job `desktop-installer-guard`,
      # 上游漂移比对已上移到本 job 的 install 之后 —— 目的都是让它**不被无关失败掩蔽**
      # (job 内前面任一步失败,后面全部 skipped,守门会连结论都不产生)。
      - name: Lint
        run: pnpm turbo run lint

      - name: Test
        run: pnpm turbo run test

      - name: Build
        # desktop(tauri) 构建极重且发布由专门工作流负责,CI 仅验证其余包可构建;
        # 连续两轮 desktop build 阶段遭 runner shutdown(cancel)。
        run: pnpm turbo run build --filter=!@ihui/desktop

  python-ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]" || echo "依赖安装失败(可能缺少可选依赖,跳过)"
        continue-on-error: true

      - name: Syntax check
        run: |
          python -c "import ast, os; files=[os.path.join(d,f) for d,_,fs in os.walk('app') for f in fs if f.endswith('.py')]; [ast.parse(open(fp,encoding='utf-8').read()) for fp in files]; print(f'{len(files)} files OK')"

  ai-service-schema-check:
    runs-on: ubuntu-latest

    services:
      postgres:
        # 2026-09-10 修复:postgres:17 不含 pgvector,迁移 0123(embedding) 到
        # vector(1536) 列时抛 `type "vector" does not exist` 并回滚整个 DDL 事务
        # → 全库无表 → schema_check 大面积报"表不存在"。与 test-real-db.yml 对齐,
        # 统一用官方 pgvector 镜像(内置扩展文件,仍需 CREATE EXTENSION,见下方 step)。
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ihui_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ihui_test

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build database package
        run: pnpm --filter @ihui/database build

      - name: Build api-client package
        run: pnpm --filter @ihui/api-client build

      # 2026-09-10 根因修复:pgvector 镜像只是把扩展文件放进镜像,每个 database 仍需
      # 显式 CREATE EXTENSION;缺这步 → 迁移到 vector 列必抛 type "vector" does not exist。
      - name: Enable pgvector extension
        working-directory: packages/database
        run: |
          node --input-type=module -e "
            import postgres from 'postgres';
            const sql = postgres(process.env.DATABASE_URL);
            await sql.unsafe('CREATE EXTENSION IF NOT EXISTS vector');
            await sql.end();
            console.log('pgvector extension enabled');
          "

      # 2026-09-10 根因修复:原 `drizzle-kit push --force` 只按 schema 现状建表,不执行
      # packages/database/drizzle/*.sql 迁移(仓库有 250+ 个),导致 agent_ab_tests /
      # agent_memory_* / publish_accounts 等"TS schema 有定义"的表在 DB 里不存在,
      # schema_check 恒红。改用与 e2e.yml / Dockerfile.migrate 一致的权威迁移路径。
      - name: Apply migrations to test DB
        working-directory: packages/database
        run: npx drizzle-kit migrate

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install ai-service dependencies
        working-directory: apps/ai-service
        run: uv pip install --system -e ".[dev]"

      - name: Create ai-service runtime tables (ensure_table)
        working-directory: apps/ai-service
        # media_tasks 由 ai-service 启动时幂等自建(ensure_table),不在 drizzle 迁移内;
        # CI 校验前先按生产同等路径建表,否则 schema_check 恒报 exists=False(2026-09-10)。
        # 2026-09-15 补:publish 指标/风格检查表同为运行时懒建表(_ensure_metrics_table /
        # _ensure_style_check_table),与 media_tasks 同模式,否则 schema_check 恒红。
        run: |
          python -c "
          import asyncio
          from app.services.media_tasks import ensure_table
          asyncio.run(ensure_table())
          from app.services.publish.metrics_collector import (
              _ensure_metrics_table,
              _ensure_style_check_table,
          )
          asyncio.run(_ensure_metrics_table())
          asyncio.run(_ensure_style_check_table())
          "

      - name: Run ai-service schema_check against test DB
        working-directory: apps/ai-service
        run: |
          python -m app.core.schema_check
          # 退出码 0 = 所有表存在且关键字段齐全;1 = 有表不存在或关键字段缺失
          exit $?

# ⁠​‌​​‌​​‌‍‍​‌​​‌​​​‍‍​‌​‌​‌​‌‍‍​‌​​‌​​‌‍‍​​‌​‌‌​‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌​​‌‌‌‌​‌​‍‍‌‌​‌‌​​​‌​​​‌‌‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌‌​‌​​‌‌‌​‍‍‌‌​​‌‌​​​‌​​‌​‌‍‍‌​‌‌‌​‌‌‌​‌‌‌​‌‍‍‌​‌‌​‌‌‌‍‍​‌​​‌‌​​‍‍​‌​​​​‌‌‍‍‌​‌‌​‌‌‌‍‍​‌‌​​​​‌‍‍​‌‌​‌​​‌‍‍​‌‌‌‌​‌​‍‍​‌‌​‌​​​‍‍​‌‌‌​​‌‌‍‍​​‌​‌‌‌​‍‍​‌‌‌​‌​​‍‍​‌‌​‌‌‌‌‍‍​‌‌‌​​​​‍‍‌​‌‌​‌‌‌‍‍​‌​‌​​​​‍‍​‌​‌​​‌​‍‍​‌​​‌‌‌‌‍‍​‌​‌​‌‌​‍‍​‌​​​‌​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​‌‌‍‍​‌​​​‌​‌‍‍​​‌​‌‌​‌‍‍​​‌‌​​‌​‍‍​​‌‌​​​​‍‍​​‌‌​​‌​‍‍​​‌‌​‌‌​⁠
