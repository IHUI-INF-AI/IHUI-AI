name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Security: least-privilege GITHUB_TOKEN (CWE-250). Third-party actions use @v tags — pin to commit SHA for stricter supply-chain security.
permissions:
  contents: read

# 陈旧 run 收敛(2026-11-03)。判据(现读 GitHub 文档 + 分支保护):
#   required status check 必须在成功 / skipped / neutral 才能让分支合并 ⇒ **cancelled 不满足**。
# 2026-11-03 实测推翻"main 用 false 就安全":GitHub 原生语义是"新的 pending 会取消同组里
#   更早的 pending",与 cancel-in-progress 无关。run 41576145991(37147a74)与 41579145214
#   (e869f63f)两枚 main 提交都是这么被判 cancelled 的 —— 那正是 required check "未满足"的形态。
#   故 main 档把 group 换成 run 级唯一值(= 不分组:互不排队、互不取消,恢复并行出结论),
#   非 main 档保留按 ref 分组 + 取消,专门收敛陈旧 PR run。
concurrency:
  group: "ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # 前置检查拆成独立 job(2026-11-02 立)。立因:watermark / conflict-markers 原是本 job 步骤链的
  # 头两步,而 GitHub 的步骤链 fail-fast —— 这两条一红,后面的 install / typecheck / lint / test
  # 全部**从未执行**,required check 的结论里只剩"水印"一条(本轮 lint 修复长期只有本地证据,正是此型)。
  # 拆出后三条结论互不掩盖:本 job 名 `lint-typecheck-test` 逐字未变 ⇒ required context
  # `CI / lint-typecheck-test (push)` 不变,仓库分支保护设置无需改动。
  # 两个 preflight 不设 needs(与主 job 并行),主 job 也不 needs 它们 —— 前置检查"先跑"但不阻塞。
  # 各只有一条 run 步骤且不设 id:,刻意不装失败自述(TRIAGE_IDS 只认具名 id 的步骤,
  # 见 scripts/check-ci-failure-triage-wiring.mjs W4:无 id 步骤只报数)。
  preflight-watermark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # 版权溯源水印守护: 任何删除水印的 PR 将导致 CI 失败
      - name: Provenance watermark check
        run: node scripts/watermark.mjs verify

  preflight-conflict-markers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # 守门 77 的远端面(2026-09-23 接):本地 pre-commit 拦得住"成对 <<<<====>>>> 冲突标记入树",
      # 但本机 .git 被宿主清除那类场面多个会话用 --no-verify 提交,整条本地钩子链失效
      # (实测 apps/cli/tests/file-edit.test.ts 带标记进 HEAD 树)。CI 是唯一的第二道防线。
      # 必须用 --rev HEAD(判刚被 push/合并出来的提交树);**禁止**改成 --staged —— CI 没有
      # 暂存区,索引恒等于 HEAD,那会退化成永远判绿。零依赖(纯 node + git)。
      - name: Conflict marker check (committed tree)
        run: node scripts/check-no-conflict-markers.mjs --rev HEAD

  # 2026-11-03(CI 提速):原单 job 串行链(install → 建依赖 → wxt → Build → typecheck →
  # schema/migration/routes/ports/version → lint → test)实测 2543s,其中 Test 925s、
  # Build 442s、Typecheck 188s、Lint 121s —— 它们是**互相独立**的结论,串行只是历史顺序。
  # 现在拆成三个并行 job(gate-build / gate-analyse / gate-test×4),再由本文件末尾那个
  # 名为 `lint-typecheck-test` 的聚合器统一收口。
  # required context `CI / lint-typecheck-test (push)` 的 job key 逐字保留在聚合器上;
  # 聚合器 `if: always()` + 逐项断言 `needs.*.result == 'success'`,**非 success 一律红**
  # (含 failure / cancelled / skipped —— 若只写 needs 不带断言,GitHub 会把 skipped 当成
  # 满足保护,那才是真洞:见 scripts/check-ci-failure-triage-wiring.mjs 同族的"绿而无结论"型)。
  gate-analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        id: checkout

      - name: Install pnpm
        id: install-pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: 'pnpm'

      # ═════════════════ 构建真值门(2026-09-24 立)═════════════════
      # 立因:origin/main 一天内两次携带"本地全绿、生产构建必炸"的缺陷,而 typecheck / lint /
      # 单测 / 约 110 道本地守门全部判绿,部署环停摆 1.5h+。这两枚缺陷只有下面这些步骤能抓:
      #   缺陷 1 = @ihui/shared 的 barrel 写了 `export * from './不存在的模块'`
      #   缺陷 2 = apps/web/package.json 与 pnpm-lock.yaml 的 importer specifier 不一致
      # 排序原则:先证明"依赖是真的",再证明"包能被编译器读通",再"真跑一次构建并核验产物";
      # 分析类门(typecheck / lint / test)一律排在其后 —— 原顺序里 Build 是全 job 最后一步,
      # 前面任一步变红或被 runner cancel(见下方 Build 注释:连续两轮遭 runner shutdown),
      # 等价于"这一次 CI 根本没有产出构建结论",而这一类缺陷恰好只在构建时显形。
      # 本门一律不使用 continue-on-error / `|| true`(一条吞掉退出码的步骤等于没有该步骤)。
      # ══════════════════════════════════════════════════════════════
      # 缺陷 2 的门:`xlsx: ^0.18.5` vs 锁里 `npm:@e965/xlsx@^0.20.3` 这类 specifier 漂移时,
      # pnpm **静默跳过**该包的链接步骤(不报错、不改锁),本地 node_modules 早就装好了所以全绿,
      # 直到 bundler 报 Module not found。--frozen-lockfile 是唯一会在此处非零退出的写法。
      # **禁止**改成裸 `pnpm install` 或加 --no-frozen-lockfile —— 那等于把这道门删掉;
      # 也**禁止**挪到任何 build 步骤之后。
      - name: Install dependencies (frozen lockfile = dependency truth)
        id: install
        run: pnpm install --frozen-lockfile

      # Shared typecheck 的前置构建(2026-09-25 补,修"每次推送连红";2026-09-27 换成拓扑闭包):
      # @ihui/shared 的 token-store/render-model/use-agent-runtime/budget-note import '@ihui/api-client',
      # 而该包 main/types/exports 全部指向 ./dist/*(产物不入库)—— CI 的 pnpm install
      # 从不构建 workspace 包 ⇒ 缺这步必红 14× TS2307 + 连带 7× TS7006(类型推不出,非独立缺陷)。
      # 2026-09-27 第二次同型:今天新加的 src/ui/back-chevron-spec.ts / navbar-spec.ts /
      # src/design/design-templates.ts 开始 import '@ihui/design-tokens'(它的 exports 也指 dist),
      # 于是这一步**建了 api-client 却仍红** —— 手工点名"要先建哪几个包"必然落后于新增。
      # 正解既有先例:test-real-db.yml:71 用 `^...`(该包全部 workspace 依赖的拓扑闭包,不含本包),
      # 选择器由 pnpm 从包图算 ⇒ 以后 shared 再吃一个新包不用再改本文件。
      # 本仓已有 7+ 个包 exports 指 dist(cli/i18n/design-tokens/types/dom-actions/api-client/
      # context-compaction),"落后一次的形态是 CI 恒红而本地全绿"(守门 72/78 同族)。
      - name: Build shared's workspace deps (topological closure, prerequisite of shared typecheck)
        id: build-shared-deps
        run: pnpm --filter "@ihui/shared^..." run build

      # 缺陷 1 的门:@ihui/shared 的 exports["."] 直指 src/index.ts,而 index.ts:19 再
      # `export * from './chat'`,apps/web 有 25 个文件 import 根 barrel(2026-09-24 实测计数)。
      # 为什么必须单独跑这一步:悬空 re-export 在 TS 侧是 TS2307,而 apps/web/next.config.ts:63
      # 设了 typescript.ignoreBuildErrors = true —— web 构建**主动放弃**了这类错误(多 agent
      # 并行期的既有权衡),于是 web 侧只剩 bundler 的 Module not found 会炸;而 @ihui/shared
      # 自己那套 tsc 没有这个开关,把它当**自己的**编译单元跑一次就必红。两道门各管一种形态。
      # 实测取证(2026-09-24):本命令在当前 HEAD exit 0、约 2s,--listFiles 证明其程序含
      # packages/shared/src/chat/index.ts(即缺陷载体)等 183 个源文件;把历史那行
      # `export * from './voice-note'` 注进同一文件即报
      # `error TS2307: Cannot find module './voice-note'`(exit≠0),撤掉即回绿。
      - name: Shared package typecheck (dangling `export *` gate)
        id: shared-typecheck
        run: pnpm --filter @ihui/shared typecheck

      - name: Build database package
        id: build-database
        run: pnpm --filter @ihui/database build

      - name: Build auth package
        id: build-auth
        run: pnpm --filter @ihui/auth build

      - name: Build api-client package
        id: build-api-client
        # 尾缀 `...` 连 workspace 依赖一起拓扑构建(同 openapi-check.yml:77 既有正解);
        # 不带 `...` 时若上游包(如 @ihui/types)未来产物化入口切到 dist,本步会静默踩坑。
        run: pnpm --filter "@ihui/api-client..." run build

      # extension 的 `wxt prepare` 经 vite 解析它**全部** workspace 入口,而上面那条
      # `@ihui/api-client...` 闭包不含 @ihui/i18n / @ihui/ui-react / @ihui/browser-platform 等
      # extension 直连依赖 ⇒ 干净检出上必然 `Failed to resolve entry for package "@ihui/i18n"`
      # (2026-10-31 实测 run 41150575693 / 41150575738 同一行)。`@ihui/extension^...` = 它的
      # workspace 依赖闭包(不含自身),与 Dockerfile.web:73 的 `@ihui/web^...` 同一写法。
      - name: Build extension workspace deps (wxt prepare 的解析面)
        id: build-ext-deps
        run: pnpm --filter "@ihui/extension^..." run build

      # WXT 生成 apps/extension/.wxt/tsconfig.json(extension 的 tsconfig 继承它)。
      # 缺此步 -> TS5083 读不到文件, 连带 200+ 个路径解析/自动导入错误(2026-09-10 实测)。
      # 本地兜底腿(2026-10-30 改):`pnpm --filter @ihui/extension typecheck` 自带 `wxt prepare`,
      # 而 `wxt dev` / `wxt build` 经 rebuild.mjs 的 generateWxtDir 自动补类型;install 期不再跑
      # prepare —— 那时 workspace 包的 dist 还没构建,干净检出上必然解析失败(见 ci-monorepo.yml 同条注记)。
      # CI 显式前置保证确定性。
      - name: Prepare WXT types (extension)
        id: wxt-prepare
        run: pnpm --filter @ihui/extension exec wxt prepare

      # Build + 产物断言已迁到独立 job `gate-build`(2026-11-03,CI 提速)。原注释保留下来,
      # 因为它记录的立因("只有真跑一次构建才会暴露")对 gate-build 同样成立:
      # ↓↓↓ Build 原是本 job 的**最后**一步……(略,见 gate-build 处的完整说明)
      # 迁移的是执行位置(并行 job),不是判据:三条断言一条未删,失败时仍各自阻塞聚合器。

      - name: Typecheck
        id: typecheck
        run: pnpm turbo run typecheck

      - name: Schema drift check
        id: schema-drift
        run: node scripts/check-db-schema-drift.mjs

      # 迁移记账守门(2026-09-13 立):journal ↔ .sql 一一对应、when 严格单调唯一。
      # 背景: journal 的 when 曾是合成时间戳 < 库内真实 created_at → drizzle-kit migrate
      # 恒空转,静默数周无守门。CI 只跑离线维度(无 DB);库内双射用 pnpm migration:check:db。
      - name: Migration bookkeeping check
        id: migration-bookkeeping
        run: node scripts/check-migration-bookkeeping.mjs

      - name: API route consistency check
        id: api-routes
        run: node scripts/check-api-routes.mjs

      - name: Port registry check
        id: port-registry
        run: node scripts/check-port-registry.mjs

      # 版本号漂移守门(2026-10-17 接)。
      # 立这道门的直接原因:桌面下载页与更新器 feed 曾**静默**停在 0.1.54 四天 ——
      # 自动刷新机制每天在跑、每天被 protected main 拒(GH006),产出的却只是一条没人看的
      # failure;同一时期安卓侧是三处版本号互相矛盾、Capacitor 壳写死 "1.0" 从不跟真实版本走。
      # 判据不是"版本号是多少",而是"每个对外可见的版本号都能追溯到某个源头":
      # 桌面双写一致 / RN 原生与界面同源 / Capacitor 不写死 / 下载页无假号 /
      # 更新器 feed 走运行期解析 / 不得再有 bot 裸 push 到 main。
      - name: Version drift check (每个可见版本号都必须可追溯)
        id: version-drift
        run: node scripts/check-version-drift.mjs

      - name: Lint
        id: lint
        run: pnpm turbo run lint

      # ═════════════════ 失败分诊(公开 annotations) ═════════════════
      # 唯一实现 = scripts/ci-failure-triage.sh(脚本头注即行为契约);本步骤只注入参数。
      # 硬边界不变:只在 failure() 分支跑,不改上面任何步骤的严格程度。
      # 分诊的"第一个红步骤 + 该步骤单独重跑输出"按本 job 的步骤集合注入 —— 拆 job 后
      # 每个 job 各自有一条,否则 triage 会去重跑不在本 job 里的命令(那是在说另一条命令)。
      - name: Failure triage (public annotations)
        id: failure-triage
        if: failure()
        env:
          TRIAGE_WORKFLOW_FILE: .github/workflows/ci.yml
          TRIAGE_IDS: checkout install-pnpm setup-node install build-shared-deps shared-typecheck build-database build-auth build-api-client build-ext-deps wxt-prepare typecheck schema-drift migration-bookkeeping api-routes port-registry version-drift lint
          O_CHECKOUT: ${{ steps.checkout.outcome }}
          O_INSTALL_PNPM: ${{ steps.install-pnpm.outcome }}
          O_SETUP_NODE: ${{ steps.setup-node.outcome }}
          O_INSTALL: ${{ steps.install.outcome }}
          O_BUILD_SHARED_DEPS: ${{ steps.build-shared-deps.outcome }}
          O_SHARED_TYPECHECK: ${{ steps.shared-typecheck.outcome }}
          O_BUILD_DATABASE: ${{ steps.build-database.outcome }}
          O_BUILD_AUTH: ${{ steps.build-auth.outcome }}
          O_BUILD_API_CLIENT: ${{ steps.build-api-client.outcome }}
          O_BUILD_EXT_DEPS: ${{ steps.build-ext-deps.outcome }}
          O_WXT_PREPARE: ${{ steps.wxt-prepare.outcome }}
          O_TYPECHECK: ${{ steps.typecheck.outcome }}
          O_SCHEMA_DRIFT: ${{ steps.schema-drift.outcome }}
          O_MIGRATION_BOOKKEEPING: ${{ steps.migration-bookkeeping.outcome }}
          O_API_ROUTES: ${{ steps.api-routes.outcome }}
          O_PORT_REGISTRY: ${{ steps.port-registry.outcome }}
          O_VERSION_DRIFT: ${{ steps.version-drift.outcome }}
          O_LINT: ${{ steps.lint.outcome }}
        run: bash scripts/ci-failure-triage.sh

  # ═════════════════ 构建真值门(2026-09-24 立;2026-11-03 拆成独立并行 job)═════════════════
  # 立因:origin/main 一天内两次携带"本地全绿、生产构建必炸"的缺陷,而 typecheck / lint /
  # 单测 / 约 110 道本地守门全部判绿,部署环停摆 1.5h+。这两枚缺陷只有下面这些步骤能抓:
  #   缺陷 1 = @ihui/shared 的 barrel 写了 `export * from './不存在的模块'`
  #   缺陷 2 = apps/web/package.json 与 pnpm-lock.yaml 的 importer specifier 不一致
  # 2026-11-03:本门从 gate-analyse 里拆出来**并行**跑(原串行 442s 与 typecheck/lint/test 相加
  # 才是 job 墙钟;并行后各自贡献 max 而不是 sum)。三条断言一条未删、命令逐字未变:
  #   本门一律不使用 continue-on-error / `|| true`(一条吞掉退出码的步骤等于没有该步骤)。
  gate-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        id: checkout

      - name: Install pnpm
        id: install-pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: 'pnpm'

      # 缺陷 2 的门:`xlsx: ^0.18.5` vs 锁里 `npm:@e965/xlsx@^0.20.3` 这类 specifier 漂移时,
      # pnpm **静默跳过**该包的链接步骤(不报错、不改锁),本地 node_modules 早就装好了所以全绿,
      # 直到 bundler 报 Module not found。--frozen-lockfile 是唯一会在此处非零退出的写法。
      # **禁止**改成裸 `pnpm install` 或加 --no-frozen-lockfile —— 那等于把这道门删掉。
      - name: Install dependencies (frozen lockfile = dependency truth)
        id: install
        run: pnpm install --frozen-lockfile

      # 前置断言:turbo 的 --filter 对"该包没有这个 script"是**静默跳过**(实测 2026-09-24
      # `turbo run build --filter=@ihui/tsconfig` → "Tasks: 0 successful, 0 total" 且 exit 0)。
      # 也就是有人把 apps/web 的 build 脚本改名或删掉,turbo 照样全绿而 web 端从未被构建。
      - name: Assert web declares a build script
        id: assert-web-build-script
        run: node -e "const p=require('./apps/web/package.json'); if(!p.scripts||!p.scripts.build){console.error('apps/web 缺 build 脚本 -> turbo run build 会静默跳过,web 端本次从未被构建验证');process.exit(1)} console.log('web build =',p.scripts.build)"

      - name: Build
        id: build
        # desktop(tauri) 构建极重且发布由专门工作流负责,CI 仅验证其余包可构建;
        # 连续两轮 desktop build 阶段遭 runner shutdown(cancel)。
        # 禁止加 continue-on-error / `|| true`:这一步是"生产构建能不能过"的唯一真值来源。
        run: pnpm turbo run build --filter=!@ihui/desktop

      # 后置断言:"这一步报绿"与"web 端真的产出了产物"是两件事。.next/BUILD_ID 由 next build
      # 独占生成(turbo 会把 .next/** 作为 outputs 一并回缓存),它不在位就说明本次根本没有
      # 构建过 web —— 宁可在这里红,也不让"形同虚设的构建步骤"继续给人假绿。
      - name: Assert web build artifact exists
        id: assert-web-artifact
        run: node -e "const fs=require('fs');const f='apps/web/.next/BUILD_ID';if(!fs.existsSync(f)){console.error('Build 步报绿但没有 '+f+' -> web 端本次未被真正构建,该步骤形同虚设');process.exit(1)}console.log('web BUILD_ID =',fs.readFileSync(f,'utf8').trim())"

      # 后置断言(2026-10-16 立,事故 3299ba4978b 的防回潮闸):构建产物 sw.js 必须已被
      # stamp-sw-version.mjs 注入部署版本号。若这里还是占位符,说明 prebuild 链条没跑或被绕过
      # ⇒ sw.js 在两次部署间字节相同 ⇒ 浏览器判定 SW 无更新 ⇒ 老客户端(桌面端 WebView2
      # 持久化 profile 尤甚)永远拿不到新版本 —— 10-13~10-16 的全站级事故就是这一型。
      - name: Assert sw.js build id stamped (SW update reachability gate)
        id: assert-sw-stamped
        run: node -e "const fs=require('fs');const f='apps/web/public/sw.js';const s=fs.readFileSync(f,'utf8');const m=/const SW_BUILD_ID = '([^']*)'/.exec(s);if(!m){console.error('sw.js 缺 SW_BUILD_ID 声明 -> 版本注入机制被破坏');process.exit(1)}if(m[1]==='SW_BUILD_ID_PLACEHOLDER'){console.error('构建后 sw.js 仍是占位符 -> prebuild 未跑 stamp-sw-version.mjs,SW 永不更新');process.exit(1)}console.log('sw.js SW_BUILD_ID =',m[1])"

      - name: Failure triage (public annotations)
        id: failure-triage
        if: failure()
        env:
          TRIAGE_WORKFLOW_FILE: .github/workflows/ci.yml
          TRIAGE_IDS: checkout install-pnpm setup-node install assert-web-build-script build assert-web-artifact assert-sw-stamped
          O_CHECKOUT: ${{ steps.checkout.outcome }}
          O_INSTALL_PNPM: ${{ steps.install-pnpm.outcome }}
          O_SETUP_NODE: ${{ steps.setup-node.outcome }}
          O_INSTALL: ${{ steps.install.outcome }}
          O_ASSERT_WEB_BUILD_SCRIPT: ${{ steps.assert-web-build-script.outcome }}
          O_BUILD: ${{ steps.build.outcome }}
          O_ASSERT_WEB_ARTIFACT: ${{ steps.assert-web-artifact.outcome }}
          O_ASSERT_SW_STAMPED: ${{ steps.assert-sw-stamped.outcome }}
        run: bash scripts/ci-failure-triage.sh

  # ═════════════════ 测试分片(2026-11-03 立)═════════════════
  # 立因:Test 步单 job 实测 925s(run 41539163237),是全 job 最长的一段。分片口径**不手抄**
  # 包清单:scripts/ci-test-shards.mjs 从 workspace 的 package.json 现读"声明了 scripts.test 的包",
  # 用测试文件数做权重装箱;`@ihui/api` / `@ihui/web` 各摊 2 片(vitest --shard 按文件切,用例集合
  # 不变)。每片先跑 `--assert`:任何包没被覆盖、或被覆盖两次,这一步直接红 ——
  # 否则新增包会**静默不被测试**而 CI 仍绿,那是删门而不是并行。
  # 并发仍按 2026-10-05 的结论压在 2(4 核上 10 包并发会互相饿死,见原 Test 步注释);
  # 分片把"包之间"的并行度交给 runner,而不是靠单机超配。
  gate-test:
    runs-on: ubuntu-latest
    # 分片号走 job 级 env 而不是在 `run:` 里直接写 `${{ matrix.shard }}`:
    # 失败分诊(scripts/ci-failure-triage.sh)会把失败步骤的 `run:` 原样重跑一遍,
    # 而它拿不到 GitHub 的表达式展开 —— 实测 run 41567631871 的 shard 3 分诊因此报
    # `bash: line 1: ${{ matrix.shard }}/4: bad substitution`(真失败点被挡在后面)。
    # 用 env 后,重跑的面与原步骤逐字相同且能被 bash 展开。
    env:
      SHARD_INDEX: ${{ matrix.shard }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        id: checkout

      - name: Install pnpm
        id: install-pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies (frozen lockfile = dependency truth)
        id: install
        run: pnpm install --frozen-lockfile

      - name: Assert test shard plan coverage (每个测试包恰好一次)
        id: test-shard-coverage
        run: node scripts/ci-test-shards.mjs --assert

      - name: Test (shard ${{ matrix.shard }}/4)
        id: test
        run: node scripts/ci-test-shards.mjs --shard "$SHARD_INDEX/4"

      - name: Failure triage (public annotations)
        id: failure-triage
        if: failure()
        env:
          TRIAGE_WORKFLOW_FILE: .github/workflows/ci.yml
          TRIAGE_IDS: checkout install-pnpm setup-node install test-shard-coverage test
          O_CHECKOUT: ${{ steps.checkout.outcome }}
          O_INSTALL_PNPM: ${{ steps.install-pnpm.outcome }}
          O_SETUP_NODE: ${{ steps.setup-node.outcome }}
          O_INSTALL: ${{ steps.install.outcome }}
          O_TEST_SHARD_COVERAGE: ${{ steps.test-shard-coverage.outcome }}
          O_TEST: ${{ steps.test.outcome }}
        run: bash scripts/ci-failure-triage.sh

  # ═════════════════ required check 聚合器(2026-11-03 立;job key 必须逐字保持)═════════════════
  # 分支保护现读只认 `CI / lint-typecheck-test (push)`,所以这个 job key **一个字都不能改**。
  # 它自身不跑任何门禁,只做一件事:把三个并行 gate 的结论收成一个 required 结论。
  # 为什么不用"只有 needs"的写法:GitHub 对 needs 失败/跳过的 job,check 结论是 failure/skipped,
  # 而 **skipped 算满足分支保护** —— 那会让"上游被跳过"伪装成绿。故用 `if: always()` +
  # 逐项断言 `result == 'success'`;failure / cancelled / skipped 三种都显式变红。
  lint-typecheck-test:
    needs: [gate-build, gate-analyse, gate-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        id: checkout

      - name: Assert every upstream gate succeeded
        id: assert-all-gates
        env:
          R_BUILD: ${{ needs.gate-build.result }}
          R_ANALYSE: ${{ needs.gate-analyse.result }}
          R_TEST: ${{ needs.gate-test.result }}
        run: |
          node -e "
          const results = { 'gate-build': process.env.R_BUILD, 'gate-analyse': process.env.R_ANALYSE, 'gate-test': process.env.R_TEST };
          const bad = Object.entries(results).filter(([, v]) => v !== 'success');
          console.log('upstream results = ' + JSON.stringify(results));
          if (bad.length > 0) {
            console.error('::error::门禁未成功: ' + bad.map(([k, v]) => k + '=' + v).join(', ') + ' —— required check 不得以非 success 结案(failure/cancelled/skipped 一律红)');
            process.exit(1);
          }
          console.log('all upstream gates succeeded');
          "

      - name: Failure triage (public annotations)
        id: failure-triage
        if: failure()
        env:
          TRIAGE_WORKFLOW_FILE: .github/workflows/ci.yml
          TRIAGE_IDS: checkout assert-all-gates
          O_CHECKOUT: ${{ steps.checkout.outcome }}
          O_ASSERT_ALL_GATES: ${{ steps.assert-all-gates.outcome }}
        run: bash scripts/ci-failure-triage.sh

  python-ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      # 每一步都要 id:失败自述脚本只认 TRIAGE_IDS 点名的 id,没有 id 的步骤在自述里结构上不存在
      # (判据见 scripts/check-ci-failure-triage-wiring.mjs;台账 G-591 第③件点名的正是"python 这条红了说不出为什么")
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        id: checkout

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # uv 版本钉死(2026-11-01 供给链):`pip install uv` 装的是"当时最新",同一枚提交在
      # 两个时间点能解析出不同的依赖图。取本机实测档 0.12.1 —— 它真读过 revision=3 的
      # apps/ai-service/uv.lock(现读 `uv export --frozen` 产出 3022 行 / 2456 条 sha256 摘要),
      # 与 apps/ai-service/Dockerfile 里那枚 `pip install uv==0.12.1` 同档,不留两个生产者。
      - name: Install uv
        id: install-uv
        run: pip install uv==0.12.1

      - name: Install dependencies
        id: install-deps
        run: uv pip install --system -e ".[dev]" || echo "依赖安装失败(可能缺少可选依赖,跳过)"

      # 装没装上问产物,不问退出码:上面那行 `|| echo` 会把"环境根本没搭起来"读成绿灯,
      # 于是后面每一步都在未安装的环境上跑,失败看起来像代码 bug(归因被搬走比红灯更贵)。
      #
      # 为什么本格先只做可闻化(observe 档)而不直接判红:现读证据取不到"今天到底装上了没"。
      # 本 job 的步骤只有 Install dependencies / Syntax check 两条,后者不需要 dev extra,
      # 而前者的 step conclusion=success 是**被 `|| echo` 吃出来的**(completed run 41257612029
      # 取证:job=python-ai-service conclusion=success,全 job 没有任何跑 pytest 的步骤)。
      # 拿一个量不到的读数当"存量已归零"直接把 blocking 装上,就是 §12e 禁止的恒红门形状。
      #
      # 升 blocking 的出口(明确、可执行):下一次 CI 读到 notice(dev extra 真在位)之后,
      # 把本步改成 `python -c "import pytest"` 单命令即红。两条分支各留一条可见信号,
      # 不写"什么都不响"的那一格。
      - name: Probe dev extra(observe 档,不阻断)
        id: probe-dev-extra
        run: |
          if python -c "import pytest"; then
            echo "::notice::dev extra 在位(pytest 可 import)—— 本步可升 blocking"
          else
            echo "::warning::dev extra 没装上:上一步的 || echo 把安装失败吃掉了,本步之后的 python 步骤都在未安装的环境上跑"
            exit 0
          fi

      - name: Syntax check
        id: syntax-check
        run: |
          python -c "import ast, os; files=[os.path.join(d,f) for d,_,fs in os.walk('app') for f in fs if f.endswith('.py')]; [ast.parse(open(fp,encoding='utf-8').read()) for fp in files]; print(f'{len(files)} files OK')"

      # 失败分诊(公开 annotations):唯一实现 = scripts/ci-failure-triage.sh,本步骤只注入参数。
      # 注:本作业 defaults.run.working-directory = apps/ai-service ⇒ 必须先回到仓根,否则脚本里
      #     TRIAGE_WORKFLOW_FILE 的相对路径读不到本工作流,"重跑映射"整格失效(那等于白装)。
      # 注:syntax-check 是块标量 run: ⇒ 脚本走"重跑映射缺失"分支,仍会点名步骤名(刻意不猜块标量内容)。
      - name: Failure triage (public annotations)
        id: failure-triage
        if: failure()
        env:
          TRIAGE_WORKFLOW_FILE: .github/workflows/ci.yml
          TRIAGE_IDS: checkout setup-python install-uv install-deps probe-dev-extra syntax-check
          O_CHECKOUT: ${{ steps.checkout.outcome }}
          O_SETUP_PYTHON: ${{ steps.setup-python.outcome }}
          O_INSTALL_UV: ${{ steps.install-uv.outcome }}
          O_INSTALL_DEPS: ${{ steps.install-deps.outcome }}
          O_PROBE_DEV_EXTRA: ${{ steps.probe-dev-extra.outcome }}
          O_SYNTAX_CHECK: ${{ steps.syntax-check.outcome }}
        run: cd ../../ && bash scripts/ci-failure-triage.sh

  ai-service-schema-check:
    runs-on: ubuntu-latest

    services:
      postgres:
        # 2026-09-10 修复:postgres:17 不含 pgvector,迁移 0123(embedding) 到
        # vector(1536) 列时抛 `type "vector" does not exist` 并回滚整个 DDL 事务
        # → 全库无表 → schema_check 大面积报"表不存在"。与 test-real-db.yml 对齐,
        # 统一用官方 pgvector 镜像(内置扩展文件,仍需 CREATE EXTENSION,见下方 step)。
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ihui_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ihui_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build database package
        run: pnpm --filter @ihui/database build

      - name: Build api-client package
        # 尾缀 `...` 连 workspace 依赖一起拓扑构建(同 openapi-check.yml:77 既有正解);
        # 不带 `...` 时若上游包(如 @ihui/types)未来产物化入口切到 dist,本步会静默踩坑。
        run: pnpm --filter "@ihui/api-client..." run build

      # 2026-09-10 根因修复:pgvector 镜像只是把扩展文件放进镜像,每个 database 仍需
      # 显式 CREATE EXTENSION;缺这步 → 迁移到 vector 列必抛 type "vector" does not exist。
      - name: Enable pgvector extension
        working-directory: packages/database
        run: |
          node --input-type=module -e "
            import postgres from 'postgres';
            const sql = postgres(process.env.DATABASE_URL);
            await sql.unsafe('CREATE EXTENSION IF NOT EXISTS vector');
            await sql.end();
            console.log('pgvector extension enabled');
          "

      # 2026-09-10 根因修复:原 `drizzle-kit push --force` 只按 schema 现状建表,不执行
      # packages/database/drizzle/*.sql 迁移(仓库有 250+ 个),导致 agent_ab_tests /
      # agent_memory_* / publish_accounts 等"TS schema 有定义"的表在 DB 里不存在,
      # schema_check 恒红。改用与 e2e.yml / Dockerfile.migrate 一致的权威迁移路径。
      - name: Apply migrations to test DB
        working-directory: packages/database
        run: npx drizzle-kit migrate

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install uv
        # uv 档钉死,同本文件 install-uv 那格的理由
        run: pip install uv==0.12.1

      - name: Install ai-service dependencies
        working-directory: apps/ai-service
        run: uv pip install --system -e ".[dev]"

      - name: Create ai-service runtime tables (ensure_table)
        working-directory: apps/ai-service
        # media_tasks 由 ai-service 启动时幂等自建(ensure_table),不在 drizzle 迁移内;
        # CI 校验前先按生产同等路径建表,否则 schema_check 恒报 exists=False(2026-09-10)。
        # 2026-09-15 补:publish 指标/风格检查表同为运行时懒建表(_ensure_metrics_table /
        # _ensure_style_check_table),与 media_tasks 同模式,否则 schema_check 恒红。
        run: |
          python -c "
          import asyncio
          from app.services.media_tasks import ensure_table
          asyncio.run(ensure_table())
          from app.services.publish.metrics_collector import (
              _ensure_metrics_table,
              _ensure_style_check_table,
          )
          # 2026-10-03 修复:此前只 import 未调用,publish_metrics/publish_style_check
          # 两表从未落库,schema_check 恒报 exists=False。幂等建表,缺一即红。
          asyncio.run(_ensure_metrics_table())
          asyncio.run(_ensure_style_check_table())
          "
      - name: Create checkin tables (raw conn + self-verify)
        working-directory: apps/ai-service
        # 签到表为 ai-service 运行时懒建表,不在 drizzle 迁移内。
        # 共享池跨 loop 回收在 CI 多连 asyncio.run 下出现过步骤退出 0 但表未落库的
        # 静默失配(run 37090730137 实测),故改裸连接建表并当步自验,缺表即红。
        # 注意:本块 python/SQL 内禁用美元符(bash 双引号会吞 $param,run 37092664754 教训)。
        # 自验钉的是「DDL 声明的每一张表都可见」这一不变量,**不是表的张数**
        # (run 38009440233 实测:签到线补第 4 张表 checkin_credits_daily 后,旧写法
        #  `assert n == 3` 让干净 HEAD 上的 main CI 每枚提交恒红;数量型锁既把"合法多一张"
        #  判成缺失,又只在数目恰好对上时才响 —— 真缺表时若张数巧合相等照样放过)。
        # 期望集合从 checkin_store 自己的源码里派生 ⇒ 增删 DDL 自动跟随,无需再改本步;
        # 派生为空按「判据失明」判红,绝不记通过。
        run: |
          python -c "
          import asyncio, inspect, re, asyncpg
          import app.services.checkin_store as cs
          from app.core.config import settings
          expected = sorted(set(re.findall(r'CREATE TABLE IF NOT EXISTS\s+([a-z_]+)', inspect.getsource(cs))))
          assert expected, 'checkin DDL 派生为空 ⇒ 判据失明,不得记通过'
          async def main():
              conn = await asyncpg.connect(dsn=settings.database_url)
              try:
                  await cs.ensure_tables_conn(conn)
                  rows = await conn.fetch('SELECT table_name FROM information_schema.tables')
                  have = set(r[0] for r in rows)
                  missing = [t for t in expected if t not in have]
                  print('[ci] checkin DDL 声明', len(expected), '张,落库可见', len(expected) - len(missing), '张')
                  assert not missing, 'checkin tables missing: %s (DDL 声明 %s 张)' % (missing, len(expected))
              finally:
                  await conn.close()
          asyncio.run(main())
          "

      - name: Create keepalive tables (raw conn + self-verify)
        working-directory: apps/ai-service
        # 账号保活两表同为 ai-service 运行时懒建表:幂等 CREATE TABLE IF NOT EXISTS 内聚在
        # app/services/keepalive/store.py 的 ensure_tables_conn(),由 lifespan fail-open 调用
        # ⇒ **不在 drizzle 迁移里**。CI 建表步骤此前没建它们,schema_check 在 main tip 上
        # 恒报 keepalive_account_state / keepalive_events exists=False(2026-10-28 实测)。
        # 形态照抄上一档 checkin(踩过的坑相同):裸连接建表(共享池跨 loop 回收在 CI 多连
        # asyncio.run 下出现过步骤退出 0 但表未落库的静默失配)+ 当步自验,缺表即红。
        # 注意:本块 python/SQL 内禁用美元符(bash 双引号会吞 $param)。
        # 自验钉的是「DDL 声明的每一张表都可见」这一不变量,**禁用张数断言** —— 写死张数
        # 会把"合法多一张"的干净 HEAD 判红(checkin 档 run 38009440233 教训);
        # 期望集合从 store.py 自己的 DDL 源码里派生 ⇒ 增删 DDL 自动跟随;
        # 派生为空按「判据失明」判红,绝不记通过。
        run: |
          python -c "
          import asyncio, inspect, re, asyncpg
          import app.services.keepalive.store as ks
          from app.core.config import settings
          expected = sorted(set(re.findall(r'CREATE TABLE IF NOT EXISTS\s+([a-z_]+)', inspect.getsource(ks))))
          assert expected, 'keepalive DDL 派生为空 ⇒ 判据失明,不得记通过'
          async def main():
              conn = await asyncpg.connect(dsn=settings.database_url)
              try:
                  await ks.ensure_tables_conn(conn)
                  rows = await conn.fetch('SELECT table_name FROM information_schema.tables')
                  have = set(r[0] for r in rows)
                  missing = [t for t in expected if t not in have]
                  print('[ci] keepalive DDL 声明', len(expected), '张,落库可见', len(expected) - len(missing), '张')
                  assert not missing, 'keepalive tables missing: %s (DDL 声明 %s 张)' % (missing, len(expected))
              finally:
                  await conn.close()
          asyncio.run(main())
          "

      - name: Run ai-service schema_check against test DB
        working-directory: apps/ai-service
        run: |
          python -m app.core.schema_check
          # 退出码 0 = 所有表存在且关键字段齐全;1 = 有表不存在或关键字段缺失
          exit $?

  # ═════════════════ SBOM(软件物料清单,2026-10-30 接)═════════════════
  # 立因:SECURITY.md「软件供应链」段一直写着「每个 Release 附带 SBOM,见 Release Assets」,
  # 而本目录此前**一条 SBOM 生成步骤都没有**(实测 grep 零命中)—— 那是文档写了条跑不通的
  # 出路(AGENTS §0.8)。本 job 把声明兑现成产物,而不是把声明删掉降承诺。
  #
  # 刻意**不装 node_modules**:scripts/gen-sbom.mjs 只解析 pnpm-lock.yaml(扁平 `name@version:`
  # + resolution.integrity),零第三方依赖 ⇒ 这一步 30 秒内出结论,且不会因 install 抖动而红。
  # 生成器自带覆盖率断言(解析出的组件必须覆盖 packages: 段,漏条即 exit 2),所以
  # "SBOM 生成了"这件事本身带可信度,不是一句空话。
  sbom:
    name: SBOM (CycloneDX 1.5)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Generate SBOM from lockfile
        run: node scripts/gen-sbom.mjs --out sbom/sbom.cdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom-cyclonedx
          path: sbom/sbom.cdx.json
          # 没有产物就是失败,不能"上传了 0 个文件还记绿"
          if-no-files-found: error

