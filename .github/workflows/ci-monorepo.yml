name: CI (Monorepo)

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig.base.json'
      - '.prettierignore'
      - '.github/workflows/ci-monorepo.yml'
  pull_request:
    branches: [main, develop]

# Security: least-privilege GITHUB_TOKEN (CWE-250). Third-party actions use @v tags — pin to commit SHA for stricter supply-chain security.
permissions:
  contents: read

concurrency:
  group: ci-monorepo-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # 与根 package.json 的 packageManager(pnpm@11.18.0)严格对齐,避免 pnpm 版本漂移。
  PNPM_VERSION: '11.18.0'
  PYTHON_VERSION: '3.12'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.pnpm-cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        id: checkout
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile
      - name: Lint (strict)
        id: lint-strict
        run: pnpm run lint:strict
      - name: Format check
        id: format-check
        run: pnpm run format:check
      # 失败分诊(公开 annotations):唯一实现 = scripts/ci-failure-triage.sh,本步骤只注入参数。
      - name: Failure triage (public annotations)
        id: failure-triage
        if: failure()
        env:
          TRIAGE_WORKFLOW_FILE: .github/workflows/ci-monorepo.yml
          TRIAGE_IDS: checkout install lint-strict format-check
          O_CHECKOUT: ${{ steps.checkout.outcome }}
          O_INSTALL: ${{ steps.install.outcome }}
          O_LINT_STRICT: ${{ steps.lint-strict.outcome }}
          O_FORMAT_CHECK: ${{ steps.format-check.outcome }}
        run: bash scripts/ci-failure-triage.sh

  typecheck:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        id: checkout
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile
      # WXT 生成 apps/extension/.wxt/tsconfig.json(extension 的 tsconfig 继承它)。
      # 缺此步 -> .wxt/ 被 gitignore 未入库 -> tsc 读不到 → TS5083 + 200+ 级联错误(2026-09-10 实测)。
      - name: Prepare WXT types (extension)
        id: prepare-wxt
        run: pnpm --filter @ihui/extension exec wxt prepare
      # 类型包前置构建(2026-10-09 立,补本 job 与 ci.yml 的那道差):
      # @ihui/types 的 main/types/exports 全指向 ./dist/* 且产物不入库,而 `pnpm install`
      # 从不构建 workspace 包 ⇒ 本 job 的 `pnpm run typecheck` 结构上拿不到它的类型声明。
      # 实测形态:typecheck job 138× TS2307 "Cannot find module '@ihui/types'"(含 2× 子路径
      # /permission-mode)+ 连带 10× TS7006 / 1× TS7053 —— 后两类不是独立缺陷,是类型推不出来。
      # 本机 A/B 同形复现(取证 .ihui-agent/tmp/census-ab/ac-without.log 与 ac-with.log):
      #   把 packages/types/dist 挪开 ⇒ RC=2、87× TS2307 + 8× TS7006 + 1× TS7053;原样放回 ⇒ RC=0、0 错。
      # 选择器 `@ihui/api-client...` = 该包**连同其 workspace 依赖**拓扑构建,与 ci.yml 的
      # build-api-client 步骤逐字同源(openapi-check.yml:77 是同一条先例)。手工点名"要先建哪几个包"
      # 必然落后于新增依赖(ci.yml:78 那段 2026-09-27 的教训),所以这里用闭包形式而不是只建 types。
      - name: Build type-consumable workspace deps (topological closure, prerequisite of typecheck)
        id: build-types-deps
        run: pnpm --filter "@ihui/api-client..." run build
      - name: Typecheck
        id: typecheck
        run: pnpm run typecheck
      - name: e2e typecheck (@ihui/web)
        id: typecheck-e2e
        run: pnpm --filter @ihui/web typecheck:e2e
      # 失败分诊(公开 annotations):唯一实现 = scripts/ci-failure-triage.sh,本步骤只注入参数。
      - name: Failure triage (public annotations)
        id: failure-triage
        if: failure()
        env:
          TRIAGE_WORKFLOW_FILE: .github/workflows/ci-monorepo.yml
          TRIAGE_IDS: checkout install prepare-wxt build-types-deps typecheck typecheck-e2e
          O_CHECKOUT: ${{ steps.checkout.outcome }}
          O_INSTALL: ${{ steps.install.outcome }}
          O_PREPARE_WXT: ${{ steps.prepare-wxt.outcome }}
          O_BUILD_TYPES_DEPS: ${{ steps.build-types-deps.outcome }}
          O_TYPECHECK: ${{ steps.typecheck.outcome }}
          O_TYPECHECK_E2E: ${{ steps.typecheck-e2e.outcome }}
        run: bash scripts/ci-failure-triage.sh

  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        id: checkout
      - name: Check for .js/.jsx/.vue files in apps/*/src/
        id: source-check
        run: |
          set -e
          FILES=$(find apps -path 'apps/*/src/*' -type f \( -name '*.js' -o -name '*.jsx' -o -name '*.vue' \) || true)
          if [ -n "$FILES" ]; then
            echo "::error::Found .js/.jsx/.vue files in apps/*/src/. Use .ts/.tsx instead."
            echo "$FILES"
            exit 1
          fi
          echo "OK: No .js/.jsx/.vue files found in apps/*/src/"
      # 失败分诊(公开 annotations):唯一实现 = scripts/ci-failure-triage.sh,本步骤只注入参数。
      # 本 job 不装 node/setup-node —— 该脚本只用 POSIX awk/grep,不依赖被测工具链。
      - name: Failure triage (public annotations)
        id: failure-triage
        if: failure()
        env:
          TRIAGE_WORKFLOW_FILE: .github/workflows/ci-monorepo.yml
          TRIAGE_IDS: checkout source-check
          O_CHECKOUT: ${{ steps.checkout.outcome }}
          O_SOURCE_CHECK: ${{ steps.source-check.outcome }}
        run: bash scripts/ci-failure-triage.sh

  port-registry-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        id: checkout
      - name: Check port registry
        id: port-registry
        run: node scripts/check-port-registry.mjs --all
      # 失败分诊(公开 annotations):唯一实现 = scripts/ci-failure-triage.sh,本步骤只注入参数。
      - name: Failure triage (public annotations)
        id: failure-triage
        if: failure()
        env:
          TRIAGE_WORKFLOW_FILE: .github/workflows/ci-monorepo.yml
          TRIAGE_IDS: checkout port-registry
          O_CHECKOUT: ${{ steps.checkout.outcome }}
          O_PORT_REGISTRY: ${{ steps.port-registry.outcome }}
        run: bash scripts/ci-failure-triage.sh

  test:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        id: checkout
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        id: test
        run: pnpm run test
      # 失败分诊(公开 annotations):唯一实现 = scripts/ci-failure-triage.sh,本步骤只注入参数。
      - name: Failure triage (public annotations)
        id: failure-triage
        if: failure()
        env:
          TRIAGE_WORKFLOW_FILE: .github/workflows/ci-monorepo.yml
          TRIAGE_IDS: checkout install test
          O_CHECKOUT: ${{ steps.checkout.outcome }}
          O_INSTALL: ${{ steps.install.outcome }}
          O_TEST: ${{ steps.test.outcome }}
        run: bash scripts/ci-failure-triage.sh

  build:
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, api, miniapp-taro]
    steps:
      - uses: actions/checkout@v4
        id: checkout
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile
      - name: Turbo build (${{ matrix.app }})
        id: turbo-build
        run: pnpm turbo run build --filter=@ihui/${{ matrix.app }}
      # 产物预算门只在 CI 问责:此处产物必然新鲜存在,超上限就是真红;
      # 本机跑它只会得到"未判定(产物不在)" —— 提交链里它是 warn,没有这一步就等于没有问责面。
      - name: 产物预算对账(仅 miniapp 档,主包口径上限 2,097,152 B)
        id: artifact-budget
        if: matrix.app == 'miniapp-taro'
        run: node scripts/check-artifact-budget.mjs --target miniapp
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: build-${{ matrix.app }}
          path: |
            apps/${{ matrix.app }}/.next
            apps/${{ matrix.app }}/dist
          retention-days: 7
      # 失败分诊(公开 annotations):唯一实现 = scripts/ci-failure-triage.sh,本步骤只注入参数。
      # build 是矩阵 job(web/api/miniapp-taro)⇒ 注解里必须带是哪个 app 红的,否则三条红长得一样。
      - name: Failure triage (public annotations)
        id: failure-triage
        if: failure()
        env:
          TRIAGE_WORKFLOW_FILE: .github/workflows/ci-monorepo.yml
          TRIAGE_IDS: checkout install turbo-build artifact-budget upload
          O_CHECKOUT: ${{ steps.checkout.outcome }}
          O_INSTALL: ${{ steps.install.outcome }}
          O_TURBO_BUILD: ${{ steps.turbo-build.outcome }}
          O_ARTIFACT_BUDGET: ${{ steps.artifact-budget.outcome }}
          O_UPLOAD: ${{ steps.upload.outcome }}
        run: bash scripts/ci-failure-triage.sh

  cli-smoke:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        id: checkout
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile
      - name: reset-admin-password --help 冒烟测试
        id: smoke-help
        working-directory: apps/api
        run: pnpm reset:admin-password --help
      - name: reset-admin-password 缺 --yes 拒绝测试
        id: smoke-no-yes
        working-directory: apps/api
        run: |
          output=$(pnpm reset:admin-password --account admin --generate 2>&1 || true)
          if echo "$output" | grep -q "用户未确认"; then
            echo "✅ 缺 --yes 正确拒绝"
          else
            echo "❌ 缺 --yes 未被拒绝"
            echo "$output"
            exit 1
          fi
      - name: reset-admin-password 生产环境拒绝测试
        id: smoke-prod-refuse
        working-directory: apps/api
        run: |
          output=$(NODE_ENV=production pnpm reset:admin-password --account admin --generate --yes 2>&1 || true)
          if echo "$output" | grep -q "生产环境"; then
            echo "✅ 生产环境无 --force 正确拒绝"
          else
            echo "❌ 生产环境未拒绝"
            echo "$output"
            exit 1
          fi
      # 失败分诊(公开 annotations):唯一实现 = scripts/ci-failure-triage.sh,本步骤只注入参数。
      # 这两条冒烟步骤是**多行块标量** ⇒ 脚本按契约打"重跑映射缺失"并点名步骤名(刻意不猜命令);
      # 点名本身仍是价值:红在哪一步从此不必点开日志看。
      - name: Failure triage (public annotations)
        id: failure-triage
        if: failure()
        env:
          TRIAGE_WORKFLOW_FILE: .github/workflows/ci-monorepo.yml
          TRIAGE_IDS: checkout install smoke-help smoke-no-yes smoke-prod-refuse
          O_CHECKOUT: ${{ steps.checkout.outcome }}
          O_INSTALL: ${{ steps.install.outcome }}
          O_SMOKE_HELP: ${{ steps.smoke-help.outcome }}
          O_SMOKE_NO_YES: ${{ steps.smoke-no-yes.outcome }}
          O_SMOKE_PROD_REFUSE: ${{ steps.smoke-prod-refuse.outcome }}
        run: bash scripts/ci-failure-triage.sh

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        id: checkout
      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        id: install-uv
        run: pip install uv
      - name: Install dependencies
        id: install-deps
        working-directory: apps/ai-service
        run: uv pip install --system -e ".[dev]"
      - name: Ruff check
        id: ruff
        working-directory: apps/ai-service
        run: ruff check .
      - name: Mypy
        id: mypy
        working-directory: apps/ai-service
        run: mypy app/
      - name: Install ripgrep（rg↔python 双通道对账测试的前置工具）
        id: install-rg
        # 缺 rg 时 `tests/test_file_search_ripgrep_v75.py` 刻意判"本结果不可用于对账"而不是
        # 静默通过(`shutil.which("rg")` 解析不到即降级并拒绝出合格证)。所以 CI 要么装它,
        # 要么永远看着一批"环境红"把真信号埋掉 —— 与 §"判据失效的表现永远是安静"同一条。
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
          rg --version | head -1
      - name: Pytest（离线单测子集，排除真网/端到端集成测试，避免依赖外部服务）
        id: pytest
        working-directory: apps/ai-service
        run: |
          pytest -m "not network" \
            --ignore=tests/test_configure_automation_task_real.py \
            --ignore=tests/test_knowledge_lookup_g6_e2e.py \
            --ignore=tests/test_mcp_oauth_authorization_code_e2e.py \
            --ignore=tests/test_mcp_streamable_http_e2e.py \
            --ignore=tests/test_native_fc_e2e_real.py \
            --ignore=tests/test_tool_loop_e2e.py
      # 失败分诊(公开 annotations):唯一实现 = scripts/ci-failure-triage.sh,本步骤只注入参数。
      # 立因与行为契约见该脚本头注;边界:只在 failure() 分支跑,不碰上面任何步骤的判据
      # 严格程度(无 continue-on-error、不删步骤、不扩 permissions、不新增 secret)。
      - name: Failure triage (public annotations)
        id: failure-triage
        if: failure()
        env:
          TRIAGE_WORKFLOW_FILE: .github/workflows/ci-monorepo.yml
          TRIAGE_IDS: checkout setup-python install-uv install-deps ruff mypy install-rg pytest
          O_CHECKOUT: ${{ steps.checkout.outcome }}
          O_SETUP_PYTHON: ${{ steps.setup-python.outcome }}
          O_INSTALL_UV: ${{ steps.install-uv.outcome }}
          O_INSTALL_DEPS: ${{ steps.install-deps.outcome }}
          O_RUFF: ${{ steps.ruff.outcome }}
          O_MYPY: ${{ steps.mypy.outcome }}
          O_INSTALL_RG: ${{ steps.install-rg.outcome }}
          O_PYTEST: ${{ steps.pytest.outcome }}
        run: bash scripts/ci-failure-triage.sh

  build-docker:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - target: api
            context: .
            file: ./deploy/docker/Dockerfile.api
          - target: web
            context: .
            file: ./deploy/docker/Dockerfile.web
          - target: ai-service
            context: apps/ai-service
            file: apps/ai-service/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: ihui-${{ matrix.target }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
# ⁠​‌​​‌​​‌‍‍​‌​​‌​​​‍‍​‌​‌​‌​‌‍‍​‌​​‌​​‌‍‍​​‌​‌‌​‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌​​‌‌‌‌​‌​‍‍‌‌​‌‌​​​‌​​​‌‌‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌‌​‌​​‌‌‌​‍‍‌‌​​‌‌​​​‌​​‌​‌‍‍‌​‌‌‌​‌‌‌​‌‌‌​‌‍‍‌​‌‌​‌‌‌‍‍​‌​​‌‌​​‍‍​‌​​​​‌‌‍‍‌​‌‌​‌‌‌‍‍​‌‌​​​​‌‍‍​‌‌​‌​​‌‍‍​‌‌‌‌​‌​‍‍​‌‌​‌​​​‍‍​‌‌‌​​‌‌‍‍​​‌​‌‌‌​‍‍​‌‌‌​‌​​‍‍​‌‌​‌‌‌‌‍‍​‌‌‌​​​​‍‍‌​‌‌​‌‌‌‍‍​‌​‌​​​​‍‍​‌​‌​​‌​‍‍​‌​​‌‌‌‌‍‍​‌​‌​‌‌​‍‍​‌​​​‌​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​‌‌‍‍​‌​​​‌​‌‍‍​​‌​‌‌​‌‍‍​​‌‌​​‌​‍‍​​‌‌​​​​‍‍​​‌‌​​‌​‍‍​​‌‌​‌‌​⁠
