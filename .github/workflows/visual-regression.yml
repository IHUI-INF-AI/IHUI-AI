name: Visual Regression

# =============================================================================
# 视觉回归测试 workflow
#
# 当 PR 修改 apps/web/** 时触发，使用 Playwright 运行视觉回归测试。
# 配置文件: apps/web/playwright.visual.config.ts
# 脚本: pnpm --filter @ihui/web test:visual
# =============================================================================

# 2026-11-03(排队治理):最近 12 次运行 = 10 failure + 2 cancelled、0 success;
#   实测 run 41576869180 排队 931s 后只跑了 109s 就红 —— 即"每次都跑、每次都红、无人修"
#   的纯损耗项(每次 web PR 都占 1 个 pending 位 15min,再占 runner 2min)。
# 按本轮口径从 PR 触发面撤下,改为**每周一次定时 + 手动触发**;job / 判据 / 配置一行未删。
# 恢复方式:把下面 `on:` 整块换回原触发面(pull_request, branches [main, develop],
#   paths = apps/web/**、packages/**、.github/workflows/visual-regression.yml),
#   即与 `.github/workflows/e2e.yml` 同级的 PR 门。
# 它不承载 required check(分支保护现读只有 `CI / lint-typecheck-test (push)`)。
on:
  schedule:
    # 每周一 19:00 UTC = 北京时间周二 03:00(避开 push 高峰)
    - cron: '0 19 * * 1'
  workflow_dispatch:

concurrency:
  group: visual-regression-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9'

jobs:
  visual:
    name: Playwright 视觉回归
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run visual regression tests
        run: pnpm --filter @ihui/web test:visual

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: visual-regression-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: visual-regression-results
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
# ⁠​‌​​‌​​‌‍‍​‌​​‌​​​‍‍​‌​‌​‌​‌‍‍​‌​​‌​​‌‍‍​​‌​‌‌​‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌​​‌‌‌‌​‌​‍‍‌‌​‌‌​​​‌​​​‌‌‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌‌​‌​​‌‌‌​‍‍‌‌​​‌‌​​​‌​​‌​‌‍‍‌​‌‌‌​‌‌‌​‌‌‌​‌‍‍‌​‌‌​‌‌‌‍‍​‌​​‌‌​​‍‍​‌​​​​‌‌‍‍‌​‌‌​‌‌‌‍‍​‌‌​​​​‌‍‍​‌‌​‌​​‌‍‍​‌‌‌‌​‌​‍‍​‌‌​‌​​​‍‍​‌‌‌​​‌‌‍‍​​‌​‌‌‌​‍‍​‌‌‌​‌​​‍‍​‌‌​‌‌‌‌‍‍​‌‌‌​​​​‍‍‌​‌‌​‌‌‌‍‍​‌​‌​​​​‍‍​‌​‌​​‌​‍‍​‌​​‌‌‌‌‍‍​‌​‌​‌‌​‍‍​‌​​​‌​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​‌‌‍‍​‌​​​‌​‌‍‍​​‌​‌‌​‌‍‍​​‌‌​​‌​‍‍​​‌‌​​​​‍‍​​‌‌​​‌​‍‍​​‌‌​‌‌​⁠
