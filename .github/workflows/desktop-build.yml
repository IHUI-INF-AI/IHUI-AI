name: Build Desktop Packages

# 多平台桌面包构建(2026-08-06 立,闭合 macOS dmg / Linux deb·AppImage 构建项)。
# 触发:
#   - 手动 workflow_dispatch(任意分支)
#   - 推送 v* tag(发布时自动出 3 平台安装包)
# 产物:GitHub Actions artifacts(ubuntu → deb+AppImage / macos → dmg / windows → nsis exe)。
# 说明:各平台在官方 runner 上原生构建,无需本地 macOS/Linux 环境。
# 安全:GITHUB_TOKEN 最小权限(contents: read);actions 均 @v4 标签。

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
          - os: macos-latest
            artifact: macos
          - os: windows-latest
            artifact: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install Tauri Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop bundle (tauri build)
        working-directory: apps/desktop
        run: pnpm build

      - name: Upload Linux artifacts (deb + AppImage)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ihui-ai-${{ matrix.artifact }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload macOS artifact (dmg)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ihui-ai-${{ matrix.artifact }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload Windows artifact (nsis exe)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ihui-ai-${{ matrix.artifact }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
