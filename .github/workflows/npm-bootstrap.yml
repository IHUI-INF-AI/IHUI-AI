# npm 账号首发引导(一次性):本机与生产机出口 IP 均被 www.npmjs.com 403,
# 由 GitHub Actions runner(Azure 出口)代行注册/验证/取 token。
# 凭据经 RSA-OAEP+AES-GCM 加密落 artifact(李总本地持私钥),公开仓零泄露。
# action=signup | verify_token;publish 走本文件独立 job(标准 npm publish)。
name: npm Bootstrap
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'signup | verify_token | publish | trusted_publisher | signpath'
        required: true
        default: 'signup'
      attempts:
        description: '整轮重试次数(诊断时可传 1 快速拿结果)'
        required: false
        default: '3'

concurrency:
  group: npm-bootstrap
  cancel-in-progress: false

jobs:
  browser:
    if: github.event.inputs.action != 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ACTION: ${{ github.event.inputs.action }}
      BOOT_ATTEMPTS: ${{ github.event.inputs.attempts || '3' }}
      PUBKEY_PEM: ${{ secrets.NPM_BOOT_PUBKEY }}
      NPM_EMAIL: ${{ secrets.NPM_BOOT_EMAIL }}
      NPM_USERNAME: ${{ secrets.NPM_BOOT_USERNAME }}
      NPM_PASSWORD: ${{ secrets.NPM_BOOT_PASSWORD }}
      NPM_VERIFY_URL: ${{ secrets.NPM_VERIFY_URL }}
      # trusted_publisher:网页登录凭据(npm 已禁用 API 换 token,Trusted Publisher 只能网页登记)
      NPM_WEB_USERNAME: ${{ secrets.NPM_WEB_USERNAME }}
      NPM_WEB_PASSWORD: ${{ secrets.NPM_WEB_PASSWORD }}
      # signpath:申请联系邮箱
      SIGNPATH_EMAIL: ${{ secrets.SIGNPATH_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install playwright + real Google Chrome
        run: |
          cd .github/scripts
          npm init -y >/dev/null 2>&1 || true
          npm i playwright@1.49.1 --no-fund --no-audit
          npx playwright install chromium --with-deps
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb >/dev/null
          # 官方真 Chrome:userAgentData.brands 含 "Google Chrome"(CFT/Playwright chromium 缺这一项,
          # CF 一测即识破);配合 --disable-blink-features=AutomationControlled 使 navigator.webdriver
          # 原生为 false,零 JS 伪造痕迹。Playwright 仅作 connectOverCDP 的客户端。
          cd /tmp
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y -qq ./google-chrome-stable_current_amd64.deb
          google-chrome --version
      - name: Run browser automation (real Chrome + CDP, xvfb headed)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb >/dev/null
          cd .github/scripts
          UNDER_XVFB=1 xvfb-run -a -s "-screen 0 1280x860x24" node npm-bootstrap-runner.mjs
      - name: Upload evidence + encrypted secrets
        if: always()
        continue-on-error: true
        timeout-minutes: 4
        uses: actions/upload-artifact@v4
        with:
          name: npm-bootstrap-${{ github.event.inputs.action }}-${{ github.run_number }}
          path: .github/scripts/shots/
          if-no-files-found: warn

  publish:
    if: github.event.inputs.action == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - name: Install + build npm bundle
        run: |
          pnpm install --frozen-lockfile --filter ihui-cli...
          pnpm --filter "ihui-cli^..." run build
          pnpm --filter ihui-cli build:npm
      - name: Publish ihui-cli to npm
        run: |
          cd apps/cli/npm-dist
          npm publish --registry=https://registry.npmjs.org/ --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
