name: Mobile Download Leg

# Android 对外下载腿门(2026-11-03 立,P1 发布线收尾)。
# 只验证「用户点下去最终拿到的那一枚」:跟随 302 后 200/206 + Content-Length >= 50MiB。
# 为什么不在 PR 上跑:外部站点抖动/EdgeOne 限流不应阻塞每次 PR;这是发布链路的运行态门,
# 用 workflow_dispatch(发版前后手动点)+ 每日定时跑。
# 证书校验为什么不在 CI:CI 没有正式 keystore/密码(私钥绝不进 GitHub Secrets),
# apksigner 也只能验证"这枚包的签名",不能证明"这枚包是正式签名机产出的";
# 证书基准比对在持钥发布机由 scripts/build-mobile-rn-release.ps1 第 5 步 `--apk` 跑。
# 退出码:0=ok / 1=fail / 2=skipped 或未判定 —— **2 也会让 job 红,skip 不是绿**。

on:
  workflow_dispatch:
  schedule:
    # 每日 03:17 UTC(Asia/Shanghai 11:17),避开整点高峰
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: mobile-download-leg
  cancel-in-progress: false

jobs:
  check:
    name: Check public APK download leg
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Self-test (offline fixtures)
        run: node scripts/check-mobile-download-leg.mjs --self-test

      - name: Probe configured download URL
        run: node scripts/check-mobile-download-leg.mjs --json
# ⁠​‌​​‌​​‌‍‍​‌​​‌​​​‍‍​‌​‌​‌​‌‍‍​‌​​‌​​‌‍‍​​‌​‌‌​‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌​​‌‌‌‌​‌​‍‍‌‌​‌‌​​​‌​​​‌‌‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌‌​‌​​‌‌‌​‍‍‌‌​​‌‌​​​‌​​‌​‌‍‍‌​‌‌‌​‌‌‌​‌‌‌​‌‍‍‌​‌‌​‌‌‌‍‍​‌​​‌‌​​‍‍​‌​​​​‌‌‍‍‌​‌‌​‌‌‌‍‍​‌‌​​​​‌‍‍​‌‌​‌​​‌‍‍​‌‌‌‌​‌​‍‍​‌‌​‌​​​‍‍​‌‌‌​​‌‌‍‍​​‌​‌‌‌​‍‍​‌‌‌​‌​​‍‍​‌‌​‌‌‌‌‍‍​‌‌‌​​​​‍‍‌​‌‌​‌‌‌‍‍​‌​‌​​​​‍‍​‌​‌​​‌​‍‍​‌​​‌‌‌‌‍‍​‌​‌​‌‌​‍‍​‌​​​‌​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​‌‌‍‍​‌​​​‌​‌‍‍​​‌​‌‌​‌‍‍​​‌‌​​‌​‍‍​​‌‌​​​​‍‍​​‌‌​​‌​‍‍​​‌‌​‌‌​⁠
