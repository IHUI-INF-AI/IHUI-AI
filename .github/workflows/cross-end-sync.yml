name: cross-end-sync

# 作用:把 scripts/sync-cross-end-cascade.mjs(已实现的 web→RN→小程序 一键级联)接入 CI,
#       实现「改 web/shared/design-tokens/ui → 自动派生 RN/小程序 → 自动落地 → 跨端门禁红才拦」。
# 全自动:同仓 PR 直接落到源分支;main 受分支保护则退回开自动 PR;门禁(36/93/128/237/259/285/290/291 等)红即失败、不落地。
# 仅 stage 跨端派生可能改动的目录,绝不碰任何人的未提交 WIP。

on:
  push:
    branches: [main, develop, release/*]
    paths:
      - 'apps/web/**'
      - 'apps/mobile-rn/**'
      - 'apps/miniapp-taro/**'
      - 'packages/design-tokens/**'
      - 'packages/ui-react/**'
      - 'packages/ui-native/**'
      - 'packages/shared/**'
      - 'scripts/sync-cross-end-cascade.mjs'
      - 'scripts/gen-*.mjs'
      - 'scripts/land-*.mjs'
      - 'scripts/parity-auto.mjs'
      - 'scripts/check-*.mjs'
      - 'scripts/heal-*.mjs'
      - 'scripts/plan-rn-token-pairing.mjs'
      - '.github/workflows/cross-end-sync.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/web/**'
      - 'apps/mobile-rn/**'
      - 'apps/miniapp-taro/**'
      - 'packages/design-tokens/**'
      - 'packages/ui-react/**'
      - 'packages/ui-native/**'
      - 'packages/shared/**'
      - 'scripts/sync-cross-end-cascade.mjs'
      - 'scripts/gen-*.mjs'
      - 'scripts/land-*.mjs'
      - 'scripts/parity-auto.mjs'
      - 'scripts/check-*.mjs'
      - 'scripts/heal-*.mjs'
      - 'scripts/plan-rn-token-pairing.mjs'
  workflow_dispatch:
  schedule:
    # 每 6 小时自巡检兜底(弥补守护巡检节拍 + 跨会话并发漏跑)
    - cron: '23 */6 * * *'

permissions:
  contents: write
  pull-requests: write
  checks: write

concurrency:
  group: cross-end-sync-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11.18.0'
  # 自动落地提交的哨兵标记:含此标记的提交会被本工作流跳过,避免自触发死循环
  AUTO_MARK: '[cross-end-auto]'

jobs:
  cascade:
    runs-on: ubuntu-latest
    # cron 任务没有默认超时(GitHub 上限 360min),级联合并卡住会把下一个整点的
    # cron 排在 concurrency 队列后,表现为"同步停摆但不红"。30 分钟足够一次级联。
    timeout-minutes: 30
    steps:
      - name: 检出
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 判定是否可写(同仓 push/PR 才自动落地,fork PR 仅出报告)
        id: can-write
        shell: bash
        run: |
          set -euo pipefail
          HEAD_MSG="${{ github.event.head_commit.message }}"
          if [[ "${HEAD_MSG}" == *"${AUTO_MARK}"* ]]; then
            echo "检测到自触发哨兵标记,跳过以避免死循环"
            echo "can_write=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            if [[ "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]]; then
              echo "can_write=true" >> "$GITHUB_OUTPUT"
            else
              echo "fork PR:仅只读报告" >> "$GITHUB_OUTPUT"
              echo "can_write=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "can_write=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 配置 pnpm + Node
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 安装依赖(级联与各 check 仅用 node:*/同目录 lib,无需 build)
        run: pnpm install --frozen-lockfile

      - name: 运行跨端级联(web→RN→小程序,自动落地)
        if: steps.can-write.outputs.can_write == 'true'
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node scripts/sync-cross-end-cascade.mjs --apply --json > cascade-apply.json && RC=0 || RC=$?
          echo "apply_rc=${RC}" >> "$GITHUB_OUTPUT"

      - name: 只读预览(不可写时出漂移报告)
        if: steps.can-write.outputs.can_write != 'true'
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          node scripts/sync-cross-end-cascade.mjs --json > cascade-preview.json && RC=0 || RC=$?
          echo "preview_rc=${RC}" >> "$GITHUB_OUTPUT"

      - name: 提交并推送派生结果(门禁红也推进,避免死循环)
        # 关键修正:无论门禁是否全绿都落地派生进度。门禁红只拦"合并",不拦"推进"。
        # 全绿时带 [cross-end-auto] 哨兵标记,下一轮 push 自跳过;门禁红时不带标记,
        # 下一轮 push 会再次触发继续派生,直到收敛(无变更 ⇒ 无 push ⇒ 链自然停)。
        if: steps.can-write.outputs.can_write == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "ihui-cross-end-bot"
          git config user.email "bot@ihui.top"
          RC="${{ steps.apply.outputs.apply_rc }}"
          # 只 stage 跨端派生可能改动的目录,绝不碰他人 WIP
          git add apps/mobile-rn apps/miniapp-taro packages/design-tokens packages/ui-native packages/shared apps/web
          if ! git diff --cached --quiet; then
            MARK=""
            if [[ "${RC}" == "0" ]]; then MARK=" ${AUTO_MARK}"; fi
            git commit -m "chore(cross-end): auto-sync RN & miniapp from web${MARK}"
          else
            echo "无工作树派生变更"
          fi
          # 造页器(object-space-land)可能已把小程序页直接落进本地分支 HEAD,
          # 即便没有工作树变更也要把本地领先远端的提交推上去,否则下一轮 checkout 会把进度吞掉。
          TARGET="${{ github.head_ref || github.ref_name }}"
          ORIGIN_TIP="$(git rev-parse "origin/${TARGET}" 2>/dev/null || echo none)"
          if [[ "$(git rev-parse HEAD)" != "${ORIGIN_TIP}" ]]; then
            if ! git push origin "HEAD:${TARGET}"; then
              # main 受分支保护时退回开自动 PR
              BR="cross-end-auto-${{ github.run_id }}"
              git checkout -b "${BR}"
              git push origin "${BR}"
              gh pr create --title "chore(cross-end): auto-sync RN & miniapp" \
                --body "由 cross-end-sync 工作流自动派生(web→RN→小程序),跨端门禁全绿。" \
                --base "${TARGET}"
            fi
          else
            echo "本地与远端同 tip,无需推送"
          fi

      - name: 汇总报告(job summary)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## 跨端级联同步报告"
            echo ""
            echo "事件: \`${{ github.event_name }}\` · 分支: \`${GITHUB_REF_NAME}\` · 可写: \`${{ steps.can-write.outputs.can_write }}\`"
            echo ""
            echo '<details><summary>详细 JSON</summary>'
            echo ''
            echo '```json'
            if [[ -f cascade-apply.json ]]; then cat cascade-apply.json; else cat cascade-preview.json 2>/dev/null; fi
            echo '```'
            echo ''
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 门禁红则失败(进度已落地,仅拦合并)
        if: steps.can-write.outputs.can_write == 'true'
        shell: bash
        run: |
          set -euo pipefail
          RC="${{ steps.apply.outputs.apply_rc }}"
          if [[ "${RC}" != "0" ]]; then
            echo "::error::跨端门禁未全绿(退出码 ${RC})。派生进度已自动落地并推送,下一轮会继续收敛;本检查仅拦合并,不拦推进。"
            exit "${RC}"
          fi

      - name: 上传产物(便于排查)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-end-cascade-report
          path: |
            cascade-apply.json
            cascade-preview.json
          if-no-files-found: ignore
# ⁠​‌​​‌​​‌‍‍​‌​​‌​​​‍‍​‌​‌​‌​‌‍‍​‌​​‌​​‌‍‍​​‌​‌‌​‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌​​‌‌‌‌​‌​‍‍‌‌​‌‌​​​‌​​​‌‌‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌‌​‌​​‌‌‌​‍‍‌‌​​‌‌​​​‌​​‌​‌‍‍‌​‌‌‌​‌‌‌​‌‌‌​‌‍‍‌​‌‌​‌‌‌‍‍​‌​​‌‌​​‍‍​‌​​​​‌‌‍‍‌​‌‌​‌‌‌‍‍​‌‌​​​​‌‍‍​‌‌​‌​​‌‍‍​‌‌‌‌​‌​‍‍​‌‌​‌​​​‍‍​‌‌‌​​‌‌‍‍​​‌​‌‌‌​‍‍​‌‌‌​‌​​‍‍​‌‌​‌‌‌‌‍‍​‌‌‌​​​​‍‍‌​‌‌​‌‌‌‍‍​‌​‌​​​​‍‍​‌​‌​​‌​‍‍​‌​​‌‌‌‌‍‍​‌​‌​‌‌​‍‍​‌​​​‌​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​‌‌‍‍​‌​​​‌​‌‍‍​​‌​‌‌​‌‍‍​​‌‌​​‌​‍‍​​‌‌​​​​‍‍​​‌‌​​‌​‍‍​​‌‌​‌‌​⁠
