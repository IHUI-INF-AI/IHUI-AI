name: cross-end-sync

# 作用:把 scripts/sync-cross-end-cascade.mjs(已实现的 web→RN→小程序 一键级联)接入 CI,
#       实现「改 web/shared/design-tokens/ui → 自动派生 RN/小程序 → 自动落地 → 跨端门禁红才拦」。
# 全自动:同仓人工作者 PR 直接落到源分支;main 受分支保护则落到**固定分支 cross-end-auto**并复用同一个 PR
# (2026-11-08 改:旧实现直推失败就新建 cross-end-auto-<run_id>+新 PR,46.8h 长出 58 支快照、派生件一条没进 main);
# 2026-11-09 改:bot / Dependabot PR 一律只读预览,绝不把派生提交直推到其源分支(旧口径只判 fork,
#   实测已污染 4 支 dependabot/* 依赖升级分支与人工 PR fix/delivery-1109)。
# 门禁(36/93/128/237/259/285/290/291 等)全绿才自批 CI + 开 auto-merge,红则只更新落地分支。
# 仅 stage 跨端派生可能改动的目录,绝不碰任何人的未提交 WIP。

on:
  push:
    branches: [main, develop, release/*]
    paths:
      - 'apps/web/**'
      - 'apps/mobile-rn/**'
      - 'apps/miniapp-taro/**'
      - 'packages/design-tokens/**'
      - 'packages/ui-react/**'
      - 'packages/ui-native/**'
      - 'packages/shared/**'
      - 'scripts/sync-cross-end-cascade.mjs'
      - 'scripts/gen-*.mjs'
      - 'scripts/land-*.mjs'
      - 'scripts/parity-auto.mjs'
      - 'scripts/check-*.mjs'
      - 'scripts/heal-*.mjs'
      - 'scripts/plan-rn-token-pairing.mjs'
      - '.github/workflows/cross-end-sync.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/web/**'
      - 'apps/mobile-rn/**'
      - 'apps/miniapp-taro/**'
      - 'packages/design-tokens/**'
      - 'packages/ui-react/**'
      - 'packages/ui-native/**'
      - 'packages/shared/**'
      - 'scripts/sync-cross-end-cascade.mjs'
      - 'scripts/gen-*.mjs'
      - 'scripts/land-*.mjs'
      - 'scripts/parity-auto.mjs'
      - 'scripts/check-*.mjs'
      - 'scripts/heal-*.mjs'
      - 'scripts/plan-rn-token-pairing.mjs'
  workflow_dispatch:
  schedule:
    # 每 6 小时自巡检兜底(弥补守护巡检节拍 + 跨会话并发漏跑)
    - cron: '23 */6 * * *'

permissions:
  contents: write
  pull-requests: write
  checks: write
  # 2026-11-08:bot 自己创建的 PR 的 pull_request run 恒为 action_required(不产生 required check),
  # 需用 actions:write 自批该 run / 重跑已完成失败的 run,让 check 真正落到落地分支的 head SHA。
  actions: write

concurrency:
  # 按**落地基线**分组(PR 事件取 base.ref):同一基线的运行串行,避免两条 run 并发 force-push
  # 同一个固定落地分支 cross-end-auto。
  group: cross-end-sync-${{ github.event.pull_request.base.ref || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11.18.0'
  # 自动落地提交的哨兵标记:含此标记的提交会被本工作流跳过,避免自触发死循环
  AUTO_MARK: '[cross-end-auto]'

jobs:
  cascade:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 判定是否可写(同仓人工作者 PR 才自动落地,fork / bot / Dependabot PR 仅出报告)
        id: can-write
        shell: bash
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          HEAD_MSG="${{ github.event.head_commit.message }}"
          if [[ "${HEAD_MSG}" == *"${AUTO_MARK}"* ]]; then
            echo "检测到自触发哨兵标记,跳过以避免死循环"
            echo "can_write=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # 2026-11-09 根因:旧口径只判 fork,同仓的 bot / Dependabot PR 被判可写,
            # 派生提交经 git push origin HEAD:${github.head_ref} 直推进其源分支,把纯依赖升级 PR
            # 污染成跨端派生 PR(实测 4 支 dependabot/* + 人工 PR fix/delivery-1109)。
            # 这类 PR 只出只读漂移报告,绝不落地。
            if [[ "${PR_HEAD_REF}" == dependabot/* ]] || [[ "${PR_AUTHOR}" == *"[bot]"* ]]; then
              echo "bot / Dependabot PR(author=${PR_AUTHOR} head=${PR_HEAD_REF}):仅只读报告"
              echo "can_write=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "${PR_HEAD_REPO}" == "${{ github.repository }}" ]]; then
              echo "can_write=true" >> "$GITHUB_OUTPUT"
            else
              echo "fork PR:仅只读报告" >> "$GITHUB_OUTPUT"
              echo "can_write=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "can_write=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 配置 pnpm + Node
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 安装依赖(级联与各 check 仅用 node:*/同目录 lib,无需 build)
        run: pnpm install --frozen-lockfile

      - name: 运行跨端级联(web→RN→小程序,自动落地)
        if: steps.can-write.outputs.can_write == 'true'
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node scripts/sync-cross-end-cascade.mjs --apply --json > cascade-apply.json && RC=0 || RC=$?
          echo "apply_rc=${RC}" >> "$GITHUB_OUTPUT"

      - name: 只读预览(不可写时出漂移报告)
        if: steps.can-write.outputs.can_write != 'true'
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          node scripts/sync-cross-end-cascade.mjs --json > cascade-preview.json && RC=0 || RC=$?
          echo "preview_rc=${RC}" >> "$GITHUB_OUTPUT"

      - name: 落地派生结果(固定分支 + 复用同一 PR + 自批 CI + auto-merge)
        # 2026-11-08 重写:旧实现「直推失败 ⇒ 每次 run 新建 cross-end-auto-<run_id> + 一个新 PR」,
        # 46.8h 长出 58 支快照 / 58 个 PR / 仅 9 个 patch-id,派生件全躺在分支上,一条都没进 main。
        #
        # 直推 main 为什么恒失败(2026-11-08 现读分支保护 + 实测,是保护规则/token 身份,不是权限不足):
        #   ① main 保护 = require PR + required check「lint-typecheck-test」(app 15368);
        #      enforce_admins=false 只对「人」生效,GITHUB_TOKEN 是 App 身份 ⇒ 直推恒 GH006。
        #   ② GITHUB_TOKEN 推送的 commit 不触发 push run;PR 的 pull_request run 因作者是
        #      github-actions[bot],被判为外部协作者 ⇒ conclusion=action_required,**不产生 check-run**
        #      (实测 58 个快照 PR 的 head SHA check-runs 全为 0 ⇒ required check 永远「Expected」)。
        #   ⇒ 不动仓库保护、不加新 secret 的唯一出路:工作流用 actions:write 自己批准该 run,
        #      让 check 真正落到 head SHA;门禁全绿才开 auto-merge,等 required check 绿后自动 squash 进 main。
        #
        # 口径不变:门禁红也推进(只更新固定分支,不开 auto-merge),避免死循环;
        #           全绿时带 [cross-end-auto] 哨兵,下一轮 push 自跳过。
        if: steps.can-write.outputs.can_write == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git config user.name "ihui-cross-end-bot"
          git config user.email "bot@ihui.top"
          RC="${{ steps.apply.outputs.apply_rc }}"
          RC="${RC:-1}"
          # 只 stage 跨端派生可能改动的目录,绝不碰他人 WIP
          git add apps/mobile-rn apps/miniapp-taro packages/design-tokens packages/ui-native packages/shared apps/web
          if ! git diff --cached --quiet; then
            MARK=""
            if [[ "${RC}" == "0" ]]; then MARK=" ${AUTO_MARK}"; fi
            git commit -m "chore(cross-end): auto-sync RN & miniapp from web${MARK}"
          else
            echo "无工作树派生变更"
          fi
          # 造页器(object-space-land)可能已把小程序页直接落进本地分支 HEAD,
          # 即便没有工作树变更也要把本地领先远端的提交推上去,否则下一轮 checkout 会把进度吞掉。
          TARGET="${GITHUB_REF_NAME}"
          BASE_REF="${GITHUB_REF_NAME}"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            TARGET="${{ github.head_ref }}"
            BASE_REF="${PR_BASE}"
          fi
          # 双保险:即便上游判定被绕过,也绝不把派生提交推到 bot / Dependabot 的依赖升级分支。
          if [[ "${TARGET}" == dependabot/* ]]; then
            echo "::warning::目标 ${TARGET} 属 Dependabot 源分支,跳过直推(仅只读报告)"
            exit 0
          fi
          ORIGIN_TIP="$(git rev-parse "origin/${TARGET}" 2>/dev/null || echo none)"
          if [[ "$(git rev-parse HEAD)" == "${ORIGIN_TIP}" ]]; then
            echo "本地与远端同 tip,无需推送"
            exit 0
          fi
          if git push origin "HEAD:${TARGET}"; then
            echo "已直推 ${TARGET}(非保护分支),无需落地 PR"
            exit 0
          fi
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            echo "::warning::PR 源分支不可直推,跳过落地(绝不新建快照分支)"
            exit 0
          fi

          # 固定落地分支:默认分支用 cross-end-auto;其它基线按 ref 派生一份,避免互相覆盖
          LAND_BRANCH="cross-end-auto"
          if [[ "${BASE_REF}" != "${{ github.event.repository.default_branch }}" ]]; then
            LAND_BRANCH="cross-end-auto-${BASE_REF//\//-}"
          fi
          echo "直推 ${TARGET} 被保护规则拒绝 ⇒ 落到固定分支 ${LAND_BRANCH}(base=${BASE_REF})"

          # 原地重建落地分支(每轮 = base tip + 本轮派生提交),不再堆叠提交、不再新建分支
          git checkout -B "${LAND_BRANCH}"
          REMOTE_SHA="$(git ls-remote --heads origin "${LAND_BRANCH}" | awk '{print $1}')"
          if [[ -n "${REMOTE_SHA}" ]]; then
            git push --force-with-lease="refs/heads/${LAND_BRANCH}:${REMOTE_SHA}" origin "HEAD:refs/heads/${LAND_BRANCH}"
          else
            git push origin "HEAD:refs/heads/${LAND_BRANCH}"
          fi

          # 复用同一个 PR(head+base 唯一):存在就更新,不存在才创建
          PR_NUM="$(gh pr list --head "${LAND_BRANCH}" --base "${BASE_REF}" --state open --json number --jq '.[0].number // empty')"
          if [[ -z "${PR_NUM}" ]]; then
            PR_URL="$(gh pr create --head "${LAND_BRANCH}" --base "${BASE_REF}" \
              --title "chore(cross-end): auto-sync RN & miniapp" \
              --body "由 cross-end-sync 工作流自动派生(web→RN→小程序)。固定落地分支 ${LAND_BRANCH}:每轮原地更新,不再新建快照分支。")"
            PR_NUM="$(gh pr view "${PR_URL}" --json number --jq '.number')"
            echo "新建落地 PR #${PR_NUM}"
          else
            gh pr edit "${PR_NUM}" --body "由 cross-end-sync 工作流自动派生(web→RN→小程序)。固定落地分支 ${LAND_BRANCH}:每轮原地更新,不再新建快照分支。本轮门禁 rc=${RC}。" >/dev/null 2>&1 \
              || echo "::warning::更新 PR #${PR_NUM} 描述失败(不阻断落地)"
            echo "复用落地 PR #${PR_NUM}"
          fi

          if [[ "${RC}" != "0" ]]; then
            echo "门禁 rc=${RC},本轮只更新落地分支,不开启 auto-merge"
            exit 0
          fi

          # bot 自己创建的 PR 的 pull_request run 处于 action_required(不产生 check-run);
          # 用 actions:write 自批,让 required check 真正落到 head SHA;已完成失败的 run 则重跑。
          SHA="$(git rev-parse HEAD)"
          FINAL_STATE="unknown"
          for i in 1 2 3 4 5; do
            RUNS="$(gh api "repos/${REPO}/actions/runs?head_sha=${SHA}&per_page=30" \
              --jq '.workflow_runs[] | select(.path == ".github/workflows/ci.yml") | [.id, .status, .conclusion] | @tsv' 2>/dev/null || true)"
            PENDING="$(echo "${RUNS}" | awk -F'\t' '$2=="completed" && $3=="action_required" {print $1; exit}')"
            SUCCESS="$(echo "${RUNS}" | awk -F'\t' '$2=="completed" && $3=="success" {print $1; exit}')"
            FAILED="$(echo "${RUNS}" | awk -F'\t' '$2=="completed" && ($3=="failure" || $3=="cancelled" || $3=="timed_out") {print $1; exit}')"
            RUNNING="$(echo "${RUNS}" | awk -F'\t' '($2=="in_progress" || $2=="queued" || $2=="requested" || $2=="waiting") {print $1; exit}')"
            if [[ -n "${PENDING}" ]]; then
              if gh api -X POST "repos/${REPO}/actions/runs/${PENDING}/approve" >/dev/null 2>&1; then
                echo "已批准待审 CI run ${PENDING}(让 required check 落在 ${SHA})"
                FINAL_STATE="approved"
                break
              fi
            elif [[ -n "${SUCCESS}" ]]; then
              FINAL_STATE="success"; echo "CI 已绿(run ${SUCCESS})"; break
            elif [[ -n "${FAILED}" ]]; then
              if gh api -X POST "repos/${REPO}/actions/runs/${FAILED}/rerun" >/dev/null 2>&1; then
                echo "CI 上一轮未绿,已重跑 run ${FAILED}"
                FINAL_STATE="rerun"
                break
              fi
            elif [[ -n "${RUNNING}" ]]; then
              FINAL_STATE="running"; echo "CI 运行中(run ${RUNNING}),保留 auto-merge 等待结论"; break
            fi
            sleep 12
          done
          if [[ "${FINAL_STATE}" == "unknown" ]]; then
            # 既无待审、也无任何 run(PR 事件派发被 GITHUB_TOKEN 抑制) ⇒ close/reopen 逼一次
            gh pr close "${PR_NUM}" >/dev/null 2>&1 || true
            gh pr reopen "${PR_NUM}" >/dev/null 2>&1 || true
            sleep 15
            RUNS="$(gh api "repos/${REPO}/actions/runs?head_sha=${SHA}&per_page=30" \
              --jq '.workflow_runs[] | select(.path == ".github/workflows/ci.yml") | [.id, .status, .conclusion] | @tsv' 2>/dev/null || true)"
            PENDING="$(echo "${RUNS}" | awk -F'\t' '$2=="completed" && $3=="action_required" {print $1; exit}')"
            if [[ -n "${PENDING}" ]]; then
              gh api -X POST "repos/${REPO}/actions/runs/${PENDING}/approve" >/dev/null 2>&1 \
                && echo "close/reopen 后已批准 CI run ${PENDING}" || true
            else
              echo "::warning::仍未取到该 SHA 的 CI run;auto-merge 可能停在 Expected"
            fi
          fi

          # 门禁全绿 ⇒ 开 auto-merge(仓库 allow_auto_merge=true;等 required check 绿后自动 squash 进 base)。
          # 已开启则跳过,避免每 6 小时重复调用刷 warning。
          AUTO_ON="$(gh pr view "${PR_NUM}" --json autoMergeRequest --jq 'if .autoMergeRequest then "yes" else "no" end' 2>/dev/null || echo no)"
          if [[ "${AUTO_ON}" == "yes" ]]; then
            echo "auto-merge 已开启(PR #${PR_NUM}),跳过"
          elif gh pr merge "${PR_NUM}" --auto --squash; then
            echo "已开启 auto-merge(PR #${PR_NUM} → ${BASE_REF})"
          else
            echo "::warning::auto-merge 未开启(PR #${PR_NUM});检查仓库 allow_auto_merge / 分支保护设置"
          fi

      - name: 汇总报告(job summary)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## 跨端级联同步报告"
            echo ""
            echo "事件: \`${{ github.event_name }}\` · 分支: \`${GITHUB_REF_NAME}\` · 可写: \`${{ steps.can-write.outputs.can_write }}\`"
            echo ""
            echo '<details><summary>详细 JSON</summary>'
            echo ''
            echo '```json'
            if [[ -f cascade-apply.json ]]; then cat cascade-apply.json; else cat cascade-preview.json 2>/dev/null; fi
            echo '```'
            echo ''
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 门禁红则失败(进度已落地,仅拦合并)
        if: steps.can-write.outputs.can_write == 'true'
        shell: bash
        run: |
          set -euo pipefail
          RC="${{ steps.apply.outputs.apply_rc }}"
          if [[ "${RC}" != "0" ]]; then
            echo "::error::跨端门禁未全绿(退出码 ${RC})。派生进度已自动落地并推送,下一轮会继续收敛;本检查仅拦合并,不拦推进。"
            exit "${RC}"
          fi

      - name: 上传产物(便于排查)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-end-cascade-report
          path: |
            cascade-apply.json
            cascade-preview.json
          if-no-files-found: ignore
# ⁠​‌​​‌​​‌‍‍​‌​​‌​​​‍‍​‌​‌​‌​‌‍‍​‌​​‌​​‌‍‍​​‌​‌‌​‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌​​‌‌‌‌​‌​‍‍‌‌​‌‌​​​‌​​​‌‌‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌‌​‌​​‌‌‌​‍‍‌‌​​‌‌​​​‌​​‌​‌‍‍‌​‌‌‌​‌‌‌​‌‌‌​‌‍‍‌​‌‌​‌‌‌‍‍​‌​​‌‌​​‍‍​‌​​​​‌‌‍‍‌​‌‌​‌‌‌‍‍​‌‌​​​​‌‍‍​‌‌​‌​​‌‍‍​‌‌‌‌​‌​‍‍​‌‌​‌​​​‍‍​‌‌‌​​‌‌‍‍​​‌​‌‌‌​‍‍​‌‌‌​‌​​‍‍​‌‌​‌‌‌‌‍‍​‌‌‌​​​​‍‍‌​‌‌​‌‌‌‍‍​‌​‌​​​​‍‍​‌​‌​​‌​‍‍​‌​​‌‌‌‌‍‍​‌​‌​‌‌​‍‍​‌​​​‌​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​‌‌‍‍​‌​​​‌​‌‍‍​​‌​‌‌​‌‍‍​​‌‌​​‌​‍‍​​‌‌​​​​‍‍​​‌‌​​‌​‍‍​​‌‌​‌‌​⁠
