name: Update Repository Metadata

# 自动更新仓库元数据(description / homepage / topics)
# 2026-07-26 立,提升 GitHub SEO 与曝光度
# 2026-07-26 触发:Workflow permissions 已启用 Read and write,GITHUB_TOKEN 可更新 topics
#
# 触发条件:
# 1. push 到 main(本文件改动时)
# 2. workflow_dispatch(手动触发)
# 3. schedule(每周一自动刷新,防止被手动改回)
#
# 权限说明:
# GITHUB_TOKEN 默认无 administration write 权限,本 workflow 声明 admin: write 尝试更新。
# 如果仓库 settings 里 "Workflow permissions" 设为 "Read and write permissions",
# 且 "Allow GitHub Actions to create and approve pull requests" 启用,本 workflow 可成功。
# 否则需要用户在 GitHub Settings → Actions → General → Workflow permissions 调整。

on:
  push:
    branches: [main]
    paths: ['.github/workflows/repo-metadata.yml']
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'  # 每周一 03:00 UTC

permissions:
  contents: read
  administration: write
  metadata: write

jobs:
  update-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update repository description & homepage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH /repos/${{ github.repository }} \
            -f description="IHUI AI — 全栈 AI 操作系统:Agent 市场 / 知识库 RAG / 多模型调度 / MCP / 8 端同源(Web/API/CLI/Desktop/Extension/Mobile/Miniapp)。Apache 2.0 开源,私有化部署。Dify/Coze/FastGPT/n8n 替代。" \
            -f homepage="https://ihui.ai" || echo "⚠️ 更新 description/homepage 失败(权限不足,需在 Settings → Actions → Workflow permissions 调整)"

      - name: Update repository topics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PUT /repos/${{ github.repository }}/topics \
            -f names[]=ai \
            -f names[]=ai-agent \
            -f names[]=ai-platform \
            -f names[]=llm \
            -f names[]=chatgpt \
            -f names[]=claude \
            -f names[]=rag \
            -f names[]=knowledge-base \
            -f names[]=mcp \
            -f names[]=model-context-protocol \
            -f names[]=agent-marketplace \
            -f names[]=langgraph \
            -f names[]=litellm \
            -f names[]=nextjs \
            -f names[]=fastify \
            -f names[]=react \
            -f names[]=typescript \
            -f names[]=monorepo \
            -f names[]=open-source \
            -f names[]=apache-2 || echo "⚠️ 更新 topics 失败(权限不足)"

      - name: Verify metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== 当前仓库元数据 ==="
          gh api /repos/${{ github.repository }} --jq '{description, homepage, topics}'
