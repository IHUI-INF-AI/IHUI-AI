name: Sync Downloads

on:
  workflow_dispatch:
  schedule:
    # 每天凌晨 3 点 UTC(北京时间 11 点)定时同步 extension 下载包
    - cron: '0 3 * * *'

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  sync:
    name: Sync Download Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Configure npm registry
        run: pnpm config set registry https://registry.npmmirror.com

      - name: Install pnpm deps
        run: pnpm install --no-frozen-lockfile

      - name: Build extension
        run: pnpm --filter @ihui/extension build

      - name: Sync downloads
        run: node scripts/sync-downloads.mjs

      # 动态刷新桌面下载快照(幂等;主要刷新时机在 release-desktop.yml,
      # 本步骤兜底 release workflow 提交失败或手动发布等情况)
      - name: Resolve desktop download feed
        run: node scripts/resolve-desktop-download.mjs

      - name: Check for changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain apps/web/public/downloads/ apps/web/src/config/desktop-feed.generated.ts)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit synced downloads
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/downloads/ apps/web/src/config/desktop-feed.generated.ts
          git commit -m "chore(downloads): auto-sync downloads + desktop feed $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: Summary
        run: |
          echo "### Downloads 同步完成" >> $GITHUB_STEP_SUMMARY
          echo "触发方式: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "extension 下载包已同步到 apps/web/public/downloads/" >> $GITHUB_STEP_SUMMARY
          echo "桌面下载快照 desktop-feed.generated.ts 已刷新(版本/URL/大小自动解析)" >> $GITHUB_STEP_SUMMARY
          echo "变更状态: ${{ steps.changes.outputs.changed }}" >> $GITHUB_STEP_SUMMARY
# ⁠​‌​​‌​​‌‍‍​‌​​‌​​​‍‍​‌​‌​‌​‌‍‍​‌​​‌​​‌‍‍​​‌​‌‌​‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌​​‌‌‌‌​‌​‍‍‌‌​‌‌​​​‌​​​‌‌‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌‌​‌​​‌‌‌​‍‍‌‌​​‌‌​​​‌​​‌​‌‍‍‌​‌‌‌​‌‌‌​‌‌‌​‌‍‍‌​‌‌​‌‌‌‍‍​‌​​‌‌​​‍‍​‌​​​​‌‌‍‍‌​‌‌​‌‌‌‍‍​‌‌​​​​‌‍‍​‌‌​‌​​‌‍‍​‌‌‌‌​‌​‍‍​‌‌​‌​​​‍‍​‌‌‌​​‌‌‍‍​​‌​‌‌‌​‍‍​‌‌‌​‌​​‍‍​‌‌​‌‌‌‌‍‍​‌‌‌​​​​‍‍‌​‌‌​‌‌‌‍‍​‌​‌​​​​‍‍​‌​‌​​‌​‍‍​‌​​‌‌‌‌‍‍​‌​‌​‌‌​‍‍​‌​​​‌​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​‌‌‍‍​‌​​​‌​‌‍‍​​‌​‌‌​‌‍‍​​‌‌​​‌​‍‍​​‌‌​​​​‍‍​​‌‌​​‌​‍‍​​‌‌​‌‌​⁠
