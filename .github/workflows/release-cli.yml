name: Release CLI

on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. cli-v1.0.0)'
        required: true

permissions:
  contents: write
  packages: write
  # --provenance 通过 Sigstore keyless 签发,必须先换 GitHub OIDC token;
  # 缺这一条发布步会直接失败(npm ERR! --provenance flag requires OIDC token)。
  id-token: write

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9'

jobs:
  # ---------- Job 1: npm publish ----------
  npm-publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # NPM_TOKEN 未配置前 publish 必败(匿名 PUT 404)—— continue-on-error 让二进制/Docker
    # 链不被拖死;token 配好后(NPM_TOKEN secret)移除此行恢复硬门。
    # 另:@ihui scope 已被第三方占用(2026-10-18 实证),npm 恢复前须先定新包名。
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        # 2026-09-26 起改用拓扑选择器 `^...`(= 该包的**全部 workspace 依赖**,不含本包):
        # 本仓已有 7 个包 exports 指 dist(cli/i18n/design-tokens/types/dom-actions/api-client/
        # context-compaction),**手工点名"要先建哪几个包"必然落后于新增** —— 落后一次的形态是
        # "CI 恒红而本地全绿"(守门 72/78 同族)。选择器由 pnpm 从包图算,加包不再需要改本文件。
        run: pnpm --filter "ihui-cli^..." run build && pnpm --filter ihui-cli build

      - name: Typecheck
        run: pnpm --filter ihui-cli typecheck

      - name: Publish to npm
        run: pnpm --filter ihui-cli publish --no-git-checks --access public --provenance
        # --provenance(2026-10-18):Sigstore keyless 免费供应链证明 —— npm 页面显示
        # "Verified from github.com/IHUI-INF-AI/IHUI-AI" 徽章,零费用零凭据
        # (public repo + GitHub Actions 即生效),与 Windows 侧 Authenticode 互补。
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          echo "### npm 发布完成" >> $GITHUB_STEP_SUMMARY
          echo "包名: \`ihui-cli\`" >> $GITHUB_STEP_SUMMARY
          echo "安装: \`npm install -g ihui-cli\`" >> $GITHUB_STEP_SUMMARY

  # ---------- Job 2: Build binaries ----------
  build-binary:
    name: Build Binaries (${{ matrix.os }}-${{ matrix.arch }})
    # 2026-10-18 起与 npm-publish 解耦:NPM_TOKEN 未配置/包名未定时二进制发布照常
    needs: []
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x64
            runner: ubuntu-latest
            asset_name: ihui-linux-x64.tar.gz
          - os: linux
            arch: arm64
            runner: ubuntu-latest
            asset_name: ihui-linux-arm64.tar.gz
          - os: macos
            arch: x64
            runner: macos-13
            asset_name: ihui-macos-x64.tar.gz
          - os: macos
            arch: arm64
            runner: macos-latest
            asset_name: ihui-macos-arm64.tar.gz
          - os: windows
            arch: x64
            runner: windows-latest
            asset_name: ihui-windows-x64.zip
          - os: windows
            arch: arm64
            runner: windows-latest
            asset_name: ihui-windows-arm64.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        # 2026-09-26 起改用拓扑选择器 `^...`(= 该包的**全部 workspace 依赖**,不含本包):
        # 本仓已有 7 个包 exports 指 dist(cli/i18n/design-tokens/types/dom-actions/api-client/
        # context-compaction),**手工点名"要先建哪几个包"必然落后于新增** —— 落后一次的形态是
        # "CI 恒红而本地全绿"(守门 72/78 同族)。选择器由 pnpm 从包图算,加包不再需要改本文件。
        run: pnpm --filter "ihui-cli^..." run build && pnpm --filter ihui-cli build

      - name: Build SEA binary
        # 2026-10-18 起统一走 apps/cli/scripts/build-sea.mjs(esbuild bundle → SEA blob
        # → postject 注入):旧内联配方(自写 sea-config.json + npx postject)没有
        # esbuild bundle、没有 IHUI_BUNDLED/版本注入、没有 i18n 语言包 assets、
        # 不随包携带 package.json,产物有真实缺陷 —— 与本地构建分叉的形态一律
        # 收口到同一脚本。产物在 apps/cli/dist-sea/(Windows: ihui.exe;
        # 非 Windows: ihui),旁带 package.json。
        run: pnpm --filter ihui-cli build:sea

      - name: Package (Linux/macOS)
        if: matrix.os != 'windows'
        shell: bash
        run: |
          mkdir -p artifacts
          # 随包携带 package.json(build-sea 产物旁自带)
          tar -czf artifacts/${{ matrix.asset_name }} -C apps/cli/dist-sea ihui package.json

      - name: Package (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path apps\cli\dist-sea\ihui.exe, apps\cli\dist-sea\package.json `
            -DestinationPath artifacts\${{ matrix.asset_name }}

      - name: Verify binary
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows" ]; then
            ./apps/cli/dist-sea/ihui.exe --version || true
          else
            ./apps/cli/dist-sea/ihui --version || true
          fi

      - name: Generate SHA256 checksum (Linux/macOS)
        if: matrix.os != 'windows'
        shell: bash
        run: |
          # sha256sum 标准格式:`<sha256>  <文件名>`(两空格)
          cd artifacts
          sha256sum ${{ matrix.asset_name }} > SHA256SUMS-${{ matrix.os }}-${{ matrix.arch }}.txt

      - name: Generate SHA256 checksum (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          # 与 sha256sum 标准格式对齐:`<sha256>  <文件名>`(两空格),LF 行尾
          $asset = "${{ matrix.asset_name }}"
          $hash = (Get-FileHash -Algorithm SHA256 "artifacts\$asset").Hash.ToLower()
          [IO.File]::WriteAllText(
            (Join-Path (Get-Location) "artifacts\SHA256SUMS-${{ matrix.os }}-${{ matrix.arch }}.txt"),
            "$hash  $asset`n")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            artifacts/${{ matrix.asset_name }}
            artifacts/SHA256SUMS-${{ matrix.os }}-${{ matrix.arch }}.txt

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/${{ matrix.asset_name }}
            artifacts/SHA256SUMS-${{ matrix.os }}-${{ matrix.arch }}.txt
          generate_release_notes: true
          draft: false
          prerelease: false

  # ---------- Job 3: Build Docker image ----------
  build-docker:
    name: Build & Push Docker Image
    needs: []
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set tag variable
        id: vars
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG" ] || [ "$TAG" = "$GITHUB_REF" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          VERSION="${TAG#cli-v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ihui/ai-cli
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.vars.outputs.version }}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/docker/Dockerfile.cli
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Docker 镜像推送完成" >> $GITHUB_STEP_SUMMARY
          echo "镜像: \`ghcr.io/ihui/ai-cli:${{ steps.vars.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "拉取: \`docker pull ghcr.io/ihui/ai-cli:${{ steps.vars.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "运行: \`docker run --rm -v \$(pwd):/workspace ghcr.io/ihui/ai-cli\`" >> $GITHUB_STEP_SUMMARY

  # ---------- Job 4: Generate changelog ----------
  release-summary:
    name: Release Summary
    needs: [build-binary, build-docker]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          configuration: |
            {
              "template": "## 变更内容\n\n{{#each commits}}\n* {{this.message.subject}}\n{{/each}}",
              "categories": [
                { "title": "新功能", "labels": ["feat", "feature"] },
                { "title": "修复", "labels": ["fix", "bugfix"] },
                { "title": "文档", "labels": ["docs"] },
                { "title": "其他", "labels": ["chore", "refactor"] }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release notes
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.changelog }}
          append_body: true

      - name: Summary
        run: |
          echo "### CLI Release 完成总结" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| npm publish | ${{ needs.npm-publish.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| build-binary | ${{ needs.build-binary.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| build-docker | ${{ needs.build-docker.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 安装方式" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "npm install -g ihui-cli" >> $GITHUB_STEP_SUMMARY
          echo "curl -fsSL https://aizhs.top/install.sh | bash" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

# ⁠​‌​​‌​​‌‍‍​‌​​‌​​​‍‍​‌​‌​‌​‌‍‍​‌​​‌​​‌‍‍​​‌​‌‌​‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌​​‌‌‌‌​‌​‍‍‌‌​‌‌​​​‌​​​‌‌‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌‌​‌​​‌‌‌​‍‍‌‌​​‌‌​​​‌​​‌​‌‍‍‌​‌‌‌​‌‌‌​‌‌‌​‌‍‍‌​‌‌​‌‌‌‍‍​‌​​‌‌​​‍‍​‌​​​​‌‌‍‍‌​‌‌​‌‌‌‍‍​‌‌​​​​‌‍‍​‌‌​‌​​‌‍‍​‌‌‌‌​‌​‍‍​‌‌​‌​​​‍‍​‌‌‌​​‌‌‍‍​​‌​‌‌‌​‍‍​‌‌‌​‌​​‍‍​‌‌​‌‌‌‌‍‍​‌‌‌​​​​‍‍‌​‌‌​‌‌‌‍‍​‌​‌​​​​‍‍​‌​‌​​‌​‍‍​‌​​‌‌‌‌‍‍​‌​‌​‌‌​‍‍​‌​​​‌​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​‌‌‍‍​‌​​​‌​‌‍‍​​‌​‌‌​‌‍‍​​‌‌​​‌​‍‍​​‌‌​​​​‍‍​​‌‌​​‌​‍‍​​‌‌​‌‌​⁠
