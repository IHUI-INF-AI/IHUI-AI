name: Release CLI

on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. cli-v1.0.0)'
        required: true

permissions:
  contents: write
  packages: write
  # --provenance 通过 Sigstore keyless 签发,必须先换 GitHub OIDC token;
  # 缺这一条发布步会直接失败(npm ERR! --provenance flag requires OIDC token)。
  id-token: write
  # SignPath 签名请求需回读本次 run 的 workflow artifact(upload-artifact 产物);
  # 显式声明 permissions 块后未列出的 scope 一律为 none,缺这条签名步会读不到 artifact。
  actions: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9'

jobs:
  # ---------- Job 1: npm publish ----------
  npm-publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # 2026-10-19 定案:不启用 2FA → 不登记 Trusted Publisher。发布实际走 secrets.NPM_PUBLISH_TOKEN
    # (granular token,bypass_2fa),OIDC/--provenance 仅作前向兼容保留,失败会自动回退。
    # 首版 1.0.0 已 bootstrap 完成(docs/npm-publish-guide.md §7.2)。
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          # 不写 registry-url:那会生成 //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN},
          # 而 Trusted Publishing 恰恰不能带长期 token。registry 由 package.json 的
          # publishConfig.registry 锁定,install 走默认 registry.npmjs.org。

      - name: Upgrade npm (Trusted Publishing 需 npm >= 11.5.1)
        # Node 22 自带的 npm 10.x 不认识 OIDC 换取流程,会直接按未登录处理。
        run: npm install -g npm@^11.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        # 2026-09-26 起改用拓扑选择器 `^...`(= 该包的**全部 workspace 依赖**,不含本包):
        # 本仓已有 7 个包 exports 指 dist(cli/i18n/design-tokens/types/dom-actions/api-client/
        # context-compaction),**手工点名"要先建哪几个包"必然落后于新增** —— 落后一次的形态是
        # "CI 恒红而本地全绿"(守门 72/78 同族)。选择器由 pnpm 从包图算,加包不再需要改本文件。
        run: pnpm --filter "ihui-cli^..." run build && pnpm --filter ihui-cli build

      - name: Typecheck
        run: pnpm --filter ihui-cli typecheck

      - name: Build npm bundle
        # 单文件 esbuild bundle → apps/cli/npm-dist/(自带 dist/messages 语言包、
        # 无 dependencies):tsc 产物保留 `import '@ihui/shared'` 且依赖 workspace:*
        # 私有包,直接 publish 出去的包装不上也跑不起来(docs/npm-publish-guide.md §11)。
        run: pnpm --filter ihui-cli build:npm

      - name: Probe npm registry
        id: probe
        # Trusted Publishing 不能给不存在的包登记 publisher。首版 1.0.0 已 bootstrap,
        # 正常情况下恒为 exists=true;exists=false 只应出现在 registry 不可达等异常场景。
        run: |
          if npm view ihui-cli version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::npm view ihui-cli 失败(包已存在,疑似 registry 不可达),本次跳过 npm 发布"
          fi

      - name: Publish to npm
        if: steps.probe.outputs.exists == 'true'
        # 既定方案:不使用 2FA,故不登记 Trusted Publisher,OIDC 必然失败 →
        # 直接回退 NPM_PUBLISH_TOKEN(granular token,bypass_2fa)发布。
        # 保留 OIDC 首次尝试仅作为"万一将来登记了"的前向兼容;失败属预期,不是故障。
        env:
          NPM_PUBLISH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: |
          if npm publish ./npm-dist --access public --provenance; then
            echo "published via OIDC provenance"
          elif [ -n "$NPM_PUBLISH_TOKEN" ]; then
            echo "::notice::OIDC 不可用(项目不启用 2FA / 未登记 Trusted Publisher),按既定方案回退 token 发布"
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_PUBLISH_TOKEN" > ~/.npmrc
            npm publish ./npm-dist --access public
          else
            echo "::error::OIDC 发布失败且未配置 NPM_PUBLISH_TOKEN"
            exit 1
          fi

      - name: Summary
        run: |
          echo "### npm 发布" >> $GITHUB_STEP_SUMMARY
          echo "包名: \`ihui-cli\` · 已存在: ${{ steps.probe.outputs.exists }}" >> $GITHUB_STEP_SUMMARY
          echo "安装: \`npm install -g ihui-cli\`" >> $GITHUB_STEP_SUMMARY

  # ---------- Job 2: Build binaries ----------
  build-binary:
    name: Build Binaries (${{ matrix.os }}-${{ matrix.arch }})
    # 与 npm-publish 完全解耦(needs: []):npm 侧无论 bootstrap 与否,6 平台二进制照常发布
    needs: []
    runs-on: ${{ matrix.runner }}
    env:
      # SignPath 通道开关:四项凭据齐备才置 true(step-level if 不支持 secrets 上下文,
      # 故先在此折算成 env)。未配置时签名相关步骤整体跳过,发布保持现状(未签名 exe)。
      SIGNPATH_CONFIGURED: ${{ secrets.SIGNPATH_API_TOKEN != '' && secrets.SIGNPATH_ORGANIZATION_ID != '' && secrets.SIGNPATH_PROJECT_SLUG != '' && secrets.SIGNPATH_SIGNING_POLICY_SLUG != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x64
            runner: ubuntu-latest
            asset_name: ihui-linux-x64.tar.gz
          - os: linux
            arch: arm64
            runner: ubuntu-latest
            asset_name: ihui-linux-arm64.tar.gz
          # macos-13 已退役(2025-12-04,GitHub 官方 changelog),x64 唯一免费标准标签=macos-15-intel;
          # 用 macos-latest 会拿到 Apple Silicon,产出 arm64 产物与 asset_name 不符
          - os: macos
            arch: x64
            runner: macos-15-intel
            asset_name: ihui-macos-x64.tar.gz
          - os: macos
            arch: arm64
            runner: macos-latest
            asset_name: ihui-macos-arm64.tar.gz
          - os: windows
            arch: x64
            runner: windows-latest
            asset_name: ihui-windows-x64.zip
          - os: windows
            arch: arm64
            runner: windows-latest
            asset_name: ihui-windows-arm64.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        # 2026-09-26 起改用拓扑选择器 `^...`(= 该包的**全部 workspace 依赖**,不含本包):
        # 本仓已有 7 个包 exports 指 dist(cli/i18n/design-tokens/types/dom-actions/api-client/
        # context-compaction),**手工点名"要先建哪几个包"必然落后于新增** —— 落后一次的形态是
        # "CI 恒红而本地全绿"(守门 72/78 同族)。选择器由 pnpm 从包图算,加包不再需要改本文件。
        run: pnpm --filter "ihui-cli^..." run build && pnpm --filter ihui-cli build

      - name: Build SEA binary
        # 2026-10-18 起统一走 apps/cli/scripts/build-sea.mjs(esbuild bundle → SEA blob
        # → postject 注入):旧内联配方(自写 sea-config.json + npx postject)没有
        # esbuild bundle、没有 IHUI_BUNDLED/版本注入、没有 i18n 语言包 assets、
        # 不随包携带 package.json,产物有真实缺陷 —— 与本地构建分叉的形态一律
        # 收口到同一脚本。产物在 apps/cli/dist-sea/(Windows: ihui.exe;
        # 非 Windows: ihui),旁带 package.json。
        run: pnpm --filter ihui-cli build:sea

      # ---------- SignPath 代码签名(仅 Windows;凭据齐备才启用) ----------
      # 时序硬约束:build-sea.mjs 的最后一步是 postject 注入 NODE_SEA_BLOB(改写 PE 尾部),
      # 任何注入前的签名都会被它破坏 —— 故签名必须落在 build:sea 之后、打包与算哈希之前。
      # 同时必须早于 Package (Windows)/Generate SHA256 checksum:否则 zip 里仍是未签名 exe、
      # SHA256SUMS 记录的是未签名哈希。
      # SignPath 侧需预先配置 artifact configuration(根为 <zip-file>,内含 ihui.exe 的
      # PE 签名项),否则默认配置会因找不到可签名对象而报错。
      - name: Upload unsigned binary for signing (Windows)
        if: matrix.os == 'windows' && env.SIGNPATH_CONFIGURED == 'true'
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          # 与后面的发布 artifact 用不同 name,避免同名冲突
          name: unsigned-ihui-windows-${{ matrix.arch }}
          path: apps/cli/dist-sea/ihui.exe
          if-no-files-found: error
          retention-days: 1

      - name: Submit SignPath signing request (Windows)
        if: matrix.os == 'windows' && env.SIGNPATH_CONFIGURED == 'true'
        id: signpath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # SignPath Foundation 人工审批可能排队,600s 默认值不够
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Replace binary with signed artifact (Windows)
        if: matrix.os == 'windows' && env.SIGNPATH_CONFIGURED == 'true'
        shell: pwsh
        run: |
          # SignPath 回传物形态取决于 artifact configuration:根为 <zip-file> 时是 zip,
          # 根为 PE 文件时是裸 exe。两种都收:先找 exe,找不到就解压 zip 再找。
          $signed = Get-ChildItem -Path signed -Filter ihui.exe -Recurse -File |
            Select-Object -First 1
          if (-not $signed) {
            Get-ChildItem -Path signed -Filter *.zip -Recurse -File | ForEach-Object {
              Expand-Archive -Path $_.FullName -DestinationPath signed -Force
            }
            $signed = Get-ChildItem -Path signed -Filter ihui.exe -Recurse -File |
              Select-Object -First 1
          }
          if (-not $signed) { throw "签名产物中未找到 ihui.exe" }
          Copy-Item $signed.FullName apps\cli\dist-sea\ihui.exe -Force
          Write-Host "signed: $($signed.FullName) ($($signed.Length) bytes)"

      - name: Verify Authenticode signature (Windows)
        if: matrix.os == 'windows' && env.SIGNPATH_CONFIGURED == 'true'
        shell: pwsh
        run: |
          # 签名链必须 Valid;不是 Valid 就让流水线红掉,不允许把未签名/坏签名产物发出去
          $sig = Get-AuthenticodeSignature apps\cli\dist-sea\ihui.exe
          Write-Host "Status: $($sig.Status)"
          Write-Host "Subject: $($sig.SignerCertificate.Subject)"
          Write-Host "Issuer:  $($sig.SignerCertificate.Issuer)"
          if ($sig.Status -ne 'Valid') {
            throw "Authenticode 校验失败: $($sig.Status) / $($sig.StatusMessage)"
          }
          Write-Host "SHA256: $((Get-FileHash -Algorithm SHA256 apps\cli\dist-sea\ihui.exe).Hash.ToLower())"
          "### 签名状态`n- Status: $($sig.Status)`n- Subject: $($sig.SignerCertificate.Subject)" >> $env:GITHUB_STEP_SUMMARY

      # 凭据不齐时上面三步整体跳过 ⇒ 流水线照绿、产物照发,但发出去的是**未签名 exe**,
      # 用户端 SmartScreen 警告一分不减。这类"静默降级"本仓的口径是不许无声:
      # 这里显式打一条 warning 注解 + 写进 job 摘要,让 green 不被读成 signed。
      - name: Report unsigned fallback (Windows)
        if: matrix.os == 'windows' && env.SIGNPATH_CONFIGURED != 'true'
        shell: pwsh
        run: |
          '::warning::SignPath 未启用(SIGNPATH_CONFIGURED=false):四项 secret 缺任一项即整体跳过签名,本次发布的 Windows 二进制未签名,用户仍会撞 SmartScreen。'
          "### 签名状态`n- ⚠️ 未签名:`$env:SIGNPATH_CONFIGURED != true`(缺凭据即静默跳过,不代表已签名)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Package (Linux/macOS)
        if: matrix.os != 'windows'
        shell: bash
        run: |
          mkdir -p artifacts
          # 随包携带 package.json(build-sea 产物旁自带)
          tar -czf artifacts/${{ matrix.asset_name }} -C apps/cli/dist-sea ihui package.json

      - name: Package (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path apps\cli\dist-sea\ihui.exe, apps\cli\dist-sea\package.json `
            -DestinationPath artifacts\${{ matrix.asset_name }}

      - name: Verify binary
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows" ]; then
            ./apps/cli/dist-sea/ihui.exe --version || true
          else
            ./apps/cli/dist-sea/ihui --version || true
          fi

      - name: Generate SHA256 checksum (Linux/macOS)
        if: matrix.os != 'windows'
        shell: bash
        run: |
          # sha256sum 标准格式:`<sha256>  <文件名>`(两空格)
          cd artifacts
          sha256sum ${{ matrix.asset_name }} > SHA256SUMS-${{ matrix.os }}-${{ matrix.arch }}.txt

      - name: Generate SHA256 checksum (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          # 与 sha256sum 标准格式对齐:`<sha256>  <文件名>`(两空格),LF 行尾
          $asset = "${{ matrix.asset_name }}"
          $hash = (Get-FileHash -Algorithm SHA256 "artifacts\$asset").Hash.ToLower()
          [IO.File]::WriteAllText(
            (Join-Path (Get-Location) "artifacts\SHA256SUMS-${{ matrix.os }}-${{ matrix.arch }}.txt"),
            "$hash  $asset`n")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            artifacts/${{ matrix.asset_name }}
            artifacts/SHA256SUMS-${{ matrix.os }}-${{ matrix.arch }}.txt

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/${{ matrix.asset_name }}
            artifacts/SHA256SUMS-${{ matrix.os }}-${{ matrix.arch }}.txt
          generate_release_notes: true
          draft: false
          prerelease: false

      # 失败分诊(公开 annotations):唯一实现 = scripts/ci-failure-triage.sh,本步骤只注入参数。
      # 守门 215 的 W1/W2:作业里**每个**带 id 的步骤都必须在 TRIAGE_IDS 里并有对应 O_<ID> 键 ——
      # 本作业原无带 id 步骤,SignPath 签名步引入 upload-unsigned / signpath 两个 id,
      # 必须同批装自述,否则"红了却报不出是哪一条"这一型正好被自己造出来。
      - name: Failure triage (public annotations)
        id: failure-triage
        if: failure()
        env:
          TRIAGE_WORKFLOW_FILE: .github/workflows/release-cli.yml
          TRIAGE_IDS: upload-unsigned signpath
          O_UPLOAD_UNSIGNED: ${{ steps.upload-unsigned.outcome }}
          O_SIGNPATH: ${{ steps.signpath.outcome }}
        run: bash scripts/ci-failure-triage.sh

  # ---------- Job 3: Build Docker image ----------
  build-docker:
    name: Build & Push Docker Image
    needs: []
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set tag variable
        id: vars
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG" ] || [ "$TAG" = "$GITHUB_REF" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          VERSION="${TAG#cli-v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ihui-inf-ai/ai-cli
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.vars.outputs.version }}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/docker/Dockerfile.cli
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Docker 镜像推送完成" >> $GITHUB_STEP_SUMMARY
          echo "镜像: \`ghcr.io/ihui-inf-ai/ai-cli:${{ steps.vars.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "拉取: \`docker pull ghcr.io/ihui-inf-ai/ai-cli:${{ steps.vars.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "运行: \`docker run --rm -v \$(pwd):/workspace ghcr.io/ihui-inf-ai/ai-cli\`" >> $GITHUB_STEP_SUMMARY

  # ---------- Job 4: Generate changelog ----------
  release-summary:
    name: Release Summary
    needs: [npm-publish, build-binary, build-docker]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          configuration: |
            {
              "template": "## 变更内容\n\n{{#each commits}}\n* {{this.message.subject}}\n{{/each}}",
              "categories": [
                { "title": "新功能", "labels": ["feat", "feature"] },
                { "title": "修复", "labels": ["fix", "bugfix"] },
                { "title": "文档", "labels": ["docs"] },
                { "title": "其他", "labels": ["chore", "refactor"] }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release notes
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.changelog }}
          append_body: true

      - name: Summary
        run: |
          echo "### CLI Release 完成总结" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| npm publish | ${{ needs.npm-publish.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| build-binary | ${{ needs.build-binary.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| build-docker | ${{ needs.build-docker.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 安装方式" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "npm install -g ihui-cli" >> $GITHUB_STEP_SUMMARY
          echo "curl -fsSL https://aizhs.top/install.sh | bash" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

