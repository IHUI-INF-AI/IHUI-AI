# ============================================================================
# 已退役(2026-09-07) — 仅存档，不是生产部署通道
# 本工作流面向的 Linux + Docker Compose + Nginx upstream 蓝绿架构自 2026-09-07 起退役；
# 现行生产为 原生 Windows Server + NSSM + Cloudflare Tunnel，部署与回滚由生产机上的
# IHUI-DEPLOYLOOP(NSSM 服务，deploy/win/ihui-deploy-loop.ps1，-Daemon -IntervalSeconds 60)
# 每 60s 轮询 origin/main 承担：拉取 → 构建 → 重启 → 健康门禁(web 200 + /api/health ok
# + ai-service 8803) → 门禁未过自动回滚。GitHub Actions 不参与生产部署。
#
# 保留本文件是为了可追溯；为阻止「点一下就又跑一条红」，首个 step 是 fail-fast 闸：
# workflow_dispatch 必须显式传 confirm_retired=yes 才继续，否则 5 秒内退出并打印指引。
# 禁止把它改成 continue-on-error / 假绿 / 删除 —— 失败就要如实失败。
# ============================================================================
name: Blue-Green Deploy

# 蓝绿部署工作流 — 零停机部署策略(已于 2026-09-07 退役，见上方头注)
# 手动触发，可选 staging / production 环境
on:
  workflow_dispatch:
    inputs:
      environment:
        description: '部署目标环境'
        type: choice
        options:
          - staging
          - production
      rollback:
        description: '回滚到上一个环境(跳过部署,直接切换)'
        type: boolean
        default: false
      confirm_retired:
        description: '本工作流已于 2026-09-07 退役；确需尝试旧通道请输入 yes，否则立即退出。真实部署由生产机 IHUI-DEPLOYLOOP 承担'
        type: string
        required: false
        default: ''

# Security: least-privilege GITHUB_TOKEN (CWE-250). Deployment uses SSH secrets, not GITHUB_TOKEN write perms.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      COMPOSE_FILE: docker-compose.yml
    steps:
      # fail-fast 闸(2026-11-04):本工作流已退役，见头注。未显式确认时不做任何 SSH/部署动作，
      # 立即打印「真实部署走 deployloop」指引并以失败退出 —— 失败是如实表达「没有部署」，不是假绿。
      - name: 退役闸 — 未显式确认则立即退出
        env:
          CONFIRM_RETIRED: ${{ inputs.confirm_retired }}
        run: |
          if [ "${CONFIRM_RETIRED}" != "yes" ]; then
            cat <<'GUIDE'
          ============================================================
           blue-green-deploy 已于 2026-09-07 退役，本通道不再部署生产。
          ============================================================
          现行生产部署的唯一路径：
            生产机(win-20251101pxt)上的 IHUI-DEPLOYLOOP 服务每 60s 轮询 origin/main，
            自动完成 拉取 → 构建 → 重启 → 健康门禁(web 200 + /api/health ok + ai-service 8803)
            → 门禁未过自动回滚。GitHub Actions 不参与生产部署。
            推送 main 后通常 1~2 分钟内生效，无需在这里点任何按钮。
          本工作流面向的 Linux + Docker + Nginx 蓝绿架构已不存在；继续运行只会在
          SSH 步骤失败，不会产生部署效果。
          如确需为考古/取证尝试旧通道：重新触发并填写 confirm_retired=yes。
          ============================================================
          GUIDE
            {
              echo "### blue-green-deploy 已退役(2026-09-07)"
              echo ""
              echo "- 真实部署路径：生产机 \`IHUI-DEPLOYLOOP\` 每 60s 轮询 \`origin/main\`（详见 docs/DEPLOYMENT_RUNBOOK.md）"
              echo "- 本工作流面向的 Linux/Docker/Nginx 蓝绿架构已不存在，继续运行只会在 SSH 步骤失败"
              echo "- 如确需尝试旧通道：重新触发并填写 \`confirm_retired=yes\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::blue-green-deploy 已于 2026-09-07 退役；生产部署由 IHUI-DEPLOYLOOP 承担，未传 confirm_retired=yes 故立即退出"
            exit 1
          fi
          echo "::warning::已显式确认 confirm_retired=yes：继续尝试退役通道，预期仍会因主机/架构不存在而失败"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 配置 SSH 连接
        run: |
          mkdir -p ~/.ssh
          echo "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts
        env:
          SSH_PRIVATE_KEY: ${{ env.SSH_PRIVATE_KEY }}

      - name: 检查当前活跃环境
        id: active-env
        run: |
          # 通过 nginx upstream 标记文件判断当前活跃环境
          ACTIVE=$(ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cat /opt/ihui/active-env 2>/dev/null || echo blue")
          echo "active=$ACTIVE" >> "$GITHUB_OUTPUT"
          echo "当前活跃环境: $ACTIVE"

      - name: 计算目标环境
        id: target-env
        run: |
          ACTIVE=${{ steps.active-env.outputs.active }}
          if [ "$ACTIVE" = "blue" ]; then
            echo "target=green" >> "$GITHUB_OUTPUT"
          else
            echo "target=blue" >> "$GITHUB_OUTPUT"
          fi

      - name: 回滚模式 — 直接切换到非活跃环境
        if: ${{ inputs.rollback == true }}
        run: |
          TARGET=${{ steps.target-env.outputs.target }}
          echo "=== 回滚: 切换流量到 $TARGET 环境 ==="
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<EOF
            set -euo pipefail
            cd /opt/ihui

            # 确认目标环境容器在运行
            if ! docker compose -p ihui-${TARGET} ps | grep -q "Up"; then
              echo "错误: $TARGET 环境未运行,无法回滚"
              exit 1
            fi

            # 切换 nginx upstream 指向目标环境
            echo "${TARGET}" > /opt/ihui/active-env
            nginx -s reload
            echo "已回滚到 $TARGET 环境"
          EOF

      - name: 构建新镜像
        if: ${{ inputs.rollback != true }}
        run: |
          echo "=== 在部署服务器上构建镜像 ==="
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'EOF'
            set -euo pipefail
            cd /opt/ihui
            git pull origin main
            docker compose build api web ai-service
          EOF

      - name: 部署到非活跃环境
        if: ${{ inputs.rollback != true }}
        run: |
          TARGET=${{ steps.target-env.outputs.target }}
          echo "=== 部署到 $TARGET 环境 ==="
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<EOF
            set -euo pipefail
            cd /opt/ihui

            # 使用 docker compose project 隔离 blue/green
            export COMPOSE_PROJECT_NAME=ihui-${TARGET}

            # 设置端口: blue=8801/8802, green=8803/8804
            if [ "${TARGET}" = "blue" ]; then
              export WEB_PORT=8801 API_PORT=8802
            else
              export WEB_PORT=8803 API_PORT=8804
            fi

            # 启动目标环境(仅 api + web + ai-service, 复用 db/redis)
            docker compose -p ihui-${TARGET} up -d api web ai-service

            echo "$TARGET 环境已启动,等待健康检查..."
          EOF

      - name: 健康检查
        if: ${{ inputs.rollback != true }}
        run: |
          TARGET=${{ steps.target-env.outputs.target }}
          if [ "$TARGET" = "blue" ]; then
            WEB_PORT=8801; API_PORT=8802
          else
            WEB_PORT=8803; API_PORT=8804
          fi

          echo "=== 健康检查 $TARGET 环境 (web:$WEB_PORT, api:$API_PORT) ==="
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<EOF
            set -euo pipefail
            MAX_RETRIES=30
            RETRY=0

            # API 健康检查
            while [ \$RETRY -lt \$MAX_RETRIES ]; do
              if curl -sf "http://localhost:${API_PORT}/api/health" > /dev/null 2>&1; then
                echo "API 健康检查通过"
                break
              fi
              echo "等待 API 就绪... (\$RETRY/\$MAX_RETRIES)"
              sleep 5
              RETRY=\$((RETRY + 1))
            done

            if [ \$RETRY -eq \$MAX_RETRIES ]; then
              echo "错误: API 健康检查超时, 部署失败"
              docker compose -p ihui-${TARGET} logs --tail 50 api
              exit 1
            fi

            # Web 健康检查
            RETRY=0
            while [ \$RETRY -lt \$MAX_RETRIES ]; do
              if curl -sf "http://localhost:${WEB_PORT}" > /dev/null 2>&1; then
                echo "Web 健康检查通过"
                break
              fi
              echo "等待 Web 就绪... (\$RETRY/\$MAX_RETRIES)"
              sleep 5
              RETRY=\$((RETRY + 1))
            done

            if [ \$RETRY -eq \$MAX_RETRIES ]; then
              echo "错误: Web 健康检查超时, 部署失败"
              docker compose -p ihui-${TARGET} logs --tail 50 web
              exit 1
            fi

            echo "=== $TARGET 环境健康检查全部通过 ==="
          EOF

      - name: 切换流量
        if: ${{ inputs.rollback != true }}
        run: |
          TARGET=${{ steps.target-env.outputs.target }}
          ACTIVE=${{ steps.active-env.outputs.active }}
          echo "=== 切换流量: $ACTIVE → $TARGET ==="

          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<EOF
            set -euo pipefail

            # 更新 nginx upstream 配置指向目标环境
            if [ "${TARGET}" = "blue" ]; then
              cp /opt/ihui/nginx/upstream-blue.conf /etc/nginx/conf.d/ihui-upstream.conf
            else
              cp /opt/ihui/nginx/upstream-green.conf /etc/nginx/conf.d/ihui-upstream.conf
            fi

            nginx -t && nginx -s reload

            # 更新活跃环境标记
            echo "${TARGET}" > /opt/ihui/active-env
            echo "流量已切换到 ${TARGET} 环境"
          EOF

      - name: 清理旧环境(保留用于回滚)
        if: ${{ inputs.rollback != true }}
        run: |
          ACTIVE=${{ steps.active-env.outputs.active }}
          echo "=== 保留 $ACTIVE 环境用于回滚(不停止) ==="
          echo "如需回滚, 重新运行此 workflow 并勾选 rollback=true"
          echo "旧环境 $ACTIVE 仍以独立端口运行, 可随时切换回去"

      # 失败通知(2026-11-04 重构):原实现 `pnpm install --filter @ihui/api...` + `tsx
      # scripts/notify-deploy-failure.ts` 依赖 `packages/shared/node_modules/@ihui/api-client/dist/index.js`,
      # 该 dist 在 runner 上从未构建 ⇒ 09-27 / 10-22 / 11-03 三次同型 ERR_MODULE_NOT_FOUND,
      # 失败邮件一封都发不出。改用零依赖实现:Node 内置模块 + runner 自带 curl 直连 SMTP。
      # 取舍:放弃品牌模板/去重台账(它们住在 apps/api 的模板与 nodemailer 依赖链里),
      # 换「失败时一定能发出去」的可靠性;品牌版式仍由生产机 deployloop 的调用路径承担。
      # 退役闸拒绝的 run(confirm_retired!=yes)不发邮件 —— 那是预期内的拒绝,不是故障。
      - name: Setup Node.js (failure notify)
        if: failure()
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: 部署失败邮件通知(零依赖)
        if: failure() && inputs.confirm_retired == 'yes'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: |
          node .github/scripts/notify-deploy-failure-ci.mjs \
            --environment "${{ inputs.environment }}" \
            --stage "job=${{ github.job }} / run#${{ github.run_attempt }}" \
            --trigger "${{ github.actor }}" \
            --source "github-actions/blue-green-deploy" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --strict

      - name: 部署摘要
        if: always()
        run: |
          echo "=========================================="
          echo "  蓝绿部署摘要"
          echo "=========================================="
          echo "目标环境: ${{ inputs.environment }}"
          echo "回滚模式: ${{ inputs.rollback }}"
          echo "原活跃环境: ${{ steps.active-env.outputs.active }}"
          echo "新活跃环境: ${{ steps.target-env.outputs.target }}"
          echo "=========================================="

# ⁠​‌​​‌​​‌‍‍​‌​​‌​​​‍‍​‌​‌​‌​‌‍‍​‌​​‌​​‌‍‍​​‌​‌‌​‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌​​‌‌‌‌​‌​‍‍‌‌​‌‌​​​‌​​​‌‌‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌‌​‌​​‌‌‌​‍‍‌‌​​‌‌​​​‌​​‌​‌‍‍‌​‌‌‌​‌‌‌​‌‌‌​‌‍‍‌​‌‌​‌‌‌‍‍​‌​​‌‌​​‍‍​‌​​​​‌‌‍‍‌​‌‌​‌‌‌‍‍​‌‌​​​​‌‍‍​‌‌​‌​​‌‍‍​‌‌‌‌​‌​‍‍​‌‌​‌​​​‍‍​‌‌‌​​‌‌‍‍​​‌​‌‌‌​‍‍​‌‌‌​‌​​‍‍​‌‌​‌‌‌‌‍‍​‌‌‌​​​​‍‍‌​‌‌​‌‌‌‍‍​‌​‌​​​​‍‍​‌​‌​​‌​‍‍​‌​​‌‌‌‌‍‍​‌​‌​‌‌​‍‍​‌​​​‌​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​‌‌‍‍​‌​​​‌​‌‍‍​​‌​‌‌​‌‍‍​​‌‌​​‌​‍‍​​‌‌​​​​‍‍​​‌‌​​‌​‍‍​​‌‌​‌‌​⁠
