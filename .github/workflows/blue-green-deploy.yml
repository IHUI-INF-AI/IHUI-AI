name: Blue-Green Deploy

# 蓝绿部署工作流 — 零停机部署策略
# 手动触发，可选 staging / production 环境
on:
  workflow_dispatch:
    inputs:
      environment:
        description: '部署目标环境'
        type: choice
        options:
          - staging
          - production
      rollback:
        description: '回滚到上一个环境(跳过部署,直接切换)'
        type: boolean
        default: false

# Security: least-privilege GITHUB_TOKEN (CWE-250). Deployment uses SSH secrets, not GITHUB_TOKEN write perms.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      COMPOSE_FILE: docker-compose.yml
    steps:
      - uses: actions/checkout@v4

      - name: 配置 SSH 连接
        run: |
          mkdir -p ~/.ssh
          echo "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts
        env:
          SSH_PRIVATE_KEY: ${{ env.SSH_PRIVATE_KEY }}

      - name: 检查当前活跃环境
        id: active-env
        run: |
          # 通过 nginx upstream 标记文件判断当前活跃环境
          ACTIVE=$(ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cat /opt/ihui/active-env 2>/dev/null || echo blue")
          echo "active=$ACTIVE" >> "$GITHUB_OUTPUT"
          echo "当前活跃环境: $ACTIVE"

      - name: 计算目标环境
        id: target-env
        run: |
          ACTIVE=${{ steps.active-env.outputs.active }}
          if [ "$ACTIVE" = "blue" ]; then
            echo "target=green" >> "$GITHUB_OUTPUT"
          else
            echo "target=blue" >> "$GITHUB_OUTPUT"
          fi

      - name: 回滚模式 — 直接切换到非活跃环境
        if: ${{ inputs.rollback == true }}
        run: |
          TARGET=${{ steps.target-env.outputs.target }}
          echo "=== 回滚: 切换流量到 $TARGET 环境 ==="
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<EOF
            set -euo pipefail
            cd /opt/ihui

            # 确认目标环境容器在运行
            if ! docker compose -p ihui-${TARGET} ps | grep -q "Up"; then
              echo "错误: $TARGET 环境未运行,无法回滚"
              exit 1
            fi

            # 切换 nginx upstream 指向目标环境
            echo "${TARGET}" > /opt/ihui/active-env
            nginx -s reload
            echo "已回滚到 $TARGET 环境"
          EOF

      - name: 构建新镜像
        if: ${{ inputs.rollback != true }}
        run: |
          echo "=== 在部署服务器上构建镜像 ==="
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'EOF'
            set -euo pipefail
            cd /opt/ihui
            git pull origin main
            docker compose build api web ai-service
          EOF

      - name: 主域 nginx 补齐 /v1 /ws 路由(幂等防漂移)
        if: ${{ inputs.rollback != true }}
        run: |
          echo "=== 同步主域 nginx /v1 /ws 代理路由 ==="
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'EOF'
            set -euo pipefail
            # 定位 aizhs.top 站点主配置(含 location /api/ 反代者),兼容 conf.d 与 sites-enabled
            F=$(grep -rl "server_name aizhs.top" /etc/nginx/conf.d/ /etc/nginx/sites-enabled/ 2>/dev/null \
              | xargs -r grep -l "location /api/" 2>/dev/null | head -1)
            if [ -z "$F" ]; then
              echo "警告: 未找到 aizhs.top 站点主配置,跳过 nginx 补丁(不影响容器部署)"
              exit 0
            fi
            echo "站点配置: $F"
            if grep -q "location /v1/" "$F" && grep -q "location /ws/" "$F"; then
              echo "已包含 /v1 与 /ws 路由,无需补丁"
            elif ! grep -q "location /v1/" "$F" && ! grep -q "location /ws/" "$F"; then
              # 动态提取 /api/ 使用的 upstream 名(兼容蓝绿切换的任意命名,不假设端口)
              APIUP=$(sed -n '/location \/api\/ {/,/}/p' "$F" | grep -oP 'proxy_pass\s+http://\K[a-zA-Z0-9_]+' | head -1)
              [ -n "$APIUP" ] || { echo "错误: 无法从 $F 提取 /api/ upstream 名,人工核查"; exit 1; }
              echo "API upstream: $APIUP"
              {
                echo "    # 公开 API(/v1/*)与 WebSocket(/ws/*)反代 — 由 blue-green-deploy 自动补齐(2026-09-05)"
                echo "    # /v1: API Key 鉴权公开 API,禁缓冲+300s 读超时+50m body; /ws: WS 长连接,1h 超时"
                echo "    location /v1/ {"
                echo "        proxy_pass http://${APIUP};"
                echo "        proxy_set_header Host              \$host;"
                echo "        proxy_set_header X-Real-IP         \$remote_addr;"
                echo "        proxy_set_header X-Forwarded-For   \$proxy_add_x_forwarded_for;"
                echo "        proxy_set_header X-Forwarded-Proto \$scheme;"
                echo "        proxy_connect_timeout 5s;"
                echo "        proxy_read_timeout    300s;"
                echo "        proxy_buffering off;"
                echo "        proxy_cache off;"
                echo "        client_max_body_size 50m;"
                echo "    }"
                echo ""
                echo "    location /ws/ {"
                echo "        proxy_pass http://${APIUP};"
                echo "        proxy_set_header Host              \$host;"
                echo "        proxy_set_header X-Real-IP         \$remote_addr;"
                echo "        proxy_set_header X-Forwarded-For   \$proxy_add_x_forwarded_for;"
                echo "        proxy_set_header X-Forwarded-Proto \$scheme;"
                echo "        proxy_http_version  1.1;"
                echo "        proxy_set_header    Upgrade \$http_upgrade;"
                echo '        proxy_set_header    Connection "upgrade";'
                echo "        proxy_connect_timeout 5s;"
                echo "        proxy_read_timeout    3600s;"
                echo "        proxy_send_timeout    3600s;"
                echo "        proxy_buffering off;"
                echo "    }"
                echo ""
              } > /tmp/ihui-v1ws-blocks.conf
              cp "$F" "${F}.bak-$(date +%Y%m%d%H%M%S)"
              awk 'BEGIN{while((getline l < "/tmp/ihui-v1ws-blocks.conf")>0) ins=ins l "\n"}
                   !done && /location \/ \{/ { printf "%s", ins; done=1 }
                   { print }' "$F" > "${F}.new" && mv "${F}.new" "$F"
              rm -f /tmp/ihui-v1ws-blocks.conf
            else
              echo "警告: /v1 与 /ws 仅部分存在,跳过自动补丁,需人工核查"
              exit 0
            fi
            if nginx -t 2>/dev/null; then
              nginx -s reload
              echo "nginx 配置已更新并重载"
            else
              echo "nginx -t 失败,回滚到最近备份"
              LATEST_BAK=$(ls -t "${F}".bak-* 2>/dev/null | head -1)
              if [ -n "$LATEST_BAK" ]; then cp "$LATEST_BAK" "$F"; nginx -t && nginx -s reload || true; fi
              exit 1
            fi
          EOF

      - name: 部署到非活跃环境
        if: ${{ inputs.rollback != true }}
        run: |
          TARGET=${{ steps.target-env.outputs.target }}
          echo "=== 部署到 $TARGET 环境 ==="
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<EOF
            set -euo pipefail
            cd /opt/ihui

            # 使用 docker compose project 隔离 blue/green
            export COMPOSE_PROJECT_NAME=ihui-${TARGET}

            # 设置端口: blue=8801/8802, green=8803/8804
            if [ "${TARGET}" = "blue" ]; then
              export WEB_PORT=8801 API_PORT=8802
            else
              export WEB_PORT=8803 API_PORT=8804
            fi

            # 启动目标环境(仅 api + web + ai-service, 复用 db/redis)
            docker compose -p ihui-${TARGET} up -d api web ai-service

            echo "$TARGET 环境已启动,等待健康检查..."
          EOF

      - name: 健康检查
        if: ${{ inputs.rollback != true }}
        run: |
          TARGET=${{ steps.target-env.outputs.target }}
          if [ "$TARGET" = "blue" ]; then
            WEB_PORT=8801; API_PORT=8802
          else
            WEB_PORT=8803; API_PORT=8804
          fi

          echo "=== 健康检查 $TARGET 环境 (web:$WEB_PORT, api:$API_PORT) ==="
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<EOF
            set -euo pipefail
            MAX_RETRIES=30
            RETRY=0

            # API 健康检查
            while [ \$RETRY -lt \$MAX_RETRIES ]; do
              if curl -sf "http://localhost:${API_PORT}/api/health" > /dev/null 2>&1; then
                echo "API 健康检查通过"
                break
              fi
              echo "等待 API 就绪... (\$RETRY/\$MAX_RETRIES)"
              sleep 5
              RETRY=\$((RETRY + 1))
            done

            if [ \$RETRY -eq \$MAX_RETRIES ]; then
              echo "错误: API 健康检查超时, 部署失败"
              docker compose -p ihui-${TARGET} logs --tail 50 api
              exit 1
            fi

            # Web 健康检查
            RETRY=0
            while [ \$RETRY -lt \$MAX_RETRIES ]; do
              if curl -sf "http://localhost:${WEB_PORT}" > /dev/null 2>&1; then
                echo "Web 健康检查通过"
                break
              fi
              echo "等待 Web 就绪... (\$RETRY/\$MAX_RETRIES)"
              sleep 5
              RETRY=\$((RETRY + 1))
            done

            if [ \$RETRY -eq \$MAX_RETRIES ]; then
              echo "错误: Web 健康检查超时, 部署失败"
              docker compose -p ihui-${TARGET} logs --tail 50 web
              exit 1
            fi

            echo "=== $TARGET 环境健康检查全部通过 ==="
          EOF

      - name: 切换流量
        if: ${{ inputs.rollback != true }}
        run: |
          TARGET=${{ steps.target-env.outputs.target }}
          ACTIVE=${{ steps.active-env.outputs.active }}
          echo "=== 切换流量: $ACTIVE → $TARGET ==="

          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<EOF
            set -euo pipefail

            # 更新 nginx upstream 配置指向目标环境
            if [ "${TARGET}" = "blue" ]; then
              cp /opt/ihui/nginx/upstream-blue.conf /etc/nginx/conf.d/ihui-upstream.conf
            else
              cp /opt/ihui/nginx/upstream-green.conf /etc/nginx/conf.d/ihui-upstream.conf
            fi

            nginx -t && nginx -s reload

            # 更新活跃环境标记
            echo "${TARGET}" > /opt/ihui/active-env
            echo "流量已切换到 ${TARGET} 环境"
          EOF

      - name: 清理旧环境(保留用于回滚)
        if: ${{ inputs.rollback != true }}
        run: |
          ACTIVE=${{ steps.active-env.outputs.active }}
          echo "=== 保留 $ACTIVE 环境用于回滚(不停止) ==="
          echo "如需回滚, 重新运行此 workflow 并勾选 rollback=true"
          echo "旧环境 $ACTIVE 仍以独立端口运行, 可随时切换回去"

      - name: 部署摘要
        if: always()
        run: |
          echo "=========================================="
          echo "  蓝绿部署摘要"
          echo "=========================================="
          echo "目标环境: ${{ inputs.environment }}"
          echo "回滚模式: ${{ inputs.rollback }}"
          echo "原活跃环境: ${{ steps.active-env.outputs.active }}"
          echo "新活跃环境: ${{ steps.target-env.outputs.target }}"
          echo "=========================================="

# ⁠​‌​​‌​​‌‍‍​‌​​‌​​​‍‍​‌​‌​‌​‌‍‍​‌​​‌​​‌‍‍​​‌​‌‌​‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌​​‌‌‌‌​‌​‍‍‌‌​‌‌​​​‌​​​‌‌‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌‌​‌​​‌‌‌​‍‍‌‌​​‌‌​​​‌​​‌​‌‍‍‌​‌‌‌​‌‌‌​‌‌‌​‌‍‍‌​‌‌​‌‌‌‍‍​‌​​‌‌​​‍‍​‌​​​​‌‌‍‍‌​‌‌​‌‌‌‍‍​‌‌​​​​‌‍‍​‌‌​‌​​‌‍‍​‌‌‌‌​‌​‍‍​‌‌​‌​​​‍‍​‌‌‌​​‌‌‍‍​​‌​‌‌‌​‍‍​‌‌‌​‌​​‍‍​‌‌​‌‌‌‌‍‍​‌‌‌​​​​‍‍‌​‌‌​‌‌‌‍‍​‌​‌​​​​‍‍​‌​‌​​‌​‍‍​‌​​‌‌‌‌‍‍​‌​‌​‌‌​‍‍​‌​​​‌​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​‌‌‍‍​‌​​​‌​‌‍‍​​‌​‌‌​‌‍‍​​‌‌​​‌​‍‍​​‌‌​​​​‍‍​​‌‌​​‌​‍‍​​‌‌​‌‌​⁠
