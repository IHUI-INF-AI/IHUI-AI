name: OpenAPI Check

# =============================================================================
# OpenAPI 规范校验 workflow
#
# 当 push 到 main/develop 或 PR 修改 apps/api/** 时触发，
# 校验后端路由与 OpenAPI spec 的一致性。
# 脚本: scripts/openapi-check.mjs
# =============================================================================

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/api/**'
      - 'scripts/openapi-check.mjs'
      - '.github/workflows/openapi-check.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/api/**'
      - 'scripts/openapi-check.mjs'
      - '.github/workflows/openapi-check.yml'

concurrency:
  group: openapi-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9'

jobs:
  openapi-check:
    name: OpenAPI 规范校验
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Capability manifest matches catalog source (O8b)
        # TS 目录(capability-catalog.ts)与生成产物(capabilities.json)不一致即红:
        # 这是"改代码不改登记表"能在本地蒙混过关的那道缝。
        run: pnpm capabilities:check

      - name: Run OpenAPI check
        run: node scripts/openapi-check.mjs

      - name: Build workspace packages the export graph imports
        # `openapi:export` 启动的是**真实 Fastify 依赖图**(不监听端口/不连库),而图里
        # packages/shared/src/auth/token-store.ts → `@ihui/api-client` 走的是该包 package.json
        # 的 `main`(指向 dist/index.js)。CI 的 `pnpm install --frozen-lockfile` 从不构建
        # workspace 包 ⇒ dist 不存在 ⇒ ERR_MODULE_NOT_FOUND,与本仓任何一处代码改动无关。
        # 本地永远绿(我的 dist 早在),正是"本地全绿、CI 恒红"那一族(同守门 72/78 取向)。
        # `@ihui/api-client...`(后缀三个点)= 该包**及其 workspace 依赖**,故 @ihui/types 一并构建。
        # 2026-09-26 起改用拓扑选择器 `^...`(= 该包的**全部 workspace 依赖**,不含本包):
        # 本仓已有 7 个包 exports 指 dist(cli/i18n/design-tokens/types/dom-actions/api-client/
        # context-compaction),**手工点名"要先建哪几个包"必然落后于新增** —— 落后一次的形态是
        # "CI 恒红而本地全绿"(守门 72/78 同族)。选择器由 pnpm 从包图算,加包不再需要改本文件。
        run: pnpm --filter "@ihui/api^..." run build

      - name: Assert committed contract has no drift (O8 [E])
        # committed 的 apps/api/openapi.json 是入库产物(见 .gitignore 的 negation)。
        # 这里从当前代码重新导出一份,逐键比对 —— 只校验 committed 产物的话,
        # "改了路由不重跑 export"照样能过,漂移判据就形同虚设。
        #
        # 路径必须给**绝对**的:`pnpm --filter @ihui/api exec` 会把 cwd 切到 apps/api/,
        # 相对路径的 --out 会落到 apps/api/ 下,而 --fresh 从仓库根读同一名字 ⇒ 读不到文件
        # (2026-09-21 本地照抄 CI 命令实测复现)。写进 .ihui-agent/tmp/ 以免产物被误提交。
        run: |
          pnpm openapi:export --out "$GITHUB_WORKSPACE/.ihui-agent/tmp/openapi.fresh.json"
          node scripts/openapi-check.mjs --fresh "$GITHUB_WORKSPACE/.ihui-agent/tmp/openapi.fresh.json"

# ⁠​‌​​‌​​‌‍‍​‌​​‌​​​‍‍​‌​‌​‌​‌‍‍​‌​​‌​​‌‍‍​​‌​‌‌​‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌​​‌‌‌‌​‌​‍‍‌‌​‌‌​​​‌​​​‌‌‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌‌​‌​​‌‌‌​‍‍‌‌​​‌‌​​​‌​​‌​‌‍‍‌​‌‌‌​‌‌‌​‌‌‌​‌‍‍‌​‌‌​‌‌‌‍‍​‌​​‌‌​​‍‍​‌​​​​‌‌‍‍‌​‌‌​‌‌‌‍‍​‌‌​​​​‌‍‍​‌‌​‌​​‌‍‍​‌‌‌‌​‌​‍‍​‌‌​‌​​​‍‍​‌‌‌​​‌‌‍‍​​‌​‌‌‌​‍‍​‌‌‌​‌​​‍‍​‌‌​‌‌‌‌‍‍​‌‌‌​​​​‍‍‌​‌‌​‌‌‌‍‍​‌​‌​​​​‍‍​‌​‌​​‌​‍‍​‌​​‌‌‌‌‍‍​‌​‌​‌‌​‍‍​‌​​​‌​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​‌‌‍‍​‌​​​‌​‌‍‍​​‌​‌‌​‌‍‍​​‌‌​​‌​‍‍​​‌‌​​​​‍‍​​‌‌​​‌​‍‍​​‌‌​‌‌​⁠
