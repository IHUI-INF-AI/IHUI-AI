name: scripts mirror tests (nightly soak)

# =============================================================================
# scripts/tests 全量镜像测试的**第一个**自动入口(2026-09-24 立)
#
# 为什么需要它:`scripts/tests/` 有 130+ 份镜像测试,而此前 CI 只点名 6 份、也没有任何
# 入口能一次跑完(AGENTS/README 里每道门都写着"取证:node --test …",却没人组织过考试)。
# 全量首跑当场抓到 9 枚红,其中 4 枚是任何环境都红的真债(它们红在 origin/main 上,
# 而相关判据早已改进、测试还停在旧政策)。工具与修复见 scripts/run-script-tests.mjs。
#
# 为什么是 windows-latest:这批门里有相当一部分**判的就是这台 Windows 生产机**
# (C 盘污染/封口 junction、HKCU TEMP 漂移、.bin shim、页面文件量取)。既有 workflow 用
# ubuntu-latest 是因为它们跑的是纯逻辑测试;而 `check-c-drive-pollution.test.mjs` 会建
# junction、读注册表 —— 在 Linux 上必然红,那将是一道与任何改动都无关的常红门。
# 实测(数字不钉在这里,以现读为准 —— §0.1 凡数字现读,同 2026-10-14「注册条目不再钉镜像例数」那条裁定):
#   套件总数 = `node scripts/run-script-tests.mjs --list | tail -1`(2026-10-16 现读共 499 个);
#   引用 process.platform 的套件 = `grep -rl "process\.platform" scripts/tests/*.test.mjs | wc -l`
#   (现读 10 个,不是原文写的 2 —— 两份都判不出"靠跳过兜住"成立)⇒ 只能选对 OS。
#
# 为什么 continue-on-error 只贴在测试那一步(通报而非阻断):本机之外从未在"干净的 Windows 检出 +
# 装好依赖"的环境里跑过全量。拿一条未验证的门去阻断全队提交,后果就是各会话合法
# `--no-verify`、连带废掉全部守门 —— 今天已经真实发生过一次(依赖树被啃空 ⇒
# lint-staged 崩在第 1 步 ⇒ 115 道门集体旁路)。**转 blocking 的条件写在下面 TODO 里,
# 满足前不得改。**
# ⚠️ 2026-10-16 更正适用范围:原先它写在 **job 级**,于是"前置步骤挂了 ⇒ 测试整步没跑"也被通报掉,
#   账面连续 8 晚 success 而行数为 0。现在它只在 `Run all mirror tests` 一步上 ——
#   环境挂 / 步骤被跳过都会让 run 变红(另有哨兵步兜底)。**只有"测试真跑了但带存量红"才是通报档。**
# =============================================================================
on:
  # 2026-10-29 补 push / pull_request(此前只有 schedule + workflow_dispatch):判据改坏镜像测试
  # 当场就能抓到,却要等到第二天 nightly 才响 —— 这是 AGENTS §0.9「造好没装车 = 没有」的
  # "装了一半"形态。带 paths 过滤只在可能影响判据的面变动时触发;这两种事件下**只跑改动面**
  # (`run-script-tests.mjs --changed`,见下面 mirror 步的 github.event_name 条件),
  # 120 分钟的**全量**仍只在 schedule/workflow_dispatch 跑。
  push:
    branches:
      - main
    paths:
      - scripts/**
      - packages/**
      - apps/**
      - .github/workflows/scripts-mirror-tests.yml
  pull_request:
    paths:
      - scripts/**
      - packages/**
      - apps/**
      - .github/workflows/scripts-mirror-tests.yml
  schedule:
    # 每天 18:20 UTC(北京时间 02:20)—— 避开 build/deploy 高峰的 runner 争用
    - cron: '20 18 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  mirror-tests:
    name: node --test scripts/tests (full)
    runs-on: windows-latest
    timeout-minutes: 120
    # TODO(转 blocking 的前置,二者缺一都不许删 `Run all mirror tests` 那一步上的这行):
    #   ① 连续 ≥2 夜在 main 的定时跑 exit 0;
    #   ② 下列三枚"他人未提交状态"红已确认不是存量债 —— apps/web/src/config/
    #      desktop-feed.generated.ts 的工作树副本缺 HEAD(982e253789a,03:11) 已入库的
    #      updaterPlatforms 块,该文件 09:00:57 被某在制任务重写;tauri-updater-platforms
    #      的三枚断言正是钉这个回退的(干净检出 14/14 绿)。
    # ⚠️ 2026-10-16 现读更正:本行**原先写在 job 级**,于是 `Setup pnpm` 失败 ⇒ 后面全部
    #   step 被 skipped ⇒ 测试一行没跑,而 run 结论仍是 success(连续 8 晚"绿")。这是
    #   AGENTS §0.3 那一型的最坏形态:不是"没判成绿",是"根本没判而账面绿"。
    #   现在 continue-on-error 只贴在"测试确实跑了、但可能带存量红"那一步上(观察期语义
    #   不变),环境类失败(装不上 / 被跳过 / 一行没跑)由哨兵步当场判红。
    steps:
      - uses: actions/checkout@v4
        with:
          # 必须取全历史。这批镜像测试里有一族判据的设计目的就是「夹具不算证明 —— 必须拿真仓
          # 历史 blob 证」(如 `check-dangling-local-imports.test.mjs` 的 D4/D5、各门的「真仓历史
          # 阳性对照」)。缺省 checkout 是 depth=1 浅克隆 ⇒ 它们在 CI 上**结构上不可能通过**,
          #  nightly 因此常年带着一堆"假存量红"。实测对照(同一枚测试):
          #   全历史 worktree ⇒ pass 22 / fail 0;浅克隆(=CI 条件)⇒ pass 17 / fail 5,
          #   红的正是 D4/D5 那两枚历史锚点用例。
          # 有界深度不可行:现读测试里按名点名且确为本仓提交的锚点共 **148 枚**,最深一枚距仓库根
          # **35347** 个提交(2b2bd94fae…)⇒ 只有 fetch-depth: 0 能覆盖全部。
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 不写 `with: version` —— 根 package.json 的 `packageManager: pnpm@11.18.0` 才是唯一
        # 版本源。原先这里再写一个 `version: 11` 会被 action 判成
        # "Multiple versions of pnpm specified" 直接失败(2026-10-15 那夜的 skipped 链就是这么起的);
        # 同仓 ci-monorepo.yml / blue-green-deploy.yml 也都是只让它读 packageManager。

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        # 顺序硬约束:pnpm/action-setup 必须在 setup-node 的 `cache: pnpm` 之前,否则
        # setup-node 找不到 pnpm 直接失败(本仓守门 48 就是为这件事立的)。
        # 不装依赖则 `check-workspace-dep-links.test.mjs` 的"真仓不变量"必红 —— 它判的
        # 就是 node_modules 里的链接是否齐全(实测:`git archive` 式无依赖快照上稳定红)。
        run: pnpm install --frozen-lockfile

      # 有一族守门把**判据**放在 ai-service 的 Python 里(单一实现,门里不许抄第二份),
      # 运行期用 `apps/ai-service/.venv/{Scripts/python.exe,bin/python}` 去 import 它:
      # check-load-state-loaded-marks / check-egress-facts / check-line-split-parity /
      # check-bpe-encoding-parity / check-principal-consumed / check-mypy 都是同一形状。
      # 缺这个 venv ⇒ 门按设计折「未判定」,而它们的镜像测试(正例必须被点名)当场红 ——
      # 本 workflow 此前是纯 Node 环境,于是这一族在夜间常年假红。
      # 只要**空 venv**:实测被判据模块 `_load_lifecycle.py` 只 import 标准库
      # (time/dataclasses/ast/re),不装 ai-service 依赖。
      - name: Setup Python (判据在 Python 里的那族守门要它)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Create ai-service venv (门探的就是这个路径)
        shell: pwsh
        run: |
          python -m venv apps/ai-service/.venv
          apps/ai-service/.venv/Scripts/python.exe -c "import sys; print('venv python', sys.version.split()[0])"

      - name: Run all mirror tests
        id: mirror
        # 工具任何一片解析不到 pass/fail 计数就按失败计,不会把"runner 崩了"洗成绿
        # continue-on-error 只贴在这一位:观察期内"存量测试红"不喊红作业(前置见上方 TODO)。
        # "到底有没有跑过"不归它放宽 —— 由下一步哨兵判。
        #
        # 2026-10-29 补:加了 push/pull_request 触发之后,这一步**不能再无条件跑全量** ——
        # 120 分钟的 windows 全量往每次 push 上叠,等于把 nightly 的成本乘以提交次数。
        # 用现成的 `github.event_name` 条件表达(不新造机制):push/PR ⇒ `--changed --base <基点>`
        # 只跑改动面对应的测试;schedule/workflow_dispatch ⇒ 原样全量。
        # 基点:PR 取 base 分支 sha,push 取"推来之前的 main"(github.event.before)。
        # CI 的检出是干净工作树,不给基点就只能读成"未判定"(工具头注里同一件事)。
        continue-on-error: true
        run: node scripts/run-script-tests.mjs ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && format('--changed --base {0}', github.event.pull_request.base.sha || github.event.before) || '' }}

      - name: 哨兵 —— 测试没跑成必须当场判红(跳过不等于通过)
        # AGENTS §0.3「取不到不记绿 / 枚举到 0 判死」在 CI 层的落地。2026-10-15 那夜实况:
        # Setup pnpm 报 "Multiple versions of pnpm specified" ⇒ 本步及其后全部 skipped ⇒
        # 一行用例都没跑,而 run 结论 = success(连续 8 晚)。作业级 continue-on-error 已摘,
        # 环境类失败本身就会红;这一道是第二把尺:哪怕前面"成功"而这步没执行,也当场红。
        if: always()
        shell: bash
        run: |
          c="${{ steps.mirror.conclusion }}"
          echo "mirror step conclusion: [$c]"
          case "$c" in
            skipped | cancelled | success | failure)
              if [ "$c" = "skipped" ] || [ "$c" = "cancelled" ] || [ -z "$c" ]; then
                echo "::error::镜像测试从未执行(conclusion=$c)⇒ 这一夜的绿不成立。先修环境;不许把「没判」写成「判过」。"
                exit 1
              fi
              ;;
          esac
          if [ -z "$c" ]; then
            echo "::error::取不到 mirror 步的结论(conclusion 为空)⇒ 同样按未执行判红"
            exit 1
          fi
          echo "mirror 步确有执行(conclusion=$c);存量红按上方 TODO 的观察期处理,不在此处放宽"

      # 失败分诊(公开 annotations):唯一实现 = scripts/ci-failure-triage.sh,本步骤只注入参数。
      # 守门 213 的 W1/W2:作业里**每个**带 id 的步骤都必须在 TRIAGE_IDS 里并有对应 O_<ID> 键 ——
      # 本作业原先整作业无 id(只在 W4 报数),今天给 mirror 加了 id 就必须同批改完,否则
      # "红了却报不出是哪一条命令"这一型正好被自己造出来(2026-10-16 safe-commit 当场拦下)。
      - name: Failure triage (public annotations)
        id: failure-triage
        if: failure()
        env:
          TRIAGE_WORKFLOW_FILE: .github/workflows/scripts-mirror-tests.yml
          TRIAGE_IDS: mirror
          O_MIRROR: ${{ steps.mirror.outcome }}
        run: bash scripts/ci-failure-triage.sh

      - name: Run deploy/win PowerShell self-tests
        shell: pwsh
        # 部署脚本的判据住在 .ps1 里,node 镜像测试结构上跑不到它。而 `Test-CleanBuildEnvInlined`
        # 判的是"净面产物有没有把 NEXT_PUBLIC_* 烘进去"——它一旦失效,症状要到屏幕上看才看得见
        # (登录按钮消失/验证码不工作),所以它必须有一把**每次都在干净检出上跑**的尺子。
        # 该自检按 AST 只取被测函数,不会执行部署主流程(点源整份脚本 = 当场开始部署)。
        run: "& 'deploy/win/test-clean-build-guard.ps1'"

      - name: 发现清单(诊断用,不参与判定)
        if: always()
        run: node scripts/run-script-tests.mjs --list

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## scripts/tests 全量镜像测试"
            echo ""
            echo "- runner: \`windows-latest\`(这批门里有一批判的就是 Windows 机器状态)"
            echo "- \`continue-on-error\` 只贴在 \`Run all mirror tests\` 这一步:测试**真跑了**但带存量红 = 通报档;环境挂 / 该步被 skipped = 本 run 直接红(另有哨兵步兜底)。"
            echo "- 转 blocking 的前置见本文件头注 TODO —— 它要的是「测试连续真跑到 exit 0」,不是「账面没红」。"
          } >> "$GITHUB_STEP_SUMMARY"

# ⁠​‌​​‌​​‌‍‍​‌​​‌​​​‍‍​‌​‌​‌​‌‍‍​‌​​‌​​‌‍‍​​‌​‌‌​‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌​​‌‌‌‌​‌​‍‍‌‌​‌‌​​​‌​​​‌‌‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌‌​‌​​‌‌‌​‍‍‌‌​​‌‌​​​‌​​‌​‌‍‍‌​‌‌‌​‌‌‌​‌‌‌​‌‍‍‌​‌‌​‌‌‌‍‍​‌​​‌‌​​‍‍​‌​​​​‌‌‍‍‌​‌‌​‌‌‌‍‍​‌‌​​​​‌‍‍​‌‌​‌​​‌‍‍​‌‌‌‌​‌​‍‍​‌‌​‌​​​‍‍​‌‌‌​​‌‌‍‍​​‌​‌‌‌​‍‍​‌‌‌​‌​​‍‍​‌‌​‌‌‌‌‍‍​‌‌‌​​​​‍‍‌​‌‌​‌‌‌‍‍​‌​‌​​​​‍‍​‌​‌​​‌​‍‍​‌​​‌‌‌‌‍‍​‌​‌​‌‌​‍‍​‌​​​‌​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​‌‌‍‍​‌​​​‌​‌‍‍​​‌​‌‌​‌‍‍​​‌‌​​‌​‍‍​​‌‌​​​​‍‍​​‌‌​​‌​‍‍​​‌‌​‌‌​⁠
