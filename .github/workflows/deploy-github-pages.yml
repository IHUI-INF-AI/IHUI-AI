name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/i18n/**'
      - 'packages/ui/**'
      - 'packages/ui-react/**'
      - 'packages/types/**'
      - 'packages/config/**'
      - 'packages/eslint-config/**'
      - 'packages/tsconfig/**'
      - 'public/**'
      - '.github/workflows/deploy-github-pages.yml'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'turbo.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web
        run: pnpm --filter @ihui/web build
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_APP_NAME: IHUI AI
          NEXT_PUBLIC_API_URL: https://ihui-api.railway.app
          NEXT_TELEMETRY_DISABLED: 1

      - name: Add .nojekyll
        run: touch apps/web/out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
