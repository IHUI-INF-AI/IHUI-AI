name: Guardian Full

# 全量守门 CI(2026-10-22 立,机主要求"业务代码提交也要快,但不能漏判")。
#
# 背景:本地 pre-commit 只跑**元门档**(27 道,实测约 49s)—— 判据见 scripts/lib/gate-scope.mjs。
# 全量 271 道门在本机 12 物理核上要约 400s,那是算力下限,不是代码问题。
# 分工:**本地求快**(元门档,覆盖"本次改动直接相关的工具/仓库状态"判据),
#       **CI 求全**(271 道,400s 由 CI 机器承担)。
#
# 触发:**工作日定时 + 手动**(2026-11-05 接案,治理债①;此前自述「当前只开手动」)。
#
# 为什么先不开 push / pull_request 自动触发(2026-10-22,机主要求"不能出任何 bug"):
# 本地全量实测 269 门有 7 道红,其中 6 道是门 168 判"未入 origin/main 的合并复活" ——
# 那些复活文件其实**已在 origin/main 里**(本地只领先 1 枚),CI 的 HEAD 就是 origin/main,
# 按门自己的判据(只判未入 origin 的合并)CI 应当不判它们。但"应当"不是"验证过":
# 在真跑过一次并确认全绿之前,不开放自动触发 —— 否则第一次 push 就是一道无意义的红。
#
# 2026-10-22 首次手动全量实测(run 39787486152,触发面 9a96efd75e):271 门 246 通过 / 5 警告 /
# 20 blocking 红 —— 前置(全绿)未达成,**继续只开手动**。红门分三类:
#   · 判据/接线缺陷(3):[62] NSIS 模板按平台原生模块取材(win 绿/linux 漂移)、[65] 硬编码 Windows git 路径、
#     [222] 面名 head 被当 git rev(Linux 大小写敏感崩溃且未折成 exit 2);
#   · CI 环境门(7,干净 checkout 结构上无输入):[4] dist 未构建、[33] 缺 ai-service/.env、[98] 悬空导入指向未构建 dist、
#     [226] 未装 husky、[228]/[187] 缺 ai-service venv、[170] 缺 .ihui-agent/state 留痕台账;
#   · 真存量(10):[8] 前端路由 /api/admin/relay/account-pool 与后端不一致、[47] HEAD 7 文件水印欠账、
#     [83] UsageScreen 品牌实底无配对前景、[103] 架构契约 3 条(测试位置/反向依赖/6240 行>6000)、
#     [105] ui-routes.generated 陈旧、[130] F9 撞号 2 组、[150] monitor/panels 4 处 control 圆角、
#     [198] 三处 updatedAt 盲写、[200] provider 健康四档第二份声明、[234] 台账标头 malformed(后续 HEAD 可能已修)。
# 处置纪律:环境门按"输入缺失 ⇒ 未判定 exit 0"修语义;判据缺陷按平台/大小写修;真存量逐条修后重跑本工作流。
# 在红集清零并真跑一次全绿之前,不得取消下面 on: 的注释。
#
# 手动验证通过后,把下面 on: 里的 push / pull_request 两段取消注释即可。
#
# ── 2026-11-05 接案(治理债①「全量档在 CI 零自动覆盖」)─────────────────────────
# 现读事实:本腿此前**只有 workflow_dispatch**,且近 9 次手动运行全部 failure、最后一次之后 9 天
# 零跑动,而门集同期从 271 涨到 332(新增枚数全程零自动覆盖)。全量档在本地只跑元门档
# (判据 scripts/lib/gate-scope.mjs),git-guardian 的 daemon 也不调 guardian-runner ⇒ 这一格无人守。
#
# 接成什么档(定案,不是缩射程也不是升档):
#   · **工作日定时 + 手动**:红只出日志与 Job Summary,并留全量原始日志 artifact;**不做 required**、
#     不升 blocking、不加 paths 过滤(那会把它缩成摆设)。required contexts 现读只有
#     `CI / lint-typecheck-test (push)` ⇒ 本腿红不逼人 `--no-verify`,§12e 那条机理在这里不成立,
#     因此"先把存量清零再挂"的前提**不成立**(CI 面与本机面是两套存量集合,本机态那批在 CI 永清不掉)。
#   · 形态照同仓先例 `8end-consistency-cert.yml`(计划触发 + 成败均上传 artifact)。
#   · 门 208 的「CI 面专属腐烂红」已在判据侧堵到登记那一刻(刀三,见 scripts/check-no-nested-git.mjs
#     头注与 carrierGuardReasons):被 .gitignore 覆盖的现场若被登进 JSON 具名台账,本机当场红
#     ⇒ 无法在"本机绿、CI 恒红"的状态下被推进 main。2026-11-05 干净检出面实测:HEAD 面 208 = RC 0。
#
# 时刻选择(先 grep 现读全仓 cron 排布再定,不挤爆 runner):既有作业占 0/2/3(:00/:17)/4/6/17:30/
# 18:00/18:20/19(:00)/20(:00)/00:00 各档,UTC 22 点整空 ⇒ 取 `27 22 * * 1-5`
# (UTC 工作日 22:27 = 北京 06:27,落在工作日开工前,报告当天就能有人看;:27 也避开整点排队)。
on:
  schedule:
    # 工作日(周一至周五)UTC 22:27 = 北京 06:27;避开既有作业的全部时刻档
    - cron: '27 22 * * 1-5'
  workflow_dispatch:

# 同一分支新推送就取消上一轮(省额度,也避免旧结论盖住新结论)
# concurrency:
#   group: guardian-full-${{ github.ref }}
#   cancel-in-progress: true

env:
  # 与 ci-monorepo / golden-e2e / e2e-browser-hub 同一档(那三处各有一份,跨文件无法共享 env,
  # 这里取值现读一致;门 254 的 ruff 由 uvx 按 apps/ai-service/pyproject.toml 的 pin 拉起,
  # 本值只决定 runner 上的 python 解释器,不参与 lint 版本判定)。
  PYTHON_VERSION: '3.12'

# 2026-11-01 安全强化:显式最小权限(与 ci.yml 同档)。此前本文件不声明 permissions,
# 拿的是仓库/组织**默认**那一份;而默认档位可能含写权。声明之后未列出的 scope 一律
# 降为 none(同 release-desktop.yml 头注那条事实)。
# 本作业只做 checkout + 装依赖 + 构建 packages + 跑全量守门:不建 PR、不上传产物、
# 不动 release、不调 GITHUB_TOKEN 写接口 ⇒ `contents: read` 就是它需要的全部。
permissions:
  contents: read

jobs:
  guardian-full:
    runs-on: ubuntu-latest
    # 30 → 45:2026-11-05 现读口径下门集已从 271 涨到 runner `--help` 的现读枚数(约三百三十余道),
    # 按既有实测吞吐(约 290 项 / 16 分钟)外推全量批约 20 分钟,再加 checkout + pnpm install +
    # packages 构建 + uv 安装,30 分钟是**贴边值**(一次抖动就撞 timeout,而 timeout 只留下
    # "跑挂了"没有守门结论 ⇒ 按 §0.3 是未判定,不是绿)。45 分钟给足余量,不缩任何门的射程。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # fetch-depth: 0 —— 守门要读历史(reflog / lost-commit tag / git log 派生),
          # 浅克隆会让 30a(commit 丢失防护)这类门读不到真历史。
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 packages(门 4/98 的 dist 取材面)
        # check-stale-dist / check-dangling-local-imports 读 packages/*/dist;
        # 干净 checkout 没有构建产物,不补就会把"未构建"判成"陈旧/悬空"。
        # 只构建 packages,不构建 apps(门对 apps dist 缺失只跳过)。
        run: pnpm -r --filter "./packages/*" build

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装 uv(门 254 ruff 的执行器)
        # 门 254 判 Python lint,它只认 uvx。本 job 此前没有任何 python 面 ⇒ 干净 runner 上取不到
        # 执行器,门会落 exit 2「未判定」并把整批守门顶红 —— 那正是 §12e 禁的恒红门,而 §0.3 又不许
        # 把"没判"读成"判过"。装不上是本步当场红,原因一眼可见,不会混进守门汇总让人误读成
        # Python 代码有了新问题。形态照 ci-monorepo / golden-e2e / e2e-browser-hub 同一条
        # (setup-python 之后 pip install uv):不碰系统 python —— Ubuntu 24.04 是
        # externally-managed 环境,在那里 `pip install --user` 会当场报 externally-managed-environment。
        run: |
          # uv 档钉死,完整理由见 .github/workflows/ci.yml 的 install-uv 那格
          pip install uv==0.12.1
          uvx --version

      - name: 全量守门(门集枚数以 runner --help 现读,报告档)
        # 刻意**不传** --staged:CI 的 checkout 是干净工作树,没有暂存区概念,
        # 门的判据面回落到"磁盘全量";同时本地那套元门档裁剪也不生效
        # (passStaged=false ⇒ 不裁剪),这正是我们要的全量。
        # --full-face(2026-11-09 必传):水印门 47 不再"没给面就猜整张 HEAD 面",
        # 无面旗会按「未判定」exit 2;本 job 是显式整面检查,面旗必须显式传下去。
        # `set -o pipefail` + tee:把逐门结果落盘成报告件(下面 artifact),同时**保留门的原结论退出码**
        # —— 无 pipefail 时管道尾部(tee)恒 0,会把整批判红洗成绿(§0.3 严禁"没判/判红"冒充"通过")。
        run: |
          set -o pipefail
          mkdir -p .ihui-agent/tmp
          node scripts/guardian-runner.mjs --full-face --timing 2>&1 | tee .ihui-agent/tmp/guardian-full.log

      - name: 上传全量原始日志(成败均上传,留存 28 天)
        # 报告档的核心:逐门结果(含每个门的原样回显与耗时)必须留得住,红不必被人当场看见也能事后取证。
        # 形态照同仓先例 8end-consistency-cert.yml 的 `if: always()` + if-no-files-found: ignore。
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: guardian-full-log-${{ github.run_id }}
          path: .ihui-agent/tmp/guardian-full.log
          if-no-files-found: warn
          retention-days: 28

      - name: 失败时给出下一步
        if: failure()
        run: |
          {
            echo "::error::全量守门有红。本地复跑:node scripts/guardian-runner.mjs"
            echo "::error::确认与本次改动无关再逃生:HUSKY_SKIP_<NAME>=1(见 AGENTS.md §12e,须在报告留痕)"
          }

      - name: 红门与未判定门写入 Job Summary(报告档;不改判据也不改结论)
        # 只把**已经判出来的东西**换个地方再摆一次:逐道点名红门编号 + 该门自己的复跑命令,
        # 未判定单独成段(§0.3:没判 ≠ 判过,不许按缺陷派单也不许当通过)。取不到任何一段一律打
        # "未取到 ⇒ 不冒充没有红",绝不写 0。
        if: failure()
        run: |
          {
            echo '## 全量守门定时腿 · 报告档'
            echo ''
            echo "- 触发:${{ github.event_name }} · 被审面:${{ github.sha }}"
            echo "- 汇总行(从原始日志现读,取不到不冒充):"
            grep -E '^ *(通过|失败|❓ 未判定|⏭ 跳过)[: ]' .ihui-agent/tmp/guardian-full.log | sed 's/^/  /' || echo '  (未取到汇总行 —— 见 artifact `guardian-full-log-<run_id>` 原始日志)'
            echo ''
            echo '### 判红的 blocking 门(编号 + 本地复跑命令)'
            echo '```'
            grep -E '道 blocking 门失败|· \[|单独复现:' .ihui-agent/tmp/guardian-full.log || echo '(未取到判红名单 ⇒ 不冒充"本批没有红",请看 artifact 原始日志)'
            echo '```'
            echo ''
            echo '### 未判定门(§0.3:没判 ≠ 判过;不按缺陷派单,也不记绿)'
            echo '```'
            grep -E '❓' .ihui-agent/tmp/guardian-full.log || echo '(本批日志里没有未判定门)'
            echo '```'
            echo ''
            echo '本腿是**报告档**:不做 required、不升 blocking、不加 paths 缩射程。红只出日志与本摘要。'
          } >> "$GITHUB_STEP_SUMMARY"

# ⁠​‌​​‌​​‌‍‍​‌​​‌​​​‍‍​‌​‌​‌​‌‍‍​‌​​‌​​‌‍‍​​‌​‌‌​‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌​​‌‌‌‌​‌​‍‍‌‌​‌‌​​​‌​​​‌‌‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌‌​‌​​‌‌‌​‍‍‌‌​​‌‌​​​‌​​‌​‌‍‍‌​‌‌‌​‌‌‌​‌‌‌​‌‍‍‌​‌‌​‌‌‌‍‍​‌​​‌‌​​‍‍​‌​​​​‌‌‍‍‌​‌‌​‌‌‌‍‍​‌‌​​​​‌‍‍​‌‌​‌​​‌‍‍​‌‌‌‌​‌​‍‍​‌‌​‌​​​‍‍​‌‌‌​​‌‌‍‍​​‌​‌‌‌​‍‍​‌‌‌​‌​​‍‍​‌‌​‌‌‌‌‍‍​‌‌‌​​​​‍‍‌​‌‌​‌‌‌‍‍​‌​‌​​​​‍‍​‌​‌​​‌​‍‍​‌​​‌‌‌‌‍‍​‌​‌​‌‌​‍‍​‌​​​‌​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​‌‌‍‍​‌​​​‌​‌‍‍​​‌​‌‌​‌‍‍​​‌‌​​‌​‍‍​​‌‌​​​​‍‍​​‌‌​​‌​‍‍​​‌‌​‌‌​⁠
