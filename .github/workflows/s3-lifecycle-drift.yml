name: S3 Lifecycle Drift

# S3 生命周期漂移检测工作流 — 关联 M-25 存储分层配置
# 定期比对实际 S3 桶生命周期策略与 s3-lifecycle.yml 声明配置，发现漂移即告警
on:
  schedule:
    - cron: '0 3 * * 1' # 每周一 03:00 UTC
  workflow_dispatch:
    inputs:
      bucket:
        description: '待检测的 S3 桶名（留空则使用默认桶）'
        required: false
        default: ''

# Security: least-privilege GITHUB_TOKEN (CWE-250). Third-party actions use @v tags — pin to commit SHA for stricter supply-chain security.
permissions:
  contents: read

jobs:
  drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Fetch current lifecycle configuration
        id: current
        run: |
          set -uo pipefail
          BUCKET="${{ inputs.bucket || secrets.S3_BUCKET }}"
          if [ -z "$BUCKET" ]; then
            echo "::error::bucket 未提供(inputs.bucket 与 secrets.S3_BUCKET 均为空)"
            exit 1
          fi
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          ERR=/tmp/aws-lifecycle-err.txt
          # 读取失败 ≠ 线上没有配置:只有 AWS 明确回 NoSuchLifecycleConfiguration 才按 Rules=[] 判;
          # 其余错误(凭据/网络/权限/桶名)一律 ::error + 非 0,不得伪装成「无规则」再判成漂移或绿。
          if aws s3api get-bucket-lifecycle-configuration --bucket "$BUCKET" \
              > /tmp/current-lifecycle.json 2>"$ERR"; then
            echo "读取成功"
          elif grep -q 'NoSuchLifecycleConfiguration' "$ERR"; then
            echo '{"Rules":[]}' > /tmp/current-lifecycle.json
            echo "线上确无生命周期配置(NoSuchLifecycleConfiguration)⇒ 按 Rules=[] 判"
          else
            echo "::error::读取生命周期配置失败(非 NoSuchLifecycleConfiguration):"
            tail -n 3 "$ERR"
            exit 1
          fi

      - name: Compare against declared configuration
        run: |
          set -uo pipefail
          # 声明配置位于 deploy/s3-lifecycle.yml,先转 JSON;解析失败/空输出 ⇒ 不可判定(exit 2),
          # 绝不当「无声明 ⇒ 无漂移」。
          if ! python3 -c 'import sys,yaml,json; print(json.dumps(yaml.safe_load(open(sys.argv[1]))))' \
              deploy/s3-lifecycle.yml > /tmp/declared-lifecycle.json 2>/tmp/declared-err.txt; then
            echo "::error::声明文件解析失败: $(tail -n 3 /tmp/declared-err.txt)"
            exit 2
          fi
          # 内容级比较(键排序规范化),改 Days 而条数不变也判漂移;漂移 exit 1、不可判定 exit 2。
          python3 deploy/aws/s3-lifecycle-compare.py /tmp/declared-lifecycle.json /tmp/current-lifecycle.json

# ⁠​‌​​‌​​‌‍‍​‌​​‌​​​‍‍​‌​‌​‌​‌‍‍​‌​​‌​​‌‍‍​​‌​‌‌​‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌​​‌‌‌‌​‌​‍‍‌‌​‌‌​​​‌​​​‌‌‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌‌​‌​​‌‌‌​‍‍‌‌​​‌‌​​​‌​​‌​‌‍‍‌​‌‌‌​‌‌‌​‌‌‌​‌‍‍‌​‌‌​‌‌‌‍‍​‌​​‌‌​​‍‍​‌​​​​‌‌‍‍‌​‌‌​‌‌‌‍‍​‌‌​​​​‌‍‍​‌‌​‌​​‌‍‍​‌‌‌‌​‌​‍‍​‌‌​‌​​​‍‍​‌‌‌​​‌‌‍‍​​‌​‌‌‌​‍‍​‌‌‌​‌​​‍‍​‌‌​‌‌‌‌‍‍​‌‌‌​​​​‍‍‌​‌‌​‌‌‌‍‍​‌​‌​​​​‍‍​‌​‌​​‌​‍‍​‌​​‌‌‌‌‍‍​‌​‌​‌‌​‍‍​‌​​​‌​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​‌‌‍‍​‌​​​‌​‌‍‍​​‌​‌‌​‌‍‍​​‌‌​​‌​‍‍​​‌‌​​​​‍‍​​‌‌​​‌​‍‍​​‌‌​‌‌​⁠
