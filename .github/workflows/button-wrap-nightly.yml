name: button-wrap-nightly

# button 文字换行 nightly 扫描
# - cron 北京时间 03:00 (UTC 19:00, 每天)
# - 跑 scripts/check-shrinkable-text-button.mjs 全量扫描
# - 命中时维护**一条**跟踪 Issue (labels: nightly / ui-bug / guardian):已有则更新,没有才新建;
#   0 命中时自动关闭在位的那条。2026-09-28 前是"每晚开一条",同文帖累计 14 条,已收口。
# - 报告始终上传为 artifact (30 天保留)
#
# 触发:
#   - 定时: 每天 UTC 19:00 (北京时间次日 03:00)
#   - 手动: Actions 页面 → Run workflow (无参数)

on:
  schedule:
    # 北京时间 03:00 = UTC 19:00
    - cron: '0 19 * * *'
  workflow_dispatch:

# Security: least-privilege GITHUB_TOKEN
permissions:
  contents: read
  issues: write

env:
  NODE_VERSION: '22'

jobs:
  scan:
    name: 扫描 button 文字换行违规
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ============================================================
      # 扫描: 默认无 --strict, 写 JSON 到 .ihui-agent/tmp/, exit 0
      # 命中判断由后续 step 读 JSON 文件自行判定
      # ============================================================
      - name: 扫描 button 文字换行违规
        id: scan
        run: |
          mkdir -p .ihui-agent/tmp
          node scripts/check-shrinkable-text-button.mjs \
            --scan \
            --output .ihui-agent/tmp/nightly-button-wrap.json \
            --quiet

      - name: 摘要 → step summary
        run: |
          report=$(cat .ihui-agent/tmp/nightly-button-wrap.json)
          hits=$(node -e "console.log(JSON.parse(process.argv[1]).summary.totalHits)" "$report")
          files=$(node -e "console.log(JSON.parse(process.argv[1]).summary.filesAffected)" "$report")
          buttons=$(node -e "console.log(JSON.parse(process.argv[1]).totalButtons)" "$report")
          echo "### button-wrap nightly 扫描结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 扫描 button 块: **${buttons}**" >> $GITHUB_STEP_SUMMARY
          echo "- 命中: **${hits}**" >> $GITHUB_STEP_SUMMARY
          echo "- 涉及文件: **${files}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "详细报告: \`nightly-button-wrap-report\` artifact" >> $GITHUB_STEP_SUMMARY

      # ============================================================
      # 命中时创建 GitHub Issue
      # ============================================================
      - name: 创建 GitHub Issue (命中时)
        id: issue
        env:
          REPORT_PATH: .ihui-agent/tmp/nightly-button-wrap.json
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, 'utf8'));
            const hits = report.summary.totalHits;
            const files = report.summary.filesAffected;
            const date = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // 单一跟踪帖(2026-09-28 改):同一条违规此前**每晚新建一份**,累计 14 条同文帖,
            // 把真实反馈埋掉了(外部审计点名"46 个开放 issue 里 14 个是机器人帖")。
            // 现口径:命中 ⇒ 更新这一条;0 命中 ⇒ 关掉这一条。0 命中却留着 open = 台账腐烂。
            const TRACK_TITLE = '[nightly] button 文字换行违规 · 自动跟踪';
            const findTracker = async () => {
              const r = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: 'nightly',
                per_page: 100,
              });
              // 标题逐字相等才算跟踪帖 —— 用 startsWith 会把历史遗留的带日期副本再算一份
              return r.data.find((i) => !i.pull_request && i.title === TRACK_TITLE) || null;
            };

            if (hits === 0) {
              const tracker = await findTracker();
              if (!tracker) {
                core.info('未命中, 且无在位跟踪帖, 不做任何事');
                return;
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: tracker.number,
                body: `本轮扫描(${date})命中 **0** 处 ⇒ 自动关闭本跟踪帖。后续再命中时同一 workflow 会重开一条跟踪帖。`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: tracker.number,
                state: 'closed',
                state_reason: 'completed',
              });
              core.info(`跟踪帖 #${tracker.number} 已关闭(0 命中)`);
              return;
            }

            // 命中 Top 20
            const top = (report.hits || []).slice(0, 20).map((h) => {
              return `- \`${h.file}:${h.line}\` label="${h.label}" 缺 ${(h.missing || []).join(', ')}`;
            }).join('\n');

            const body = [
              '## Nightly button 文字换行违规扫描',
              '',
              `- 扫描时间: ${report.scannedAt}`,
              `- 扫描 button 块: ${report.totalButtons}`,
              `- 命中: **${hits}** 处`,
              `- 涉及文件: ${files}`,
              `- 耗时: ${report.summary.elapsedMs}ms`,
              `- 扫描目录: ${(report.summary.scanDirs || []).join(', ')}`,
              '',
              '## 命中 Top 20',
              '',
              top,
              '',
              '---',
              '',
              '完整报告见 workflow run artifact: `nightly-button-wrap-report`',
              '',
              `由 \`.github/workflows/button-wrap-nightly.yml\` 自动维护(命中即更新本帖,0 命中即关闭) · ${runUrl}`,
              '',
            ].join('\n');

            // 命中:有跟踪帖就改它,没有才建 —— 保证**任何时刻最多一条**在位。
            const tracker = await findTracker();
            if (tracker) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: tracker.number,
                body,
              });
              core.info(`已更新唯一跟踪帖 #${tracker.number}(命中 ${hits} 处 / ${files} 个文件)`);
              core.setOutput('issue_number', String(tracker.number));
              core.setOutput('issue_url', tracker.html_url);
              return;
            }

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: TRACK_TITLE,
              body,
              labels: ['nightly', 'ui-bug', 'guardian'],
            });

            core.info(`已创建 Issue #${issue.data.number}: ${issue.data.html_url}`);
            core.setOutput('issue_number', String(issue.data.number));
            core.setOutput('issue_url', issue.data.html_url);

      # ============================================================
      # 上传扫描报告 (artifact, 30 天保留)
      # 无论命中与否都上传, 方便事后追溯
      # ============================================================
      - name: 上传扫描报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-button-wrap-report
          path: .ihui-agent/tmp/nightly-button-wrap.json
          retention-days: 30
          if-no-files-found: error
# ⁠​‌​​‌​​‌‍‍​‌​​‌​​​‍‍​‌​‌​‌​‌‍‍​‌​​‌​​‌‍‍​​‌​‌‌​‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌​​‌‌‌‌​‌​‍‍‌‌​‌‌​​​‌​​​‌‌‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌‌​‌​​‌‌‌​‍‍‌‌​​‌‌​​​‌​​‌​‌‍‍‌​‌‌‌​‌‌‌​‌‌‌​‌‍‍‌​‌‌​‌‌‌‍‍​‌​​‌‌​​‍‍​‌​​​​‌‌‍‍‌​‌‌​‌‌‌‍‍​‌‌​​​​‌‍‍​‌‌​‌​​‌‍‍​‌‌‌‌​‌​‍‍​‌‌​‌​​​‍‍​‌‌‌​​‌‌‍‍​​‌​‌‌‌​‍‍​‌‌‌​‌​​‍‍​‌‌​‌‌‌‌‍‍​‌‌‌​​​​‍‍‌​‌‌​‌‌‌‍‍​‌​‌​​​​‍‍​‌​‌​​‌​‍‍​‌​​‌‌‌‌‍‍​‌​‌​‌‌​‍‍​‌​​​‌​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​‌‌‍‍​‌​​​‌​‌‍‍​​‌​‌‌​‌‍‍​​‌‌​​‌​‍‍​​‌‌​​​​‍‍​​‌‌​​‌​‍‍​​‌‌​‌‌​⁠
