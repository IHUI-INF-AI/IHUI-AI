# Why this file was rewritten (2026-09-27).
#
# Its previous form ran on ubuntu-latest and did:
#     curl -f http://localhost:8801/api/health/metrics
#     curl -f http://localhost:9090/api/v1/targets
#     curl -f http://localhost:8801/api/health
# Those ports belong to the production Windows host. A GitHub-hosted runner has nothing
# listening on them, so `curl -f` exits 7 on a refused socket every single run. Verified:
# `grep -rn "runs-on" .github/workflows/` yields 78 hits, all GitHub-hosted
# (ubuntu-latest / windows-latest / macos-* / matrix of the same) and zero self-hosted.
#
# So this job could not pass, and it never reported on the thing its name claimed.
# That is worse than having no job at all: a weekly red row in the Actions list reads to
# everyone who glances at it as "alerting is drilled, we just ignore that flaky one", and
# the dimension stays uncovered forever while looking covered.
#
# What it judges now is the same dimension, but by a method that can actually observe it
# from a runner: the alerting chain is only as live as its configuration. Everything below
# is repo content, needs no network, and fails on the exact defects this stack has already
# produced (a rules file Prometheus 3.x refuses to load at all, and rules pointing at
# targets that are never scraped).
#
# What this job deliberately does NOT cover, stated so nobody reads green as "alerting
# works": it proves the config parses and the wiring is self-consistent. It does not prove
# Prometheus is running, that any target is actually up, or that a fired alert reaches a
# human. Endpoint liveness and delivery are the on-host watch shift's job, because that is
# the only place those ports exist.

name: Monitoring Config Static Validation

on:
  schedule:
    # Weekly sweep retained: it catches drift introduced by merges that touched no
    # monitored path below (e.g. a rules file renamed by a refactor elsewhere).
    - cron: '0 6 * * 1'
  workflow_dispatch:
  # The real value: a broken monitoring config is caught by the commit that breaks it,
  # not up to six days later by the schedule.
  push:
    paths:
      - 'monitoring/prometheus/**'
      - 'monitoring/alertmanager/**'
      - 'scripts/render-alertmanager-config.mjs'
      - '.github/workflows/observability-drills.yml'
  pull_request:
    paths:
      - 'monitoring/prometheus/**'
      - 'monitoring/alertmanager/**'
      - 'scripts/render-alertmanager-config.mjs'
      - '.github/workflows/observability-drills.yml'

# Security: least-privilege GITHUB_TOKEN (CWE-250).
permissions:
  contents: read

env:
  # Pinned deliberately. CI must parse the config with the same grammar the production
  # host uses, otherwise a field the runner accepts and the server rejects (or the reverse
  # -- which is how the `disabled:` rules bug stayed invisible) is judged against the wrong
  # spec. Read the prod version with:
  #   promtool --version   (on the host: D:\DevEnv\monitor\prometheus\*\promtool.exe)
  # Measured on this repo's host 2026-09-27: prometheus 3.14.0. Bump both together.
  PROMETHEUS_VERSION: '3.14.0'

jobs:
  validate-monitoring-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install promtool (version-pinned to the production host)
        run: |
          set -euo pipefail
          v="$PROMETHEUS_VERSION"
          url="https://github.com/prometheus/prometheus/releases/download/v${v}/prometheus-${v}.linux-amd64.tar.gz"
          curl -fsSL --retry 3 -o /tmp/prom.tgz "$url"
          tar -xzf /tmp/prom.tgz -C /tmp
          # Put the extracted dir on PATH instead of installing into /usr/local/bin:
          # writing there needs sudo, and a step that fails on permissions would look
          # exactly like a config failure in the run list.
          echo "/tmp/prometheus-${v}.linux-amd64" >> "$GITHUB_PATH"
          export PATH="/tmp/prometheus-${v}.linux-amd64:$PATH"
          promtool --version

      # `check config` also resolves rule_files, so it is the step that would have caught
      # the historical `disabled:` defect -- that field is unknown to Prometheus 3.x's
      # rulefmt, so promtool rejects the WHOLE rules file rather than skipping one rule,
      # and no check in this repo could see it (only promtool on the host ever did).
      #
      # Note on prometheus.yml's `password_file: 'D:/DevEnv/secrets/...'`: this does NOT
      # break CI, and that is a measured fact, not an assumption -- `check config` does not
      # dereference password_file (verified by pointing it at a path that cannot exist:
      # still "SUCCESS ... is valid prometheus config file syntax"). Do not "fix" this by
      # rewriting or stubbing the path for the runner; doing so would validate a file that
      # is not the one production loads.
      - name: Prometheus config must load (config + referenced rule files)
        run: promtool check config monitoring/prometheus/prometheus.yml

      - name: Alert rules must parse standalone
        run: promtool check rules monitoring/prometheus/alerts.yml

      - name: Every job selector in an alert rule must name a scraped job
        run: |
          set -euo pipefail
          python3 -c 'import yaml' 2>/dev/null || {
            echo "::error::PyYAML is unavailable on this runner -- this step judged nothing." >&2
            exit 1
          }
          python3 - <<'PYCHECK'
          import re, sys
          import yaml

          CFG, RULES = "monitoring/prometheus/prometheus.yml", "monitoring/prometheus/alerts.yml"
          JOB_RE = re.compile(r'\bjob\s*(=~|!~|!=|=)\s*"([^"]*)"')
          IDENT_RE = re.compile(r"[A-Za-z_:][A-Za-z0-9_:]*")
          BRACE_RE = re.compile(r"\{[^{}]*\}")
          KEYWORDS = {"and", "or", "unless", "bool", "offset", "by", "without", "on",
                      "ignoring", "group_left", "group_right", "inf", "nan", "start", "end"}

          def load(p):
              with open(p, encoding="utf-8") as fh:
                  return yaml.safe_load(fh)

          def scraped(cfg):
              return [s["job_name"] for s in (cfg.get("scrape_configs") or []) if s.get("job_name")]

          def disabled_only(active):
              # yaml.safe_load discards comments, so a job that survives only inside a
              # comment block is invisible to it. Naming those separately matters: it is
              # the difference between "nobody ever wrote this job" and "we switched it off
              # on purpose", and the second one has a different fix.
              out = set()
              with open(CFG, encoding="utf-8") as fh:
                  for line in fh:
                      t = line.strip()
                      if t.startswith("#") and "job_name" in t:
                          m = re.search(r"job_name:\s*['\"]?([^'\"\s#]+)", t)
                          if m:
                              out.add(m.group(1).strip("'\""))
              return out - set(active)

          def metrics(expr):
              # Label matchers must be dropped before harvesting identifiers, or
              # {fstype!~"tmpfs|overlay"} contributes "fstype"/"tmpfs"/"overlay" as if they
              # were metrics -- which makes the DEAD test below quietly report fewer dead
              # rules than exist.
              body = BRACE_RE.sub(" ", expr)
              return {m.group(0) for m in IDENT_RE.finditer(body)
                      if m.group(0) not in KEYWORDS
                      and not body[m.end():].lstrip().startswith("(")}

          def rules(doc):
              for g in doc.get("groups") or []:
                  for r in g.get("rules") or []:
                      e = r.get("expr")
                      if isinstance(e, str):
                          yield g.get("name", "?"), r.get("alert") or r.get("record") or "?", e

          def full(pat, val):
              # Prometheus anchors regex matchers, so mirror that. An uncompilable pattern
              # cannot be reached here (promtool rejects it in the step above), but never
              # let a crash stand in for a verdict.
              try:
                  return re.fullmatch(pat, val) is not None
              except re.error:
                  return False

          cfg, doc = load(CFG), load(RULES)
          active = scraped(cfg)
          aset, dis = set(active), disabled_only(active)
          bad, dead, unscoped, used = [], [], [], set()

          for group, name, expr in rules(doc):
              pos = [(o, v) for o, v in JOB_RE.findall(expr) if o in ("=", "=~")]
              if not pos:
                  unscoped.append((group, name))
                  ms = metrics(expr)
                  own = {j for j in dis if any(m.startswith(j + "_") for m in ms)}
                  if ms and own and all(any(m.startswith(j + "_") for j in own) for m in ms):
                      dead.append((group, name, sorted(ms), sorted(own)))
                  continue
              for op, val in pos:
                  used.add(val)
                  ok = val in aset if op == "=" else any(full(val, j) for j in active)
                  if not ok:
                      gone = val in dis or (op == "=~" and any(full(val, j) for j in dis))
                      bad.append((group, name, 'job%s"%s"' % (op, val),
                                  "is commented out in prometheus.yml"
                                  if gone else "is not defined in prometheus.yml"))

          print("scraped jobs (%d): %s" % (len(active), ", ".join(sorted(aset))))
          if dis:
              print("named only in comments, NOT scraped: %s" % ", ".join(sorted(dis)))
          print("rules examined: %d" % sum(1 for _ in rules(doc)))
          print("\nVIOLATION (blocking)   : %d" % len(bad))
          for g, n, s, w in bad:
              print("  - [%s] %s uses %s -> %s" % (g, n, s, w))
          print("DEAD RULE (not blocking): %d" % len(dead))
          for g, n, ms, own in dead:
              print("  - [%s] %s reads only %s, exposed only by job(s) %s -- which "
                    "%s commented out in prometheus.yml, so this alert can never fire."
                    % (g, n, ", ".join(ms), ", ".join(own),
                       "is" if len(own) == 1 else "are"))
          print("UNSCOPED (not judged)  : %d" % len(unscoped))
          for g, n in unscoped:
              print("  - [%s] %s -- no job label; this check cannot prove its series exist"
                    % (g, n))
          orphans = sorted(aset - used)
          print("\nscraped but named by no rule selector: %d%s"
                % (len(orphans), "" if not orphans else " -> " + ", ".join(orphans)))
          print("(not judged -- a job can legitimately be dashboard-only)")
          print()

          # Three states, three different meanings, never collapsed into one count.
          # VIOLATION is what makes CI red. DEAD is reported but does not fail, because
          # whoever added this check does not own monitoring/prometheus/ and cannot decide
          # whether those rules should be re-enabled or deleted; a red that only the owner
          # can clear becomes the next permanently-ignored red row, which is the failure
          # this file is being rewritten to remove. It is printed as a ::warning:: so it
          # shows up inline on the diff, not just in a log nobody opens.
          if bad:
              print("::error::%d alert rule(s) select jobs that are never scraped." % len(bad))
              print("RESULT: FAIL")
              sys.exit(1)
          for g, n, ms, own in dead:
              print("::warning file=%s::%s watches metrics of disabled job(s) %s and can "
                    "never fire." % (RULES, n, ", ".join(own)))
          print("RESULT: PASS%s" % (" (with findings above)" if dead or unscoped else ""))
          PYCHECK

      # Alertmanager's real check is the repo's own renderer, not a downloaded amtool:
      # amtool 0.34.0 could not be executed here (the host copy is unreadable by the shell
      # and re-download did not complete), so its verdict on this file is unobserved -- and
      # wiring a step nobody has watched pass is how this file got into the state it was in.
      # `--check` is pure repo content + node builtins, exits non-zero on the failure modes
      # this config actually has history of, and is measured green against the current tree.
      #
      # Scope note, so this is not later "fixed" into a permanent red: the single source of
      # truth is monitoring/alertmanager/alertmanager.yml.tmpl. The sibling
      # alertmanager.yml is a deprecated stub that is *deliberately* missing route/receivers
      # so that mounting it fails loudly instead of silently loading a config that cannot
      # send; `amtool check-config` on that file is expected to fail and must not be added.
      - name: Alertmanager config must keep its single exit (bridge-only)
        run: node scripts/render-alertmanager-config.mjs --check

      - name: Summary
        run: |
          echo "Covered: prometheus config + rules parse under the pinned production version;" \
               "every job selector in an alert rule resolves to a scraped job;" \
               "alertmanager keeps exactly one egress."
          echo "NOT covered here: service liveness on 8801/8802/8803/8815/9093/9096," \
               "scrape success of any target, and delivery of a fired alert to an inbox."
          # 谁真的在管这三件事(2026-09-27 按实测写,不写"某个班次会看"):
          #   - 端口活性 6 个全在 deploy/win/ihui-monitor.ps1 的探测清单里(nssm IHUI-MONITOR,
          #     5 分钟一轮、不经 prometheus 的独立路径)。这一条过去只写了 8801/8802/8803,
          #     而"监控系统自己死了谁来看"没人答 —— 8815/9093/9096 当时**无人探活**。
          #   - 抓取是否成功:monitoring/prometheus/alerts.yml 里每组 *Down 规则(由 prometheus 自评,
          #     所以它对"prometheus 自身死亡"这一格结构上无效,上一条才是它的兜底)。
          #   - 到人:bridge 落盘的 UNDELIVERED 标记 + AlertBridgeMailUndelivered /
          #     AlertmanagerDeliveryFailed 两条规则;以及每周必寄的运维周报(死手开关)。

