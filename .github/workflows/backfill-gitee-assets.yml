name: Backfill Gitee Assets

# 手动补齐 Gitee release 缺失的资产(2026-10-17 立)。
#
# 为什么需要独立入口:`release-desktop.yml` 里的 sync-gitee job 是**发版时顺带**做的,
# 一旦在它跑的过程中超时/断流,缺失的资产只能等**下一次发版**才补 —— 而用户下载页是
# 立刻指向新版本的,于是"页面写着 0.1.75、点下载 404"会持续很久。
# 实测事故:desktop-v0.1.75 的 `AI_0.1.75_amd64.AppImage`(79MB)在 Gitee 上缺失(404),
# 而 GitHub 侧完好。国内外都直连不到 GitHub 资产域名(本机与生产机实测 rc=28 超时),
# 只有 **Actions runner** 能下载 —— 所以补传必须由 runner 来做,不能靠本地。
#
# 用法:手动触发,填 tag(如 desktop-v0.1.75),可先 dry-run 看缺哪些。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要补齐的 tag(如 desktop-v0.1.75)'
        required: true
      dry_run:
        description: '只打印缺哪些资产,不下载不上传'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: backfill-gitee-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  backfill:
    name: Backfill Gitee assets (${{ github.event.inputs.tag }})
    runs-on: ubuntu-latest
    # 79MB 级资产从 GitHub 拉到国内,再传 Gitee,慢是常态;给足预算但**必须有上限**,
    # 不能像 sync-gitee 那样挂一小时还占着 runner。
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Backfill
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/backfill-gitee-assets.py \
            --tag "${{ github.event.inputs.tag }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Summary
        if: always()
        run: |
          echo "### Gitee 资产补齐" >> $GITHUB_STEP_SUMMARY
          echo "tag: \`${{ github.event.inputs.tag }}\` / dry-run: ${{ github.event.inputs.dry_run }}" >> $GITHUB_STEP_SUMMARY
          echo "脚本: \`.github/scripts/backfill-gitee-assets.py\`(幂等:已有同名跳过)" >> $GITHUB_STEP_SUMMARY
# ⁠​‌​​‌​​‌‍‍​‌​​‌​​​‍‍​‌​‌​‌​‌‍‍​‌​​‌​​‌‍‍​​‌​‌‌​‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌​​‌‌‌‌​‌​‍‍‌‌​‌‌​​​‌​​​‌‌‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌‌​‌​​‌‌‌​‍‍‌‌​​‌‌​​​‌​​‌​‌‍‍‌​‌‌‌​‌‌‌​‌‌‌​‌‍‍‌​‌‌​‌‌‌‍‍​‌​​‌‌​​‍‍​‌​​​​‌‌‍‍‌​‌‌​‌‌‌‍‍​‌‌​​​​‌‍‍​‌‌​‌​​‌‍‍​‌‌‌‌​‌​‍‍​‌‌​‌​​​‍‍​‌‌‌​​‌‌‍‍​​‌​‌‌‌​‍‍​‌‌‌​‌​​‍‍​‌‌​‌‌‌‌‍‍​‌‌‌​​​​‍‍‌​‌‌​‌‌‌‍‍​‌​‌​​​​‍‍​‌​‌​​‌​‍‍​‌​​‌‌‌‌‍‍​‌​‌​‌‌​‍‍​‌​​​‌​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​‌‌‍‍​‌​​​‌​‌‍‍​​‌​‌‌​‌‍‍​​‌‌​​‌​‍‍​​‌‌​​​​‍‍​​‌‌​​‌​‍‍​​‌‌​‌‌​⁠
