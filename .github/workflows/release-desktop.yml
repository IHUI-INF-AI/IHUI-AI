name: Release Desktop

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. desktop-v0.1.0)'
        required: true

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: Build Desktop (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            runner: windows-latest
          - label: macos-arm64
            runner: macos-latest
          - label: macos-x64
            runner: macos-13
          - label: linux-x64
            runner: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: Configure npm registry (avoid npmjs.org 503)
        run: pnpm config set registry https://registry.npmmirror.com

      - name: Install pnpm deps
        run: pnpm install --no-frozen-lockfile

      - name: Build web (static export to apps/web/out)
        env:
          # 生产 API 基址:在 GitHub repo Settings → Secrets 配置 DESKTOP_API_URL
          # 例如 https://api.ihui.ai(不带尾部斜杠)
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.DESKTOP_API_URL }}
        run: pnpm --filter @ihui/web build

      - name: Verify web output exists
        shell: bash
        run: |
          if [ ! -d "apps/web/out" ]; then
            echo "ERROR: apps/web/out not found after web build"
            exit 1
          fi
          echo "apps/web/out exists, file count:"
          find apps/web/out -type f | wc -l

      - name: Build & Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.DESKTOP_TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.DESKTOP_TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'IHUI AI Desktop ${{ github.ref_name }}'
          releaseBody: '桌面端安装包(Tauri 2 + Rust + React)。详见 CHANGELOG。'
          releaseDraft: false
          prerelease: false
          # 启用自动更新 artifacts:tauri-action 会自动生成 latest.json 并上传到 Release assets
          # updater endpoint 配置在 tauri.conf.json 指向 GitHub Releases:
          # https://github.com/IHUI-INF-AI/IHUI-AI/releases/latest/download/latest.json
          updaterJsonPreferNsis: true

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-bundle-${{ matrix.label }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
          retention-days: 7

      - name: Summary
        run: |
          echo "### Desktop 构建完成" >> $GITHUB_STEP_SUMMARY
          echo "平台: ${{ matrix.label }}" >> $GITHUB_STEP_SUMMARY
          echo "tag: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "产物: .msi/.exe(Windows)、.dmg(macOS)、.deb/.AppImage(Linux)+ updater 签名包" >> $GITHUB_STEP_SUMMARY

  # 聚合多平台 .sig 文件,生成包含全部平台的统一 latest.json
  # 解决:tauri-action 矩阵构建时每个 job 只生成当前平台的 latest.json,后上传覆盖先上传
  publish-updater-json:
    name: Publish Updater JSON
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate & upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/generate-latest-json.mjs

      - name: Summary
        run: |
          echo "### Updater JSON 发布完成" >> $GITHUB_STEP_SUMMARY
          echo "tag: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "latest.json 已聚合所有平台签名,上传到 Release assets" >> $GITHUB_STEP_SUMMARY

  # 同步构建产物到 apps/web/public/downloads/,实现"构建 → 自动同步下载包 → 自动更新 manifest"全链路
  sync-downloads:
    name: Sync Downloads to public/downloads/
    needs: [build, publish-updater-json]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (main branch for commit)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Configure npm registry
        run: pnpm config set registry https://registry.npmmirror.com

      - name: Install pnpm deps
        run: pnpm install --no-frozen-lockfile

      - name: Build extension
        run: pnpm --filter @ihui/extension build

      - name: Download all bundle artifacts
        uses: actions/download-artifact@v4
        with:
          path: .
          pattern: desktop-bundle-*
          merge-multiple: true

      - name: Sync downloads to public/downloads/
        run: node scripts/sync-downloads.mjs

      - name: Check for changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain apps/web/public/downloads/)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit synced downloads
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/downloads/
          git commit -m "chore(downloads): auto-sync after release ${{ github.ref_name }}"
          git push origin main

      - name: Summary
        run: |
          echo "### Downloads 同步完成" >> $GITHUB_STEP_SUMMARY
          echo "tag: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "产物已同步到 apps/web/public/downloads/(desktop + extension)" >> $GITHUB_STEP_SUMMARY
