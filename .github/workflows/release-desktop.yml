name: Release Desktop

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. desktop-v0.1.0)'
        required: true

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  # 2026-09-17 终极薄壳化:frontendDist 改为 src-tauri/shell(几 KB 占位页),
  # 桌面端不再内嵌/构建 909 页前端(线上 aizhs.top 才是真前端,更新零发版)。
  # → 发版链 = 纯 Rust 编译+打包,web 构建步骤整体移除。
  build:
    name: Build Desktop (${{ matrix.label }})
    # 2026-09-17:幽灵 run 防护——并行会话频繁 push main 会为 tags-only workflow
    # 创建 0-job 空 run 并标 failure(GitHub 行为);此守卫使其变为 skipped。
    if: startsWith(github.ref, 'refs/tags/desktop-v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            runner: windows-latest
          # 2026-09-17 极致提速:macOS 由"arm64 + Intel 两个 job"合并为 **Universal 二进制**
          # (arm64 runner 交叉编译 x86_64-apple-darwin,tauri --target universal-apple-darwin),
          # 产物同时支持 Apple Silicon 与 Intel——直接砍掉最慢的 macos-15-intel job(实测 ~45min)。
          - label: macos-universal
            runner: macos-latest
          - label: linux-x64
            runner: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # macOS Universal:补装 x86_64 目标(arm64 已就位)
      - name: Add macOS x86_64 target (universal build)
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      # 2026-09-17 链接提速:.cargo/config.toml 指定 rust-lld 作为 Windows 链接器
      # (实测增量构建 110s → 5.4s);rust-lld 在 toolchain 内不在 PATH,补入 GITHUB_PATH
      - name: Expose rust-lld (Windows linker speedup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $lldDir = Join-Path (rustc --print sysroot) 'lib/rustlib/x86_64-pc-windows-msvc/bin'
          if (Test-Path $lldDir) { Add-Content -Path $env:GITHUB_PATH -Value $lldDir; Write-Host "rust-lld dir: $lldDir" }

      # 2026-09-16 构建提速:Rust target 缓存——release 全量编译 20-40 分钟是大头,
      # 增量后仅重编变更 crate(实测可压缩到 5-10 分钟);key 按 Cargo.lock 哈希失效。
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          cache-all-crates: true
          # 2026-09-17:失败也保存缓存——失败 run 的编译成果不浪费,重跑时增量续编
          cache-on-failure: true

      # 2026-09-17 编译缓存跨 run 共享:命中后依赖 crate 全跳过,只编业务代码
      # (macOS/Linux 单 job 预期 8-10 分钟;首 run 为填充缓存,第二次起生效)
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Enable sccache
        run: echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      # 2026-09-17:纯 Rust 化后无 node_modules,tauri-action 默认 `npm run tauri` 会失败——
      # 全局装独立 CLI(约 10 秒)并显式指定 tauriScript
      - name: Install Tauri CLI
        run: npm i -g @tauri-apps/cli@^2

      - name: Build & Release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        # 2026-09-05: tauri-action 的产物收集按预期路径 existsSync 过滤,非 ASCII productName
        # (智汇AI)在 Linux/macOS 上预期路径与磁盘文件失配→"No artifacts were found"假失败
        # (产物实际已构建+签名成功,CI 日志实证);容错后由下一步兜底上传
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.DESKTOP_TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.DESKTOP_TAURI_KEY_PASSWORD }}
        with:
          # 2026-09-17:纯 Rust 化后无 node_modules,tauri-action 默认 `npm run tauri` 会失败——
          # 显式指定全局安装的 tauri CLI(见上一步 Install Tauri CLI)
          tauriScript: tauri
          # macOS:Universal 二进制(同时覆盖 arm64 + Intel;配合 rustup target add)
          args: ${{ runner.os == 'macOS' && '--target universal-apple-darwin' || '' }}
          # 2026-09-05: 默认以仓库根为 CWD,导致 beforeBuildCommand `node scripts/ensure-web-out.mjs`
          # 解析到 <root>/scripts 找不到模块(CI 实证);指定 tauri 应用目录对齐本地行为
          projectPath: apps/desktop
          # workflow_dispatch 手动触发时 ref_name 是分支名,须用 inputs.tag;
          # tag push 触发时 ref_name 即 tag 名
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'IHUI AI Desktop ${{ inputs.tag || github.ref_name }}'
          releaseBody: '桌面端安装包(Tauri 2 + Rust + React)。详见 CHANGELOG。'
          releaseDraft: false
          prerelease: false
          # 启用自动更新 artifacts:tauri-action 生成各平台 .sig 签名包并上传 Release assets;
          # publish-updater-json job 聚合全部平台生成统一 latest.json,
          # 并同步到固定 feed tag desktop-updater-feed(见 scripts/generate-latest-json.mjs)。
          # updater endpoint 配置在 tauri.conf.json 指向固定 feed(避免 releases/latest 被其他 release 漂移):
          # https://github.com/IHUI-INF-AI/IHUI-AI/releases/download/desktop-updater-feed/latest.json
          updaterJsonPreferNsis: true

      # 2026-09-18 兜底断言:此前 Build & Release 是 continue-on-error(为绕过非 ASCII
      # productName 的 tauri-action 产物收集假失败),导致 **Windows NSIS 打包真实失败
      # (makensis 语言文件缺失)被静默吞掉** —— job 报 success、release 缺 exe/sig,
      # 直接造成 0.1.35 无 Windows 资产(下载页与 Tauri 更新 feed 双断)。
      # 这里改成「无论如何都断言磁盘上真有产物」:产物为空即硬失败,不再允许静默成功。
      - name: Verify bundle produced (fail loudly)
        if: always()
        shell: bash
        run: |
          BUNDLE=apps/desktop/src-tauri/target/release/bundle
          if [ -d "apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle" ]; then
            BUNDLE=apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle
          fi
          COUNT=$(find "$BUNDLE" -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
            -o -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.app.tar.gz' \) 2>/dev/null | wc -l | tr -d ' ')
          echo "tauri build 产物数量: $COUNT (Build & Release outcome: ${{ steps.tauri.outcome }})"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::tauri build 未产出任何安装包($BUNDLE 为空);Build & Release outcome=${{ steps.tauri.outcome }}。拒绝静默成功。"
            exit 1
          fi

      - name: Fallback upload bundle files to Release
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          # 2026-09-17:macOS Universal 产物在 target/universal-apple-darwin/release/bundle
          BUNDLE=apps/desktop/src-tauri/target/release/bundle
          if [ -d "apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle" ]; then
            BUNDLE=apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle
          fi
          # tauri-action existsSync 过滤丢产物的兜底:按磁盘真实文件名(含中文)直接上传
          FILES=$(find "$BUNDLE" -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
            -o -name '*.AppImage.tar.gz' -o -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \
            -o -name '*.app.tar.gz' -o -name '*.sig' \) 2>/dev/null)
          if [ -z "$FILES" ]; then
            echo "No bundle files found, skip fallback upload"
            exit 0
          fi
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "IHUI AI Desktop $TAG" \
              --notes "Desktop bundles (Tauri 2)"
          echo "$FILES" | while IFS= read -r f; do
            echo "Uploading: $f"
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "$f" || echo "WARN: upload failed: $f"
          done

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-bundle-${{ matrix.label }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
          if-no-files-found: warn
          retention-days: 7

      - name: Summary
        run: |
          echo "### Desktop 构建完成" >> $GITHUB_STEP_SUMMARY
          echo "平台: ${{ matrix.label }}" >> $GITHUB_STEP_SUMMARY
          echo "tag: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "产物: .exe(Windows)、.dmg(macOS)、.deb/.AppImage(Linux)+ updater 签名包" >> $GITHUB_STEP_SUMMARY

  # 聚合多平台 .sig 文件,生成包含全部平台的统一 latest.json
  # 解决:tauri-action 矩阵构建时每个 job 只生成当前平台的 latest.json,后上传覆盖先上传
  publish-updater-json:
    name: Publish Updater JSON
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate & upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/generate-latest-json.mjs

      - name: Summary
        run: |
          echo "### Updater JSON 发布完成" >> $GITHUB_STEP_SUMMARY
          echo "tag: ${{ inputs.tag || github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "latest.json 已聚合所有平台签名,上传到 Release assets + 固定 feed tag desktop-updater-feed" >> $GITHUB_STEP_SUMMARY

  # 同步构建产物到 apps/web/public/downloads/,实现"构建 → 自动同步下载包 → 自动更新 manifest"全链路
  sync-downloads:
    name: Sync Downloads to public/downloads/
    needs: [build, publish-updater-json]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (main branch for commit)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Configure npm registry
        run: pnpm config set registry https://registry.npmmirror.com

      - name: Install pnpm deps
        run: pnpm install --no-frozen-lockfile

      - name: Build extension
        run: pnpm --filter @ihui/extension build

      - name: Download all bundle artifacts
        uses: actions/download-artifact@v4
        with:
          path: .
          pattern: desktop-bundle-*
          merge-multiple: true

      - name: Sync downloads to public/downloads/
        run: node scripts/sync-downloads.mjs

      # 动态解析桌面端下载产物:从 GitHub Releases API 读取最新 desktop-v* release
      # 资产(URL/大小/版本/发布日期),刷新 desktop-feed.generated.ts 入库快照。
      # 前端下载页构建期读快照,发版后零手动更新(脚本幂等:无变化不产生 diff)。
      - name: Resolve desktop download feed
        env:
          # release 可能仍处 draft(Publish 刚完成),无 token 的 API 看不到 → 必须带 token
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/resolve-desktop-download.mjs

      - name: Check for changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain apps/web/public/downloads/ apps/web/src/config/desktop-feed.generated.ts)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit synced downloads
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/downloads/ apps/web/src/config/desktop-feed.generated.ts
          git commit -m "chore(downloads): auto-sync downloads + desktop feed after release ${{ github.ref_name }}"
          git push origin main

      - name: Summary
        run: |
          echo "### Downloads 同步完成" >> $GITHUB_STEP_SUMMARY
          echo "tag: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "产物已同步到 apps/web/public/downloads/(desktop + extension)" >> $GITHUB_STEP_SUMMARY
          echo "桌面下载快照 desktop-feed.generated.ts 已刷新(版本/URL/大小自动解析)" >> $GITHUB_STEP_SUMMARY

  # 2026-09-17:国内发行(Gitee)自动化——安装包+更新签名镜像到 Gitee release,
  # latest.json(url 全部指向 Gitee 直链)更新 desktop-feed 分支 raw 直链。
  # 更新器第一端点即该 raw 链接(薄壳化 exe 内嵌),GitHub feed 仅兜底。
  sync-gitee:
    name: Sync release to Gitee (国内发行)
    needs: [build, publish-updater-json]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync bundles + updater feed to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/sync-gitee.py

      - name: Summary
        run: |
          echo "### Gitee 国内发行同步完成" >> $GITHUB_STEP_SUMMARY
          echo "tag: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "安装包+签名已镜像 Gitee release;latest.json 已更新 desktop-feed 分支" >> $GITHUB_STEP_SUMMARY
          echo "更新器端点(Gitee 优先): https://gitee.com/${{ secrets.GITEE_OWNER }}/IHUI-AI/raw/desktop-feed/latest.json" >> $GITHUB_STEP_SUMMARY

# ⁠​‌​​‌​​‌‍‍​‌​​‌​​​‍‍​‌​‌​‌​‌‍‍​‌​​‌​​‌‍‍​​‌​‌‌​‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌​​‌‌‌‌​‌​‍‍‌‌​‌‌​​​‌​​​‌‌‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌‌​‌​​‌‌‌​‍‍‌‌​​‌‌​​​‌​​‌​‌‍‍‌​‌‌‌​‌‌‌​‌‌‌​‌‍‍‌​‌‌​‌‌‌‍‍​‌​​‌‌​​‍‍​‌​​​​‌‌‍‍‌​‌‌​‌‌‌‍‍​‌‌​​​​‌‍‍​‌‌​‌​​‌‍‍​‌‌‌‌​‌​‍‍​‌‌​‌​​​‍‍​‌‌‌​​‌‌‍‍​​‌​‌‌‌​‍‍​‌‌‌​‌​​‍‍​‌‌​‌‌‌‌‍‍​‌‌‌​​​​‍‍‌​‌‌​‌‌‌‍‍​‌​‌​​​​‍‍​‌​‌​​‌​‍‍​‌​​‌‌‌‌‍‍​‌​‌​‌‌​‍‍​‌​​​‌​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​‌‌‍‍​‌​​​‌​‌‍‍​​‌​‌‌​‌‍‍​​‌‌​​‌​‍‍​​‌‌​​​​‍‍​​‌‌​​‌​‍‍​​‌‌​‌‌​⁠
