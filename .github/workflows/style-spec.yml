name: style-spec

# 样式规范检查
# - 高特异性选择器检测 (4 层以上嵌套)
# - !important 禁用检查

on:
  push:
    branches: [main, develop, release/*]
    paths:
      - 'apps/web/**'
      - '.github/workflows/style-spec.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/web/**'
      - '.github/workflows/style-spec.yml'
  workflow_dispatch:

# 2026-11-03(排队治理):原无 concurrency。main 上 apps/web/** 的每次改动都会起一枚,
#   实测单次执行 ~379s(2 个 job)。它不是 required check,按"同一 ref 只跑最新一次"收敛;
#   被挤掉的旧运行只是过期结论,最新提交始终有结论。
concurrency:
  group: style-spec-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15'

jobs:
  high-specificity-check:
    # 用户规则: 禁止使用 4 类以上嵌套的高特异性选择器
    # 用户规则: 禁止使用 !important
    name: 高特异性选择器检测
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 跑 no-important 检查
        # 2026-09-10 根因修复:原实现直接 `grep -rnE '!important'` 扫文本,有两个缺陷 ——
        #  ① 无法区分「声明」与「注释」,注释里提到 !important 也被误判(实测 8 处误报);
        #  ② 无法表达合法例外,只能一刀切。
        # 改为调用共用守门脚本(与仓库其它 check:*.mjs 口径一致):
        #   剥离注释后再判定,并豁免 @media (prefers-reduced-motion: reduce) 块
        #   (选择器特异度为 0,必须用 !important 才能压过未被 @layer 包裹的动画类)。
        run: node scripts/check-no-important.mjs

      - name: 跑高特异性选择器检测
        env:
          HIGH_SPECIFICITY_THRESHOLD: '4'
        run: |
          set -e
          echo "检测高特异性选择器 (嵌套 > $HIGH_SPECIFICITY_THRESHOLD 层)..."
          # 检测 CSS 中 4+ 层嵌套选择器 (简化: 以空格分隔的选择器组合)
          # 模式: .a .b .c .d {  或  .a > .b > .c > .d {
          high_spec_hits=$(grep -rnE '\.[a-zA-Z][a-zA-Z0-9_-]*(\s+[.#>][a-zA-Z][a-zA-Z0-9_-]*){3,}\s*\{' \
            --include='*.css' --include='*.scss' \
            apps/web/app apps/web/src 2>/dev/null || true)
          if [ -n "$high_spec_hits" ]; then
            echo "::error::检测到高特异性选择器 (> 4 层嵌套), 请用 :where() 包裹:"
            echo "$high_spec_hits" | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
          echo "✓ 未检测到高特异性选择器违规"

      - name: 阻断提示
        if: failure()
        run: |
          echo "::error::样式规范检查未通过，请用 :where() 包裹高特异性选择器，并移除 !important"

  css-lint:
    # CSS/SCSS lint: 检测内联样式中的 !important
    name: CSS Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [high-specificity-check]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 探测 stylelint 配置 (本 job 判据唯一源)
        id: stylelint-probe
        # 治理债③(2026-11-05):原实现是一份 run 内的 if/else —— 缺配置时走 else 分支
        # `echo "未配置 stylelint, 跳过"` 后 exit 0, 于是每一枚运行都把「没判」渲染成「检查通过」
        # (违 AGENTS §0.3「没判绝不写成判过」)。现拆成「探测步写 output + 门控步只读 output」:
        # 判据只在这一处计算, 下面 if: 不复写条件(两份写法必然漂移)。
        # 刻意**不**改成「缺配置即 exit 1」:HEAD 面 stylelint 配置从未存在过(git log --all 零命中),
        # 那会把每次触碰 apps/web 的 push/PR 都变红 = §12e 明令禁止的恒红门。
        run: |
          # 判据形态: apps/web/.stylelintrc* / apps/web/stylelint.config.* 任一存在, 或
          # apps/web/package.json 含 stylelintConfig 键。
          # 用 nullglob + 数组计数, 而不是 [ -f glob ](命中多份时报 "too many arguments" 落到假跳过),
          # 也不是 ls a* b*(只要有一族没命中 ls 就以 2 退出, 实测把「已配置」误判成未配置)。
          shopt -s nullglob
          stylelint_configs=( apps/web/.stylelintrc* apps/web/stylelint.config.* )
          if [ "${#stylelint_configs[@]}" -gt 0 ] \
            || grep -q '"stylelintConfig"' apps/web/package.json 2>/dev/null; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "探测到 stylelint 配置: ${stylelint_configs[*]:-package.json 的 stylelintConfig 键} ⇒ 下一步真跑 stylelint"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo '::warning title=未判定-stylelint-未执行::apps/web 无 stylelint 配置 ⇒ 本轮对 CSS/SCSS 没有做过任何 stylelint 规则校验, 下一步「Stylelint 检查」显示为 Skipped(灰跳), 这不是通过。'
            {
              echo '## 未判定：stylelint 的 CSS/SCSS 规则检查未执行'
              echo ''
              echo '- 没判的那一格：`apps/web` 下 `**/*.{css,scss}` 的 stylelint 规则校验(本轮零结论)。'
              echo '- 为什么没判：探测判据 = `apps/web/.stylelintrc*` 或 `apps/web/stylelint.config.*` 存在, 或 `apps/web/package.json` 含 `stylelintConfig` 键; 三者现读皆无 ⇒ `configured=false`。'
              echo '- 这不是「通过」：作业结论 success 只代表真跑过的那几把尺都过了; stylelint 那一格在 UI 显示为 Skipped(灰)。'
              echo '- 怎么让它真跑：在 `apps/web` 落一份 stylelint 配置(例 `apps/web/.stylelintrc.json`)并同批把 stylelint 列为 devDependency ⇒ 本步自动复活, 不再需要改本文件。'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stylelint 检查 (仅当探测到配置时执行, 否则灰跳)
        if: steps.stylelint-probe.outputs.configured == 'true'
        run: |
          cd apps/web && npx stylelint "**/*.{css,scss}" --max-warnings 0

# ⁠​‌​​‌​​‌‍‍​‌​​‌​​​‍‍​‌​‌​‌​‌‍‍​‌​​‌​​‌‍‍​​‌​‌‌​‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌​​‌‌‌‌​‌​‍‍‌‌​‌‌​​​‌​​​‌‌‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌‌​‌​​‌‌‌​‍‍‌‌​​‌‌​​​‌​​‌​‌‍‍‌​‌‌‌​‌‌‌​‌‌‌​‌‍‍‌​‌‌​‌‌‌‍‍​‌​​‌‌​​‍‍​‌​​​​‌‌‍‍‌​‌‌​‌‌‌‍‍​‌‌​​​​‌‍‍​‌‌​‌​​‌‍‍​‌‌‌‌​‌​‍‍​‌‌​‌​​​‍‍​‌‌‌​​‌‌‍‍​​‌​‌‌‌​‍‍​‌‌‌​‌​​‍‍​‌‌​‌‌‌‌‍‍​‌‌‌​​​​‍‍‌​‌‌​‌‌‌‍‍​‌​‌​​​​‍‍​‌​‌​​‌​‍‍​‌​​‌‌‌‌‍‍​‌​‌​‌‌​‍‍​‌​​​‌​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​‌‌‍‍​‌​​​‌​‌‍‍​​‌​‌‌​‌‍‍​​‌‌​​‌​‍‍​​‌‌​​​​‍‍​​‌‌​​‌​‍‍​​‌‌​‌‌​⁠
