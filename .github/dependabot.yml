# Dependabot 自动依赖升级（与 .github/workflows/security-scan.yml / weekly-security-audit.yml 互补：
# 后者做 SAST + 漏洞阻断与告警，本文件负责把"已知可升级"的依赖自动开 PR，缩短修复滞留期）。

version: 2
updates:
  # pnpm monorepo 根（含 pnpm-workspace.yaml + pnpm-lock.yaml）
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:00'
    open-pull-requests-limit: 20
    labels:
      - 'dependencies'
      - 'automated'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    # 若项目使用私有 registry（如 npmmirror），需在仓库
    # Settings > Secrets and variables > Dependabot 配置对应 registries，
    # 否则升级 PR 的 lockfile 重新解析会失败（PR 仍会创建，只是 CI 验证不通过）。
    # 参考 https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference

  # GitHub Actions 工作流自身引用的 action 版本
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    labels:
      - 'github-actions'
      - 'dependencies'
