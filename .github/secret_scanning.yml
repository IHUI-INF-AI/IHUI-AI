# GitHub 机密扫描 / 推送保护的路径排除表。
# 键名与作用域取自官方文档《从机密扫描中排除文件夹和文件》:配置文件必须是
# `.github/secret_scanning.yml`,键为 `paths-ignore`,且**同时作用于机密扫描与推送保护**
# (上限 1000 条;单文件 >1MB 会被忽略)。
#
# 为什么需要它:脱敏/泄漏检测类测试**必须**在源码里写出"凭据形状"的字面量才能断言
# 掩码生效,而这些字面量会被 push protection 判成密钥,于是**整条 main 被拒**
# (`push declined due to repository rule violations`),连带阻塞所有并行会话的推送。
# 实测触发点:packages/shared/src/utils/__tests__/redact.test.ts:103(commit 7b2c7f006e5)。
#
# 只列"测试夹具"三类,且逐条写理由。**故意不列入** apps/mobile-cap/android/app/
# google-services.json —— 它是真实应用配置而非测试夹具,给它开忽略等于对本仓真正的
# 凭据落点关掉保护,那与"为了过门而放宽门禁"同罪。若将来它真的阻塞推送,须单独决策。
paths-ignore:
  # 脱敏工具的正向用例:必须含 AWS / Google API key / Slack bot+app token / GitLab PAT
  # 与 Basic 认证 base64 等**官方文档示例值**(如 AKIAIOSFODNN7EXAMPLE),否则测不出掩码。
  - 'packages/shared/src/utils/__tests__/redact.test.ts'
  # 同上,CLI 侧的 redact 用例。
  - 'apps/cli/tests/redact.test.ts'
  # API key 泄漏守门自身的夹具:它要构造"应当被拦下"的 key 才能验证判据不空转。
  - 'scripts/tests/check-api-key-leak.test.mjs'
