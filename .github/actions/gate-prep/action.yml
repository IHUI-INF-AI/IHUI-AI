name: Gate preparation (full gate legs)
description: >-
  全量守门腿的公共取材面。gates-full / guardian-full 两腿必须走同一份,
  避免"一条腿有 packages dist / uv,另一条腿没有"导致同一枚提交在两处得到不同结论。
  规则由 scripts/check-workflow-step-order.mjs 的 [full-prep] 维强制(引入即拦)。

inputs:
  python-version:
    description: 'uv / ruff 所在 runner 的 Python 版本'
    required: false
    default: '3.12'

runs:
  using: composite
  steps:
    - name: 安装依赖
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: 构建 packages(门 4/98 的 dist 取材面)
      # check-stale-dist / check-dangling-local-imports 读 packages/*/dist;
      # 干净 checkout 没有构建产物,不补就会把"未构建"判成"陈旧/悬空"。
      # 只构建 packages,不构建 apps(门对 apps dist 缺失只跳过)。
      shell: bash
      run: pnpm -r --filter "./packages/*" build

    - name: Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: 安装 uv(门 254 ruff 的执行器)
      # 门 254 判 Python lint,它只认 uvx。不装 ⇒ 干净 runner 上取不到执行器,
      # 门会落 exit 2「未判定」并把整批守门顶红 —— 那正是 §12e 禁的恒红门。
      # 版本钉死,完整理由见 .github/workflows/ci.yml 的 install-uv 那格。
      shell: bash
      run: |
        pip install uv==0.12.1
        uvx --version

# ⁠​‌​​‌​​‌‍‍​‌​​‌​​​‍‍​‌​‌​‌​‌‍‍​‌​​‌​​‌‍‍​​‌​‌‌​‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌​​‌‌‌‌​‌​‍‍‌‌​‌‌​​​‌​​​‌‌‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌‌​‌​​‌‌‌​‍‍‌‌​​‌‌​​​‌​​‌​‌‍‍‌​‌‌‌​‌‌‌​‌‌‌​‌‍‍‌​‌‌​‌‌‌‍‍​‌​​‌‌​​‍‍​‌​​​​‌‌‍‍‌​‌‌​‌‌‌‍‍​‌‌​​​​‌‍‍​‌‌​‌​​‌‍‍​‌‌‌‌​‌​‍‍​‌‌​‌​​​‍‍​‌‌‌​​‌‌‍‍​​‌​‌‌‌​‍‍​‌‌‌​‌​​‍‍​‌‌​‌‌‌‌‍‍​‌‌‌​​​​‍‍‌​‌‌​‌‌‌‍‍​‌​‌​​​​‍‍​‌​‌​​‌​‍‍​‌​​‌‌‌‌‍‍​‌​‌​‌‌​‍‍​‌​​​‌​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​‌‌‍‍​‌​​​‌​‌‍‍​​‌​‌‌​‌‍‍​​‌‌​​‌​‍‍​​‌‌​​​​‍‍​​‌‌​​‌​‍‍​​‌‌​‌‌​⁠
