<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 智汇 AI favicon(2026-07-27 P1-4 SEO 资产补全)
       - 64x64 SVG,智字 logo + 圆角背景
       - 主色 #1E3A5F(深蓝)+ 背景 #FAF8F3(米白)
       - rx=8 对应 rounded-lg(AGENTS.md §4 圆角守门,禁止 rounded-full)
       - 与 app/icon.svg 区别:icon.svg 是 Next.js 自动 favicon(蓝渐变),本文件是 public/ 显式 favicon 备用 -->
  <rect width="64" height="64" rx="8" fill="#1E3A5F"/>
  <text x="32" y="44" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="36" font-weight="700" fill="#FAF8F3">智</text>
</svg>
