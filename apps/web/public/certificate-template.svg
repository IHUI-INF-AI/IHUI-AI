<?xml version="1.0" encoding="UTF-8"?>
<!-- 证书视觉模板（P1-3 MVP）：占位符 {studentName}/{courseName}/{durationHours}/{issuedAt}/{certificateNo} 可程序化替换 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- 米白底 -->
  <rect width="800" height="600" fill="#FAF8F3"/>

  <!-- 双层金色边框 -->
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#C9A961" stroke-width="3"/>
  <rect x="35" y="35" width="730" height="530" fill="none" stroke="#C9A961" stroke-width="1"/>

  <!-- 四角装饰 -->
  <path d="M 35 80 L 35 35 L 80 35" fill="none" stroke="#C9A961" stroke-width="2"/>
  <path d="M 720 35 L 765 35 L 765 80" fill="none" stroke="#C9A961" stroke-width="2"/>
  <path d="M 35 520 L 35 565 L 80 565" fill="none" stroke="#C9A961" stroke-width="2"/>
  <path d="M 720 565 L 765 565 L 765 520" fill="none" stroke="#C9A961" stroke-width="2"/>

  <!-- 标题 -->
  <text x="400" y="110" text-anchor="middle" font-family="serif" font-size="42" font-weight="bold" fill="#1E3A5F">结业证书</text>
  <text x="400" y="140" text-anchor="middle" font-family="serif" font-size="14" fill="#C9A961" letter-spacing="4">CERTIFICATE OF COMPLETION</text>

  <!-- 标题装饰分隔 -->
  <line x1="320" y1="155" x2="480" y2="155" stroke="#C9A961" stroke-width="1"/>
  <circle cx="400" cy="155" r="3" fill="#C9A961"/>

  <!-- 正文 -->
  <text x="400" y="220" text-anchor="middle" font-family="serif" font-size="18" fill="#1E3A5F">兹证明</text>

  <!-- 学员姓名占位 -->
  <text x="400" y="260" text-anchor="middle" font-family="serif" font-size="32" font-weight="bold" fill="#1E3A5F">{studentName}</text>
  <line x1="280" y1="275" x2="520" y2="275" stroke="#C9A961" stroke-width="1"/>

  <!-- 课程名占位 -->
  <text x="400" y="310" text-anchor="middle" font-family="serif" font-size="18" fill="#1E3A5F">已圆满完成</text>
  <text x="400" y="345" text-anchor="middle" font-family="serif" font-size="24" font-weight="bold" fill="#1E3A5F">{courseName}</text>

  <!-- 课时数占位 -->
  <text x="400" y="385" text-anchor="middle" font-family="serif" font-size="16" fill="#1E3A5F">课时数：{durationHours} 学时</text>

  <!-- 颁发日期占位 -->
  <text x="400" y="420" text-anchor="middle" font-family="serif" font-size="14" fill="#1E3A5F">颁发日期：{issuedAt}</text>

  <!-- 证书编号占位 -->
  <text x="400" y="445" text-anchor="middle" font-family="serif" font-size="12" fill="#1E3A5F" letter-spacing="2">证书编号：{certificateNo}</text>

  <!-- 颁发机构签名 -->
  <text x="220" y="510" text-anchor="middle" font-family="serif" font-size="16" fill="#1E3A5F">智汇 AI 教育学院</text>
  <line x1="160" y1="520" x2="280" y2="520" stroke="#1E3A5F" stroke-width="1"/>
  <text x="220" y="540" text-anchor="middle" font-family="serif" font-size="11" fill="#1E3A5F">颁发机构</text>

  <!-- 红色圆形印章 -->
  <circle cx="580" cy="510" r="45" fill="none" stroke="#C8102E" stroke-width="3"/>
  <circle cx="580" cy="510" r="38" fill="none" stroke="#C8102E" stroke-width="1"/>
  <text x="580" y="505" text-anchor="middle" font-family="serif" font-size="11" font-weight="bold" fill="#C8102E">智汇 AI</text>
  <text x="580" y="520" text-anchor="middle" font-family="serif" font-size="11" font-weight="bold" fill="#C8102E">教育学院</text>
  <text x="580" y="535" text-anchor="middle" font-family="serif" font-size="8" fill="#C8102E">CERTIFIED</text>
</svg>
