<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>IHUI RTC 双端验证</title>
  <style>
    body { font: 14px/1.5 ui-monospace, monospace; margin: 24px; }
    h1 { font-size: 18px; }
    #status { white-space: pre-wrap; padding: 12px; border: 1px solid #ccc; }
    #remote { width: 320px; background: #111; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>IHUI RTC 双端验证</h1>
  <div id="status">booting…</div>
  <video id="remote" autoplay playsinline muted></video>
  <script>
    const params = new URLSearchParams(location.search);
    const role = params.get('role') === 'answerer' ? 'answerer' : 'offerer';
    const room = params.get('room') || 'e2e-room';
    const signalingBase = params.get('signaling') || 'ws://127.0.0.1:8890/signal';
    const iceTransportPolicy = params.get('policy') === 'relay' ? 'relay' : 'all';
    const iceServers = (() => {
      if (!params.get('ice')) return [];
      try {
        const parsed = JSON.parse(params.get('ice'));
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    })();
    const statusEl = document.getElementById('status');
    const remoteVideo = document.getElementById('remote');
    const state = {
      role,
      stage: 'boot',
      connected: false,
      dataChannelEcho: false,
      remoteTracks: [],
      audioInboundBytes: 0,
      videoInboundBytes: 0,
      localCandidateTypes: [],
      errors: [],
    };
    window.__rtcResult = state;

    function report(stage, extra = {}) {
      Object.assign(state, { stage }, extra);
      statusEl.textContent = JSON.stringify(state, null, 2);
    }

    function fail(err) {
      state.errors.push(String(err && err.stack ? err.stack : err));
      report('failed');
      console.error(err);
    }

    function wait(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    async function createSyntheticStream() {
      const canvas = document.createElement('canvas');
      canvas.width = 640;
      canvas.height = 360;
      const ctx = canvas.getContext('2d');
      let frame = 0;
      const timer = setInterval(() => {
        frame += 1;
        ctx.fillStyle = `hsl(${frame % 360} 70% 45%)`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = '48px monospace';
        ctx.fillText('IHUI RTC ' + frame, 40, 190);
      }, 1000 / 15);
      const video = canvas.captureStream(15);
      const audioCtx = new AudioContext();
      await audioCtx.resume().catch(() => {});
      const oscillator = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      gain.gain.value = 0.08;
      const destination = audioCtx.createMediaStreamDestination();
      oscillator.connect(gain);
      gain.connect(destination);
      oscillator.start();
      return {
        stream: new MediaStream([...video.getVideoTracks(), ...destination.stream.getAudioTracks()]),
        stop: () => {
          clearInterval(timer);
          oscillator.stop();
          void audioCtx.close();
          for (const track of video.getTracks()) track.stop();
        },
      };
    }

    async function main() {
      const pc = new RTCPeerConnection({ iceServers, iceTransportPolicy, bundlePolicy: 'max-bundle' });
      const pendingIce = [];
      let remoteDescriptionSet = false;
      let dataChannel = null;

      const flushIce = async () => {
        if (!remoteDescriptionSet) return;
        while (pendingIce.length) {
          const candidate = pendingIce.shift();
          try { await pc.addIceCandidate(candidate); } catch (err) { fail(err); }
        }
      };

      pc.onicecandidate = (event) => {
        if (!event.candidate) return;
        const candidate = event.candidate.toJSON();
        if (candidate.type && !state.localCandidateTypes.includes(candidate.type)) {
          state.localCandidateTypes.push(candidate.type);
        }
        if (ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'ice', candidate }));
        }
      };
      pc.oniceconnectionstatechange = () => report('ice-' + pc.iceConnectionState);
      pc.onconnectionstatechange = () => {
        state.connected = pc.connectionState === 'connected';
        report('pc-' + pc.connectionState);
      };
      pc.ontrack = (event) => {
        state.remoteTracks.push({ kind: event.track.kind, id: event.track.id });
        if (event.streams[0]) remoteVideo.srcObject = event.streams[0];
      };

      let localStream = null;
      let stopLocalStream = null;
      if (role === 'offerer') {
        const useCamera = params.get('media') === 'camera';
        report(useCamera ? 'getUserMedia' : 'syntheticMedia');
        if (useCamera) {
          localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
          stopLocalStream = () => {
            for (const track of localStream.getTracks()) track.stop();
          };
        } else {
          const synthetic = await createSyntheticStream();
          localStream = synthetic.stream;
          stopLocalStream = synthetic.stop;
        }
        for (const track of localStream.getTracks()) pc.addTrack(track, localStream);
      } else {
        // 应答端只收不发：不申请第二份摄像头/麦克风，避免单机 fake device 独占。
        pc.addTransceiver('audio', { direction: 'recvonly' });
        pc.addTransceiver('video', { direction: 'recvonly' });
        report('recvonly-tracks');
      }

      if (role === 'offerer') {
        dataChannel = pc.createDataChannel('ihui-e2e');
        dataChannel.onopen = () => {
          dataChannel.send('ihui-e2e-ping');
          report('data-channel-open');
        };
        dataChannel.onmessage = (event) => {
          state.dataChannelEcho = String(event.data) === 'ihui-e2e-pong';
          report('data-channel-message');
        };
      } else {
        pc.ondatachannel = (event) => {
          dataChannel = event.channel;
          dataChannel.onmessage = (msg) => {
            if (String(msg.data) === 'ihui-e2e-ping') {
              state.dataChannelEcho = true;
              dataChannel.send('ihui-e2e-pong');
            }
            report('data-channel-message');
          };
        };
      }

      // WebSocket 必须在媒体/轨道准备完成后才连：单机 fake device 下 getUserMedia
      // 可能比握手慢，若先连会错过 server 的 `ready`（room 双方齐备时一次性下发）。
      const ws = new WebSocket(`${signalingBase}?room=${encodeURIComponent(room)}&role=${role}`);

      const sendReady = () => {
        if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'ping' }));
      };
      ws.onopen = sendReady;

      ws.onmessage = async (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'ready') {
            report('signaling-ready');
            if (role === 'offerer') {
              const offer = await pc.createOffer();
              await pc.setLocalDescription(offer);
              ws.send(JSON.stringify({ type: 'offer', sdp: offer.sdp }));
              report('offer-sent');
            }
          } else if (msg.type === 'offer' && role === 'answerer') {
            await pc.setRemoteDescription({ type: 'offer', sdp: msg.sdp });
            remoteDescriptionSet = true;
            await flushIce();
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            ws.send(JSON.stringify({ type: 'answer', sdp: answer.sdp }));
            report('answer-sent');
          } else if (msg.type === 'answer' && role === 'offerer') {
            await pc.setRemoteDescription({ type: 'answer', sdp: msg.sdp });
            remoteDescriptionSet = true;
            await flushIce();
            report('answer-applied');
          } else if (msg.type === 'ice') {
            const candidate = msg.candidate;
            if (remoteDescriptionSet) await pc.addIceCandidate(candidate);
            else pendingIce.push(candidate);
          } else if (msg.type === 'error') {
            fail('signaling: ' + msg.error);
          }
        } catch (err) {
          fail(err);
        }
      };
      ws.onerror = () => fail('signaling websocket error');
      ws.onclose = () => { if (!state.connected) fail('signaling websocket closed'); };

      const deadline = Date.now() + 20_000;
      while (Date.now() < deadline) {
        if (pc.connectionState === 'connected' && state.dataChannelEcho) break;
        await wait(250);
      }
      if (pc.connectionState !== 'connected') {
        fail(`connectionState=${pc.connectionState}`);
        return;
      }
      await wait(3000);
      const stats = await pc.getStats();
      const localCandidateTypes = new Set(state.localCandidateTypes);
      const remoteCandidateTypes = new Set();
      stats.forEach((entry) => {
        if (entry.type === 'inbound-rtp' && entry.kind === 'audio') state.audioInboundBytes = entry.bytesReceived || 0;
        if (entry.type === 'inbound-rtp' && entry.kind === 'video') state.videoInboundBytes = entry.bytesReceived || 0;
        if (entry.type === 'local-candidate' && entry.candidateType) localCandidateTypes.add(entry.candidateType);
        if (entry.type === 'remote-candidate' && entry.candidateType) remoteCandidateTypes.add(entry.candidateType);
      });
      state.localCandidateTypes = [...localCandidateTypes];
      state.remoteCandidateTypes = [...remoteCandidateTypes];
      state.connected = true;
      report('done', {
        connectionState: pc.connectionState,
        iceConnectionState: pc.iceConnectionState,
        dataChannelEcho: state.dataChannelEcho,
        audioInboundBytes: state.audioInboundBytes,
        videoInboundBytes: state.videoInboundBytes,
        localCandidateTypes: state.localCandidateTypes,
        remoteCandidateTypes: state.remoteCandidateTypes,
      });
      ws.send(JSON.stringify({ type: 'bye' }));
      ws.close();
      pc.close();
      if (stopLocalStream) stopLocalStream();
    }

    main().catch(fail);
  </script>
</body>
</html>
