[project]
name = "ihui-ai-service"
version = "0.0.0"
description = "IHUI AI Service - LangGraph + LiteLLM + MCP"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.52.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.14.0",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.0",
    "redis[hiredis]>=8.1.0",
    # 任务调度(2026-07-24 立):APScheduler + croniter
    # APScheduler 保持 3.x(4.x 是完全重写,有重大 breaking change)
    "apscheduler>=3.11.0",
    "croniter>=6.2.0",
    "langgraph>=1.2.0",
    "langchain>=1.3.0",
    "langchain-core>=1.5.0",
    "langchain-openai>=1.4.0",
    "langchain-anthropic>=1.5.0",
    "litellm>=1.95.0",
    # MCP 依赖已删除(2026-08-02):代码库未使用 mcp 库,mcp_server.py 是完全自定义实现
    "httpx>=0.28.1",
    "orjson>=3.11.0",
    "tenacity>=9.1.0",
    "structlog>=26.1.0",
    "tiktoken>=0.13.0",
    "numpy>=2.4.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pyjwt>=2.13.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    # 多平台一键发布(2026-07-20 新增)
    "python-socketio>=5.16.0",
    "python-multipart>=0.0.32",
    "markdown>=3.10",
    "beautifulsoup4>=4.15.0",
    "mammoth>=1.12.0",
    "pdfplumber>=0.11.10",
    # 文档解析引擎(2026-09-08 立):Firecrawl anydoc(Rust 原生,NAPI wheel)
    # doc/docx/pptx/ppt/xls/xlsx/odt/ods/odp/rtf/epub/pdf → GFM Markdown
    # document_tools.py / codebase_indexer.py 主路径;未安装时自动降级旧实现
    "firecrawl-anydoc>=0.2.4",
    "playwright>=1.62.0",
    "slowapi>=0.1.10",
    # 免费 TTS(2026-09-01 立):edge-tts 零 key 零成本语音合成(对标 GPT-5 Voice)
    "edge-tts>=7.2.0",
    # 语音 STT(2026-07-28 立):faster-whisper 本地 CPU 推理,替代 litellm Whisper 付费 API
    # CTranslate2 后端,base 模型 74MB,首次下载后离线可用,零成本
    "faster-whisper>=1.2.0",
    "mcp>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    # 2026-09-10 钉版本:CI 用 uv pip install -e ".[dev]" 不走 uv.lock,不钉会解析到
    # 更新版本导致 lint 行为漂移(本地绿 CI 红的 I001 排序差异即此根因)
    "ruff==0.16.6",
    "mypy==2.3.1",
    # 2026-07-24 立:Redis 持久化测试用 fakeredis 隔离(不依赖真实 Redis)
    "fakeredis>=2.37.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

# 2026-09-10:历史债务收敛(5047 项 → 0)。
#   第一步:ruff check --fix / --fix --unsafe-fixes 清掉 2708 项机械问题
#          (import 排序、废弃 typing 语法、f-string、无用 import/变量等)。
#   第二步:对下列「受框架/契约/工具链约束、无法也不应在本仓满足」的规则显式豁免,
#          每条附理由 —— 这是口径决策,不是掩盖问题。
ignore = [
    # ---- 纯格式化 ----
    # 行宽 100:本仓未引入 Python formatter,且大量中文注释 / URL / 长断言无法在不损可读性
    # 的前提下折行;TS 侧同样未强制 max-len(ESLint 无 max-len 规则),两端口径保持一致。
    "E501",
    # ---- 框架 / 契约惯用法 ----
    # Pydantic / 响应模型字段必须保持 camelCase,与 TS 侧 API JSON 契约逐字段对齐,不可改。
    "N815",
    # FastAPI 依赖注入惯用法:函数参数默认值必须写 Depends() / Query() / Body() / File()。
    "B008",
    # 脚本与测试需先注入 sys.path(或设置环境变量)再 import,属路径引导的必然结果。
    "E402",
    # ---- 命名约定:本仓两端均不强制命名风格 ----
    # (与 TS 侧口径一致:ESLint 无 camelcase/PascalCase 命名规则)
    "N801",
    "N802",
    "N803",
    "N805",
    "N806",
    "N811",
    # N812:把模块级私有缓存以 SCREAMING_SNAKE 别名再导出(如
    # `_fallback_cache as _ARTIFACTS_CACHE`)是本仓刻意的命名习惯,用于标示
    # 「模块级单例/缓存」,并保留对既有测试的兼容契约。
    "N812",
    "N814",
    "N818",
    "N999",
    # 数学 / 几何 / 循环代码中的单字符名(l / I / O),重命名会破坏与公式的一一对应性。
    "E741",
    # ---- 可读性偏好(flakes-simplify / pycodestyle 严格子集):本仓明确不采纳合写压缩 ----
    # 说明:以下规则要求把「嵌套 with」「嵌套 if」「try/except/pass」「if-else 赋值」压成更紧凑的
    # 写法。本仓倾向保留显式层级 —— 嵌套 with 的分组语义更清晰、嵌套 if 便于单独加日志/断点、
    # try/except 便于精细异常处理。故统一豁免,而非为了过 lint 牺牲可读性。
    "SIM117",  # 嵌套 with 合并
    "SIM102",  # 嵌套 if 合并
    "SIM105",  # try/except/pass → contextlib.suppress
    "SIM108",  # if-else 块 → 三元表达式
    "SIM116",  # if-elif 链 → 字典查表
    "E701",    # 单行多语句(冒号后)
    "E702",    # 单行多语句(分号)
    # %-格式化未废弃且此处多为日志/CLI 输出;改写为 f-string 需处理 %% 与字典键等边界,
    # 收益低而回归风险高,保持现状。
    "UP031",
    # 异常链显式化(raise ... from e):本仓在 except 内重抛 HTTPException 时按 FastAPI 惯例
    # 直接抛出,不强制携带原始异常作为 __cause__。
    "B904",
]

[tool.ruff.lint.per-file-ignores]
# 2026-09-10:bench golden fixtures 的 import 分节是刻意的人为布局(golden 参考实现
# 的可读性优先),且 local ruff 与 CI ruff 对其 I001 判定曾出现环境性摇摆,
# 显式豁免以消除双端口径分歧。
"bench/fixtures_golden/**" = ["I001"]

# 2026-07-26 立:mypy 集成 typecheck:full CI(从 informational 升级为 blocking)
# 2026-07-27 升级:strict=true(全库 0 errors 已达成,正式启用 strict 模式)
# 由 pnpm `typecheck:full` 在所有 TS typecheck 之后执行,作为 Python 类型检查的最后一道闸门。
#
# 渐进式策略已毕业(三阶段全部完成):
#   - 阶段一(已完成):strict=false + check_untyped_defs=true → 捕获基础类型错误
#   - 阶段二(已完成):按模块逐个 enable strict_optional / disallow_untyped_defs /
#     warn_return_any 等严格项,每启用一项就要求该模块所有错误清零。
#   - 阶段三(本 commit 完成):全部 strict=true,所有 [no-untyped-def] / [no-any-return] 错误清零。
#
# 配套:typecheck-full.mjs 在 pnpm -r run typecheck 之后调用 mypy,
#       mypy 退出码 != 0 立即终止 typecheck:full,阻塞 push。
# 配套:scripts/check-mypy.mjs 显式传 --strict 作为双保险,防止本字段被改回 false 降级守门。
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = [
    "tests/",
    "migrations/",
    "alembic/",
]

# 测试目录暂不强制类型检查(避免 pytest fixtures 引入大量 mypy 噪音)
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 2026-09-02 立:真网集成测试标记(语雀/飞书等 Connector 真通验证,CI 默认不跑)
markers = [
    "network: 真实网络调用集成测试(需外网,默认跳过可 --run-network 强制)",
]

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
]
