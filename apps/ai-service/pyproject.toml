[project]
name = "ihui-ai-service"
version = "0.0.0"
description = "IHUI AI Service - LangGraph + LiteLLM + MCP"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.52.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.14.0",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.0",
    "redis[hiredis]>=8.1.0",
    # 任务调度(2026-07-24 立):APScheduler + croniter
    # APScheduler 保持 3.x(4.x 是完全重写,有重大 breaking change)
    "apscheduler>=3.11.0",
    "croniter>=6.2.0",
    "langgraph>=1.2.0",
    "langchain>=1.3.0",
    "langchain-core>=1.5.0",
    "langchain-openai>=1.4.0",
    "langchain-anthropic>=1.5.0",
    "litellm>=1.95.0",
    # MCP 保持 1.x(2.0 是新主版本,可能有 breaking change,跳过)
    "mcp>=1.29.0,<2.0.0",
    "httpx>=0.28.1",
    "orjson>=3.11.0",
    "tenacity>=9.1.0",
    "structlog>=26.1.0",
    "tiktoken>=0.13.0",
    "numpy>=2.4.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pyjwt>=2.13.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    # 多平台一键发布(2026-07-20 新增)
    "python-socketio>=5.16.0",
    "python-multipart>=0.0.32",
    "markdown>=3.10",
    "beautifulsoup4>=4.15.0",
    "mammoth>=1.12.0",
    "pdfplumber>=0.11.10",
    "playwright>=1.62.0",
    "slowapi>=0.1.10",
    # 语音 STT(2026-07-28 立):faster-whisper 本地 CPU 推理,替代 litellm Whisper 付费 API
    # CTranslate2 后端,base 模型 74MB,首次下载后离线可用,零成本
    "faster-whisper>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    "ruff>=0.16.0",
    "mypy>=1.20.0",
    # 2026-07-24 立:Redis 持久化测试用 fakeredis 隔离(不依赖真实 Redis)
    "fakeredis>=2.37.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

# 2026-07-26 立:mypy 集成 typecheck:full CI(从 informational 升级为 blocking)
# 2026-07-27 升级:strict=true(全库 0 errors 已达成,正式启用 strict 模式)
# 由 pnpm `typecheck:full` 在所有 TS typecheck 之后执行,作为 Python 类型检查的最后一道闸门。
#
# 渐进式策略已毕业(三阶段全部完成):
#   - 阶段一(已完成):strict=false + check_untyped_defs=true → 捕获基础类型错误
#   - 阶段二(已完成):按模块逐个 enable strict_optional / disallow_untyped_defs /
#     warn_return_any 等严格项,每启用一项就要求该模块所有错误清零。
#   - 阶段三(本 commit 完成):全部 strict=true,所有 [no-untyped-def] / [no-any-return] 错误清零。
#
# 配套:typecheck-full.mjs 在 pnpm -r run typecheck 之后调用 mypy,
#       mypy 退出码 != 0 立即终止 typecheck:full,阻塞 push。
# 配套:scripts/check-mypy.mjs 显式传 --strict 作为双保险,防止本字段被改回 false 降级守门。
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = [
    "tests/",
    "migrations/",
    "alembic/",
]

# 测试目录暂不强制类型检查(避免 pytest fixtures 引入大量 mypy 噪音)
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
