[project]
name = "ihui-ai-service"
version = "0.0.0"
description = "IHUI AI Service - LangGraph + LiteLLM + MCP"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "asyncpg>=0.30.0",
    "cryptography>=43.0.0",
    "redis[hiredis]>=5.2.0",
    # 任务调度(2026-07-24 立):APScheduler + croniter
    "apscheduler>=3.10.0",
    "croniter>=1.4.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "litellm>=1.55.0",
    "mcp>=1.0.0",
    "httpx>=0.28.0",
    "orjson>=3.10.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "tiktoken>=0.8.0",
    "numpy>=2.1.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "pyjwt>=2.10.0",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-otlp>=1.30.0",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    # 多平台一键发布(2026-07-20 新增)
    "python-socketio>=5.11.0",
    "python-multipart>=0.0.12",
    "markdown>=3.7",
    "beautifulsoup4>=4.12.0",
    "mammoth>=1.8.0",
    "pdfplumber>=0.11.0",
    "playwright>=1.48.0",
    "slowapi>=0.1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    # 2026-07-24 立:Redis 持久化测试用 fakeredis 隔离(不依赖真实 Redis)
    "fakeredis>=2.20.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
# 2026-07-26 立:mypy 集成 typecheck:full CI(从 informational 升级为 blocking)
# 由 GitHub Actions `test-python` 任务 + pnpm `typecheck:full` 共同执行。
# 阶段一:strict=false 渐进启用,先捕获基础类型错误(no-any-return / name-defined 等);
# 阶段二:后续按模块逐个 enable strict 检查项(strict_optional / disallow_untyped_defs 等)。
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = [
  "tests/",
  "migrations/",
  "alembic/",
]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
