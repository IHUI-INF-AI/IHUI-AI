#
# 私有评测测试的**本地** pytest 配置 —— 只覆盖一件事:关掉 xdist 并行。
#
# 为什么(2026-11-26 立):ai-service/pyproject.toml 的 [tool.pytest.ini_options].addopts
# 带 `-n auto`(xdist)。本目录这批用例是**纯函数 + 独立子进程**,worker 起动开销(实测
# 27.5s)远超用例本身(串行 10.9s),纯浪费;且 xdist worker 会各自重入 conftest、放大
# 与 tests/ 重夹具同型的收集竞态。
#
# pytest 取**离测试最近的 ini**(整份生效、不是与 pyproject 合并)—— 所以本文件一旦在位,
# 跑本目录就完全用它,pyproject 的 addopts/testpaths 不再注入。因此这里必须自带:
#   - addopts = -n0(串行;命令行再加 -n auto 仍可临时改回并行)
#   - basetemp 指到仓外(pyproject 那份的注释警告过:tmp SQLite 若落进仓内会翻车真实 .git。
#     本目录 rootdir = tests-isolated/,跳四级到仓外的 DevEnv/Temp,不污染仓库根)
[pytest]
asyncio_mode = auto
addopts = -n0 --basetemp=../../../../DevEnv/Temp/pytest_tmp_isolated
# ⁠​‌​​‌​​‌‍‍​‌​​‌​​​‍‍​‌​‌​‌​‌‍‍​‌​​‌​​‌‍‍​​‌​‌‌​‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌​​‌‌‌‌​‌​‍‍‌‌​‌‌​​​‌​​​‌‌‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌‌​‌​​‌‌‌​‍‍‌‌​​‌‌​​​‌​​‌​‌‍‍‌​‌‌‌​‌‌‌​‌‌‌​‌‍‍‌​‌‌​‌‌‌‍‍​‌​​‌‌​​‍‍​‌​​​​‌‌‍‍‌​‌‌​‌‌‌‍‍​‌‌​​​​‌‍‍​‌‌​‌​​‌‍‍​‌‌‌‌​‌​‍‍​‌‌​‌​​​‍‍​‌‌‌​​‌‌‍‍​​‌​‌‌‌​‍‍​‌‌‌​‌​​‍‍​‌‌​‌‌‌‌‍‍​‌‌‌​​​​‍‍‌​‌‌​‌‌‌‍‍​‌​‌​​​​‍‍​‌​‌​​‌​‍‍​‌​​‌‌‌‌‍‍​‌​‌​‌‌​‍‍​‌​​​‌​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​‌‌‍‍​‌​​​‌​‌‍‍​​‌​‌‌​‌‍‍​​‌‌​​‌​‍‍​​‌‌​​​​‍‍​​‌‌​​‌​‍‍​​‌‌​‌‌​⁠
