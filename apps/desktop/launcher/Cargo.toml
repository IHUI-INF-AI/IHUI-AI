[package]
name = "ihui-launcher"
version = "0.1.0"
edition = "2021"
publish = false
description = "IHUI AI desktop stable launcher: version pointer switch, boot health window, automatic rollback"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
winres = "0.1"
