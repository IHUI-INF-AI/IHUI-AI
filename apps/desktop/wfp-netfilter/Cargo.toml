[package]
name = "ihui-wfp-netfilter"
version = "0.1.0"
edition = "2021"
description = "Windows Filtering Platform 网络策略编译层（对齐统一规范）"
license = "Apache-2.0"
publish = false

# 独立性说明：
# 本 crate **刻意不加入 apps/desktop/src-tauri 的依赖图**。
# 理由：`src-tauri/Cargo.toml` 与 `lib.rs` 当前为他席在飞文件（M 状态），
# 按 AGENTS.md §2 并发纪律不代改。本 crate 自带 workspace 根（见下），
# 可独立 `cargo test`，接线由属主在合并窗口内一次性完成。
[workspace]

[lib]
name = "ihui_wfp_netfilter"
path = "src/lib.rs"

[dependencies]

[target.'cfg(windows)'.dependencies]
# 只用 windows-sys：它是纯声明式 FFI 绑定，无运行时糖，避免引入
# windows 0.61 那套与 webview2-com-sys 版本耦合的麻烦。
# 版本与 src-tauri 既有的 windows-sys 0.52 对齐，防将来合并时出现双副本。
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
] }
# ⁠​‌​​‌​​‌‍‍​‌​​‌​​​‍‍​‌​‌​‌​‌‍‍​‌​​‌​​‌‍‍​​‌​‌‌​‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌​​‌‌‌‌​‌​‍‍‌‌​‌‌​​​‌​​​‌‌‌‍‍​‌​​​​​‌‍‍​‌​​‌​​‌‍‍‌​‌‌​‌‌‌‍‍‌‌​​‌‌‌​‌​​‌‌‌​‍‍‌‌​​‌‌​​​‌​​‌​‌‍‍‌​‌‌‌​‌‌‌​‌‌‌​‌‍‍‌​‌‌​‌‌‌‍‍​‌​​‌‌​​‍‍​‌​​​​‌‌‍‍‌​‌‌​‌‌‌‍‍​‌‌​​​​‌‍‍​‌‌​‌​​‌‍‍​‌‌‌‌​‌​‍‍​‌‌​‌​​​‍‍​‌‌‌​​‌‌‍‍​​‌​‌‌‌​‍‍​‌‌‌​‌​​‍‍​‌‌​‌‌‌‌‍‍​‌‌‌​​​​‍‍‌​‌‌​‌‌‌‍‍​‌​‌​​​​‍‍​‌​‌​​‌​‍‍​‌​​‌‌‌‌‍‍​‌​‌​‌‌​‍‍​‌​​​‌​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​​‌‍‍​‌​​‌‌‌​‍‍​‌​​​​‌‌‍‍​‌​​​‌​‌‍‍​​‌​‌‌​‌‍‍​​‌‌​​‌​‍‍​​‌‌​​​​‍‍​​‌‌​​‌​‍‍​​‌‌​‌‌​⁠
