[package]
name = "ihui-desktop"
version = "0.1.0"
description = "IHUI AI — Tauri 2 壳"
authors = ["IHUI AI"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ihui_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "devtools"] }
tauri-plugin-deep-link = "2.4"
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = "2.5"
tauri-plugin-http = { version = "2.5", features = ["unsafe-headers"] }
tauri-plugin-notification = "2.3"
tauri-plugin-os = "2.3"
tauri-plugin-shell = "2.3"
tauri-plugin-store = "2.4"
tauri-plugin-updater = "2.10"
tauri-plugin-autostart = "2.5"
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-single-instance = "2.4"
tauri-plugin-log = "2.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
screenshots = "0.8"
enigo = "0.6"
arboard = "3.6"
base64 = "0.23"
image = { version = "0.24", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "processthreadsapi", "winbase", "handleapi", "winnls"] }

[profile.release]
panic = "abort"
# 2026-07-25: Windows rustc panic in ar_archive_writer with codegen-units=1 + lto(fat)
# 2026-07-29: 试 lto = "thin"(不跨 module 内联,不触发 ar_archive_writer ICE)
#   预计包体降 15-20%。如再触发 ICE 回滚到无 lto 配置(opt-level="s" + strip)。
lto = "thin"
opt-level = "s"
strip = true
