<!DOCTYPE html>

<!-- 桌面端离线兜底页(2026-09-17 薄壳化配套):断网时 Rust 侧导航至此,恢复后自动切回线上前端 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>智汇AI — 网络连接中</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #242424; color: #e8e8e8;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    user-select: none;
  }
  .logo { font-size: 44px; font-weight: 700; letter-spacing: 2px; margin-bottom: 8px; }
  .logo span { color: #7c6cff; }
  .sub { font-size: 15px; color: #9a9a9a; margin-bottom: 36px; }
  .status { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #cfcfcf; }
  .spinner {
    /* radius-exempt: 16px 加载指示点正圆(spinner,半径=直径一半),非容器圆角 */
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid #4a4a4a; border-top-color: #7c6cff;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hint { margin-top: 14px; font-size: 12px; color: #6f6f6f; }
</style>
</head>
<body>
  <div class="logo">智汇<span>AI</span></div>
  <div class="sub">检测到网络连接不可用</div>
  <div class="status"><div class="spinner"></div><div>正在自动重连,恢复后将自动进入工作区…</div></div>
  <div class="hint">请检查网络连接;重连成功后无需任何操作</div>
</body>
</html>
