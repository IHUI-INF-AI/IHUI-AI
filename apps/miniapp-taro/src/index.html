<!DOCTYPE html>
<html>
<head>
  <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
  <meta content="width=device-width,initial-scale=1,user-scalable=no" name="viewport">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-touch-fullscreen" content="yes">
  <meta name="format-detection" content="telephone=no,address=no">
  <meta name="apple-mobile-web-app-status-bar-style" content="white">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="description" content="智汇AI社区 - 一站式AI学习与交流平台，提供AI对话、课程、直播、社区互动等服务">
  <meta name="keywords" content="智汇AI,AI社区,AI对话,人工智能,在线课程,AI学习">
  <meta name="author" content="IHUI-AI">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="智汇AI社区">
  <meta property="og:description" content="一站式AI学习与交流平台">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#4F6EF7">
  <title>智汇AI社区 - 一站式AI学习与交流平台</title>
  <!-- 兜底拦截 react-refresh-webpack-plugin 的 ErrorOverlay iframe
       (H5 模式下未处理的 Promise rejection 会触发 overlay 遮挡页面)。
       即使 ReactRefreshPlugin 仍被加载, 也必须在客户端彻底屏蔽。 -->
  <style>
    /* 强制隐藏所有可能的 overlay 容器(无论是否已注入) */
    #react-refresh-overlay, #webpack-dev-server-client-overlay,
    iframe#react-refresh-overlay, iframe#webpack-dev-server-client-overlay {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
      width: 0 !important;
      height: 0 !important;
      position: fixed !important;
      left: -99999px !important;
      top: -99999px !important;
      z-index: -2147483648 !important;
    }
  </style>
  <script>
    (function () {
      var noop = function () {}
      // 第 1 层: 劫持 react-refresh 全局 hook, 让其 register 不真正注册
      try {
        Object.defineProperty(window, '__REACT_ERROR_OVERLAY_GLOBAL_HOOK__', {
          configurable: true,
          writable: true,
          value: {
            onBuildError: noop,
            onRuntimeError: noop,
            reportBuildError: noop,
            reportRuntimeError: noop,
            register: function (overlay) {
              try { overlay && overlay.dispose && overlay.dispose() } catch (e) {}
              try { overlay && overlay.componentDidMount && (overlay.componentDidMount = noop) } catch (e) {}
              try { overlay && overlay.componentDidUpdate && (overlay.componentDidUpdate = noop) } catch (e) {}
              return function () {}
            },
            unregister: noop,
            setRuntimeErrorHandler: function () { return noop },
            overlay: null,
          },
        })
      } catch (e) {}

      // 第 2 层: 持续轮询 + MutationObserver 双保险, 反复删除已注入的 iframe
      var IFRAME_IDS = ['react-refresh-overlay', 'webpack-dev-server-client-overlay']
      var cleanup = function () {
        try {
          for (var i = 0; i < IFRAME_IDS.length; i++) {
            var id = IFRAME_IDS[i]
            var nodes = document.querySelectorAll('#' + id)
            for (var j = 0; j < nodes.length; j++) {
              var n = nodes[j]
              if (n && n.parentNode) {
                try { n.parentNode.removeChild(n) } catch (e) {}
              }
            }
          }
        } catch (e) {}
      }
      // 立即执行一次
      cleanup()
      // 监听 DOM 变化
      try {
        var obs = new MutationObserver(function () { cleanup() })
        obs.observe(document.documentElement || document.body, { childList: true, subtree: true })
      } catch (e) {}
      // 高频轮询兜底(每 100ms 扫一次, iframe 一旦出现立即删除)
      setInterval(cleanup, 100)
    })()
  </script>
  <script><%= htmlWebpackPlugin.options.script %></script>
</head>
<body>
  <div id="app"></div>
</body>
</html>
