<!DOCTYPE html>
<html>
<head>
  <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
  <meta content="width=device-width,initial-scale=1,user-scalable=no" name="viewport">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-touch-fullscreen" content="yes">
  <meta name="format-detection" content="telephone=no,address=no">
  <meta name="apple-mobile-web-app-status-bar-style" content="white">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="description" content="智汇AI社区 - 一站式AI学习与交流平台，提供AI对话、课程、直播、社区互动等服务">
  <meta name="keywords" content="智汇AI,AI社区,AI对话,人工智能,在线课程,AI学习">
  <meta name="author" content="IHUI-AI">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="智汇AI社区">
  <meta property="og:description" content="一站式AI学习与交流平台">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#4F6EF7">
  <title>智汇AI社区 - 一站式AI学习与交流平台</title>
  <!-- 隐藏 react-refresh-webpack-plugin 和 webpack-dev-server 的 overlay iframe
       (H5 模式下远程图片加载失败等异步错误触发 unhandledrejection,
       被 overlay 捕获显示遮挡页面;业务层已通过 app.tsx 自行处理) -->
  <style>
    #react-refresh-overlay, #webpack-dev-server-client-overlay,
    [id*='react-refresh-overlay'], [id*='webpack-dev-server'],
    iframe[src*='react-refresh'], iframe[src*='webpack-dev-server'] {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
      width: 0 !important;
      height: 0 !important;
      position: fixed !important;
      left: -9999px !important;
      top: -9999px !important;
      opacity: 0 !important;
      z-index: -9999 !important;
    }
  </style>
  <!-- 在 webpack-dev-server overlay 之前拦截全局错误,防止全屏弹窗(AGENTS.md §4) -->
  <script>
    // 拦截所有 error 和 unhandledrejection,阻止 webpack-dev-server overlay 弹窗
    // 必须在 webpack-dev-server client 脚本加载之前注册
    // 业务层错误由 app.tsx 的 initCrashReport 和全局 handler 处理
    var __origOnError = window.onerror;
    window.addEventListener('error', function(e) { e.preventDefault(); }, true);
    window.addEventListener('unhandledrejection', function(e) { e.preventDefault(); }, true);
    // 覆盖 window.onerror 确保早期错误也被捕获
    window.onerror = function() { return true; };
    // 使用 MutationObserver 在 overlay iframe 插入 DOM 后立即移除
    // 防止 react-refresh-webpack-plugin 动态注入的 iframe 遮挡页面
    try {
      var __observer = new MutationObserver(function(mutations) {
        for (var i = 0; i < mutations.length; i++) {
          var nodes = mutations[i].addedNodes || [];
          for (var j = 0; j < nodes.length; j++) {
            var node = nodes[j];
            if (node && node.nodeType === 1) {
              var id = node.id || '';
              var src = node.src || '';
              if (id.indexOf('react-refresh') > -1 || id.indexOf('webpack-dev-server') > -1 ||
                  src.indexOf('react-refresh') > -1 || src.indexOf('webpack-dev-server') > -1) {
                node.parentNode && node.parentNode.removeChild(node);
              }
            }
          }
        }
      });
      __observer.observe(document.documentElement || document.body, { childList: true, subtree: true });
    } catch(e) { /* MutationObserver 降级 */ }
  </script>
  <script><%= htmlWebpackPlugin.options.script %></script>
</head>
<body>
  <div id="app"></div>
</body>
</html>
