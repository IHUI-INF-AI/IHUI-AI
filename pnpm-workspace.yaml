# ============== nodeLinker: isolated(2026-08-05 恢复)==============
# 2026-08-05 曾切到 hoisted 解决 react-native-worklets CMake 路径过长问题,
# 但 hoisted 模式下 pnpm 不创建 @ihui/* workspace 包符号链接到顶层 node_modules,
# 导致 web/api/mobile-rn 全部报 "Cannot find package '@ihui/database'" 等 ESM 解析失败。
# 修复方案:回到 isolated(默认)+ publicHoistPattern 已包含 *react-native*,
# react-native-worklets 会被 hoist 到顶层 node_modules/react-native-worklets(短路径),
# CMake 编译时用此短路径,不会触发 250 字符限制。
# Metro 错误(Cannot find metro/src/lib/isResolvedDependency.js)用 metro.config.js
# 的 Module._resolveFilename monkey-patch 单独解决(重定向到 @expo/metro/metro/lib/)。
# nodeLinker 默认值 isolated,此处显式声明便于后续维护者理解。
nodeLinker: isolated

# ============== virtualStoreDir: 短路径(2026-09-08 引入,2026-09-10 迁 D 盘)==============
# Windows 上 pnpm isolated 的 .pnpm 虚拟仓库位于 node_modules/.pnpm,叠加包名+hash 后
# 真实绝对路径过长,导致 mobile-rn 原生 CMake/AGP 生成的 .cxx 对象与 prefab 文件路径
# 超过 Windows 260 字符限制(ninja: mkdir/Stat ... longer than 260 characters)。
# 把虚拟仓库挪到短路径(仅改变 .pnpm 物理位置,不改 nodeLinker,
# 不影响 node_modules/<pkg> 软链解析,@ihui/* workspace 链接不受影响),
# 全局缩短 ~20 字符。依赖解析/锁文件不受影响(仅物理落盘位置变化)。此路径需存在且为短路径。
# 2026-09-10: C:/pstore → D:/pstore。原因:内容寻址仓库在 D:\.pnpm-store,虚拟仓放 C 盘
# 导致跨盘硬链接失效退化为逐文件复制(全新安装 ~3 包/分钟);同盘后 pnpm 直接硬链接,
# 全新安装分钟级完成。路径长度不变,短路径约束(mobile-rn 原生构建)不受影响。
# 2026-09-10 回退默认(项目内 node_modules/.pnpm):Next 16 Turbopack 强制 hermetic
# workspace root(按锁文件定位=D:\IHUI-AI),根外虚拟仓实体文件被拒绝解析 → next build
# 必挂 "Could not find the Next.js package" / "@ihui/shared/*" 全线 Module not found(实测)。
# 回退后仓库根与 store 同为 D 盘,硬链接优势保留;长路径由 publicHoistPattern 兜底。
# 2026-10-17 重新启用:迁到 C:/pn(短盘符)。mobile-rn Android 本地构建(ninja/CMake)
# 依赖短路径;Next.js hermetic 问题仅影响 next build,后续可再评估。
# 2026-10-17 二次回退默认(项目内 node_modules/.pnpm):"仅影响 next build" 判断有误 ——
# next dev(Turbopack)同样强制 hermetic root=G:\IHUI-AI,而 apps/web/node_modules/next
# 等软链的 realpath 在 C:\pn(根外)→ "Could not find the Next.js package" →
# 8801 全站 500、桌面端窗口无法加载(实测)。IHUI_TURBOPACK_ROOT=C:\ 也不能救:
# workspace 包(@ihui/api-client)与 tailwindcss 又被判"outside of root"。
# 虚拟仓必须留在仓库内;store 迁到 G:/.pnpm-store 与仓库同盘以保留硬链接优势。
# (mobile-rn 长路径由 publicHoistPattern 兜底,与 2026-09-10 回退口径一致。)
# 2026-10-19: 本地用绝对路径 G:/.pnpm-store(同盘硬链接);
# 云端 EAS 构建通过 npm_config_store_dir 环境变量覆盖为相对路径 .pnpm-store-cloud。
# 2026-10-22 二次更正(06:04 实测卡死 43 分钟后):上一版改成的 D:/DevEnv/cache/pnpm-store
# 是**错的更隐蔽**的一档 —— 本机真 store 在 D:/DevEnv/tools/pnpm/store(8.5G,主仓
# node_modules/.modules.yaml 记录的正是它,与 PNPM_HOME 同源)。指向别处时 pnpm 每次
# install 都判定"store 已变更 ⇒ 需要 purge 重建",在非交互管道里等确认输入 ⇒
# **部署链整轮卡死**(实测 06:04-06:47 零输出、pnpm 进程 CPU 恒 0)。
# 现改为真身 D:/DevEnv/tools/pnpm/store:主仓 node_modules 与 store 匹配 ⇒ 不 purge、
# 净面 install 直接命中已有 8.5G 内容(实测 57.5s 完成),交互/服务身份共用同一份。
storeDir: 'D:/DevEnv/tools/pnpm/store'

# ============== mobile-rn (Expo + RN) Metro hoist 配置 ==============
# 解决 pnpm isolated linker 与 Metro bundler 不兼容问题(2026-07-25)
# Metro 0.81 默认不 follow pnpm 的 .pnpm/<pkg>/node_modules junction 真实路径,
# 导致 react-native / @react-navigation/native 的传递依赖(invariant, @react-navigation/core,
# ansi-regex 等)无法从 .pnpm 隔离目录解析,报 "Unable to resolve module"。
# 方案:用 publicHoistPattern 把 RN/Expo 生态的传递依赖 hoist 到根 node_modules 顶层,
# Metro 的 hierarchical lookup 即可找到。
# 注意:pnpm 9.15+ 的 public-hoist-pattern 必须配在 pnpm-workspace.yaml(而非 .npmrc),
#       否则 pnpm config get 能读到但 install 时不应用。
# 影响范围:仅 RN/Expo 生态包,其他 7 端不引用这些包,无影响。
publicHoistPattern:
  # ----- 通配符:覆盖 RN/Expo/Metro 生态 -----
  - '*react-native*'
  - '*react-navigation*'
  - '*expo*'
  - '*nativewind*'
  - '*metro*'
  - '@react-native/*'
  - '@react-native-*/*'
  - '@react-navigation/*'
  - '@expo/*'
  - '@ide/*'
  # ----- react-native 0.79.6 非 scoped 传递依赖(Metro bundle 必需) -----
  - 'invariant'
  - 'nullthrows'
  - 'memoize-one'
  - 'scheduler'
  - 'stacktrace-parser'
  - 'pretty-format'
  - 'regenerator-runtime'
  - 'anser'
  - 'ansi-regex'
  - 'chalk'
  - 'commander'
  - 'glob'
  - 'event-target-shim'
  - 'abort-controller'
  - 'base64-js'
  - 'whatwg-fetch'
  - 'ws'
  - 'yargs'
  - 'semver'
  - 'promise'
  - 'react-devtools-core'
  - 'react-refresh'
  - 'flow-enums-runtime'
  - 'babel-jest'
  - 'jest-environment-node'
  - 'babel-plugin-syntax-hermes-parser'
  - '@jest/create-cache-key-function'
  # ----- @react-navigation / expo 非 scoped 传递依赖 -----
  - 'escape-string-regexp'
  - 'fast-deep-equal'
  - 'nanoid'
  - 'query-string'
  - 'react-is'
  - 'use-latest-callback'
  - 'color'
  - 'warn-once'
  - 'whatwg-url-without-unicode'
  - 'babel-preset-expo'
  - 'ua-parser-js'
  - 'assert'
  - 'badgin'
  # ----- react-native-* / nativewind / workspace 包的非 scoped 传递依赖 -----
  - 'react-freeze'
  - 'comment-json'
  - 'debug'
  - 'lightningcss'
  - 'convert-source-map'
  - 'merge-options'
  - 'html2canvas'
  - 'events'
  - 'js-sha1'
  - 'tailwindcss'
  - 'class-variance-authority'
  - 'clsx'
  - 'tailwind-merge'
  - 'xstate'
  - 'zod'

# ============== pnpm catalog(2026-07-29 立,AGENTS.md P3 阶段 1.2)==============
# 目的:锁定全端共用依赖的单一版本,升级改一处,所有引用自动同步。
# 范围:只纳入"版本完全一致 + 多端共用"的依赖。
# 排除(版本冲突硬约束,不可纳入 catalog):
#   - react/react-dom:Taro 4 需要 React 18,web/extension/desktop 用 React 19(18 vs 19 硬约束)
#   - tailwindcss:miniapp-taro/mobile-rn 用 v3(NativeWind/Taro 兼容),web/extension 用 v4(v3 vs v4 硬约束)
#   - next:web 独占
#   - expo + react-native:RN 独占
#   - @tarojs/*:taro 独占
#   - @types/react:对应 React 版本,由根 pnpm.overrides 全局锁定
#   - lucide-react:ui-react 用 ^0.460.0,web 用 ^0.562.0(版本不一致,暂纳入 catalog 锁定
#     ui-react 基线版本 ^0.460.0,web 未迁移到 catalog: 仍用硬编码 ^0.562.0,待后续统一)
# 引用方式:package.json 中 "typescript": "catalog:" 即引用此处的版本。
# 与 pnpm.overrides 协同:overrides 优先级 > catalog,二者可并存。
catalog:
  typescript: ^5.7.2 # L1:保持 5.x(TS 7.0 是 major,留 L2 评估)
  rimraf: ^6.1.3 # L1:6.0.1 → 6.1.3 minor
  vitest: ^4.0.0 # L3:3.x→4.x major(miniapp-taro 除外,其 @tarojs/vite-runner peerDep 锁定 vite^4,而 vitest 4.x 需要 vite 5+ 的 ./module-runner 导出,故 miniapp-taro 单独降级到 vitest ^3.2.7)
  zod: ^4.6.6 # L4:3.x→4.x major(已迁移:z.string().ip()→z.union([z.ipv4(),z.ipv6()])、errorMap→error、.flatten()→z.treeifyError、.passthrough()→z.looseObject()、z.record(z.x)→z.record(z.string(),z.x)、z.string().email()→z.email())
  # 2026-10-28 依赖审计:4.4.3 → ^4.6.6(GHSA-mrhx-c7xc-m3w5,超大集合校验内存耗尽)。
  # 注意 catalog 的版本优先级高于 pnpm.overrides —— 只写 overrides 不会改动这里,实测 4.4.3 仍在树里。
  eslint: ^10.0.0 # L2:9.x→10.x major(已评估:flat config 已就位 + typescript-eslint v8.56+ 支持 + Node 24 满足要求)
  zustand: ^5.0.14 # L1:5.0.2 → 5.0.14 patch

# ============== pnpm 11 配置迁移(2026-08-03)==============
# pnpm 11 不再读取 package.json 的 pnpm 字段,overrides/peerDependencyRules
# 必须迁移到 pnpm-workspace.yaml(https://pnpm.io/settings)

# minimumReleaseAge:pnpm 11 默认启用供应链策略(拒绝发布<24h 的包)。
# 项目 2026-08-03 从 pnpm 9 升级到 11,此策略会阻止 fastify 5.11.2 等新发布包。
# 显式设 0 禁用,恢复 pnpm 9 安全级别(项目已有 onlyBuiltDependencies 白名单兜底)。
minimumReleaseAge: 0

