packages:
  - 'apps/*'
  - 'packages/*'

# ============== mobile-rn (Expo + RN) Metro hoist 配置 ==============
# 解决 pnpm isolated linker 与 Metro bundler 不兼容问题(2026-07-25)
# Metro 0.81 默认不 follow pnpm 的 .pnpm/<pkg>/node_modules junction 真实路径,
# 导致 react-native / @react-navigation/native 的传递依赖(invariant, @react-navigation/core,
# ansi-regex 等)无法从 .pnpm 隔离目录解析,报 "Unable to resolve module"。
# 方案:用 publicHoistPattern 把 RN/Expo 生态的传递依赖 hoist 到根 node_modules 顶层,
# Metro 的 hierarchical lookup 即可找到。
# 注意:pnpm 9.15+ 的 public-hoist-pattern 必须配在 pnpm-workspace.yaml(而非 .npmrc),
#       否则 pnpm config get 能读到但 install 时不应用。
# 影响范围:仅 RN/Expo 生态包,其他 7 端不引用这些包,无影响。
publicHoistPattern:
  # ----- 通配符:覆盖 RN/Expo/Metro 生态 -----
  - '*react-native*'
  - '*react-navigation*'
  - '*expo*'
  - '*nativewind*'
  - '*metro*'
  - '@react-native/*'
  - '@react-native-*/*'
  - '@react-navigation/*'
  - '@expo/*'
  - '@ide/*'
  # ----- react-native 0.79.6 非 scoped 传递依赖(Metro bundle 必需) -----
  - 'invariant'
  - 'nullthrows'
  - 'memoize-one'
  - 'scheduler'
  - 'stacktrace-parser'
  - 'pretty-format'
  - 'regenerator-runtime'
  - 'anser'
  - 'ansi-regex'
  - 'chalk'
  - 'commander'
  - 'glob'
  - 'event-target-shim'
  - 'abort-controller'
  - 'base64-js'
  - 'whatwg-fetch'
  - 'ws'
  - 'yargs'
  - 'semver'
  - 'promise'
  - 'react-devtools-core'
  - 'react-refresh'
  - 'flow-enums-runtime'
  - 'babel-jest'
  - 'jest-environment-node'
  - 'babel-plugin-syntax-hermes-parser'
  - '@jest/create-cache-key-function'
  # ----- @react-navigation / expo 非 scoped 传递依赖 -----
  - 'escape-string-regexp'
  - 'fast-deep-equal'
  - 'nanoid'
  - 'query-string'
  - 'react-is'
  - 'use-latest-callback'
  - 'color'
  - 'warn-once'
  - 'whatwg-url-without-unicode'
  - 'babel-preset-expo'
  - 'ua-parser-js'
  - 'assert'
  - 'badgin'
  # ----- react-native-* / nativewind / workspace 包的非 scoped 传递依赖 -----
  - 'react-freeze'
  - 'comment-json'
  - 'debug'
  - 'lightningcss'
  - 'convert-source-map'
  - 'merge-options'
  - 'html2canvas'
  - 'events'
  - 'js-sha1'
  - 'tailwindcss'
  - 'class-variance-authority'
  - 'clsx'
  - 'tailwind-merge'
  - 'xstate'
  - 'zod'

# ============== pnpm catalog(2026-07-29 立,AGENTS.md P3 阶段 1.2)==============
# 目的:锁定全端共用依赖的单一版本,升级改一处,所有引用自动同步。
# 范围:只纳入"版本完全一致 + 多端共用"的依赖。
# 排除(版本冲突硬约束,不可纳入 catalog):
#   - react/react-dom:Taro 4 需要 React 18,web/extension/desktop 用 React 19(18 vs 19 硬约束)
#   - tailwindcss:miniapp-taro/mobile-rn 用 v3(NativeWind/Taro 兼容),web/extension 用 v4(v3 vs v4 硬约束)
#   - next:web 独占
#   - expo + react-native:RN 独占
#   - @tarojs/*:taro 独占
#   - @types/react:对应 React 版本,由根 pnpm.overrides 全局锁定
#   - lucide-react:ui-react 用 ^0.460.0,web 用 ^0.562.0(版本不一致,暂纳入 catalog 锁定
#     ui-react 基线版本 ^0.460.0,web 未迁移到 catalog: 仍用硬编码 ^0.562.0,待后续统一)
# 引用方式:package.json 中 "typescript": "catalog:" 即引用此处的版本。
# 与 pnpm.overrides 协同:overrides 优先级 > catalog,二者可并存。
catalog:
  typescript: ^5.7.2 # L1:保持 5.x(TS 7.0 是 major,留 L2 评估)
  rimraf: ^6.1.3 # L1:6.0.1 → 6.1.3 minor
  vitest: ^4.0.0 # L3:3.x→4.x major(内部 vite 自动升 6,miniapp-taro vite 4.5.5 隔离不受影响)
  zod: ^4.0.0 # L4:3.x→4.x major(已迁移:z.string().ip()→z.union([z.ipv4(),z.ipv6()])、errorMap→error、.flatten()→z.treeifyError、.passthrough()→z.looseObject()、z.record(z.x)→z.record(z.string(),z.x)、z.string().email()→z.email())
  eslint: ^10.0.0 # L2:9.x→10.x major(已评估:flat config 已就位 + typescript-eslint v8.56+ 支持 + Node 24 满足要求)
  zustand: ^5.0.14 # L1:5.0.2 → 5.0.14 patch

# ============== pnpm 11 配置迁移(2026-08-03)==============
# pnpm 11 不再读取 package.json 的 pnpm 字段,overrides/peerDependencyRules
# 必须迁移到 pnpm-workspace.yaml(https://pnpm.io/settings)

# minimumReleaseAge:pnpm 11 默认启用供应链策略(拒绝发布<24h 的包)。
# 项目 2026-08-03 从 pnpm 9 升级到 11,此策略会阻止 fastify 5.11.2 等新发布包。
# 显式设 0 禁用,恢复 pnpm 9 安全级别(项目已有 onlyBuiltDependencies 白名单兜底)。
minimumReleaseAge: 0

# 原 package.json pnpm.overrides 迁移至此:
overrides:
  ioredis: 6.0.0
  webpack: 5.91.0
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.4
  "@types/node": 26.1.2
  drizzle-orm: 0.45.2
  fast-jwt: 6.3.1
  metro: 0.81.5
  html-encoding-sniffer: 4.0.0
  d3-array: ^3.2.0
  d3-shape: ^3.2.0
  jiti: 2.7.0

# 原 package.json pnpm.peerDependencyRules 迁移至此:
peerDependencyRules:
  ignoreMissing:
    - "@opentelemetry/api"

# ============== pnpm 11 allowBuilds 迁移(2026-08-03)==============
# pnpm 11 删除了 onlyBuiltDependencies / neverBuiltDependencies / ignoredBuiltDependencies,
# 全部替换为 allowBuilds 映射(包名 → true/false)。
# pnpm 11 默认 strictDepBuilds=true,未在 allowBuilds 中列 true 的包的 build scripts 全部忽略。
# 原 .npmrc onlyBuiltDependencies[] 白名单:argon2/sharp/esbuild/playwright
# 新增(2026-08-03):项目实际需要的 native/binding 依赖全部设 true,
# 否则 ERR_PNPM_IGNORED_BUILDS 阻塞 install。
allowBuilds:
  # ----- 原 .npmrc 白名单 -----
  argon2: true
  sharp: true
  esbuild: true
  playwright: true
  # ----- 新增:项目实际需要的 build scripts -----
  '@parcel/watcher': true        # taro/next 文件监听 native binding
  '@swc/core': true              # taro/next SWC 编译器 native binding
  '@tarojs/binding': true        # taro 4 native binding
  '@tarojs/cli': true            # taro CLI build script
  core-js: true                  # polyfill build script
  core-js-pure: true             # polyfill build script
  msgpackr-extract: true         # msgpackr native binding
  msw: true                      # mock service worker build script
  node-pty: true                 # 终端伪线程 native binding(cli 端)
  protobufjs: true               # protobuf codegen
  unrs-resolver: true            # oxlint resolver native binding
  '@alicloud/openapi-core': true # 阿里云 SDK build script
